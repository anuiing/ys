   "zhTitle": "学习与研究",
   "enTitle": "Learning and Inquiry",
   "paragraphs": [
    {
     "en": "01 A research project may begin with a rough [[VW:draft|/drɑːft/|草稿；汇票起草]], a quick [[VW:sketch|/sketʃ/|概略概述]], a glossy [[VW:brochure|/ˈbrəʊʃə(r)/|小册子]] or a technical [[VW:manual|/ˈmænjuəl/|使用手册，指南手工的]]. [[VW:Even|/ˈiːv(ə)n/|均匀的；偶数的；相等的甚至]] a loose idea needs a [[VW:frame|/freɪm/|(画、镜子等的)框架；眼镜框…]]: a title, an [[VW:index|/ˈɪndeks/|指数；指标；索引为……编索引]], a [[VW:catalogue|/ˈkætəlɒɡ/|目录]] of sources and a clear [[VW:category|/ˈkætəɡəri/|种类，类别，范畴]] for each item. A careful [[VW:inventory|/ˈɪnvəntri/|库存；详细目录]] prevents a useful note from",
     "zh": "研究项目可能从一份粗略草稿、一张快速概略图、一本精美 小册子或一部技术手册开始。即使只是初步想法，也需要一个框架：标题、索引、资料目录，以及为每项内容设定清晰 类别。仔细的清单能防止有用笔记消失。"
    },
    {
     "en": "[[VW:Context|/ˈkɒntekst/|上下文，语境；背最，来龙去脉]] gives every [[VW:list|/lɪst/|一览表，目录列举；把……列表]] meaning. A single word on a page may refer to a whole [[VW:chapter|/ˈtʃæptə(r)/|(书等的)章…]], a heavy [[VW:volume|/ˈvɒljuːm/|(书)卷；体积，容积；音量]] or a confusing [[VW:reel|/riːl/|眩晕，混乱]] of observations. The [[VW:subject|/ˈsʌbdʒɪkt/|科目；主题；实验对象]] may become a [[VW:major|/ˈmeɪdʒə(r)/|［美］主修科目，专业［美］主修主要的…]] field of inquiry, while a [[VW:minor|/ˈmaɪnə(r)/|［美］辅修科目不严重的]] question reveals a hidden assumption. Good organisation makes the",
     "zh": "语境赋予每一份清单意义。书页上的一个词，可能指向整章 内容、厚重书卷，或一卷令人眩晕的观察记录。主题可能成 为重要研究领域，而次要问题也会揭示隐藏假设。良好组织 能让从问题到证据的路径变得清晰。"
    },
    {
     "en": "The study of society draws on many perspectives. [[VW:Sociology|/ˌsəʊsiˈɒlədʒi/|社会学]] examines groups and institutions; [[VW:politics|/ˈpɒlətɪks/|政治学；政治；政治事务]] concerns power and public choice; [[VW:economics|/ˌiːkəˈnɒmɪks/|经济学]] studies production and exchange; [[VW:marketing|/ˈmɑːkɪtɪŋ/|市场营销]] connects goods with consumers; [[VW:accounting|/əˈkaʊntɪŋ/|会计]] records financial activity; and an [[VW:audit|/ˈɔːdɪt/|审计旁听；审计]] checks whether those records are reliable. [[VW:Statistics|/stəˈtɪstɪks/|统计学]] turns data into patterns, [[VW:psychology|/saɪˈkɒlədʒi/|心理学；心理特征]] examines mind and behaviour, [[VW:philosophy|/fəˈlɒsəfi/|哲学]] asks what knowledge means, [[VW:logic|/ˈlɒdʒɪk/|逻辑；逻辑学]] tests reasoning, and [[VW:biology|/baɪˈɒlədʒi/|生物学；生命机理]] studies living",
     "zh": "社会研究借鉴许多视角。社会学考察群体与制度；政治学关 注权力与公共选择；经济学研究生产与交换；市场营销把商品与消费者连接起来；会计记录财务活动；审计则检查这些 记录是否可靠。统计学把数据转化为模式，心理学研究心智 与行为，哲学追问知识意味着什么，逻辑检验推理，生物学研究生命系统。"
    },
    {
     "en": "Natural and technical subjects form another constellation. [[VW:Physics|/ˈfɪzɪks/|物理学]] explains matter and energy, [[VW:chemistry|/ˈkemɪstri/|化学]] examines substances and reactions, [[VW:agriculture|/ˈæɡrɪkʌltʃə(r)/|农业；农学]] applies science to food production, [[VW:logistics|/ləˈdʒɪstɪks/|物流；后勤]] organises the movement of goods, [[VW:geography|/dʒiˈɒɡrəfi/|地理学；地形，地势]] maps places and environments, and [[VW:history|/ˈhɪstri; ˈhɪstəri/|历史；历史学]] studies change over time. [[VW:Engineering|/ˌendʒɪˈnɪərɪŋ/|工程；工程学]] turns ideas into structures and machines, [[VW:mechanics|/məˈkænɪks/|力学；机械学]] describes force and motion, [[VW:electronics|/ɪˌlekˈtrɒnɪks/|电子学；电子器件]] works with circuits and signals, and [[VW:maths|/mæθs/|数学]] provides a language for quantity and proof. [[VW:Arithmetic|/əˈrɪθmətɪk/|算数]], [[VW:geometry|/dʒiˈɒmətri/|几何学]], [[VW:algebra|/ˈældʒɪbrə/|代数学，代数]] and [[VW:calculus|/ˈkælkjələs/|微积分；结石]] offer different ways to reason",
     "zh": "自然与技术学科构成另一组星座。物理学解释物质与能量，化学研究物质与反应，农学把科学应用于粮食生产，物流组 织货物流动，地理学绘制地点与环境，历史学研究时间中的 变化。工程把想法变成结构与机器，力学描述力与运动，电子学研究电路与信号，数学则提供数量与证明的语言。算术、 几何、代数与微积分，以不同方式处理数字、形状、关系和 变化。"
    },
    {
     "en": "Basic [[VW:arithmetic|/əˈrɪθmətɪk/|算数]] begins with [[VW:plus|/plʌs/|加上正(数)的，在零以上的]] and [[VW:sum|/sʌm/|总数，总和；金额]]. A [[VW:total|/ˈtəʊt(ə)l/|总的，全部的总数]] may grow through a [[VW:merger|/ˈmɜːdʒə(r)/|合并，归并]] of resources; an [[VW:equation|/ɪˈkweɪʒ(ə)n/|相等；平衡，综合体…]] can show that two expressions are [[VW:identical|/aɪˈdentɪk(ə)l/|同一的]]; [[VW:minus|/ˈmaɪnəs/|负的，零以下的减(去)]] and [[VW:subtract|/səbˈtrækt/|减去，减]] describe a decrease; [[VW:multiply|/ˈmʌltɪplaɪ/|乘，使相乘；(使)成倍增加…]] and [[VW:divide|/dɪˈvaɪd/|除以；除]] describe repeated addition and equal sharing. A [[VW:dividend|/ˈdɪvɪdend/|股息，红利]] may leave a [[VW:remainder|/rɪˈmeɪndə(r)/|余数；剩余部分]], and a [[VW:rational|/ˈræʃ(ə)nəl/|理性的；合理的]]  sets a limit, while a [[VW:variable|/ˈveəriəb(ə)l/|变量；可变因素易变的]] can change. An [[VW:even|/ˈiːv(ə)n/|均匀的；偶数的；相等的甚至]] number is divisible by two; an [[VW:odd|/ɒd/|奇数的；古怪的]] number is not. A [[VW:mean|/miːn/|平均数，平均值；平均的]] describes a central value; to [[VW:double|/ˈdʌb(ə)l/|两倍的两倍数，两倍量(使)加倍…]], [[VW:triple|/ˈtrɪp(ə)l/|三倍的，三重的三倍数，三倍量(使)增至…]] or [[VW:quadruple|/ˈkwɒdrʊp(ə)l/|四倍的四倍(使)成四倍]] a quantity is to make it two, three or four times larger. A [[VW:multiple|/ˈmʌltɪp(ə)l/|倍数多样的，数量多的]] repeats a number, a [[VW:maximum|/ˈmæksɪməm/|最大值，最大限度]] marks an upper limit, a [[VW:minimum|/ˈmɪnɪməm/|最小值，最低限度]] marks a lower one, and [[VW:approximately|/əˈprɒksɪmətli/|大约]] signals that a figure is close rather than exact. 07 A [[VW:chart|/tʃɑːt/|图，图表；海图]], a [[VW:graph|/ɡrɑːf/|图，图表]], a [[VW:diagram|/ˈdaɪəɡræm/|图表；示意图，图解]] and a [[VW:table|/ˈteɪb(ə)l/|表格；桌子]] present relationships in different ways. A [[VW:matrix|/ˈmeɪtrɪks/|矩阵；铸模]] arranges values in rows and columns, a [[VW:decimal|/ˈdesɪm(ə)l/|小数的；十避位的；小数]] expresses a [[VW:fraction|/ˈfrækʃn/|分数；小部分；片断]] of a unit, and a [[VW:percent|/pəˈsent/|［单复数同形］百分之......…]] compares a part with one hundred. A culture may [[VW:ferment|/fəˈment/|(使)发酵；骚动；酶；发酵…]] under controlled conditions, and a [[VW:formula|/ˈfɔːmjələ/|公式，万程式；原则；配方…]] can describe the result without describing every local",
     "zh": "基础算术从加号与总和开始。总量可能因资源合并而增长； 等式可以显示两个表达式完全相同；减号和减去描述下降；乘与除描述重复相加和等分。除法可能留下余数，而理性论 证应解释每一步，而不是把过程藏在符号背后。参数设定限度，变量则会变化。偶数可被二整除，奇数不能。平均值描述中心值；使数量加倍、增至三倍或四倍，就是把它扩大为两倍、三倍或四倍。倍数重复一个数，最大值标出上限，最小值标出下限，大约则表明数字接近而非精确。图表、曲线图、示意图和表格以不同方式呈现关系。矩阵把数值排成行列，小数表示一个单位的部分，百分数则把部分与一百比较。培养物可能在受控条件下发酵，而公式能够描述结果，却未必描述每个局部细节。"
    },
    {
     "en": "[[VW:Geometry|/dʒiˈɒmətri/|几何学]] describes shape and space. A [[VW:rectangle|/ˈrektæŋɡl/|长方形，矩形]], a [[VW:cube|/kjuːb/|立方体；立方，三次幕…]], an [[VW:angle|/ˈæŋɡ(ə)l/|角；角度]] and a [[VW:triangle|/ˈtraɪæŋɡ(ə)l/|三角形；三角关系]] have precise properties; a [[VW:diagonal|/daɪˈæɡən(ə)l/|斜纹的；对角线的对角线…]] is not the same as a [[VW:straight|/streɪt/|直的笔直地；直接]] edge; a [[VW:circle|/ˈsɜːk(ə)l/|圆]] may contain a [[VW:dot|/dɒt/|点，圆点在......上打点]] at its centre, while a [[VW:round|/raʊnd/|圆的绕圈；一轮环绕]] object can be modelled as a [[VW:sphere|/sfɪə(r)/|球体；球状物；范围，领域]] or a [[VW:cone|/kəʊn/|圆锥体；锥形物]]. [[VW:Extent|/ɪkˈstent/|广度，范围；程度]], [[VW:width|/wɪdθ; wɪtθ/|宽度]] and [[VW:length|/leŋkθ; leŋθ/|长度]] give an object size; [[VW:proportion|/prəˈpɔːʃ(ə)n/|比例]], [[VW:rate|/reɪt/|比率，率；速度]], [[VW:ratio|/ˈreɪʃiəʊ/|比(率)]] and [[VW:fraction|/ˈfrækʃn/|分数；小部分；片断]] compare quantities; a [[VW:scale|/skeɪl/|刻度；规模；［~s］天平…]] connects a model with the world it represents.",
     "zh": "几何学描述形状与空间。长方形、立方体、角与三角形都有精确属性；对角线不同于直边；圆可以在圆心处标一个点，而圆形物体可被建模为球体或圆锥。广度、宽度和长度给出物体尺寸；比例、速率、比率和分数比较数量；刻度则把模型与它所代表的世界连接起来。"
    },
    {
     "en": "Measurement requires units and materials. An ounce , [[VW:density|/ˈdensəti/|密度；浓度]] reading, [[VW:Fahrenheit|/ˈfærənhaɪt/|华氏温标的]] thermometer, [[VW:mercury|/ˈmɜːkjəri/|水银，汞；［M~］水星]] column, battery , [[VW:volt|/vəʊlt/|伏特(电压单位)]], [[VW:transparent|/trænsˈpærənt/|透明的；易看穿的]] lens, [[VW:hollow|/ˈhɒləʊ/|空(心)的，中空的]] tube and [[VW:ozone|/ˈəʊzəʊn/|臭氧]] sensor all serve particular purposes. A hot object may [[VW:radiate|/ˈreɪdieɪt/|辐射，发散；从中心向四周散开]] heat or [[VW:emit|/iˈmɪt/|散发(光、热、气等)…]] light; [[VW:gravity|/ˈɡrævəti/|地球引力，重力]] creates weight; [[VW:friction|/ˈfrɪkʃ(ə)n/|摩擦；摩擦力；不和，矛盾]] slows motion; an [[VW:eccentric|/ɪkˈsentrɪk/|不同圆心的；古怪的]] orbit differs from a circular one; and a moving body can [[VW:displace|/dɪsˈpleɪs/|移动……的位置；取代，替代]] water. Heat can [[VW:boil|/bɔɪl/|煮沸，(使)沸腾沸点]] a liquid, [[VW:melt|/melt/|(使)融化；(使)熔化]] a solid, [[VW:dissolve|/dɪˈzɒlv/|(使)溶解；解散]] a salt, [[VW:rust|/rʌst/|(使)生锈锈，铁锈]] iron or [[VW:dilute|/daɪˈluːt/|冲淡，稀释稀释了的；减弱了的]] an [[VW:acid|/ˈæsɪd/|酸酸的；讽刺的，尖刻的]]. A [[VW:noxious|/ˈnɒkʃəs/|有害的]] gas needs ventilation, a [[VW:static|/ˈstætɪk/|静态的；静力的]] charge needs grounding, and an [[VW:inert|/ɪˈnɜːt/|无生气的；惰性的，不活泼的]] material may remain chemically calm, but no instrument removes the [[VW:inherent|/ɪnˈherənt/|内在的，固有的]] uncertainty of observation.",
     "zh": "测量需要单位和材料。盎司、密度读数、华氏温度计、水银柱、电池、伏特、透明镜片、空心管和臭氧传感器各有用途。高温物体会辐射热量或发出光；引力产生重量；摩擦使运动变慢；偏心轨道不同于圆形轨道；移动物体会排开水面。热能使液体沸腾、固体融化、盐溶解、铁生锈，或把酸稀释。有害气体需要通风，静电荷需要接地；惰性材料可能在化学上保持平静，但没有任何仪器能消除观察固有的不确定性。"
    },
    {
     "en": "Formal study brings these tools together. A [[VW:compulsory|/kəmˈpʌlsəri/|强制的]] [[VW:component|/kəmˈpəʊnənt/|成分，组成部分]] may [[VW:compose|/kəmˈpəʊz/|组成，构成；创作(音乐)；写]] a [[VW:mixture|/ˈmɪkstʃə(r)/|混合(物)]] or [[VW:blend|/blend/|混合；(使)交融；混合物]] of methods; a [[VW:theory|/ˈθɪəri/|理论；学说]] should be tested against [[VW:empirical|/ɪmˈpɪrɪk(ə)l/|以实验为依据的；经验主义的]] evidence; [[VW:practical|/ˈpræktɪkl/|实际的；有用的；务实的…]] work reveals what a [[VW:doctrine|/ˈdɒktrɪn/|学说；教义；信条]] leaves out; a [[VW:principle|/ˈprɪnsəp(ə)l/|原则；(科学)原理]] guides judgement; and a [[VW:discipline|/ˈdɪsəplɪn/|纪律；训练]] provides a shared standard. Near the end of a [[VW:term|/tɜːm/|期限；术语；［尤英］学期]] or [[VW:semester|/sɪˈmestə(r)/|学期]], a student should be able to explain not only the answer but also the path taken to reach",
     "zh": "正式学习把这些工具汇集起来。必修组成部分可能以混合物或混合物般的方式组合多种方法；理论应接受经验证据检验实践工作会揭示学说遗漏之处；原则引导判断；学科提供共同标准。临近期末或学期结束时，学生应能解释答案，也能说明抵达答案的路径。"
    }

  {
   "zhTitle": "校园生活与成长",
   "enTitle": "Campus Life and Growth",
   "paragraphs": [
    {
     "en": "01 A university [[VW:timetable|/ˈtaɪmteɪb(ə)l/|时间表；课程表]] and a personal [[VW:schedule|/ˈʃedjuːl/|日程安排；［美］时刻表]] rarely look the same. A [[VW:deadline|/ˈdedlaɪn/|截止日期]] may fall before a [[VW:course|/kɔːs/|课程]] is finished, a [[VW:lesson|/ˈles(ə)n/|一堂课；课程；教训]] may raise a question that a [[VW:curriculum|/kəˈrɪkjələm/|课程；(学校等的)全部课程]] cannot answer, a [[VW:seminar|/ˈsemɪnɑː(r)/|研讨会；讨论课]] may depend on preparation, and a [[VW:forum|/ˈfɔːrəm/|讨论会，论坛；公开讨论的广场]] may turn disagreement into shared understanding. The [[VW:syllabus|/ˈsɪləbəs/|教学大纲]] describes the route, but the wider [[VW:system|/ˈsɪstəm/|系统；体系，制度]] of learning includes",
     "zh": "大学课程表与个人日程很少完全相同。截止日期可能在一门课程结束前到来；一堂课可能提出课程本身无法回答的问题研讨会依赖准备；论坛则可能把分歧转化为共同理解。教 学大纲描述路径，但更广阔的学习系统还包括好奇心、实践与反思。"
    },
    {
     "en": "Every programme begins with a [[VW:rudimentary|/ˌruːdɪˈment(ə)ri/|基本的，粗浅的]] idea before it reaches a [[VW:basic|/ˈbeɪsɪk/|基本的，基础的]] principle. A [[VW:fundamental|/ˌfʌndəˈment(ə)l/|基础的，基本的；根本的]] question is not necessarily [[VW:elementary|/ˌelɪˈmentri/|基本的；初级的]], and a [[VW:profound|/prəˈfaʊnd/|(影响)深刻的，深远的…]] insight may begin at the [[VW:surface|/ˈsɜːfɪs/|表面；地面；水面]] of ordinary experience. A [[VW:prerequisite|/ˌpriːˈrekwəzɪt/|必备条件必备的]] [[VW:course|/kɔːs/|课程]] prepares students for advanced work; a [[VW:selective|/sɪˈlektɪv/|选择性的]] programme admits some applicants; and an [[VW:elective|/ɪˈlektɪv/|选举的…]] allows a learner to follow a",
     "zh": "每个课程体系都从粗浅想法开始，再走向基本原则。根本问题未必初级，深刻洞见也可能从日常经验的表面开始。先修 课程为高阶学习做准备；选择性课程只录取部分申请者；选 修科目则让学习者追随特定兴趣。"
    },
    {
     "en": "An [[VW:assignment|/əˈsaɪnmənt/|(布置的)作业…]] asks a student to [[VW:submit|/səbˈmɪt/|服从；提交，呈递]] work by a fixed date. A [[VW:preview|/ˈpriːvjuː/|预习；预习]] helps one see the shape of a text; a [[VW:review|/rɪˈvjuː/|回顾；复习；回顾；复习]] consolidates it; and a revision improves it. A reader may [[VW:inspect|/ɪnˈspekt/|检查；检阅，视察]] the evidence, [[VW:consult|/kənˈsʌlt/|请教；查阅]] a source, [[VW:skim|/skɪm/|掠过，擦边；略读]] for the main [[VW:point|/pɔɪnt/|点；要点]], [[VW:scan|/skæn/|细看；浏览；扫描扫描检查…]] for a name, [[VW:scrutinise|/ˈskruːtɪnaɪz/|详细检查，仔细查看]] a difficult paragraph, [[VW:recite|/rɪˈsaɪt/|背诵，朗诵]] a key idea or [[VW:dictate|/dɪkˈteɪt/|让(某人)昕写…]] a note to a partner. To [[VW:revise|/rɪˈvaɪz/|修订，修改]] is not merely to correct an error; it is to reconsider how well the",
     "zh": "作业要求学生在一定期限前提交成果。预习帮助人看清文本 轮廓；复习巩固内容；修订则改善它。读者可以检查证据、 请教资料、略读主旨、浏览姓名、仔细查看难段、背诵关键观点，或向同伴口述笔记。"
    },
    {
     "en": "An [[VW:examination|/ɪɡˌzæmɪˈneɪʃ(ə)n/|考试；细查]], a [[VW:test|/test/|试验，检验；试验，检验]] and a [[VW:quiz|/kwɪz/|智力竞赛；小测验]] measure different levels of confidence. A [[VW:presentation|/ˌprez(ə)nˈteɪʃ(ə)n/|陈述；表演，演出]] makes an argument visible, and a strong [[VW:point|/pɔɪnt/|点；要点]] should support the main claim. An [[VW:abstract|/ˈæbstrækt/|摘要；抽象的；提取…]] may summarise a longer study; a [[VW:postulate|/ˈpɒstʃəleɪt/|假定，假设/假定，假设]] may state an assumption; careful reading can [[VW:detect|/dɪˈtekt/|察觉，发觉；侦察出]] a weakness, a [[VW:deliberate|/dɪˈlɪbərət/|深思熟虑，仔细考虑；审慎的]] comparison can clarify it, and a teacher may [[VW:diagnose|/ˈdaɪəɡnəʊz/|判断；诊断]] a misunderstanding before it",
     "zh": "考试、测试与小测验衡量不同程度的信心。陈述让论点变得可见，有力要点应支持主要主张。摘要可以概括较长研究； 假设可以陈述一项前提；仔细阅读能察觉弱点，有意比较能澄清它，教师则能在误解变成习惯前作出诊断。"
    },
    {
     "en": "Academic honesty requires more than avoiding a direct [[VW:copy|/ˈkɒpɪ/|复制品；抄写；复制]]. To [[VW:plagiarise|/ˈpleɪdʒəraɪz/|抄袭]] is to present another person's words or ideas as one's own. A student may [[VW:print|/prɪnt/|打印；印刷品…]] a source, [[VW:quote|/kwəʊt/|引用，引述；报(价)]] it and [[VW:cite|/saɪt/|引用]] it, but should not reproduce it without acknowledgement. A [[VW:thesis|/ˈθiːsɪs/|论文]], [[VW:essay|/ˈeseɪ/|(学生为某门课程写的)短文论说文…]] or [[VW:paper|/ˈpeɪpə(r)/|论文；纸]] may grow into a [[VW:dissertation|/ˌdɪsəˈteɪʃ(ə)n/|专题论文，(尤指)学位论文]] or ; a [[VW:heading|/ˈhedɪŋ/|标题；主题]], an [[VW:outset|/ˈaʊtset/|开端，开始]] and a clear [[VW:outline|/ˈaʊtlaɪn/|概要；轮廓，略图]] help the writer see the [[VW:gist|/dʒɪst/|主旨，要点]] before details starting [[VW:point|/pɔɪnt/|点；要点]] rather than a final answer. An introduction should [[VW:introduce|/ˌɪntrəˈdjuːs/|介绍；引进]] a question, a [[VW:reference|/ˈrefrəns/|参考；推荐函；提及，涉及]] should identify a source, and a citation should make the source easy to find. A question can [[VW:elicit|/ɪˈlɪsɪt/|引出；探出，套出]] a useful answer, a [[VW:quote|/kwəʊt/|引用，引述；报(价)]] can preserve a voice, and an [[VW:extract|/ˈekstrækt; ɪkˈstrækt/|摘录]] can support a [[VW:summary|/ˈsʌməri/|摘要，概要]]. A writer may [[VW:assume|/əˈsjuːm/|假定，设想；承担(责任)…]], [[VW:presume|/prɪˈzjuːm/|假定，假设；料想]] or [[VW:suppose|/səˈpəʊz/|假定；认为]] that a claim is true, but a [[VW:hypothesis|/haɪˈpɒθəsɪs/|假说，假设]] must remain open to evidence. To [[VW:speculate|/ˈspekjuleɪt/|推测]] is not the same as to [[VW:predict|/prɪˈdɪkt/|预测]].",
     "zh": "学术诚信不只是避免直接复制。抄袭是把别人的话或观点冒 充为自己的。学生可以打印资料、引用并注明来源，但不应 未经承认就复制。论文、短文或文章可以发展为学位论文或 专题研究；标题、开端和清晰概要能帮助作者在细节扩张前看清主旨。优秀读者把看法当作起点，而非最终答案。引言应引出问题参考应识别来源，引用则让来源易于查找。问题可以引出有用答案，引语可以保留声音，摘录可以支持摘要。作者可能假定、料想或认为某个说法为真，但假说必须对证据保持开放。推测并不等于预测。"
    },
    {
     "en": "Perception and reasoning work together. We [[VW:perceive|/pəˈsiːv/|感知，察觉，意识到]] a pattern, [[VW:discern|/dɪˈsɜːn/|觉察出；分辨出]] a difference, [[VW:recognise|/ˈrekəɡnaɪz/|认识，辨认出]] a familiar idea and become [[VW:conscious|/ˈkɒnʃəs/|意识到的；奋知觉的]] of a hidden assumption. We may [[VW:reckon|/ˈrekən/|估计；期望；认为]] that a plan is sound or [[VW:deem|/diːm/|认为，相信]] a result convincing. A statement can [[VW:imply|/ɪmˈplaɪ/|暗指，意味着]] more than it says; a symbol can [[VW:represent|/ˌreprɪˈzent/|代表；象征]] an entire [[VW:system|/ˈsɪstəm/|系统；体系，制度]]. A scholar may [[VW:insist|/ɪnˈsɪst/|坚持，坚决认为(或主张、要求)…]] on accuracy and [[VW:persist|/pəˈsɪst/|坚持不懈；持续存在]] through repeated failure, yet still fail to [[VW:understand|/ˌʌndəˈstænd/|懂得，理解]] the whole. To [[VW:comprehend|/ˌkɒmprɪˈhend/|理解，领悟]] a problem is to [[VW:analyse|/ˈænəlaɪz/|分析]] its parts, [[VW:infer|/ɪnˈfɜː(r)/|推断，推理]] a relationship, [[VW:deduce|/dɪˈdjuːs/|演绎，推论]] a consequence and [[VW:conclude|/kənˈkluːd/|推断出，得出结论；(使)结束]] with humility.",
     "zh": "感知与推理协同工作。我们感知模式，分辨差异，辨认熟悉想法，并意识到隐藏假设。我们可能估计计划可靠，或认为结果有说服力。一句话可以暗指多于字面的意思；一个符号可以代表整个系统。学者可能坚持准确性，并在反复失败中持续努力，却仍无法理解整体。理解问题就是分析各部分，推断关系，演绎后果，并谦逊地得出结论。"
    },
    {
     "en": "An [[VW:analogy|/əˈnælədʒi/|类比；类推]] can make an unfamiliar idea accessible. To [[VW:compare|/kəmˈpeə(r)/|比较；但......比作…]] two cases is to look for similarity; to [[VW:contrast|/ˈkɒntrɑːst/|对比；明显的差异]] them is to identify difference. A [[VW:survey|/ˈsɜːveɪ/|民意调查…]] can reveal a pattern, and a student may [[VW:apply|/əˈplaɪ/|应用，适用]] a method to a new field. A [[VW:fee|/fiː/|酬金；费用]] may limit access, and two explanations may [[VW:overlap|/ˌəʊvəˈlæp/|与......复叠…]] without being identical. A [[VW:contradiction|/ˌkɒntrəˈdɪkʃ(ə)n/|矛盾，不一致；反驳]] should not be hidden, and people may [[VW:disagree|/ˌdɪsəˈɡriː/|有分歧；不同意]] because their assumptions [[VW:differ|/ˈdɪfə(r)/|不同，相异]]. A [[VW:diverse|/daɪˈvɜːs/|不一样的，多种多样的]] set of examples reveals [[VW:nuance|/ˈnjuːɑːns/|细微差别]], while an [[VW:inductive|/ɪnˈdʌktɪv/|归纳的；诱导的]] argument moves from [[VW:detail|/ˈdiːteɪl/|细节；(画等的)细部]] to general pattern. A [[VW:thorough|/ˈθʌrə/|彻底的，详尽的]] [[VW:review|/rɪˈvjuː/|回顾；复习；回顾；复习]] does not ignore inconvenient evidence.",
     "zh": "类比能让陌生想法变得可理解。比较两个案例是寻找相似，对比则是识别差异。调查可以揭示模式，学生也可能把方法应用于新领域。费用会限制机会，两种解释也可能部分重叠却并不相同。矛盾不应被掩盖，人们会因前提不同而产生分歧。多样例子揭示细微差别，归纳论证则从细节走向一般模式。彻底回顾不会忽略不便的证据。"
    },
    {
     "en": "An [[VW:example|/ɪɡˈzɑːmp(ə)l/|例子；榜样]] makes an argument concrete; an [[VW:instance|/ˈɪnstəns/|实例；情况，场合]] shows how a principle works. Evidence may [[VW:confirm|/kənˈfɜːm/|证实；确保，巩固]] a claim, [[VW:demonstrate|/ˈdemənstreɪt/|示范，演示；证明]] a relationship, [[VW:illustrate|/ˈɪləstreɪt/|(用图等)说明…]] a trend or [[VW:manifest|/ˈmænɪfest/|显示，表明]] a change. A single case cannot [[VW:prove|/pruːv/|证明；结果是]] a universal rule, but it can help [[VW:determine|/dɪˈtɜːmɪn/|决定；下定决心；查明]] what to study next. A student must [[VW:decide|/dɪˈsaɪd/|决定]] how to [[VW:resolve|/rɪˈzɒlv/|决心，决定；(使)分解为…]] a conflict, conduct [[VW:research|/rɪˈsɜːtʃ/|调查；探索]], [[VW:observe|/əbˈzɜːv/|观察，观测；注意到]] a process, [[VW:inquire|/ɪnˈkwaɪə(r)/|询问；调查]] about a result and design a [[VW:questionnaire|/ˌkwestʃəˈneə(r)/|调查表，调查问卷]]. A [[VW:query|/ˈkwɪəri/|疑问；询问；怀疑；询问]] is useful when it is precise.",
     "zh": "例子让论证具体，实例显示原则如何运作。证据可以证实主张、演示关系、说明趋势或表明变化。单一案例不能证明普遍规律，却有助于决定下一步研究什么。学生必须决定如何解决冲突、开展研究、观察过程、询问结果并设计调查问卷。问题只有精确时才有用。"
    },
    {
     "en": "Learning also involves recognition. A student may [[VW:accomplish|/əˈkʌmplɪʃ/|达到(目的)，完成]] a difficult task, [[VW:attain|/əˈteɪn/|获得；达到]] a personal goal and earn [[VW:credit|/ˈkredɪt/|赊购；学分；信任]] for honest effort. A [[VW:score|/skɔː(r)/|得分，成绩]], [[VW:mark|/mɑːk/|分数；标记标志着…]], [[VW:grade|/ɡreɪd/|给......分等级等级…]] or [[VW:rank|/ræŋk/|等级；排，列给····平级…]] offers one kind of [[VW:feedback|/ˈfiːdbæk/|反馈，反应]], and a place in a [[VW:row|/rəʊ/|(一)排，(一)行]] or a [[VW:queue|/kjuː/|行列排队等候]] is not a measure of worth. A [[VW:grant|/ɡrɑːnt/|授予；准予；承认]], [[VW:praise|/preɪz/|赞美；赞扬]] and constructive [[VW:feedback|/ˈfiːdbæk/|反馈，反应]] can support progress, but learners should not [[VW:overestimate|/ˌəʊvərˈestɪmeɪt/|高估]] a single result. A [[VW:fellowship|/ˈfeləʊʃɪp/|研究生奖学金]] or [[VW:scholarship|/ˈskɒləʃɪp/|奖学金；学问，学识]] may open a door; a [[VW:reward|/rɪˈwɔːd/|报答；黄金；报答]], [[VW:award|/əˈwɔːd/|奖；奖品]] or [[VW:prize|/praɪz/|奖赏；珍视]] may [[VW:recognise|/ˈrekəɡnaɪz/|认识，辨认出]] achievement without defining it. Just as importantly, students learn to [[VW:appreciate|/əˈpriːʃieɪt/|赏识；感激；意识到]] work that is careful rather than merely quick, and to value progress that no  can fully express.",
     "zh": "学习也涉及认可。学生可能完成艰难任务，达到个人目标，并因诚实努力获得学分。分数、成绩、等级或排名提供一种反馈，而排队中的位置并不衡量价值。助学金、赞扬和建设性反馈能支持进步，但学习者不应高估单一结果。研究生奖学金或奖学金可能打开一扇门；报答、奖品或奖赏可以认可成就，却不能定义成就。同样重要的是，学生要学会欣赏细致而非只是迅速的工作，也要珍惜任何单一分数都无法完整表达的进步。"
    }
   ],

   "paragraphs": [
    {
     "en": "[[VW:Technology|/tekˈnɒlədʒi/|技术]] is not a single object but a long conversation between knowledge and need. A [[VW:technique|/tekˈniːk/|技巧；技术]] may begin as a gesture, become a craft, and eventually support a whole [[VW:domain|/dəˈmeɪn/|(活动、学问等的)领域…]] of engineering. At a [[VW:polytechnic|/ˌpɒliˈteknɪk/|有关多种工艺的；理工学院]], students learn how an [[VW:engineer|/ˌendʒɪˈnɪə(r)/|工程师，技师]] and a [[VW:mechanic|/məˈkænɪk; mɪˈkænɪk/|技工，机械师，机修工]] approach the same machine from different angles: one designs a system, while the other listens to its sounds and feels where resistance begins. Every [[VW:advance|/ədˈvɑːns/|发展；前进；发展；前进]] creates new questions, and the wish to [[VW:innovate|/ˈɪnəveɪt/|创新，改革]] often grows from a stubborn practical problem. To [[VW:invent|/ɪnˈvent/|发明，创造]] is to bring a new possibility into the world, while even a modest [[VW:gizmo|/ˈɡɪzməʊ/|小装置]] can [[VW:reveal|/rɪˈviːl/|展现；显示，透露]] how 02 A [[VW:breakthrough|/ˈbreɪkθruː/|突破]] rarely arrives without preparation. Inventors may [[VW:devise|/dɪˈvaɪz/|设计，发明]] a device, file a [[VW:patent|/ˈpeɪt(ə)nt; ˈpæt(ə)nt/|专利，专利权…]] and [[VW:discover|/dɪˈskʌvə(r)/|发现]] an unexpected effect before they can explain why it works. To [[VW:disclose|/dɪsˈkləʊz/|揭露，透露]] an idea is to make it public; to [[VW:reveal|/rɪˈviːl/|展现；显示，透露]] a result is to show what was hidden; to [[VW:uncover|/ʌnˈkʌvə(r)/|揭露，发现]] a cause is to find it beneath appearances; and to [[VW:expose|/ɪkˈspəʊz/|使暴露；揭发，使曝光]] a fault is to place it where it can be examined. The most useful inventions do not merely surprise us. They enlarge the [[VW:realm|/relm/|领域]] in",
     "zh": "技术不是某一个孤立物件，而是知识与需要之间漫长的对话。一种技巧可能从手势开始，逐渐成为手艺，最终支撑整个工 程领域。在理工学院里，学生学习工程师与机械师如何从不同角度看待同一台机器：一个设计系统，另一个倾听声音， 感受阻力从何处出现。每一次进步都会带来新问题，而创新愿望往往源自顽固的现实难题。突破很少在没有准备时到来。发明者可能设计装置、申请专利，并在能够解释原理之前发现意外效果。披露想法就是把 它公之于众；揭示结果就是展示原先隐藏之物；发掘原因就是透过表象找到根源；暴露缺陷则是把它放到可检查的位置。 真正有用的发明不只是令我们惊讶，它还会拓宽普通人能够 行动的领域。"
    },
    {
     "en": "The [[VW:foundation|/faʊnˈdeɪʃ(ə)n/|基础；地基；基金会]] of applied science lies in careful attention. A specialist may [[VW:specialise|/ˈspeʃəlaɪz/|专攻]] in one narrow field, [[VW:concentrate|/ˈkɒns(ə)ntreɪt/|集中(心思)；(使)浓缩]] on a single variable, [[VW:focus|/ˈfəʊkəs/|(把……)集中(于) 焦点]] on a measurable effect and [[VW:utilise|/ˈjuːtəlaɪz/|利用]] a familiar method in a new setting. Yet [[VW:usage|/ˈjuːsɪdʒ/|使用；(词语的)用法]] changes with context: a [[VW:tool|/tuːl/|工具]] that is gentle in a laboratory may be dangerous in a factory. A [[VW:tester|/ˈtestə(r)/|测试仪；测试员]] must therefore ask not only whether a device works, but also when, for whom and under what conditions it",
     "zh": "应用科学的基础在于细致关注。专才可以专攻某一狭窄领域集中研究单一变量，聚焦可测量效应，并在新环境中利用 熟悉方法。然而，用法会随语境改变：实验室里温和的工具在工厂里可能危险。因此，测试者不仅要问装置是否有效 ，还要问它在何时、对谁、在何种条件下可能失效。"
    },
    {
     "en": "An [[VW:appliance|/əˈplaɪəns/|应用；(家用)器具]] brings [[VW:technology|/tekˈnɒlədʒi/|技术]] into the home, while a [[VW:facility|/fəˈsɪlətɪ/|设备；便利]] may serve a school, hospital or station. [[VW:Equipment|/ɪˈkwɪpmənt/|设备]] can be large or small, and an [[VW:instrument|/ˈɪnstrəmənt/|仪器；工具；乐器]] may [[VW:measure|/ˈmeʒə(r)/|测量；衡量；措施]], record or make music. A simple [[VW:tool|/tuːl/|工具]] can extend the hand; a [[VW:gauge|/ɡeɪdʒ/|测量仪器；测量；判断]] can make pressure visible; and a [[VW:measure|/ˈmeʒə(r)/|测量；衡量；措施]] can turn a vague impression into a number. We [[VW:calculate|/ˈkælkjuleɪt/|计算；考虑，打算]] a total, [[VW:compute|/kəmˈpjuːt/|计算；估计]] a result, [[VW:count|/kaʊnt/|计算]] a set of parts and [[VW:assess|/əˈses/|评估；估算]] a risk. To [[VW:evaluate|/ɪˈvæljueɪt/|评价，评估]] a design is to judge",
     "zh": "家用器具把技术带入家庭，而公共设施可能服务学校、医院或车站。设备可大可小，仪器可以测量、记录或演奏音乐。 简单工具能延伸双手；计量表能让压力变得可见；衡量则能把模糊印象变成数字。我们计算总量，推算结果，数出部件 数量，并评估风险。评价设计，就是同时判断它的承诺与代价。"
    },
    {
     "en": "Few devices consist of one perfect part. An [[VW:accessory|/əkˈsesəri/|附件，配件]] may improve a machine, while a [[VW:byproduct|/ˈbaɪˌprɒdʌkt/|副产品]] is produced alongside the main result. An [[VW:auxiliary|/ɔːɡˈzɪliəri/|辅助的，协助的；备用的]] system provides support when the primary one is stressed, and a [[VW:versatile|/ˈvɜːsətaɪl/|多功能的，多用途的]] material may serve several purposes. Engineers [[VW:add|/æd/|添加；附加]] a component, [[VW:accumulate|/əˈkjuːmjəleɪt/|积累；(数额)逐渐增加]] observations, [[VW:assemble|/əˈsemb(ə)l/|组装；装配]] the pieces, [[VW:gather|/ˈɡæðə(r)/|聚集；采集]] data, [[VW:attach|/əˈtætʃ/|使依附；附加；缚，系，贴]] a [[VW:sensor|/ˈsensə(r)/|传感器]] and consider where each part should [[VW:belong|/bɪˈlɒŋ/|应在(某处)…]]. A machine is therefore a relationship among parts, not just a collection of",
     "zh": "很少有装置只由一个完美部件组成。附件可以改进机器，副 产品则与主要结果一同产生。辅助系统在主体承压时提供支持，通用材料则可用于多种用途。工程师添加部件，积累观 察，组装零件，采集数据，固定传感器，并思考每个部分应归属于何处。因此，机器是各部分之间的关系，而不只是物 件的集合。"
    },
    {
     "en": "[[VW:Optics|/ˈɒptɪks/|光学]] offers a clear example of how bring a tiny world into view; [[VW:radar|/ˈreɪdɑː(r)/|雷达，无线电定位装置]] sends out a signal and reads its [[VW:echo|/ˈekəʊ/|回声；发回声；模仿；重复]]; a [[VW:sensor|/ˈsensə(r)/|传感器]] detects a change that human senses may miss. [[VW:Multimedia|/ˌmʌltiˈmiːdiə/|多媒体]] systems combine image, sound and text, but their power depends on disciplined design. The same principle applies across the  becomes meaningful when it helps us see more clearly, not merely when it",
     "zh": "instruments reshape perception. A microscope /ˈmaɪkrəskəʊp/ （显微镜） uses a lens /lenz/ （透镜；(照相机等的)镜头） to光学提供了一个清晰例子，说明仪器如何重塑感知。显微镜用镜片把微小世界带入视野；雷达发出信号并读取回声；传感器察觉人类感官可能错过的变化。多媒体系统结合图像、声音与文字，但其力量取决于严谨设计。同样的原则适用于各门科学：只有当技术帮助我们看得更清楚，而非仅仅制造更多数据时，它才真正有意义。"
    }
   ],

   "zhTitle": "创新与社会",
   "enTitle": "Innovation and Society",
   "paragraphs": [
    {
     "en": "01 A modern [[VW:network|/ˈnetwɜːk/|网络；广播网，电视网]] is less a place than a set of relationships. A [[VW:browser|/ˈbraʊzə(r)/|浏览器]] opens a window onto it, while a [[VW:laptop|/ˈlæptɒp/|笔记本电脑]], [[VW:keyboard|/ˈkiːbɔːd/|键盘]] and [[VW:screen|/skriːn/|屏；屏幕；遮蔽]] make private thought public. [[VW:Software|/ˈsɒftweə(r)/|软件]] translates intention into action, a [[VW:microphone|/ˈmaɪkrəfəʊn/|话筒，麦克风]] captures a voice, and a [[VW:loudspeaker|/ˌlaʊdˈspiːkə(r)/|扬声器，喇叭]] returns it to a room. The old [[VW:cassette|/kəˈset/|盒式磁带；底片盒]] and magnetic [[VW:tape|/teɪp/|磁带，录音带；胶带]] have not vanished from memory: they remind us that every new medium once seemed strange, and that a simple [[VW:dial|/ˈdaɪəl/|拨(电话号码)]] was the first interface many people touched. What was once a [[VW:fantasy|/ˈfæntəsi/|幻想]] of instant connection has become an ordinary part of work,",
     "zh": "现代网络与其说是地点，不如说是一组关系。浏览器为它打开一扇窗，而笔记本电脑、键盘和屏幕让个人思考公之于众。 软件把意图转化为行动，话筒捕捉声音，扬声器又把它送回 房间。旧式盒式磁带和磁带并未从记忆中消失：它们提醒我们，每一种新媒介最初都显得陌生，而简单的拨号盘曾是许 多人最早接触的交互界面。"
    },
    {
     "en": "[[VW:Binary|/ˈbaɪnəri/|二进制的；二元的]] code reduces information to two states, yet its consequences are remarkably rich. [[VW:Digital|/ˈdɪdʒɪt(ə)l/|数字的]] systems store text, image and sound; [[VW:wireless|/ˈwaɪələs/|不用电线的，无线的]] links cross a room or an ocean; [[VW:high-definition|/ˌhaɪ ˌdefɪˈnɪʃn/|高分辨率的]] displays make an image vivid; and [[VW:audio|/ˈɔːdiəʊ/|声音的]] tools preserve the texture of a voice. Like a [[VW:pump|/pʌmp/|泵 (用泵)抽]] that moves water or a [[VW:generator|/ˈdʒenəreɪtə(r)/|发电机]] that produces power, these systems circulate something invisible. A [[VW:gear|/ɡɪə(r)/|齿轮，传动装置；使适合]] may change speed, while a [[VW:pivot|/ˈpɪvət/|枢轴，支点；中心，重点]] gives a mechanism its point of turning; [[VW:hydraulic|/haɪˈdrɒlɪk/|水力的，液压的]] pressure can move",
     "zh": "二进制代码把信息缩减为两种状态，其后果却异常丰富。数 字系统储存文字、图像和声音；无线连接跨越房间或海洋； 高清屏幕让图像鲜明；音频工具保存声音的质感。它们像抽水的泵或发电的发电机一样，让某种无形之物循环流动。齿 轮可以改变速度，枢轴给机械提供转动支点；液压压力则能无需人直接推拉便移动沉重物体。"
    },
    {
     "en": "Infrastructure is often noticed only when it fails. [[VW:Drainage|/ˈdreɪnɪdʒ/|排水系统；排水]] carries rainwater away, [[VW:sewage|/ˈsuːɪdʒ/|(下水道的)污水]] requires treatment, and [[VW:ventilation|/ˌventɪˈleɪʃn/|通风；通风设备]] keeps indoor air breathable. To [[VW:compress|/kəmˈpres/|压紧，压缩]] a gas is not the same as to [[VW:condense|/kənˈdens/|简缩，精简；(使气体)凝结]] it into liquid; to [[VW:refine|/rɪˈfaɪn/|精炼，提纯]] a fuel is not the same as to [[VW:simplify|/ˈsɪmplɪfaɪ/|简化，精简]] a message; to [[VW:purify|/ˈpjʊərɪfaɪ/|净化，使纯净]] water is not the same as to [[VW:filter|/ˈfɪltə(r)/|过滤；(光或声)透过；过滤器]] every particle. A laboratory may [[VW:distil|/dɪˈstɪl/|蒸馏；提取......的精华]] a liquid to separate its components, while a [[VW:filter|/ˈfɪltə(r)/|过滤；(光或声)透过；过滤器]] uses passage and restraint. Each process can [[VW:transform|/trænsˈfɔːm/|使改变形态；使改观]] material and reveals a practical truth: change needs both energy and 04 A [[VW:prototype|/ˈprəʊtətaɪp/|原型；雏形]] is not a final product but an honest question. Its [[VW:framework|/ˈfreɪmwɜːk/|框架，结构；体系]] may be rough, and each [[VW:aspect|/ˈæspekt/|(问题、事物等的)方面]] may be tested one [[VW:phase|/feɪz/|阶段，时期]] at a time. Engineers [[VW:operate|/ˈɒpəreɪt/|操作；运营；做手术]] a device, [[VW:facilitate|/fəˈsɪlɪteɪt/|使便利，促进]] a task and observe how it transforms a routine. They may [[VW:alter|/ˈɔːltə(r)/|改变，变更]] a setting, [[VW:shift|/ʃɪft/|转移，变换；转移，变换；轮班]] a priority, [[VW:turn|/tɜːn/|转；翻 (依次轮到的)机会]] a [[VW:dial|/ˈdaɪəl/|拨(电话号码)]], [[VW:adapt|/əˈdæpt/|适应；改编]] an old method or [[VW:adjust|/əˈdʒʌst/|调节…]] a plan. To [[VW:pinpoint|/ˈpɪnpɔɪnt/|精确指明……的位置；针尖…]] a problem is difficult, because an [[VW:accurate|/ˈækjərət/|准确的，正确无误的]] measurement is not automatically a complete",
     "zh": "基础设施往往在失效时才被注意。排水系统带走雨水，污水需要处理，通风让室内空气可呼吸。压缩气体不等同于把气 体凝结成液体；精炼燃料不等同于简化信息；净化水也不等同于过滤掉每个微粒。蒸馏借助热量与差异，过滤器则借助 通过与阻拦。每个过程都揭示一个现实真理：转变既需要能量，也需要控制。原型不是最终产品，而是一个诚实的疑问。它的框架可能粗 糙，每个方面都可能在一个阶段中接受测试。工程师操作装置，促进任务完成，并观察它如何改变日常流程。他们可能 改变设置、转移重点、转动旋钮、改编旧方法或调整计划。 精确指明问题很难，因为准确测量并不自动等于完整解释。"
    },
    {
     "en": "Precision matters, but it is not the same as certainty. A [[VW:precise|/prɪˈsaɪs/|精确的，准确的；一丝不苟的]] reading may still rest on a [[VW:wrong|/rɒŋ/|错误的；错误地]] assumption; a [[VW:correct|/kəˈrekt/|正确的]] answer may follow from a mistaken route; a small [[VW:error|/ˈerə(r)/|错误，过失]] may reveal a deeper [[VW:flaw|/flɔː/|缺陷；错误]]; and a [[VW:fault|/fɔːlt/|缺点；故障；找出缺点]] may be caused by design, use or circumstance. Anyone who never makes a [[VW:mistake|/mɪˈsteɪk/|错；误；误；解]] may simply be avoiding difficulty. When people [[VW:stumble|/ˈstʌmb(ə)l/|犯错误；绊脚；跌跌撞撞地走]], the useful response is not blame but investigation. A [[VW:contingency|/kənˈtɪndʒənsi/|意外事件，可能发生的事]] plan accepts that the",
     "zh": "精确很重要，但它不等于确定。精确读数仍可能建立在错误 假设上；正确答案也可能来自误解路径；小错误会揭示更深 缺陷；故障则可能源于设计、使用或环境。从不犯错的人，也许只是在回避困难。当人们跌倒时，有益反应不是责备，而是调查。应急计划承认，意外本就是现实世界的一部分。"
    },
    {
     "en": "Innovation changes society because it changes what can be done, who can do it and what people expect. A new tool can empower a learner, connect a distant community or reduce the cost of a public service. It can also concentrate power, create waste and make old skills seem obsolete. The question is therefore not whether technology will change us. It will. The question is whether we can direct that change with foresight, fairness and a clear sense of",
     "zh": "创新改变社会，因为它改变了能做什么、谁能做以及人们期 待什么。新工具可以赋能学习者，连接遥远社区，或降低公共服务成本。它也可能集中权力、制造废物，并让旧技能显 得过时。因此，问题不是技术是否会改变我们，它一定会。 问题在于，我们能否以远见、公平和明确目标来引导这种变化。"
    }
   ],

   "zhTitle": "遗存与记忆",

   "paragraphs": [
    {
     "en": "[[VW:Culture|/ˈkʌltʃə(r)/|文化，文明；教养]] is not a [[VW:museum|/mjuˈziːəm/|博物馆]] case filled with fixed objects. It is the living way in which a [[VW:civilisation|/ˌsɪvəlaɪˈzeɪʃ(ə)n/|文明]] remembers, adapts and argues with itself. The [[VW:Renaissance|/rɪˈneɪs(ə)ns/|文艺复兴时期]] gave Europe new confidence in art and inquiry, while an [[VW:epic|/ˈepɪk/|史诗；宏大的]] poem or a founding story can carry an [[VW:ideology|/ˌaɪdiˈɒlədʒi/|意识形态，思想体系]] across generations. What begins as [[VW:tradition|/trəˈdɪʃ(ə)n/|传统]] may harden into [[VW:convention|/kənˈvenʃ(ə)n/|惯例；大型会议]], and what one generation calls [[VW:custom|/ˈkʌstəm/|习俗；(个人的)习惯]] may be questioned by",
     "zh": "文化不是一个装满固定物件的博物馆展柜。它是文明记忆、适应并与自身争辩的活方式。文艺复兴让欧洲对艺术与探究重获信心，而史诗或起源故事能把一种思想体系带过世代。 起初作为传统的事物可能固化为惯例，而上一代称为习俗的 东西，也可能受到下一代质疑。"
    },
    {
     "en": "Every society must also confront the difference between what is legal and what is [[VW:ethical|/ˈeθɪk(ə)l/|伦理的，道德的]]. [[VW:Feudalism|/ˈfjuːdəlɪzəm/|封建主义；封建制度]] bound people to land and obligation; [[VW:slavery|/ˈsleɪvəri/|奴隶制]] denied human beings the [[VW:moral|/ˈmɒrəl/|道德上的；有道德的；道德]] standing that freedom requires. Historical study does not excuse such systems, but tries to understand how they lasted and how people resisted them. A [[VW:culture|/ˈkʌltʃə(r)/|文化，文明；教养]] that hides its wounds cannot",
     "zh": "每个社会都必须面对合法与伦理之间的差别。封建制度把人束缚于土地和义务；奴隶制否认了自由所要求的人格尊严。历史研究不为这些制度开脱，而是尝试理解它们为何延续， 以及人们如何抵抗。一个掩盖伤口的文化，无法诚实庆祝自己的成就。"
    },
    {
     "en": "The words used for belonging deserve care. A [[VW:tribe|/traɪb/|部落]] may share a language and a history without being simple or unchanging. An [[VW:aboriginal|/ˌæbəˈrɪdʒən(ə)l/|澳大利亚土著人；本土原有的…]] community may be [[VW:native|/ˈneɪtɪv/|本土的；本地人]] to a place, yet its members are not relics of the past; each [[VW:inhabitant|/ɪnˈhæbɪtənt/|居民]] has a modern life, rights and choices. Their neighbours may be [[VW:local|/ˈləʊk(ə)l/|当地的；当地人]] or [[VW:foreigner|/ˈfɒrənə(r)/|外国人]], familiar or [[VW:alien|/ˈeɪliən/|外侨；外星生物；外国的…]], while an [[VW:exotic|/ɪɡˈzɒtɪk/|外来的；异国情调的]] label often says more about",
     "zh": "用来谈论归属的词值得谨慎。部落可以共享语言和历史，却 并不因此简单或停滞。原住民社群可能世代属于某地，但其成员不是过去的遗物；他们是拥有现代生活、权利与选择的居民。他们的邻居可能是本地人或外国人、熟悉者或陌生者而“异国”标签往往更多揭示观察者，而非被描述者。"
    },
    {
     "en": "An [[VW:anthropologist|/ˌænθrəˈpɒlədʒɪst/|人类学家]] studies how people make meaning, and a [[VW:humanitarian|/hjuːˌmænɪˈteəriən/|人道主义者…]] asks how dignity can be protected across cultural difference. [[VW:Heritage|/ˈherɪtɪdʒ/|(国家的)遗产]] is not only what a society may [[VW:inherit|/ɪnˈherɪt/|继承(财产等)；经遗传获得]] from the past; it is what it chooses to protect for the future. An [[VW:antique|/ænˈtiːk/|古董；古董的]] object may be beautiful, but [[VW:archaeology|/ˌɑːkiˈɒlədʒi/|考古学]] gives it context. To [[VW:excavate|/ˈekskəveɪt/|挖掘，发掘]] a site is to disturb the ground, so a [[VW:museum|/mjuˈziːəm/|博物馆]] must record every layer, ask who",
     "zh": "人类学家研究人们如何制造意义，人道主义者则追问如何跨 越文化差异保护尊严。遗产不仅是社会从过去继承之物，也是它为未来选择保护之物。古董可能很美，但考古学赋予它 语境。发掘遗址会扰动地面，因此博物馆必须记录每一层， 追问发现物归谁所有，并解释过去为何与现在相关。"
    },
    {
     "en": "Material evidence is intimate and incomplete. An artist may [[VW:engrave|/ɪnˈɡreɪv/|在……上雕刻]] and [[VW:decorate|/ˈdekəreɪt/|装饰]] [[VW:pottery|/ˈpɒtəri/|陶器]] with great skill, yet its pattern cannot tell us everything about [[VW:belief|/bɪˈliːf/|信念；信仰]]. A [[VW:religion|/rɪˈlɪdʒən/|宗教，宗教信仰]] may express itself through [[VW:ritual|/ˈrɪtʃuəl/|仪式]], music, architecture and [[VW:etiquette|/ˈetɪkət/|礼仪，礼节]]; a shared [[VW:belief|/bɪˈliːf/|信念；信仰]] may grow into a public practice or remain a private source of courage. Objects survive more easily than",
     "zh": "物质证据既亲密又残缺。艺术家可以技艺高超地为陶器雕刻 并装饰，但它的图案未必能讲述信仰的一切。宗教可以通过仪式、音乐、建筑和礼仪表达自身；共同信念可能成为公共 实践，也可能保留为私人的勇气来源。物件比意义更容易留 存，因此阐释需要耐心。"
    },
    {
     "en": "Many traditions speak of a [[VW:soul|/səʊl/|灵魂；心灵；精神]] or [[VW:spirit|/ˈspɪrɪt/|精神，心灵]] that exceeds the visible body. A place may be [[VW:sacred|/ˈseɪkrɪd/|神圣的；宗教的]], [[VW:hallowed|/ˈhæləʊd/|神圣的；受尊崇的]] or [[VW:holy|/ˈhəʊli/|神圣的；圣洁的，虔诚的]] without belonging to one exclusive story. To respect such places is not to accept every claim about them; it is to recognise that human life reaches beyond usefulness. The task of",
     "zh": "许多传统都谈及超越可见身体的灵魂或精神。一个地方可以是神圣、受尊崇或圣洁的，而不只属于唯一叙事。尊重这类 地方，并不等于接受关于它们的每一种主张；而是承认人类 生活不只关乎实用。因此，记忆的任务不是冻结过去，而是让它与现在保持诚实的对话。"
    }
   ],

  {
   "zhTitle": "文化交流",
   "enTitle": "Cultural Exchange",
   "paragraphs": [
    {
     "en": "Religious institutions have long shaped cultural exchange. A [[VW:Pope|/pəʊp/|教皇]], [[VW:bishop|/ˈbɪʃəp/|主教]], [[VW:missionary|/ˈmɪʃən(ə)ri/|传教士]] or [[VW:priest|/priːst/|牧师；神父；教士]] may carry a message across borders; a [[VW:Bible|/ˈbaɪb(ə)l/|基督教的《圣经》]] may be translated into a new language; and a [[VW:church|/tʃɜːtʃ/|教堂]], [[VW:cathedral|/kəˈθiːdrəl/|大教堂]] or [[VW:choir|/ˈkwaɪə(r)/|唱诗班]] can turn belief into shared sound. A [[VW:monk|/mʌŋk/|僧侣]] in a quiet library, a [[VW:temple|/ˈtemp(ə)l/|寺院，庙宇]] keeper and a tall [[VW:pagoda|/pəˈɡəʊdə/|佛塔]] belong to different traditions, yet each",
     "zh": "宗教制度长期塑造着文化交流。教皇、主教、传教士或神父可能把信息带过边界；《圣经》可能被译成新语言；教堂、 大教堂或唱诗班则能把信仰化为共同声音。安静图书馆中的 僧侣、寺院守护者和高耸佛塔属于不同传统，却都显示信仰如何成为建筑、日常与记忆。"
    },
    {
     "en": "An [[VW:empire|/ˈempaɪə(r)/|帝国]] also moves people, goods and ideas. An [[VW:imperial|/ɪmˈpɪəriəl/|帝国的]] administration may seek order, a [[VW:royal|/ˈrɔɪəl/|皇家的；高贵的]] court may display wealth, and a [[VW:dynasty|/ˈdɪnəsti/|朝代]] may leave a [[VW:chronology|/krəˈnɒlədʒi/|年表，事件发生顺序表；年代学]] of rulers whose names are still debated. An [[VW:emperor|/ˈempərə(r)/|皇帝]], [[VW:king|/kɪŋ/|国王]], [[VW:queen|/kwiːn/|王后；女王]], [[VW:prince|/prɪns/|王子；亲王]] or [[VW:princess|/ˌprɪnˈses/|公主；王妃]] could occupy the centre of a public story, while the [[VW:majesty|/ˈmædʒəsti/|威严，壮观；陛下]] of a throne concealed ordinary fear and dependence. [[VW:Nobility|/nəʊˈbɪləti/|高尚的品质；贵族]], a [[VW:lord|/lɔːd/|(英国)贵族；阁下，大人…]] or a [[VW:knight|/naɪt/|骑士；封(某人)为爵士]] might enjoy high [[VW:status|/ˈsteɪtəs/|地位，身份]], but [[VW:status|/ˈsteɪtəs/|地位，身份]] was often",
     "zh": "帝国也会移动人、货物与观念。帝国行政可能追求秩序，王 室可能展示财富，王朝可能留下统治者年表，而这些人名至今仍有争议。皇帝、国王、王后、王子或公主可能居于公共叙事的中心，而王座的威严掩盖着普通人的恐惧与依附。贵 族、领主或骑士可能享有较高地位，但地位往往来自继承，而非功绩。"
    },
    {
     "en": "Every person needs a [[VW:guardian|/ˈɡɑːdiən/|保卫者；监护人；守护的]], whether a parent, teacher, friend or institution. Yet movement can produce [[VW:nostalgia|/nɒˈstældʒə/|思乡之情；怀旧之情]]: the [[VW:homesick|/ˈhəʊmsɪk/|思乡的]] traveller longs for a familiar street, while a [[VW:celebrity|/səˈlebrəti/|名人；名誉]] may feel exposed by public attention. Social [[VW:status|/ˈsteɪtəs/|地位，身份]] and [[VW:background|/ˈbækɡraʊnd/|背景…]] shape opportunity, but [[VW:experience|/ɪkˈspɪəriəns/|经验；(一次)经历，体验]] is never reducible to a label. A personal [[VW:anecdote|/ˈænɪkdəʊt/|轶事，奇闻]] can illuminate a",
     "zh": "每个人都需要守护者，无论那是父母、教师、朋友还是制度。然而迁徙会带来乡愁：思乡的旅人渴望熟悉的街道，名人则可能因公众关注而感到暴露。社会地位和背景塑造机会，但 经验永远不能简化为标签。个人轶事能照亮整个时代，即使 它只是众多叙述之一。"
    },
    {
     "en": "History also turns on [[VW:accident|/ˈæksɪdənt/|事故；意外，偶然的事]] and [[VW:incident|/ˈɪnsɪdənt/|(尤指不寻常的、重要的或暴力的)事件…]]. A chance meeting may begin a friendship; a sudden [[VW:incident|/ˈɪnsɪdənt/|(尤指不寻常的、重要的或暴力的)事件…]] may divide a community; and a serious [[VW:accident|/ˈæksɪdənt/|事故；意外，偶然的事]] may reveal the weakness of an old system. A society may [[VW:thrive|/θraɪv/|繁荣，兴旺发达；茁壮生长]] through trade, learning and trust, and its [[VW:prosperity|/prɒˈsperəti/|繁荣，兴旺]] may seem permanent until a [[VW:setback|/ˈsetbæk/|挫折，阻碍]] arrives. [[VW:Adversity|/ədˈvɜːsəti/|逆境]] tests not only resources but also the",
     "zh": "历史也取决于偶然与事件。一次偶遇可能开启友谊；突发事 件可能分裂社群；严重事故则可能暴露旧制度的弱点。社会可能因贸易、学习与信任而兴旺，其繁荣看似永久，直到挫 折到来。逆境考验的不只是资源，也考验人们讲述自身的故 事。"
    },
    {
     "en": "Cultural exchange is most valuable when it is reciprocal. To learn from another tradition is not to abandon one's own; to translate an idea is not to erase its origin. The meeting of civilisations has too often been described as a simple victory or defeat. A more truthful account notices negotiation, borrowing, misunderstanding and repair. [[VW:Prosperity|/prɒˈsperəti/|繁荣，兴旺]] built on respect lasts longer",
     "zh": "文化交流在双向时最有价值。向另一种传统学习，不等于抛 弃自己的传统；翻译一个观念，也不等于抹去其来源。文明相遇常被描述为简单胜败，但更真实的叙述会注意协商、借用、误解与修复。建立在尊重上的繁荣，比建立在沉默上的 繁荣更持久。"
    },
    {
     "en": "In the end, memory is a form of responsibility. The names of rulers fade, but habits of hospitality, laws and works of art continue to shape daily life. A culture becomes narrow when it treats its own customs as universal and everyone else as an",
     "zh": "最终，记忆是一种责任。统治者的名字会淡去，但待客习惯、 法律和艺术作品仍继续塑造日常生活。一个文化若把自己的习俗视为普遍，把其他所有人都视为局外人，就会变得狭窄若能在不失去自身声音的同时容纳差异，它便变得宽厚。"
    }
   ],

  {
   "zhTitle": "语言的生命",
   "enTitle": "The Life of Language",
   "paragraphs": [
    {
     "en": "[[VW:Language|/ˈlæŋɡwɪdʒ/|语言]] begins before writing. A [[VW:symbol|/ˈsɪmb(ə)l/|象征；符号，记号]], a [[VW:sign|/saɪn/|符号；征兆，迹象…]] or a [[VW:gesture|/ˈdʒestʃə(r)/|手势，姿势]] can carry meaning between people who share no [[VW:dictionary|/ˈdɪkʃən(ə)ri/|词典，字典，辞典]], and [[VW:handwriting|/ˈhændraɪtɪŋ/|笔迹；书写]] preserves the pressure of a particular hand. Early communities used a [[VW:pictograph|/ˈpɪktəɡrɑːf/|象形文字]], a [[VW:wedge|/wedʒ/|楔子；楔形物；楔形文字]]-shaped mark or a [[VW:knot|/nɒt/|(绳、线等的)结…]] in a cord to record ownership, time or memory. Only later did a full writing system",
     "zh": "语言早于文字。一个象征、符号或手势可以在没有共同词典 的人之间传递意义，手写笔迹则保存某只手的力度。早期社 群用象形文字、楔形标记或绳结记录所有权、时间或记忆。直到后来，完整书写系统才让信息离开信使也能远行。"
    },
    {
     "en": "[[VW:Linguistics|/lɪŋˈɡwɪstɪks/|语言学]] studies [[VW:language|/ˈlæŋɡwɪdʒ/|语言]] as a system rather than a collection of isolated words. [[VW:Semantic|/sɪˈmæntɪk/|语义的]] study asks what expressions mean, [[VW:syntax|/ˈsɪntæks/|句法]] explains how words combine, and [[VW:grammar|/ˈɡræmə(r)/|语法；语法书]] describes regular patterns without claiming that every sentence follows one simple rule. [[VW:Phonetics|/fəˈnetɪks/|语音学]] examines the physical sounds of speech, while pronunciation, [[VW:intonation|/ˌɪntəˈneɪʃ(ə)n/|语调]] and [[VW:inflection|/ɪnˈflekʃn/|语调的抑扬变化]] reveal emotion, emphasis and region. To [[VW:pronounce|/prəˈnaʊns/|发……的音；宣布]] a word is also to place it in 03 A [[VW:dialect|/ˈdaɪəlekt/|方言，地方话]] is not a failed standard [[VW:language|/ˈlæŋɡwɪdʒ/|语言]]. It is a variety shaped by community, history and place, and an [[VW:accent|/ˈæksent/|重音；口音；读音符号]] may identify where a speaker grew up without limiting what that speaker can say. An [[VW:utterance|/ˈʌtərəns/|说话；话语]] becomes [[VW:oral|/ˈɔːrəl/|口头的]] or [[VW:verbal|/ˈvɜːb(ə)l/|口头的；言语的]] when it enters the air, and even a single [[VW:syllable|/ˈsɪləb(ə)l/|音节]] can carry meaning. A [[VW:phoneme|/ˈfəʊniːm/|音位]], [[VW:vowel|/ˈvaʊəl/|元音]] or [[VW:consonant|/ˈkɒnsənənt/|辅音]] may seem small, yet differences among them can change",
     "zh": "语言学研究作为系统的语言，而不是孤立词语的集合。语义 学追问表达意味着什么，句法解释词语如何组合，语法则描述规律模式，却不声称每个句子都遵循唯一简单规则。语音 学研究言语的物理声音，而发音、语调和语调起伏则揭示情 绪、强调和地域。方言不是失败的标准语。它是由社群、历史和地点塑造的变体；口音可以标示说话者成长之处，却不限制其表达能力。话语进入空气后便成为口头或言语表达，甚至一个音节也能承载意义。音位、元音或辅音看似微小，但它们之间的差异 足以彻底改变一个词。"
    },
    {
     "en": "An [[VW:alphabet|/ˈælfəbet/|字母表，(一种语言的)全部字母…]] arranges letters for a [[VW:language|/ˈlæŋɡwɪdʒ/|语言]], while a [[VW:logogram|/ˈlɒɡəɡræm/|词符，缩记符]] represents a word or idea more directly. [[VW:Vocabulary|/vəˈkæbjələri; vəʊˈkæbjələri/|词汇]] grows through use, and a [[VW:dictionary|/ˈdɪkʃən(ə)ri/|词典，字典，辞典]] records a community's shared habits at a particular moment. An [[VW:idiom|/ˈɪdiəm/|习语]], [[VW:phrase|/freɪz/|短语；习语]] or [[VW:clause|/klɔːz/|分句，从句；条款]] may resist literal translation, and an [[VW:expression|/ɪkˈspreʃ(ə)n/|词语；表达；表情]] can be warm, formal, ironic or [[VW:tense|/tens/|时态紧张的]]. Meaning lives not",
     "zh": "字母表为语言排列字母，词符则更直接地代表词或概念。词汇在使用中增长，词典记录某一时刻社群共有习惯。习语、 短语或分句可能难以逐字翻译，而表达可以温暖、正式、讽刺或紧张。意义不仅存在于词语中，也存在于词语之间的关系里。"
    },
    {
     "en": "[[VW:Language|/ˈlæŋɡwɪdʒ/|语言]] also changes because people do. New technology, migration, humour and youth culture create new terms and retire old ones. Speakers borrow, blend and invent, and a standard may follow usage rather than control it. To protect a [[VW:language|/ˈlæŋɡwɪdʒ/|语言]] is not to place it behind glass; it is to",
     "zh": "语言也会因为人而改变。新技术、迁徙、幽默和青年文化创 造新词，也让旧词退场。说话者借用、融合并发明，标准往 往追随用法，而非控制用法。保护语言不是把它放在玻璃后而是给人理由去说、读、唱和写它。"
    },
    {
     "en": "The study of [[VW:language|/ˈlæŋɡwɪdʒ/|语言]] therefore joins precision with imagination. A [[VW:grammar|/ˈɡræmə(r)/|语法；语法书]] can explain a pattern, but it cannot exhaust a poem. A [[VW:dictionary|/ˈdɪkʃən(ə)ri/|词典，字典，辞典]] can define a word, but it cannot predict every situation in which the word will feel right. We understand one another through rules, context, memory and trust, and every conversation is",
     "zh": "因此，语言研究把精确与想象结合起来。语法能解释模式， 却不能穷尽一首诗。词典能定义词语，却不能预测它在每种 情境中何时恰当。我们通过规则、语境、记忆与信任彼此理解，而每一次交谈都是一次微小的合作。"
    }
   ],

  {
   "zhTitle": "表达与理解",
   "enTitle": "Expression and Understanding",
   "paragraphs": [
    {
     "en": "Meaning is built from small patterns. A [[VW:prefix|/ˈpriːfɪks/|词首，前缀；前置代号]] changes the direction of a word, a [[VW:suffix|/ˈsʌfɪks/|后缀，词尾；尾标]] changes its grammatical role, and an [[VW:abbreviation|/əˌbriːviˈeɪʃn/|缩写形式]] saves time without always saving clarity. A [[VW:synonym|/ˈsɪnənɪm/|同义词]] may seem to offer the same sense as another word, but an [[VW:antonym|/ˈæntənɪm/|反义词]] can reveal a boundary that the [[VW:synonym|/ˈsɪnənɪm/|同义词]] hides. Even a simple [[VW:noun|/naʊn/|名词]], [[VW:verb|/vɜːb/|动词]] or [[VW:pronoun|/ˈprəʊnaʊn/|代词]] depends on context: [[VW:singular|/ˈsɪŋɡjələ(r)/|单数单数的；非凡的]] and [[VW:plural|/ˈplʊərəl/|复数复数的；多元的]] forms may shift emphasis, while an [[VW:adjective|/ˈædʒɪktɪv/|形容词]] 02 A [[VW:preposition|/ˌprepəˈzɪʃ(ə)n/|介词]] connects an object with a place or relation, and a [[VW:conjunction|/kənˈdʒʌŋkʃ(ə)n/|连词；结合]] joins ideas that might otherwise stand apart. A [[VW:consistent|/kənˈsɪstənt/|—致的；(观点或看法)连贯的]] style is not necessarily a simple one. Language can be [[VW:complicated|/ˈkɒmplɪkeɪtɪd/|复杂的]] because experience is [[VW:complex|/ˈkɒmpleks/|复杂的]], and an argument may need several clauses before it becomes clear. To [[VW:compile|/kəmˈpaɪl/|编纂]] a text is to gather and arrange, but to make it",
     "zh": "意义由细小模式构成。前缀改变词的方向，后缀改变其语法 角色，缩写节省时间，却未必总能节省清晰度。同义词看似提供相同意义，反义词却能揭示同义词所掩盖的边界。甚至一个简单的名词、动词或代词也依赖语境：单数与复数形式 会改变强调，而形容词或副词则为后文着色。介词把对象与地点或关系连接起来，连词则把原本可能彼此 分离的观念连接起来。一致风格未必简单。语言可以复杂，因为经验本身复杂；一个论点也可能需要多个分句才变得清 楚。编纂文本是收集与安排，而使其连贯，则是决定每一部 分承担何种作用。"
    },
    {
     "en": "Translation is an act of interpretation, not a transfer of labels. A translator may produce a new [[VW:version|/ˈvɜːʃ(ə)n/|译本；版本]], [[VW:translate|/trænzˈleɪt/|翻译；(使)转变]] an idea, [[VW:paraphrase|/ˈpærəfreɪz/|意译，改述；意译，改述]] a sentence or [[VW:interpret|/ɪnˈtɜːprət/|口译；解释，说明；领会，理解]] a speaker's tone. To [[VW:narrate|/nəˈreɪt/|讲(故事)，叙述]] is to give events a sequence; to [[VW:illuminate|/ɪˈluːmɪneɪt/|阐释，说明；照亮]] is to make a hidden relation visible; to [[VW:decipher|/dɪˈsaɪfə(r)/|译解；辨认]] is to recover meaning from an uncertain sign. The result should be faithful without pretending that two languages can ever be",
     "zh": "翻译是解释行为，而不是标签转移。译者可能产生新版本， 翻译观念，改述句子，或口译说话者语气。叙述是给事件顺 序；阐明是让隐藏关系可见；破译是从不确定符号中找回意义。结果应忠实，同时不假装两种语言能完全等同。"
    },
    {
     "en": "Conversation has its own architecture. A [[VW:discussion|/dɪˈskʌʃ(ə)n/|讨论，谈论]] may begin with a [[VW:brainstorm|/ˈbreɪnstɔːm/|集体自由讨论，头脑风暴集思广益，进行头脑风暴…]], sharpen into a [[VW:debate|/dɪˈbeɪt/|辩论；争论，讨论；讨论，辩论]] and end with a [[VW:commentary|/ˈkɒmənt(ə)ri/|评论，评注；批评；实况报道]] that gives the exchange a shape. Parties may [[VW:negotiate|/nɪˈɡəʊʃieɪt/|协商，谈判]], clarify their positions and discover that [[VW:contention|/kənˈtenʃ(ə)n/|争论，争辩；观点]] is not the same as hostility. [[VW:Eloquence|/ˈeləkwəns/|雄辩；流利的口才]] can persuade, but it can also conceal. To [[VW:communicate|/kəˈmjuːnɪkeɪt/|沟通，交流；传达]] well is not simply to speak; the strongest communicator is often the one",
     "zh": "交谈有自身结构。讨论可能从头脑风暴开始，深化为辩论， 并以评注收束，让交流获得形状。各方可能协商、澄清立场并发现争辩不等于敌意。雄辩能说服，也能掩盖。最强的 沟通者，往往是听得足够久，能听见尚未说出口之意的人。"
    },
    {
     "en": "Writing and speech do different work. A written [[VW:version|/ˈvɜːʃ(ə)n/|译本；版本]] can be revised until it is precise; an oral exchange must be understood in real time. Neither is automatically superior. A clear summary may help a reader, while an improvised answer may reveal a speaker's living thought. The skill lies in",
     "zh": "写作和口语承担不同工作。书面版本可以修订到精确；口头 交流必须实时理解。二者都不自动优越。清晰摘要能帮助读者，即兴回答也能显露说话者鲜活的思想。技巧在于选择适合当下的形式。"
    },
    {
     "en": "Understanding is therefore collaborative. A listener completes an utterance with memory and inference; a reader fills gaps with experience; a translator makes a choice and accepts responsibility for it. Language is not a transparent window, but a set of tools that people use together. Its imperfections do not prevent understanding. They",
     "zh": "因此，理解是一种合作。听者用记忆和推断补全话语；读者 用经验填补空白；译者作出选择，并为其承担责任。语言不 是透明窗户，而是人们共同使用的工具。它的不完美并不妨碍理解，反而让专注成为必要。"
    }
   ],

  {
   "zhTitle": "运动的节奏",
   "enTitle": "The Rhythm of Sport",
   "paragraphs": [
    {
     "en": "Sport and art both ask people to [[VW:perform|/pəˈfɔːm/|履行，执行]] in public. A [[VW:rehearsal|/rɪˈhɜːs(ə)l/|排练]] protects a work from avoidable error, while a live event accepts that anything may happen. A news [[VW:medium|/ˈmiːdɪəm/|媒介；中间的，中等的]] can turn such moments into shared experience. A [[VW:journalist|/ˈdʒɜːnəlɪst/|记者，新闻工作者]], [[VW:correspondent|/ˌkɒrəˈspɒndənt/|通信者；通讯员，记者]] or [[VW:editor|/ˈedɪtə(r)/|编辑，校订者…]] gathers and shapes a report; the [[VW:press|/pres/|新闻界，记者；报刊；出版社]] may [[VW:publish|/ˈpʌblɪʃ/|公布；出版，发行]] it; a [[VW:critic|/ˈkrɪtɪk/|批评家；挑剔的人]], [[VW:commentator|/ˈkɒmənteɪtə(r)/|评论员；实况解说员]] or [[VW:announcer|/əˈnaʊnsə(r)/|广播员，播音员]] interprets it; and an [[VW:exponent|/ɪkˈspəʊnənt/|阐述者，倡导者，拥护者]] of a method can explain why it matters. A [[VW:messenger|/ˈmesɪndʒə(r)/|邮递员，信使]], [[VW:typist|/ˈtaɪpɪst/|打字员]] or [[VW:editor|/ˈedɪtə(r)/|编辑，校订者…]] belongs to the 02 A [[VW:handout|/ˈhændaʊt/|传单；讲义]], [[VW:leaflet|/ˈliːflət/|传单；散发传单]] or [[VW:programme|/ˈprəʊɡræm/|节目；方案…]] guides an audience, but [[VW:propaganda|/ˌprɒpəˈɡændə/|宣传，鼓吹]] tries to control what people believe. To [[VW:publish|/ˈpʌblɪʃ/|公布；出版，发行]] is to make something public; to [[VW:disseminate|/dɪˈsemɪneɪt/|散布，传播]] is to spread it widely. A planner may [[VW:foresee|/fɔːˈsiː/|预见，预知]] a risk, [[VW:anticipate|/ænˈtɪsɪpeɪt/|预期，预料]] a reaction, [[VW:expect|/ɪkˈspekt/|预料，预期]] a result and [[VW:await|/əˈweɪt/|等候，期待；将降临到……身上]] an outcome. None of these acts guarantees truth. The more quickly information travels, the more carefully its",
     "zh": "体育与艺术都要求人在公众面前表演。排练使作品免于可避 免的错误，现场活动则接受任何情况都可能发生。媒体把这 种时刻变成共同经验。记者、通讯员或编辑收集并塑造报道新闻界可能将其出版；批评家、评论员或播音员作出解读 ；某种方法的倡导者则能解释其重要性。信使、打字员或编 辑也属于同一条传播链，即使新技术不断改变工具。讲义、传单或节目单引导观众，宣传却试图控制人们相信什 么。出版是让某事公开；传播是把它散播得更广。计划者可 能预见风险、预期反应、预料结果并等待结局。这些行为都不保证真实。信息传播越快，就越应仔细检查其来源与目的。"
    },
    {
     "en": "Leisure is not empty time. A [[VW:pastime|/ˈpɑːstaɪm/|消遣，娱乐]] may [[VW:entertain|/ˌentəˈteɪn/|娱乐；招待；心存，怀有]], [[VW:recreation|/ˌriːkrɪˈeɪʃn; ˌrekrɪˈeɪʃən/|休闲，娱乐]] may restore energy, and a joke may [[VW:amuse|/əˈmjuːz/|逗乐；给......提供娱乐]] without denying difficulty. [[VW:Gossip|/ˈɡɒsɪp/|闲聊；流言蜚语]] and [[VW:rumour|/ˈruːmə(r)/|谣言，传闻]] often travel faster than evidence, while a [[VW:consensus|/kənˈsensəs/|共识，一致的意见]] can form slowly through repeated observation and discussion. A [[VW:festival|/ˈfestɪvl; ˈfestəvəl/|节日；(音乐、电影等的)节]] or [[VW:feast|/fiːst/|盛宴；(宗教)节日]] brings a community together, and a [[VW:programme|/ˈprəʊɡræm/|节目；方案…]] gives an occasion a [[VW:rhythm|/ˈrɪðəm/|节奏，韵律]]. People may [[VW:imitate|/ˈɪmɪteɪt/|模仿，效仿]], [[VW:mimic|/ˈmɪmɪk/|模仿，效仿]] or [[VW:simulate|/ˈsɪmjuleɪt/|模拟；假装，冒充]] what they admire; imitation can be tribute, mockery or",
     "zh": "闲暇不是空白时间。消遣可以娱乐，休闲可以恢复精力，玩 笑可以逗乐而不否认困难。流言和谣言常比证据传播得更快共识则可能通过反复观察与讨论缓慢形成。节日或盛宴把 社群聚在一起，活动程序则赋予场合节奏。人会模仿、仿效 或模拟所钦佩之物；模仿可以是致敬、戏谑或研究，取决于 意图。"
    },
    {
     "en": "Performance also creates worlds. A [[VW:circus|/ˈsɜːkəs/|马戏团…]] uses skill and exaggeration, [[VW:magic|/ˈmædʒɪk/|魔术；魔法]] relies on attention and illusion, and [[VW:drama|/ˈdrɑːmə/|戏，剧；戏剧艺术]] turns conflict into a visible [[VW:scene|/siːn/|景色；现场；(戏剧的)场面]]. A [[VW:concert|/ˈkɒnsət/|音乐会]], [[VW:symphony|/ˈsɪmfəni/|交响乐]] or [[VW:orchestra|/ˈɔːkɪstrə/|管弦乐队]] can fill a hall with coordinated sound; [[VW:ballet|/ˈbæleɪ/|芭蕾舞；芭蕾舞剧]] and [[VW:opera|/ˈɒprə/|歌剧]] unite movement, voice and design; [[VW:comedy|/ˈkɒmədi/|喜剧]] and [[VW:tragedy|/ˈtrædʒədi/|悲剧；悲惨的事]] arrange emotion in different keys. [[VW:Animation|/ˌænɪˈmeɪʃ(ə)n/|动画片；动画制作]], [[VW:film|/fɪlm/|影片；胶卷]] and [[VW:movie|/ˈmuːvi/|电影]]-making may range from gentle stories to material unsuitable for children, which is why an [[VW:X-rated|/ˈeks reɪtɪd/|x级的，青少年不宜的]] label is a warning rather",
     "zh": "表演也创造世界。马戏团运用技巧与夸张，魔术依赖注意力和幻觉，戏剧把冲突变成可见场面。音乐会、交响乐或管弦乐队能以协调声音充满大厅；芭蕾与歌剧结合动作、人声与 设计；喜剧和悲剧以不同调性安排情绪。动画、电影和影片 制作既可是温柔故事，也可能包含不适合儿童的内容，因此级标签是提示，而非质量判断。"
    },
    {
     "en": "Behind every work stands an artist  or [[VW:craftsman|/ˈkrɑːftsmən/|工匠，工艺师]]. A [[VW:role|/rəʊl/|角色；作用；职能]] belongs to a performer, a [[VW:scene|/siːn/|景色；现场；(戏剧的)场面]] belongs to a story, and a [[VW:stage|/steɪdʒ/|舞台；阶段]] can make a private choice public. A [[VW:gallery|/ˈɡælərɪ/|美术馆]] or [[VW:exhibition|/ˌeksɪˈbɪʃ(ə)n/|展览]] invites viewers to [[VW:select|/sɪˈlekt/|选择，挑选]], [[VW:opt|/ɒpt/|选择]] and [[VW:collect|/kəˈlekt/|收集；收藏]] images, while [[VW:aesthetic|/iːsˈθetɪk/|审美的]] experience resists a single explanation. A [[VW:photograph|/ˈfəʊtəɡrɑːf/|照片，相片]] freezes a moment; a [[VW:painter|/ˈpeɪntə(r)/|画家；油漆匠]] studies a face in a [[VW:portrait|/ˈpɔːtreɪt/|肖像，半身画像]]; and a [[VW:painting|/ˈpeɪntɪŋ/|油画，绘画]], [[VW:sculpture|/ˈskʌlptʃə(r)/|雕塑]] or sketch may [[VW:depict|/dɪˈpɪkt/|描述，描写]] an  a mood, [[VW:draw|/drɔː/|画；拉；拔出]] a new way of seeing or [[VW:carve|/kɑːv/|雕刻；切下]] meaning into",
     "zh": "每件作品背后都有艺术家或工匠。角色属于表演者，场面属于故事，舞台能让私人选择变得公开。美术馆或展览邀请观众挑选、选择并收藏图像，而审美经验难以用单一解释概括。照片凝固瞬间；肖像研究面容；绘画、雕塑或素描可以描绘对象、描述情绪，或刻出新的观看方式。"
    },
    {
     "en": "To [[VW:improvise|/ˈɪmprəvaɪz/|临时做；即兴创作]] keeps performance alive. A [[VW:musical|/ˈmjuːzɪk(ə)l/|音乐的；悦耳的]] tradition may be [[VW:classical|/ˈklæsɪk(ə)l/|古典的，传统的]], [[VW:jazz|/dʒæz/|爵士乐]], [[VW:rock|/rɒk/|摇滚乐；岩石]],  or [[VW:pop|/pɒp/|流行音乐，流行乐曲]]; a [[VW:lyric|/ˈlɪrɪk/|抒情诗]] gives language to feeling; and a [[VW:band|/bænd/|乐队]] turns separate instruments into a conversation. A [[VW:solo|/ˈsəʊləʊ/|独奏，独唱]] exposes one voice, while [[VW:melody|/ˈmelədi/|乐曲；旋律]], [[VW:rhythm|/ˈrɪðəm/|节奏，韵律]] and [[VW:tone|/təʊn/|音色；声调；腔调]] give a [[VW:tune|/tjuːn/|曲调；短乐曲]] its character. A [[VW:disc|/dɪsk/|光碟；唱片…]] preserves sound, but a [[VW:piano|/pɪˈænəʊ/|钢琴]] or [[VW:violin|/ˌvaɪəˈlɪn/|小提琴]] can make the same notes new in a room. What an audience remembers is not only technical perfection, but the sense that something human has been risked.",
     "zh": "即兴让表演保持鲜活。音乐传统可以是古典、爵士、摇滚、嘻哈或流行；歌词为感受赋予语言；乐队则把不同乐器变成一场对话。独奏暴露单一声音，而旋律、节奏与音色赋予曲调性格。光盘保存声音，但钢琴或小提琴能让同样音符在房间里焕然一新。观众记住的不只是技术完美，而是某种人性被冒险呈现的感觉。"
    }

   "zhTitle": "娱乐与闲暇",
   "enTitle": "Entertainment and Leisure",
   "paragraphs": [
    {
     "en": "Music can begin with a single breath. A [[VW:cello|/ˈtʃeləʊ/|.大提琴]] hums, a [[VW:guitar|/ɡɪˈtɑː(r)/|吉他]] rings, a [[VW:harmonica|/hɑːˈmɒnɪkə/|口琴]] sighs, a [[VW:trumpet|/ˈtrʌmpɪt/|喇叭，小号]] calls, a [[VW:drum|/drʌm/|鼓；鼓状物；大桶]] insists and a [[VW:flute|/fluːt/|长笛]] rises like wind. In a [[VW:competition|/ˌkɒmpəˈtɪʃ(ə)n/|竞争；比赛]] or [[VW:tournament|/ˈtʊənəmənt/|锦标赛，联赛]], players test skill under pressure, while an [[VW:Olympic|/əˈlɪmpɪk/|奥林匹克运动会的]] event makes every [[VW:athlete|/ˈæθliːt/|运动员:［英］田径运动员]] a potential [[VW:champion|/ˈtʃæmpiən/|冠军，第一名]] and gives every [[VW:spectator|/spekˈteɪtə(r)/|观众]] a shared standard. A [[VW:sponsor|/ˈspɒnsə(r)/|发起人；主办人；赞助人]] or [[VW:patron|/ˈpeɪtrən/|赞助人；顾客，老主顾]] may provide support, and a [[VW:volunteer|/ˌvɒlənˈtɪə(r)/|志愿者；自愿做]] may make the event possible without seeking applause. 02 A sport begins on a [[VW:pitch|/pɪtʃ/|沥青]] or in a [[VW:stadium|/ˈsteɪdiəm/|体育场，运动场]], but its life extends into a [[VW:gym|/dʒɪm/|体育活动]]. A [[VW:famous|/ˈfeɪməs/|著名的，出名的]] or  [[VW:athlete|/ˈæθliːt/|运动员:［英］田径运动员]] may seem endlessly [[VW:energetic|/ˌenəˈdʒetɪk/|充满活力的，精力充沛的]], yet [[VW:vigorous|/ˈvɪɡərəs/|充满活力的；活跃的，积极的]] [[VW:training|/ˈtreɪnɪŋ/|训练，锻炼；培训]] includes rest, [[VW:exercise|/ˈeksəsaɪz/|锻炼，运动；习题，练习；锻炼]] and recovery. [[VW:Indoor|/ˈɪndɔː(r)/|室内的]] and [[VW:outdoor|/ˈaʊtdɔː(r)/|户外的，室外的]] settings demand different skills. A [[VW:mobile|/ˈməʊbaɪl/|可移动的；流动的]] body finds a [[VW:movement|/ˈmuːvmənt/|(身体部位的)活动；运动…]], turns it into a [[VW:yoga|/ˈjəʊɡə/|瑜伽]] posture, avoids a painful [[VW:sprawl|/sprɔːl/|仰开四肢坐着(或躺着)…]], uses a careful [[VW:stretch|/stretʃ/|伸展；伸长(胳膊、腿)]] and recognises the warning sign of [[VW:strain|/streɪn/|拉紧：拉伤，纽伤；张力，拉力…]] before injury.",
     "zh": "音乐可以从一次呼吸开始。大提琴低吟，吉他鸣响，口琴叹息，小号呼唤，鼓声坚持，长笛则如风升起。在竞争或锦标赛中，选手在压力下检验技巧；奥运会则把运动员、冠军和观众聚集在共同标准周围。赞助人或资助者可以提供支持，志愿者也可能让赛事成为可能，却不寻求掌声。运动从球场或体育场开始，但其生命延伸到健身房。著名或众所周知的运动员看似精力无穷，然而充满活力的训练也包含休息、锻炼与恢复。室内与户外环境要求不同技能。可移动的身体找到动作，把它变成瑜伽姿势，避免痛苦的四肢摊开，谨慎伸展，并在一受伤前认出拉伤的警示。"
    },
    {
     "en": "Games sharpen attention in different ways. [[VW:Chess|/tʃes/|国际象棋]] rewards foresight, [[VW:badminton|/ˈbædmɪntən/|羽毛球]] and [[VW:tennis|/ˈtenɪs/|网球]] demand quick reactions, [[VW:golf|/ɡɒlf/|高尔夫球]] rewards patience, [[VW:billiards|/ˈbɪliədz/|台球]] combines geometry with control, and [[VW:soccer|/ˈsɒkə(r)/|(英式)足球]], [[VW:volleyball|/ˈvɒlibɔːl/|排球]] or [[VW:hockey|/ˈhɒki/|曲棍球；冰球]] turns collective [[VW:movement|/ˈmuːvmənt/|(身体部位的)活动；运动…]] into a pattern. The aim may be to reach the [[VW:goal|/ɡəʊl/|球门；进球得分；目的]], swing a [[VW:bat|/bæt/|球拍，球棒，球板]] or [[VW:racket|/ˈrækɪt/|(网球、羽毛球等的)球拍]], [[VW:kick|/kɪk/|踢；踢腿]] a ball, [[VW:knock|/nɒk/|敲，击；撞]] an opponent off balance, [[VW:flip|/flɪp/|掷；(使)快速翻动…]] a decision, [[VW:throw|/θrəʊ/|投，掷，抛，扔]] or [[VW:toss|/tɒs/|扔，抛，掷；(使)颠簸]] a pass,",
     "zh": "游戏以不同方式磨砺注意力。国际象棋奖励远见，羽毛球和网球要求快速反应，高尔夫奖励耐心，台球把几何与控制结 合，足球、排球或曲棍球则把集体移动变成模式。目标可能是到达球门、挥动球棒或球拍、踢球、撞得失衡、翻转决定、 抛出或掷出传球，并在每次错误后恢复。"
    },
    {
     "en": "Motion is rarely a single action. A player may [[VW:slide|/slaɪd/|滑动；逐渐降低；滑行；下跌]], [[VW:slip|/slɪp/|滑跤；滑落；溜；滑倒]], [[VW:glide|/ɡlaɪd/|滑动，掠过；滑行]] or [[VW:tumble|/ˈtʌmb(ə)l/|摔倒，滚下]]; to [[VW:ski|/skiː/|滑雪；滑雪板]] or [[VW:skate|/skeɪt/|滑冰]] is to balance on an unstable surface; [[VW:cycling|/ˈsaɪklɪŋ/|骑自行车运动]] carries speed through the legs; to [[VW:dive|/daɪv/|跳水；潜水；俯冲]] is to enter the water after a controlled fall; and a boat may [[VW:drift|/drɪft/|飘移，漂流；流浪，漂泊]] with the current. A  releases stored energy. To [[VW:jump|/dʒʌmp/|跳；暴涨；跳远]], [[VW:leap|/liːp/|v，跳，跃；跳跃]], [[VW:plunge|/plʌndʒ/|纵身投入；猛跌；(使)投身…]], [[VW:hop|/hɒp/|跳上(或下)；单脚跳行…]] or [[VW:bounce|/baʊns/|(使)反弹，(使)弹起…]] is to negotiate gravity in relationship with time. A [[VW:picnic|/ˈpɪknɪk/|野餐；野餐食物；野餐]] turns a meal into a place; a [[VW:hunt|/hʌnt/|打猎；搜寻；猎取；搜寻]] demands patience and ethical restraint; a [[VW:race|/reɪs/|赛跑，速度竞赛；人种，种族]] or [[VW:marathon|/ˈmærəθən/|马拉松赛跑；马拉松式的活动]] measures endurance; and a [[VW:pedestrian|/pəˈdestrɪən/|步行者，行人]] sets a [[VW:pace|/peɪs/|步速，速度；步调，节奏…]] one [[VW:step|/step/|步伐；步骤]] at a time. An [[VW:excursion|/ɪkˈskɜːʃn/|远足，短程旅行]], [[VW:cruise|/kruːz/|乘船游览；以平稳的速度行驶]], [[VW:trip|/trɪp/|绊倒；旅行；绊倒]] or [[VW:vacation|/veɪˈkeɪʃ(ə)n/|休假；休假；假期]] can enlarge a life, whether it is a [[VW:hike|/haɪk/|/徒步旅行，远足]], a gentle jog , a long [[VW:stride|/straɪd/|大步走，阔步行走]] or a [[VW:wander|/ˈwɒndə(r)/|闲逛，漫步；走柿，开小差]] without a fixed destination. Sometimes it is wise to [[VW:linger|/ˈlɪŋɡə(r)/|逗留，流连；继续存留]]; at other times, to [[VW:lag|/læɡ/|落后；间隔，时间差]] behind means missing the group.",
     "zh": "运动很少只是单一动作。选手可能滑动、滑倒、滑行或摔倒滑雪者或滑冰者学会在不稳定表面保持平衡；骑行通过双 腿传递速度；跳水者经过受控下落进入水中；船则可能随水 流漂移。跳、跃、纵身投入、单脚跳或弹跳，都是以不同情绪与重力协商，从谨慎到喜悦。帐篷与营地暗示一种更缓慢的时间关系。野餐把一顿饭变成地点；狩猎需要耐心与伦理约束；赛跑或马拉松衡量耐力；行人则一步一步确定步速。远足、乘船游览、旅行或假期都能拓宽人生，无论是徒步、慢跑、大步走，还是没有固定目的地的漫步。有时适合流连，有时落后就意味着错过队伍。"
    },
    {
     "en": "The body also knows effort and release. To [[VW:climb|/klaɪm/|攀登，爬]] is to [[VW:pull|/pʊl/|拉，拖，扯；划(小船)]] upward; to [[VW:drag|/dræɡ/|拖，拉，拽]] is to [[VW:pull|/pʊl/|拉，拖，扯；划(小船)]] weight across a surface; and to [[VW:bend|/bend/|俯身，弯腰；使弯曲]] is to yield without breaking. These actions are metaphors as well as movements. A good [[VW:athlete|/ˈæθliːt/|运动员:［英］田径运动员]], like a good traveller, learns when to push and when to rest, when to compete and when to enjoy the game for its own sake. Play remains one of the most generous forms of learning because it asks us to move, watch, fail and begin again.",
     "zh": "身体也懂得用力与释放。攀登是向上拉；拖拽是把重量沿表面拉动；弯腰则是屈服而不折断。这些动作既是隐喻，也是运动。优秀运动员如同优秀旅人，懂得何时推进、何时休息何时竞争、何时只为游戏本身而享受。游戏仍是最慷慨的学习形式之一，因为它要求我们移动、观看、失败，再重新开始。"
    }

   "id": 20,

  {
   "zhTitle": "材质与手作",
   "enTitle": "Material and Craft",
   "paragraphs": [
    {
     "en": "Every useful [[VW:item|/ˈaɪtəm/|一项项目，条目]] begins with [[VW:stuff|/stʌf/|东西；原料]] that has not yet found its form. A [[VW:material|/məˈtɪərɪəl/|材料，原料；人才；物质的]] may be [[VW:raw|/rɔː/|天然的，未经加工的…]], [[VW:crude|/kruːd/|天然的，未经加工的；粗糙的…]] and unattractive, yet a careful worker can [[VW:tap|/tæp/|轻拍，轻叩；开发]] it, shape it and turn it into [[VW:merchandise|/ˈmɜːtʃəndaɪs/|商品]]. A [[VW:souvenir|/ˌsuːvəˈnɪə(r)/|纪念品]] or [[VW:artefact|/ˈɑːtɪfækt/|人造物品；手工艺品]] may carry memory, but even an ordinary [[VW:necessity|/nəˈsesəti/|必需品，必不可少的事物；必要]] can reveal how people live. Craft begins when need meets attention.",
     "zh": "每件有用物品都始于尚未获得形式的材料。材料可能天然、粗糙、并不美观，但细心的工匠可以轻拍、塑形，把它变成商品。纪念品或手工艺品可以承载记忆，但即使普通必需品也能揭示人们如何生活。当需要遇见专注，手艺便开始了。"
    },
    {
     "en": "Before a task starts, a worker gathers the right [[VW:outfit|/ˈaʊtfɪt/|全套服装；全套装备…]] and [[VW:kit|/kɪt/|成套工具]]. A [[VW:utensil|/juːˈtens(ə)l/|(家庭)用具，器皿]] may be simple, a tool may be specialised, and a piece of equipment may need several accessories before it is ready. What is discarded can become [[VW:garbage|/ˈɡɑːbɪdʒ/|垃圾，废物]], [[VW:rubbish|/ˈrʌbɪʃ/|垃圾，废弃物，废话]] or [[VW:trash|/træʃ/|垃圾]]; communities may [[VW:recycle|/ˌriːˈsaɪkl/|使再循环，回收利用；反复应用]] some materials and [[VW:reuse|/ˌriːˈjuːz/|再次使用]] others. [[VW:Litter|/ˈlɪtə(r)/|垃圾，废弃物；乱丢东西]], [[VW:waste|/weɪst/|废物；浪费；浪费]] and [[VW:junk|/dʒʌŋk/|无用的东西，废物]] do not disappear when they leave the house. They travel to a [[VW:landfill|/ˈlændfɪl/|垃圾填埋地；垃圾填埋]], a [[VW:sewerage|/ˈsuːərɪdʒ/|排水系统，污水处理系统；污水]] system or a treatment plant, where [[VW:detergent|/dɪˈtɜːdʒənt/|洗涤剂]], [[VW:lotion|/ˈləʊʃn/|洁肤乳；润肤乳]], [[VW:shampoo|/ʃæmˈpuː/|用洗发剂洗(头发) 洗发剂]] and [[VW:soap|/səʊp/|肥皂；用肥皂擦洗]] must also be managed with care.",
     "zh": "任务开始前，工作者会准备合适的全套服装和成套工具。用具可能简单，工具可能专用，一件设备可能需要若干配件才准备好。被丢弃之物会成为垃圾、废弃物或废物；可回收物则可能被再次使用。乱丢的垃圾、废物和废旧品不会在离开家后消失，它们进入填埋场、污水处理系统或处理厂；洗涤剂、润肤乳、洗发剂和肥皂也必须被谨慎处理。"
    },
    {
     "en": "The domestic world is a small museum of practical design. A [[VW:tub|/tʌb/|桶，盆；浴缸，浴盆]] may hold water; a [[VW:plug|/plʌɡ/|塞子；插头；把……塞住]] closes it; a [[VW:pipe|/paɪp/|管子，管道；烟斗]] and [[VW:tube|/tjuːb/|管；(电视机的)显像管…]] carry the flow away. A [[VW:mop|/mɒp/|拖把；用拖把擦]] and [[VW:broom|/bruːm/|扫帚；用扫帚扫]] make cleaning possible, while a quiet [[VW:sweep|/swiːp/|打扫；(迅猛地)吹走；掠过]] can restore order in minutes. A [[VW:mattress|/ˈmætrəs/|床垫]], [[VW:carpet|/ˈkɑːpɪt/|地毯，毡毯，毛毯]], [[VW:rug|/rʌɡ/|小地毯；(盖肩或腿的)小毯子]] and [[VW:mat|/mæt/|地垫，地席]] soften a room; a [[VW:cushion|/ˈkʊʃ(ə)n/|软垫]], [[VW:pad|/pæd/|衬垫，垫…]], [[VW:blanket|/ˈblæŋkɪt/|毛毯，毯子]], [[VW:quilt|/kwɪlt/|被子]], [[VW:sheet|/ʃiːt/|被单，床单；一张(纸)；薄板]] and [[VW:pillow|/ˈpɪləʊ/|枕头]] make rest comfortable; and a [[VW:sponge|/spʌndʒ/|海绵]] and [[VW:towel|/ˈtaʊəl/|毛巾，手巾]] turn washing into a civilised ritual.",
     "zh": "家庭生活是实用设计的小博物馆。浴缸可以盛水，塞子把它封闭，管道和管子把水流带走。拖把和扫帚让清洁成为可能一次安静的打扫能在几分钟内恢复秩序。床垫、地毯、小地毯和地垫让房间柔软；坐垫、衬垫、毛毯、被子、床单和枕头让休息舒适；海绵和毛巾则把清洗变成文明的仪式。"
    },
    {
     "en": "Small repairs are often more revealing than grand projects. A [[VW:staple|/ˈsteɪp(ə)l/|订书钉；主要部分]], [[VW:nail|/neɪl/|指甲；钉子 (用钉子)钉住]], [[VW:razor|/ˈreɪzə(r)/|剃刀 (用剃刀)剃]], [[VW:shave|/ʃeɪv/|剃须，刮脸]], [[VW:fuse|/fjuːz/|保险丝；导火线 (使)熔化…]], [[VW:cable|/ˈkeɪb(ə)l/|电缆；缆绳，钢索；电报…]], [[VW:cord|/kɔːd/|细绳，粗线]] and [[VW:strand|/strænd/|缕，股；滨，岸]] of wire each answer a specific problem. A [[VW:match|/mætʃ/|火柴；比赛；匹配的人或物…]] lights a [[VW:candle|/ˈkænd(ə)l/|蜡烛]], and [[VW:wax|/wæks/|蜡；蜂蜡]] gives the flame time. A [[VW:plug|/plʌɡ/|塞子；插头；把……塞住]] may hold a connection while a [[VW:cable|/ˈkeɪb(ə)l/|电缆；缆绳，钢索；电报…]] carries power. A sharp [[VW:shear|/ʃɪə(r)/|(尤指修剪篱笆用的)大剪刀…]] can trim a hedge, and a fine tool can repair a delicate [[VW:edge|/edʒ/|边缘，边；刀口]]. Maintenance is not glamorous, but it prevents a small weakness from becoming a large failure.",
     "zh": "小修理往往比宏大工程更能说明问题。订书钉、钉子、剃刀、剃须、保险丝、电缆、细绳和一缕电线，各自解决具体问题。火柴点燃蜡烛，蜡则让火焰持续。插头固定连接，电缆输送电力。维护并不光鲜，却能防止小弱点变成大故障。"
    },
    {
     "en": "Paper keeps a different kind of order. A [[VW:portfolio|/pɔːtˈfəʊliəʊ/|文件夹，公事包]] may protect drawings, a [[VW:paperback|/ˈpeɪpəbæk/|简装书，平装书]] and [[VW:pamphlet|/ˈpæmflət/|小册子]] may carry ideas, and a [[VW:tissue|/ˈtɪʃuː/|薄绢，薄纸；组织；面巾纸]] can wrap a fragile page. A [[VW:cover|/ˈkʌvə(r)/|封面；盖子；套子]] protects what lies inside; a [[VW:Xerox|/ˈzɪərɒks/|施乐复印件]] or [[VW:duplicate|/ˈdjuːplɪkeɪt/|重复；副本，复制品]] preserves a copy; and a [[VW:memorandum|/ˌmeməˈrændəm/|备忘录；建议书…]] records a decision before memory changes it. [[VW:Stationery|/ˈsteɪʃənri/|文具；信纸]], [[VW:glue|/ɡluː/|胶，胶水]], [[VW:ink|/ɪŋk/|墨水，油墨]], [[VW:rubber|/ˈrʌbə(r)/|橡胶；橡皮擦]], [[VW:scissors|/ˈsɪzəz/|剪刀，剪子]] and a pair of shears all serve the hand. Even an [[VW:edge|/edʒ/|边缘，边；刀口]] or [[VW:rim|/rɪm/|(圆形物的)外缘，边缘]], though easy to overlook, determines how safely an object can be handled.",
     "zh": "纸张保存另一种秩序。文件夹可以保护图画，平装书和小册子可以承载思想，薄纸则能包裹易碎书页。封面保护内部之物；复印或副本保留备份；备忘录在记忆改变前记录决定。文具、胶水、墨水、橡皮、剪刀和大剪刀都服务双手。边缘或外缘虽容易被忽略，却决定物件能被多安全地使用。"
    },
    {
     "en": "Every [[VW:material|/məˈtɪərɪəl/|材料，原料；人才；物质的]] object is also a system. An [[VW:element|/ˈelɪmənt/|(化学中的)元素；组成部分…]] may be extracted, a [[VW:factor|/ˈfæktə(r)/|因素，要素]] may change its quality, and a [[VW:section|/ˈsekʃ(ə)n/|部分；章，节]] may be repaired or replaced. The life of an object is therefore not a straight line from factory to [[VW:rubbish|/ˈrʌbɪʃ/|垃圾，废弃物，废话]]. It is a cycle of value, use, repair, [[VW:reuse|/ˌriːˈjuːz/|再次使用]] and return. To understand it is to see labour, energy and choice in even the most ordinary thing.",
     "zh": "每件材料物件也是一个系统。元素可以被提取，因素会改变质量，部分可以修复或替换。因此物件的一生不是从工厂到垃圾的直线，而是价值、使用、修理、再利用与回归的循环。理解它，就是在最普通之物中看见劳动、能量与选择。"
    }
   ],

  {
   "zhTitle": "器物与设计",
   "enTitle": "Objects and Design",
   "paragraphs": [
    {
     "en": "01 A designed object begins with information. A [[VW:tag|/tæɡ/|标签；称号]], [[VW:label|/ˈleɪb(ə)l/|标签，标贴]] or [[VW:badge|/bædʒ/|徽章；证章；标志，象征]] tells us what something is, who made it and where it belongs. A [[VW:bolt|/bəʊlt/|螺栓；插销；闩上(门、窗)]] and [[VW:knob|/nɒb/|球形把手；旋钮]] hold a mechanism together; a [[VW:handle|/ˈhænd(ə)l/|柄；把手；拿；处理]] invites the hand; and a [[VW:shutter|/ˈʃʌtə(r)/|百叶窗；(相机)快门…]], [[VW:curtain|/ˈkɜːt(ə)n/|窗帘；帘；幕布…]] or [[VW:pane|/peɪn/|(一块)窗玻璃]] controls light and privacy. Even [[VW:opacity|/əʊˈpæsəti/|不透明性]] is a design choice, because a surface may reveal, soften or block",
     "zh": "被设计之物始于信息。标签、标贴或徽章告诉我们它是什么、由谁制造、应归何处。螺栓和旋钮把机械固定在一起；把手 邀请手去握持；百叶窗、窗帘或一块窗玻璃控制光线与隐私。甚至不透明性也是一种设计选择，因为表面可以显露、柔化 或阻挡其后之物。"
    },
    {
     "en": "Containers solve the problem of carrying. A [[VW:jar|/dʒɑː(r)/|罐，广口瓶；猛烈震动]], [[VW:barrel|/ˈbærəl/|桶]], [[VW:bucket|/ˈbʌkɪt/|(有握手的)桶]] or [[VW:pail|/peɪl/|(通常是金属或木制的)桶，提桶…]] may hold food, water or material, and each shape answers a different need. A [[VW:phone|/fəʊn/|电话；电话机；电话昕筒]] and [[VW:bell|/bel/|钟；铃]] extend communication; a [[VW:camera|/ˈkæm(ə)rə/|照相机，摄影机]] records what the eye might miss; and a [[VW:portable|/ˈpɔːtəb(ə)l/|手提式的，便携式的]] [[VW:spotlight|/ˈspɒtlaɪt/|聚光灯；聚光灯照出的光圈]], [[VW:lantern|/ˈlæntən/|提灯，灯笼]], [[VW:bulb|/bʌlb/|电灯泡；球茎；球茎状物]] or [[VW:flashlight|/ˈflæʃlaɪt/|(闪光灯的)闪光；手电筒]] brings light to a dark place. A [[VW:refrigerator|/rɪˈfrɪdʒəreɪtə(r)/|冰箱]], [[VW:fridge|/frɪdʒ/|冰箱]] or [[VW:vacuum|/ˈvækjuːm/|真空；真空吸尘器；真空的]] works quietly in the background, while a [[VW:fan|/fæn/|扇子；风扇；狂热爱好者；扇]], [[VW:switch|/swɪtʃ/|开关；转换；转换]] or circuit turns a room into a",
     "zh": "容器解决携带问题。罐、桶、水桶或提桶可以盛放食物、水 或材料，每种形状回应不同需求。电话和铃延伸交流；照相 机记录眼睛可能错过的内容；便携聚光灯、灯笼、灯泡或手 电筒把光带到黑暗处。冰箱、冷藏柜或真空吸尘器在背景中 安静工作，风扇、开关或电路则把房间变成可控环境。"
    },
    {
     "en": "Access is a form of design. A [[VW:hurdle|/ˈhɜːd(ə)l/|栏架；跨栏赛跑]] must be crossed, a [[VW:fence|/fens/|栅栏；围栏]] may divide, and a [[VW:pedal|/ˈped(ə)l/|踏板；踩踏板]], [[VW:shelf|/ʃelf/|架子，搁板]], [[VW:ladder|/ˈlædə(r)/|梯子；(进步、晋升等的)阶梯]] or [[VW:lift|/lɪft/|提，抬；提高…]] changes how the body reaches a destination. A stool , [[VW:drawer|/drɔː(r)/|抽屉]] and [[VW:umbrella|/ʌmˈbrelə/|伞，雨伞]] reduce ordinary inconvenience, while a [[VW:raincoat|/ˈreɪnkəʊt/|雨衣]] answers weather with practical intelligence. A [[VW:dredge|/dredʒ/|挖泥船，挖掘机；挖掘…]], , [[VW:mill|/mɪl/|磨粉机；磨坊；碾碎…]] or [[VW:forge|/fɔːdʒ/|锻铁炉；锻造；伪造]] turns raw material into",
     "zh": "通行也是一种设计。栏架必须跨越，围栏可能分隔，踏板、 架子、梯子或电梯改变身体抵达目的地的方式。凳子、抽屉和雨伞减少日常不便，雨衣以实用智慧回应天气。挖泥船、 罐头、磨粉机或锻炉把原材料变成有用之物，但每台机器也会把自己的节奏强加给使用者。"
    },
    {
     "en": "Materials give an object its character. An [[VW:alloy|/ˈælɔɪ/|合金；(金属的)成色]] combines the strengths of different metals; [[VW:metal|/ˈmet(ə)l/|金属]], [[VW:iron|/ˈaɪən/|铁；熨斗；熨，烫]], [[VW:lead|/liːd/|铅]], [[VW:brass|/brɑːs/|黄铜；黄铜制品]] and [[VW:bronze|/brɒnz/|青铜；青铜艺术品]] have different weights, colours and histories; [[VW:cement|/sɪˈment/|水泥；胶接剂；使黏结]] and [[VW:lime|/laɪm/|石灰]] bind a structure; and [[VW:plaster|/ˈplɑːstə(r)/|灰泥；熟石膏]] smooths a wall. A maker may choose [[VW:leather|/ˈleðə(r)/|皮革…]] for toughness, [[VW:plastic|/ˈplæstɪk/|塑料；有塑性的；塑料的]] for flexibility, [[VW:fibre|/ˈfaɪbə(r)/|纤维；纤维素]] for strength or [[VW:fabric|/ˈfæbrɪk/|织物，布料]] for comfort. To [[VW:knit|/nɪt/|编织，针织]], [[VW:weave|/wiːv/|编织；编造]] or stretch [[VW:canvas|/ˈkænvəs/|帆布；油画布]], [[VW:linen|/ˈlɪnɪn/|亚麻布：亚麻织品]], [[VW:cotton|/ˈkɒtn/|棉；棉线；棉布]] or [[VW:nylon|/ˈnaɪlɒn/|尼龙]] is to turn a line into a surface, and [[VW:lumber|/ˈlʌmbə(r)/|木材，木料]] or a [[VW:wooden|/ˈwʊdn/|木制的；呆板的]] frame  give that surface a",
     "zh": "材料赋予物件性格。合金结合不同金属的优势；金属、铁、 铅、黄铜和青铜有不同重量、颜色与历史；水泥和石灰黏结 结构；灰泥则平整墙面。制造者可能选择皮革以求坚韧，塑料以求弹性，纤维以求强度，织物以求舒适。编织、织造或 伸展帆布、亚麻布、棉布或尼龙，就是把线变成面，而木材 或木制框架则给这个面一个骨架。"
    },
    {
     "en": "The story begins underground. A [[VW:mine|/maɪn/|矿，矿井；地雷]] or [[VW:pit|/pɪt/|深坑；煤矿；潜在危险]] may supply [[VW:fuel|/ˈfjuːəl/|燃料；给......加燃料]], mineral or stone; to [[VW:lubricate|/ˈluːbrɪkeɪt/|润滑，加润滑油于]] a machine is to reduce friction; and a [[VW:diamond|/ˈdaɪmənd; ˈdaɪəmənd/|金刚石，钻石；菱形]] or [[VW:crystal|/ˈkrɪst(ə)l/|水晶；结晶，晶体]] [[VW:can|/kæn; kən/|把(食品)装罐保存；罐头，听]] be valued for hardness, clarity or beauty. A market may  copy, a [[VW:counterfeit|/ˈkaʊntəfɪt/|假冒的；伪造]] product or a [[VW:fake|/feɪk/|假冒的；冒充者；假货]], so quality depends on  be precise, yet a [[VW:fragile|/ˈfrædʒaɪl/|易碎的；脆弱的]] surface may not be [[VW:durable|/ˈdjʊərəb(ə)l/|耐用的，持久的]]. Design is the art of balancing these qualities so that a useful object becomes [[VW:available|/əˈveɪləb(ə)l/|可获得的]] to many people without",
     "zh": "materials, labour and honest inspection. A miniature /ˈmɪnɪtʃə(r)/ （微型的，很小的；缩微模型…） object故事始于地下。矿井或矿坑可能供应燃料、矿物或石料；润滑机器可减少摩擦；钻石或水晶则因硬度、透明度或美感而珍贵。市场可能含劣质仿品、假冒产品或假货，因此质量取决于材料、劳动和诚实检查。微型物件可以很精确，但易碎表面未必耐用。设计的艺术，就是在这些品质之间取得平衡让有用之物能为许多人获得，同时不假装每个版本都同样优秀。"
    }
   ],

  {
   "zhTitle": "衣料与剪裁",
   "enTitle": "Cloth and Cut",
   "paragraphs": [
    {
     "en": "[[VW:Fashion|/ˈfæʃ(ə)n/|时尚；制作，制成]] is more than a [[VW:perfect|/ˈpɜːfɪkt/|完美的]] [[VW:dress|/dres/|衣服；连衣帽]] or an [[VW:extravagant|/ɪkˈstrævəɡənt/|奢侈的；过分的]] display. It is a way of reading time. A [[VW:style|/staɪl/|风格；样式；时尚]] may begin among a small group, become a [[VW:trend|/trend/|趋势，倾向]], reveal a broader [[VW:tendency|/ˈtendənsi/|趋势；倾向，偏好]] and grow into [[VW:popularity|/ˌpɒpjuˈlærəti/|流行]]. A particular [[VW:vogue|/vəʊɡ/|流行]] may [[VW:prevail|/prɪˈveɪl/|盛行；获胜]] for a season and then fade, but the human wish to belong and to be seen does not disappear. Clothes help us say what we value before 02 A [[VW:model|/ˈmɒd(ə)l/|模型；模范；模特儿使模仿]] can present a design, an [[VW:icon|/ˈaɪkɒn/|偶像；图标]] may symbolise an era, and an [[VW:idol|/ˈaɪdl/|偶像，受到崇拜的人或物；神像]] can attract devotion that goes far beyond clothing. [[VW:Luxury|/ˈlʌkʃəri/|奢侈；奢侈品]], [[VW:jewellery|/ˈdʒuːəlri/|珠宝，首饰]], a [[VW:jewel|/ˈdʒuːəl/|宝石]], a [[VW:gem|/dʒem/|宝石；珍品]] or a piece of [[VW:jade|/dʒeɪd/|玉石，翡翠]] can signal wealth, memory or taste, yet their meaning depends on who wears them and why. Adorning the body is not superficial",
     "zh": "时尚不只是一件完美礼服或奢侈展示。它是一种阅读时间的 方式。某种风格可能在小群体中开始，成为趋势，显露更广泛的倾向，并发展为流行。某种时尚可能盛行一季后消退， 但人渴望归属与被看见的愿望不会消失。衣服帮助我们在开口前表明珍视之物。模特可以展示设计，偶像可以象征时代，崇拜对象也会吸引远超服饰的追随。奢侈品、珠宝、宝石、珍品或玉石可以标示财富、记忆或品味，但其意义取决于谁佩戴、为何佩戴。 装饰身体并不肤浅，因为它在表达身份、仪式或喜悦。"
    },
    {
     "en": "Craft gives that expression depth. A maker may [[VW:adorn|/əˈdɔːn/|装饰，装扮]] a [[VW:garment|/ˈɡɑːmənt/|(一件)衣服]], add an [[VW:ornament|/ˈɔːnəmənt/|装饰晶；装饰]], [[VW:embellish|/ɪmˈbelɪʃ/|修饰]] a hem or [[VW:embroider|/ɪmˈbrɔɪdə(r)/|对(故事等)加以渲染…]] a story into cloth. [[VW:Hairdressing|/ˈheədresɪŋ/|美发，理发]] uses [[VW:pigment|/ˈpɪɡmənt/|色素；颜料]] and [[VW:dye|/daɪ/|染料；(染上的)颜色染]], while a  allows a [[VW:veil|/veɪl/|面纱；遮蔽物]] or [[VW:costume|/ˈkɒstjuːm/|戏服…]] to change the rules of recognition. Such details can [[VW:fascinate|/ˈfæsɪneɪt/|迷住]] us, but what holds attention in another person is",
     "zh": "手艺赋予这种表达深度。制作者可以装饰衣物，添加装饰， 修饰衣摆，或把故事绣进布里。美发运用颜料和染料，化装 舞会则让面纱或戏服改变识别规则。真正令人着迷的，很少只是单一外貌特征，而是外表与品格相遇时的自信。"
    },
    {
     "en": "Beauty is plural. A [[VW:decent|/ˈdiːsnt/|得体的；尚好的]] outfit can be more persuasive than an [[VW:exquisite|/ɪkˈskwɪzɪt/|精致的；雅致的]] one that feels borrowed, and [[VW:grace|/ɡreɪs/|优美，优雅]] or [[VW:elegance|/ˈelɪɡəns/|文雅，典雅]] is often a matter of proportion, movement and ease. [[VW:Cosmetics|/kɒzˈmetɪks/|化妆品]] and [[VW:make-up|/ˈmeɪk ʌp/|化妆品；组成成分；性格]] may sharpen an [[VW:appearance|/əˈpɪərəns/|外貌；出现]], but they should not become a mask that hides the person underneath. A [[VW:handsome|/ˈhænsəm/|数量大的；英俊的]] face, a [[VW:charming|/ˈtʃɑːmɪŋ/|迷人的]] manner, a [[VW:pretty|/ˈprɪti/|漂亮的相当地]] detail and a [[VW:beautiful|/ˈbjuːtɪf(ə)l/|美丽的]] gesture are different kinds of",
     "zh": "美是多元的。得体衣着可能比一件精致却像借来的衣服更有说服力；优雅往往关乎比例、动作与从容。化妆品和妆容可 以强化外貌，却不应成为遮住真实自我的面具。英俊面容、迷人举止、漂亮细节与美丽动作是不同类型的吸引。甚至丑陋也可以诚实、有趣而真实。"
    },
    {
     "en": "What people wear is shaped by work, climate and occasion. A [[VW:uniform|/ˈjuːnɪfɔːm/|制服一致的]] reduces choice in one setting and creates belonging in another; to [[VW:clothe|/kləʊð/|给......穿衣…]] a body is to prepare it for a role. A [[VW:garment|/ˈɡɑːmənt/|(一件)衣服]] may be practical, a [[VW:dress|/dres/|衣服；连衣帽]] may be formal, and outer layers such as an [[VW:overall|/ˌəʊvərˈɔːl/|［英］(工作时穿的)罩衣，全面的…]], [[VW:overcoat|/ˈəʊvəkəʊt/|大衣]], [[VW:robe|/rəʊb/|长袍；浴袍]] or [[VW:gown|/ɡaʊn/|长外衣；女礼服]] protect the body from weather or ceremony. A [[VW:sweater|/ˈswetə(r)/|毛衣，线衣]], [[VW:jacket|/ˈdʒækɪt/|夹克衫]], [[VW:skirt|/skɜːt/|裙子]], [[VW:jeans|/dʒiːnz/|牛仔裤]] or [[VW:trousers|/ˈtraʊzəz/|［尤英］裤子]] can be casual or deliberate, and even a small [[VW:clasp|/klɑːsp/|搭扣；扣住]] can change how a [[VW:garment|/ˈɡɑːmənt/|(一件)衣服]] feels. A crowded [[VW:laundry|/ˈlɔːndri/|洗衣店…]] and a well-kept [[VW:wardrobe|/ˈwɔːdrəʊb/|衣柜；(某人的)全部服装]] also tell a story about",
     "zh": "人的穿着受工作、气候和场合塑造。制服在一种场景中减少 选择，在另一种场景中创造归属；为身体穿衣，就是为角色做准备。一件衣服可以实用，一条连衣裙可以正式，而罩衣、 大衣、长袍或礼服等外层可保护身体抵御天气或服务礼仪。毛衣、夹克、裙子、牛仔裤或长裤可以休闲，也可以郑重， 甚至小小搭扣也能改变衣物感觉。"
    },
    {
     "en": "Outer [[VW:appearance|/əˈpɪərəns/|外貌；出现]] does not determine inner worth. It can create confidence, express respect or become a cage of comparison. When [[VW:fashion|/ˈfæʃ(ə)n/|时尚；制作，制成]] becomes pure consumption, it measures people by price and novelty. When it becomes culture, it connects memory, skill and imagination. The most enduring [[VW:style|/staɪl/|风格；样式；时尚]] is not the one that makes everyone identical, but the",
     "zh": "外在形象不决定内在价值。它可以建立自信、表达尊重，也可能成为比较的牢笼。当时尚沦为纯粹消费，它便用价格和 新奇衡量人；当它成为文化，它连接记忆、技艺与想象。最持久的风格，不是让每个人一模一样，而是帮助每个人更完 整地成为自己。"
    }

  {
   "zhTitle": "风格与消费",
   "enTitle": "Style and Consumption",
   "paragraphs": [
    {
     "en": "Small details make clothing usable. A [[VW:button|/ˈbʌt(ə)n/|纽扣；按钮…]] fastens, while a [[VW:wrap|/ræp/|裹，包；用......缠绕]] keeps a body warm. A [[VW:chain|/tʃeɪn/|连锁店；一连串(人或事物)]] may connect a pendant or link a row of shops; a [[VW:glove|/ɡlʌv/|手套]] protects the hand; and a [[VW:hat|/hæt/|(常指带惰的)帽子]], [[VW:cap|/kæp/|(有帽舌的)帽子(经费等的)最高限额…]], [[VW:brim|/brɪm/|边缘；帽檐]] or [[VW:scarf|/skɑːf/|围巾，头巾]] frames the face against sun, rain or cold. A [[VW:handkerchief|/ˈhæŋkətʃɪf/|手帕]], [[VW:purse|/pɜːs/|［尤英］钱包；［美］小手提包]] or [[VW:wallet|/ˈwɒlɪt/|钱包，皮夹子]] carries what a person needs, and a [[VW:vest|/vest/|［英］汗衫；［美］西装背心]], [[VW:cloak|/kləʊk/|斗篷；覆盖物]], [[VW:collar|/ˈkɒlə(r)/|衣领；项圈]] or [[VW:sleeve|/sliːv/|袖子]] turns fabric into a shape that follows the body.",
     "zh": "细小部件让衣物可用。纽扣用于扣合，包裹则保持温暖。链条可以连接吊坠，也可连接一连串商店；手套保护手；帽子、鸭舌帽、帽檐或围巾为面部遮蔽阳光、风雨或寒冷。手帕、钱包或皮夹携带个人所需，而背心、斗篷、衣领或袖子把布料变成贴合身体的形状。"
    },
    {
     "en": "Accessories continue below the ankle. A [[VW:sock|/sɒk/|短袜]], [[VW:stocking|/ˈstɒkɪŋ/|(女式)长筒袜]], [[VW:slipper|/ˈslɪpə(r)/|拖鞋]], [[VW:boot|/buːt/|靴子]] or [[VW:lace|/leɪs/|鞋带；花边]] can protect the foot or express a mood. Each item seems minor until it is missing. The same is true of a [[VW:tailor|/ˈteɪlə(r)/|裁缝专门制作]]'s tools: to [[VW:sew|/səʊ/|缝制，缝补]], [[VW:spin|/spɪn/|纺；(使)旋转；高速旋转…]], [[VW:stitch|/stɪtʃ/|针脚缝]], [[VW:needle|/ˈniːd(ə)l/|针]], [[VW:pin|/pɪn/|别针，大头针别住，钉住]], [[VW:string|/strɪŋ/|线；一串]] or [[VW:thread|/θred/|线；螺纹]] is to build a surface one line at a time. A [[VW:strap|/stræp/|带子；用带子系(或捆、扎)]], [[VW:stripe|/straɪp/|条纹]], [[VW:ribbon|/ˈrɪbən/|缎带，丝带]], [[VW:belt|/belt/|腰带，皮带；地带，地区]], [[VW:bracelet|/ˈbreɪslət/|手镯]], [[VW:necklace|/ˈnekləs/|项链]] or [[VW:bead|/biːd/|珠子；(液体的)小滴…]] may be practical, ornamental or both. [[VW:Textile|/ˈtekstaɪl/|纺织的纺织品]], [[VW:velvet|/ˈvelvɪt/|丝绒，天鹅绒]] and [[VW:wool|/wʊl/|(羊等的)毛毛线]] show how touch can carry memory as strongly as sight.",
     "zh": "配饰延伸到脚踝以下。短袜、长筒袜、拖鞋、靴子或鞋带可以保护脚，也可以表达心情。每件物品看似次要，直到缺失才显出价值。裁缝工具也是如此：缝制、纺织、缝合、穿针、别住、串线或引线，就是一线一线地构建表面。带子、条纹、缎带、腰带、手镯、项链或珠子可能实用、装饰，或两者兼具。纺织品、天鹅绒和羊毛表明，触感能像视觉一样强烈承载记忆。"
    },
    {
     "en": "Clothing is also an archive of repair. A [[VW:patch|/pætʃ/|补丁；(与周围不同的)小片…]] can cover a tear, a [[VW:rag|/ræɡ/|破布]] can clean a surface, and a [[VW:shabby|/ˈʃæbi/|破旧的；衣衫褴褛的]] coat may still be warm and beloved. A [[VW:tight|/taɪt/|紧的]] fit can flatter or restrict. [[VW:Colour|/ˈkʌlə(r)/|颜色颜料]] matters too: [[VW:white|/waɪt/|白的；白色]], [[VW:yellow|/ˈjeləʊ/|黄的；黄色]], [[VW:brown|/braʊn/|褐色的褐色]], [[VW:grey|/ɡreɪ/|灰色的灰色]], [[VW:pink|/pɪŋk/|粉红色的粉红色]], [[VW:purple|/ˈpɜːp(ə)l/|紫的；紫色]] and [[VW:tan|/tæn/|棕黄色的；棕黄色…]] can signal season, mood or convention. Over time, [[VW:colour|/ˈkʌlə(r)/|颜色颜料]] may [[VW:fade|/feɪd/|逐渐消失；(使)褪色]], a [[VW:stain|/steɪn/|染污；污渍]] may remain and a [[VW:blot|/blɒt/|污点]] may mark an accident, but care can",
     "zh": "衣物也是修补的档案。补丁可以盖住破口，破布可以清洁表面，破旧外套也可能依然温暖、令人珍爱。紧身剪裁可以衬 托，也可以束缚。颜色同样重要：白、黄、褐、灰、粉、紫和棕黄可以标示季节、心情或惯例。时间久了，颜色会褪去污渍会留下，污点会标记意外，但用心照料能保存匆忙丢 弃之物。"
    },
    {
     "en": "The body in clothing is never a neutral object. A [[VW:figure|/ˈfɪɡə(r)/|身材；身影；重要人物；数字…]] may be tall, small, [[VW:slender|/ˈslendə(r)/|苗条的；微弱的]] or [[VW:slight|/slaɪt/|纤细的；轻微的]], and a garment can honour that form. The problem begins when fashion treats one body as the only acceptable standard. Style should offer choices, not commands. A well-made piece can last for years, while a cheap",
     "zh": "穿着中的身体从不是中立物件。身材可能高挑、娇小、苗条或纤细，衣服可以尊重这种形态。问题始于时尚把某一种身 体视为唯一可接受标准。风格应提供选择，而非命令。做工 良好的衣物可以穿很多年，而廉价潮流可能在失去形状前就失去魅力。"
    },
    {
     "en": "Consumption connects the private wardrobe to a public [[VW:chain|/tʃeɪn/|连锁店；一连串(人或事物)]] of production. A [[VW:purse|/pɜːs/|［尤英］钱包；［美］小手提包]] or [[VW:wallet|/ˈwɒlɪt/|钱包，皮夹子]] pays for goods, but the price does not show who sewed, dyed, shipped or sold them. A shopper can choose quality, repair, reuse and fair labour. To consume consciously is not to reject pleasure; it is to",
     "zh": "消费把私人衣橱与公共生产链连接起来。钱包或皮夹为商品 付款，但价格并不显示谁缝制、染色、运输或出售。消费者可以选择质量、修补、再利用和公平劳动。有意识地消费不 是拒绝愉悦，而是追问愉悦的代价，以及由谁承担。"
    },
    {
     "en": "In the end, clothing is a language with a very large vocabulary. It can whisper, exaggerate, comfort or conceal. The most elegant choice is not always the most expensive one. It is the one that respects the body, the maker and the world that supplies the",
     "zh": "最终，服装是一门词汇量很大的语言。它可以低声诉说、夸 张、安慰或隐藏。最优雅的选择不一定最昂贵，而是尊重身 体、制作者，以及提供材料的世界。"
    }
   ],
