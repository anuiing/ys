   "enTitle": "Food and Kitchen",
   "paragraphs": [
    {
     "en": "01 A meal begins long before it reaches the table. [[VW:Food|/fuːd/|食物]] must be grown, chosen, stored and prepared, and a sensible [[VW:diet|/ˈdaɪət/|日常饮食…]] depends on variety as much as quantity. [[VW:Appetite|/ˈæpɪtaɪt/|食欲；强烈欲望]] is not the same as hunger; it responds to smell, memory and company. A small [[VW:treat|/triːt/|请(客)对待治疗]] can nourish the spirit, but only what is edible ",
     "zh": "一顿饭在抵达餐桌前很久就已开始。食物必须被种植、选择、 储存和烹制，而合理饮食既取决于数量，也取决于多样。食 欲不等同于饥饿，它回应气味、记忆和同伴。小小款待能滋 养精神，但均衡饮食不应把愉悦当作健康的敌人。"
    },
    {
     "en": "Institutions must [[VW:cater|/ˈkeɪtə(r)/|为……提供饮食…]] for many people at once. A [[VW:provision|/prəˈvɪʒ(ə)n/|供应；预备；【~s】食品供应]] of basic ingredients becomes a [[VW:recipe|/ˈresəpɪ/|食谱；秘诀]]; a [[VW:restaurant|/ˈrestrɒnt/|餐馆]], [[VW:refectory|/rɪˈfektəri/|(学校或其他机构的)食堂，餐厅…]] or [[VW:cafeteria|/ˌkæfəˈtɪəriə/|自助餐厅]] turns that [[VW:recipe|/ˈresəpɪ/|食谱；秘诀]] into a shared service; and a [[VW:buffet|/ˈbʌfeɪ; ˈbʊfeɪ/|自助餐]], [[VW:barbecue|/ˈbɑːbɪkjuː/|烧烤野餐；烤架；烧烤]], [[VW:supper|/ˈsʌpə(r)/|晚餐]] or [[VW:banquet|/ˈbæŋkwɪt/|宴会]] gives eating a social rhythm. A light [[VW:refreshment|/rɪˈfreʃmənt/|【~s】茶点，点心]], a snack  and an [[VW:appetiser|/ˈæpəˌtaɪzə(r)/|开胃饮料，开胃小吃]] may be simple, but they still deserve care. [[VW:Cuisine|/kwɪˈziːn/|菜肴；烹饪]] is not only flavour; it is knowledge passed from one cook to customer eats in or asks for [[VW:takeaway|/ˈteɪkəweɪ/|【英】外卖餐馆，外卖食物]]. A [[VW:chef|/ʃef/|厨师]] and a [[VW:gourmet|/ˈɡʊəmeɪ/|美食家；美味佳肴的]] may seek refinement, while a [[VW:vegetarian|/ˌvedʒəˈteəriən/|素食者；素食的无肉的]] chooses a [[VW:diet|/ˈdaɪət/|日常饮食…]] without meat. The table itself is part of the experience: [[VW:cutlery|/ˈkʌtləri/|餐具；刀具]], [[VW:silver|/ˈsɪlvə(r)/|银；银器adj，银的；银色的]], ceramic  or [[VW:porcelain|/ˈpɔːsəlɪn/|瓷器；瓷]] vessels, a [[VW:bowl|/bəʊl/|碗]], [[VW:dish|/dɪʃ/|碟；菜肴]], [[VW:saucer|/ˈsɔːsə(r)/|茶托，茶碟]] and [[VW:tray|/treɪ/|盘，托盘]] organise a meal, while a [[VW:fork|/fɔːk/|餐叉；分岔处]], [[VW:knife|/naɪf/|刀]] and [[VW:spoon|/spuːn/|匙，调羹]] make it possible. A [[VW:glass|/ɡlɑːs/|玻璃；玻璃杯]], [[VW:mug|/mʌɡ/|大杯，马克杯]], [[VW:kettle|/ˈket(ə)l/|水壶【美】锅]], [[VW:pan|/pæn/|平底锅【美】烤盘]], [[VW:pot|/pɒt/|锅；壶]], [[VW:stove|/stəʊv/|炉子]], [[VW:furnace|/ˈfɜːnɪs/|熔炉]], [[VW:oven|/ˈʌv(ə)n/|烤炉，烤箱]], [[VW:tin|/tɪn/|锡；罐头]] and [[VW:lid|/lɪd/|盖子]] belong to the quieter craft behind the [[VW:food|/fuːd/|食物]].",
     "zh": "机构必须同时为许多人提供饮食。基础食材供应变成食谱； 餐馆、食堂或自助餐厅把食谱变成共同服务；自助餐、烧烤、 晚餐或宴会赋予进食社会节奏。茶点、小吃和开胃菜可能清 淡，但仍值得认真对待。烹饪不只是风味，也是从一位厨师传给另一位厨师的知识。菜单既是承诺，也是指南，无论顾客堂食还是点外卖。厨师和美食家可能追求精致，素食者则选择不含肉的饮食。餐桌本身也是体验的一部分：餐具、银器、陶瓷或瓷器、碗、碟、茶托和托盘组织一顿饭，而餐叉、刀和匙使其可行。玻璃杯、大杯、水壶、平底锅、锅、炉子、熔炉、烤箱、罐头和盖子在食物背后构成更安静的工艺。"
    },
    {
     "en": "What we [[VW:drink|/drɪŋk/|饮，喝；喝酒饮料]] also shapes a meal. A [[VW:beverage|/ˈbevərɪdʒ/|(水以外的)饮料]] may be water, [[VW:juice|/dʒuːs/|果汁，菜汁]] or [[VW:soda|/ˈsəʊdə/|无水碳酸钠；苏打水…]]; [[VW:coffee|/ˈkɒfi/|咖啡]] can begin a day or extend a conversation; [[VW:alcohol|/ˈælkəhɒl/|酒精，乙醇酒]], [[VW:liquor|/ˈlɪkə(r)/|烈性酒]], [[VW:whisky|/ˈwɪski/|威士忌酒]] and [[VW:brandy|/ˈbrændi/|白兰地酒]] can mark celebration, but a person who becomes [[VW:drunk|/drʌŋk/|醉的]] should not be treated as amusing. [[VW:Tobacco|/təˈbækəʊ/|烟草]] and a [[VW:cigarette|/ˌsɪɡəˈret/|香烟]] harm the body and those nearby, while to remain [[VW:sober|/ˈsəʊbə(r)/|清醒的头脑清醒的 (使)醒酒]] is not a restriction on pleasure. It is a condition for making a clear choice. to the kitchen. A [[VW:tomato|/təˈmɑːtəʊ/|番茄]] and [[VW:potato|/pəˈteɪtəʊ/|马铃薯]] may be roasted; a [[VW:pea|/piː/|豌豆]] or [[VW:bean|/biːn/|豆]] can be stewed; [[VW:cucumber|/ˈkjuːkʌmbə(r)/|黄瓜]] and [[VW:cabbage|/ˈkæbɪdʒ/|洋白菜，卷心菜，甘蓝]] add freshness; [[VW:onion|/ˈʌnjən/|洋葱]], [[VW:mushroom|/ˈmʌʃrʊm/|蘑菇；呈蘑菇状扩散]] and [[VW:eggplant|/ˈeɡplɑːnt/|茄子]] deepen a [[VW:dish|/dɪʃ/|碟；菜肴]]; and [[VW:carrot|/ˈkærət/|胡萝卜]], [[VW:turnip|/ˈtɜːnɪp/|芜菁]] and [[VW:radish|/ˈrædɪʃ/|樱桃萝卜]] offer earthiness and bite. To [[VW:peel|/piːl/|剥落；掉漆；脱皮]], [[VW:strip|/strɪp/|剥去，除去；条，带]] or [[VW:hull|/hʌl/|(果实等的)外壳；船体…]] is to remove what is not wanted, but the discarded part is still part of the [[VW:food|/fuːd/|食物]] system. A thoughtful cook reduces waste",
     "zh": "饮品也塑造一顿饭。饮料可以是水、果汁或汽水；咖啡可以开启一天，也能延长交谈；酒精、烈酒、威士忌和白兰地可以标记庆祝，但醉酒者不应被当作笑料。烟草和香烟伤害身体及附近的人，而保持清醒并非限制愉悦，而是作出清晰选择的条件。蔬菜为厨房带来颜色和质感。番茄和马铃薯可以烘烤；豌豆 或豆子可以炖煮；黄瓜和卷心菜增添清爽；洋葱、蘑菇和茄子加深菜肴；胡萝卜、芜菁和樱桃萝卜则提供土性与脆感。 剥皮、剥去或去壳是移除不需要部分，但被丢弃物仍属于食 物系统。体贴的厨师减少浪费，如同调味一样仔细。"
    },
    {
     "en": "Fruit ends the meal with fragrance and contrast. A [[VW:cherry|/ˈtʃeri/|樱桃；樱桃树]] or [[VW:berry|/ˈberi/|浆果]] may be eaten fresh; [[VW:grape|/ɡreɪp/|葡萄]] and [[VW:papaya|/pəˈpaɪə/|番木瓜]] offer sweetness; [[VW:peach|/piːtʃ/|桃子]], [[VW:pear|/peə(r)/|梨]], [[VW:plum|/plʌm/|李子；梅子]], [[VW:orange|/ˈɒrɪndʒ/|橙子]], [[VW:melon|/ˈmelən/|瓜，甜瓜]] and [[VW:lemon|/ˈlemən/|柠檬]] balance sugar with acidity. The [[VW:order|/ˈɔːdə(r)/|次序；整齐；命令]] in which dishes appear is not an accident: a bright [[VW:appetiser|/ˈæpəˌtaɪzə(r)/|开胃饮料，开胃小吃]] awakens the [[VW:appetite|/ˈæpɪtaɪt/|食欲；强烈欲望]], a main [[VW:dish|/dɪʃ/|碟；菜肴]] satisfies",
     "zh": "水果以香气和对比结束一餐。樱桃或浆果可以鲜食；葡萄和番木瓜带来甜味；桃子、梨、李子、橙子、甜瓜和柠檬用酸 度平衡糖分。上菜次序并非偶然：明亮开胃菜唤醒食欲，主菜满足食欲，清新的食物则让记忆保持干净。"
    },
    {
     "en": "At its best, eating is both ordinary and extraordinary. It connects soil, labour, science and hospitality. It can be quick or ceremonial, private or public, frugal or abundant. The healthiest table is not one that forbids every pleasure, but one that understands where [[VW:food|/fuːd/|食物]] comes from, who",
     "zh": "最好状态下，饮食既普通又非凡。它连接土壤、劳动、科学 与好客。它可以迅速或隆重、私密或公开、节俭或丰盛。最健康的餐桌不是禁止所有愉悦，而是理解食物来自何处、由 谁准备，以及多少才算足够。"
    }
   ],

  {
   "zhTitle": "营养与公共健康",
   "enTitle": "Nutrition and Public Health",
   "paragraphs": [
    {
     "en": "Public health begins in the field. A [[VW:crop|/krɒp/|庄稼；收成，产量]] of [[VW:corn|/kɔːn/|【英】(小麦等)谷物【美】玉米…]], [[VW:grain|/ɡreɪn/|谷物；颗粒]] or [[VW:wheat|/wiːt/|小麦]] must be planted, protected and reaped before it can become [[VW:flour|/ˈflaʊə(r)/|面粉；粉状物质]], [[VW:porridge|/ˈpɒrɪdʒ/|麦片粥]] or [[VW:paste|/peɪst/|糨糊；面团]]. A [[VW:kiwi|/ˈkiːwi/|猕猴桃，奇异果]] may travel from orchard to market, but behind every food is a chain of soil, water, weather and work. Farmers [[VW:reap|/riːp/|收割；收获]] what the season allows, and a single [[VW:loaf|/ləʊf/|一条(面包)游荡，闲逛]] of bread may depend on many hands. Good nutrition is not a private matter alone; it depends on what a community can grow, afford",
     "zh": "公共健康从田野开始。一季玉米、谷物或小麦必须先被种植、 保护并收割，才能成为面粉、麦片粥或面团。猕猴桃可能从果园运到市场，但每种食物背后都有土壤、水、天气与劳动 构成的链条。良好营养不只是私事，它取决于社区能种什么、买得起什么，以及能够接触到什么。"
    },
    {
     "en": "Animal foods belong to the same chain. [[VW:Livestock|/ˈlaɪvstɒk/|家畜]] may supply [[VW:chicken|/ˈtʃɪkɪn/|鸡]], [[VW:turkey|/ˈtɜːki/|火鸡]], [[VW:beef|/biːf/|牛肉]], [[VW:pork|/pɔːk/|猪肉]] and [[VW:mutton|/ˈmʌtn/|羊肉]]; a [[VW:sausage|/ˈsɒsɪdʒ/|香肠]] or a [[VW:fish|/fɪʃ/|鱼钓鱼]] may be processed for convenience; and a [[VW:pond|/pɒnd/|池塘]] can support fisheries as well as leisure. A [[VW:rod|/rɒd/|杆，竿]] is a tool, not a guarantee. [[VW:Dairy|/ˈdeəri/|乳制品；乳品店；乳制的]] products such as [[VW:milk|/mɪlk/|奶；挤奶]], [[VW:yogurt|/ˈjɒɡət/|酸奶]], [[VW:cream|/kriːm/|奶油]], [[VW:cheese|/tʃiːz/|奶酪]] and [[VW:butter|/ˈbʌtə(r)/|黄油涂黄油]] provide nutrients, while a [[VW:supplement|/ˈsʌplɪmənt/|营养补剂；补贴；增补，补充]] may help in a",
     "zh": "动物性食物属于同一条链条。家畜可提供鸡肉、火鸡、牛肉、 猪肉和羊肉；香肠或鱼可被加工以便利食用；池塘既能支持 渔业，也能提供休闲。鱼竿是工具，却不保证收获。乳制品如牛奶、酸奶、奶油、奶酪和黄油提供营养，营养补剂可能 有助于特定情况，却不能取代多样饮食。"
    },
    {
     "en": "Everyday meals take many forms. A [[VW:salad|/ˈsæləd/|色拉]] and a [[VW:sandwich|/ˈsænwɪtʃ/|把……夹入；三明治]] can be quick; a [[VW:hamburger|/ˈhæmbɜːɡə(r)/|汉堡包；汉堡牛肉饼]], [[VW:pie|/paɪ/|馅饼，派]], [[VW:pizza|/ˈpiːtsə/|比萨饼]], [[VW:pasta|/ˈpæstə/|意大利面食]] or [[VW:spaghetti|/spəˈɡeti/|意大利细面条]] can be filling; [[VW:soup|/suːp/|汤]], [[VW:pudding|/ˈpʊdɪŋ/|冷布丁；热布丁糕]], a [[VW:biscuit|/ˈbɪskɪt/|【英】饼干【美】烤饼，小圆面包…]], [[VW:jam|/dʒæm/|果酱]], [[VW:nut|/nʌt/|坚果；螺母]], [[VW:chocolate|/ˈtʃɒklət/|巧克力]] and  add comfort or pleasure. [[VW:Vanilla|/vəˈnɪlə/|香草香草味的]], [[VW:mustard|/ˈmʌstəd/|芥末；芥菜]], [[VW:wasabi|/wəˈsɑːbi/|山葵；山葵根]], [[VW:pepper|/ˈpepə(r)/|胡椒粉；柿子椒]], [[VW:ginger|/ˈdʒɪndʒə(r)/|姜]], [[VW:garlic|/ˈɡɑːlɪk/|蒜]], [[VW:scallion|/ˈskæliən/|大葱]], [[VW:vinegar|/ˈvɪnɪɡə(r)/|醋]], [[VW:salt|/sɔːlt; sɒlt/|盐]], [[VW:sugar|/ˈʃʊɡə(r)/|糖]], [[VW:candy|/ˈkændi/|糖果]] and [[VW:honey|/ˈhʌni/|蜂蜜]] show how [[VW:flavour|/ˈfleɪvə(r)/|味道口味特色，风格]] is built from contrasts. A good [[VW:cook|/kʊk/|烹调，烧，煮；厨师]] does not hide an [[VW:ingredient|/ɪnˈɡriːdiənt/|成分(烹调的)原料；因素]]; the [[VW:cook|/kʊk/|烹调，烧，煮；厨师]] lets it speak.",
     "zh": "日常餐食形式多样。色拉和三明治可以快捷；汉堡、馅饼、比萨、意大利面或细面条能饱腹；汤、布丁、饼干、果酱、坚果、巧克力和冰激凌增添舒适或愉悦。香草、芥末、山葵、胡椒、姜、蒜、大葱、醋、盐、糖、糖果和蜂蜜表明，风味如何由对比构成。好厨师不会隐藏食材，而会让它开口。"
    },
    {
     "en": "Taste is both biology and memory. A [[VW:flavour|/ˈfleɪvə(r)/|味道口味特色，风格]] may be [[VW:sour|/ˈsaʊə(r)/|酸的；闷闷不乐的]], [[VW:sweet|/swiːt/|甜的；愉快的]], [[VW:bitter|/ˈbɪtə(r)/|苦的；痛苦的；严寒的]] or [[VW:spicy|/ˈspaɪsi/|辣的]]; a dish may be [[VW:delicious|/dɪˈlɪʃəs/|美味的]], [[VW:yummy|/ˈjʌmi/|美味的]] or [[VW:tasty|/ˈteɪsti/|美味的，可口的]]; and [[VW:hunger|/ˈhʌŋɡə(r)/|饥饿；饥饿感；渴望]] or a [[VW:thirsty|/ˈθɜːsti/|渴的；渴望的]] body can change how it is experienced. [[VW:Spice|/spaɪs/|(调味)香料…]], [[VW:sauce|/sɔːs/|酱汁]] and [[VW:ketchup|/ˈketʃəp/|番茄酱]] can sharpen a meal, while [[VW:perfume|/ˈpɜːfjuːm/|香味，芳香；香水]] reminds us that smell is part of appetite. Nutrition advice becomes useful only when it respects culture, pleasure and access, not just numbers on a label.",
     "zh": "味觉既是生物反应，也是记忆。味道可以酸、甜、苦或辣；菜肴可能美味、可口或好吃；饥饿或口渴会改变体验。香料、酱汁和番茄酱能提升一餐，香水则提醒我们，气味也是食欲的一部分。营养建议只有在尊重文化、愉悦和可及性，而不只是标签上的数字时，才真正有用。"
    },
    {
     "en": "The body must [[VW:digest|/daɪˈdʒest/|消化；理解，领悟]] what the mouth receives. To [[VW:cook|/kʊk/|烹调，烧，煮；厨师]], [[VW:bake|/beɪk/|烘烤；烤熟]], [[VW:fry|/fraɪ/|油煎]], [[VW:roast|/rəʊst/|烤烤肉]] or [[VW:toast|/təʊst/|向……祝酒，为……干杯烤…]] is to apply different kinds of heat. A person may [[VW:suck|/sʌk/|吮吸]], [[VW:lick|/lɪk/|舔]] or [[VW:chew|/tʃuː/|咀嚼]], and [[VW:gum|/ɡʌm/|口香糖；树胶]] can remain after the meal. To [[VW:soak|/səʊk/|浸泡；使湿透]], [[VW:dip|/dɪp/|蘸，浸]], [[VW:squeeze|/skwiːz/|挤压]], [[VW:stir|/stɜː(r)/|搅动(使)行动]], [[VW:grind|/ɡraɪnd/|碾碎；枯燥乏味的事]] or [[VW:slice|/slaɪs/|将……切成薄片…]] is to change texture and release [[VW:flavour|/ˈfleɪvə(r)/|味道口味特色，风格]]. These small actions connect kitchen technique with the chemistry of the body. they become patients. It supports clean water, safe storage, honest labelling and affordable produce. It also asks why some neighbourhoods have fresh food while others have only processed convenience. The answer involves income, transport, planning and education. Nutrition is therefore not simply a matter of willpower; it is a public choice about the conditions in which choice is made.",
     "zh": "身体必须消化口腔接纳之物。烹调、烘烤、油煎、烧烤或烤制，就是运用不同热量。人可以吮吸、舔或咀嚼，口香糖则可能在饭后留下。浸泡、蘸、挤压、搅动、碾碎或切片，就是改变质地并释放风味。这些细小动作把厨房技术与身体化学连接起来。健康的食物系统会在人们成为病人前保护他们。它支持清洁饮水、安全储存、诚实标签和可负担农产品。它也追问为何有些社区有新鲜食物，另一些只有加工便利食品。答案涉及收入、交通、规划与教育。因此，营养不只是意志力问题，而是关于选择在何种条件下作出的公共选择。"
    }
   ],

  {
   "zhTitle": "家与建筑",
   "enTitle": "Home and Architecture",
   "paragraphs": [
    {
     "en": "[[VW:Architecture|/ˈɑːkɪtektʃə(r)/|建筑风格；建筑学]] begins with a simple [[VW:shed|/ʃed/|简易房，棚；流，洒；摆脱]] as readily as with a cathedral. A [[VW:structure|/ˈstrʌktʃə(r)/|建筑物；结构]] must stand, so its [[VW:erection|/ɪˈrekʃn/|建筑，建造]] depends on a sound foundation. To [[VW:construct|/kənˈstrʌkt/|建造]] is to bring parts into relation; to [[VW:obstruct|/əbˈstrʌkt/|阻塞；妨碍]] is to place something in the way; to [[VW:establish|/ɪˈstæblɪʃ/|建立，设立]], [[VW:build|/bɪld/|建造；开发]] or [[VW:found|/faʊnd/|创建，创办]] is to give an idea a durable setting. [[VW:Concrete|/ˈkɒŋkriːt/|混凝土；具体的混凝土制的]] and [[VW:steel|/stiːl/|钢铁]] offer strength, but [[VW:stability|/stəˈbɪləti/|稳定(性)]] also depends on 02 A building belongs to a [[VW:site|/saɪt/|地点]]. A [[VW:venue|/ˈvenjuː/|发生地点，举行场所]] may become a [[VW:landmark|/ˈlændmɑːk/|地标；里程碑]] when it is [[VW:situated|/ˈsɪtʃueɪtɪd/|位于......的]] well, and planners [[VW:locate|/ləʊˈkeɪt/|放置，建立找到]] it near transport so that it can serve public life. People [[VW:reside|/rɪˈzaɪd/|居住]], [[VW:inhabit|/ɪnˈhæbɪt/|居住于]], [[VW:migrate|/maɪˈɡreɪt/|迁徙；移居]] and [[VW:settle|/ˈset(ə)l/|解决在……定居，使定居]] in different ways; a [[VW:dwelling|/ˈdwelɪŋ/|住所]] may be temporary or inherited. A",
     "zh": "建筑学既可从简单棚屋开始，也可从大教堂开始。结构必须 立得住，因此其建造依赖稳固地基。建造是把部件带入关系阻塞是把东西挡在路上；建立、搭建或创办则给想法一个 持久环境。混凝土和钢铁提供强度，但稳定性还取决于比例、 排水、气候与维护。建筑属于某个地点。当一个场所位置良好、靠近交通并能服 务公共生活时，它可能成为地标。人们以不同方式居住、栖居、迁徙和定居；住所可能临时，也可能继承而来。一个地 方成为家，不只靠所有权，也靠习惯、照料与归属。"
    },
    {
     "en": "Housing takes many forms. A [[VW:skyscraper|/ˈskaɪskreɪpə(r)/|摩天大楼]] saves ground space, while a [[VW:villa|/ˈvɪlə/|乡间别墅；［英］度假别墅]], [[VW:mansion|/ˈmænʃ(ə)n/|宅第，公馆]] or [[VW:apartment|/əˈpɑːtmənt/|\\[美］公寓套房]] offers different degrees of privacy; a [[VW:hostel|/ˈhɒst(ə)l/|廉价招待所]], [[VW:lodge|/lɒdʒ/|租住；小屋；度假屋]], [[VW:hut|/hʌt/|小屋，棚屋]] or [[VW:cabin|/ˈkæbɪn/|小木屋；(船上的)小舱]] may serve travellers; a [[VW:cellar|/ˈselə(r)/|地窑，地下室]], [[VW:cottage|/ˈkɒtɪdʒ/|村舍，小屋]] and [[VW:nursery|/ˈnɜːsərɪ/|托儿所托儿所的]] answer practical needs; and a [[VW:cradle|/ˈkreɪd(ə)l/|摇篮发源地]] or [[VW:shelter|/ˈʃeltə(r)/|庇护处；掩蔽；庇护；遮蔽]] reminds us that home first means protection. Each type reflects a balance among land, cost, climate and",
     "zh": "住房形式多样。摩天大楼节省地面，而乡间别墅、宅第或公 寓提供不同程度的私密；招待所、小屋、棚屋或木屋可服务旅人；地窖、村舍和托儿所回应实际需要；摇篮或庇护处则提醒我们，家首先意味着保护。每种类型都反映土地、成本、 气候与文化之间的平衡。"
    },
    {
     "en": "Circulation shapes daily experience. A city [[VW:block|/blɒk/|街区；障碍；一块]], [[VW:grid|/ɡrɪd/|栅栏；网格；输电网]] or [[VW:aisle|/aɪl/|走廊，过道]] can guide movement; a [[VW:porch|/pɔːtʃ/|门廊]], [[VW:corridor|/ˈkɒrɪdɔː(r)/|走廊，通道]], [[VW:stair|/steə(r)/|楼梯]] or [[VW:staircase|/ˈsteəkeɪs/|(建筑内的)楼梯]] connects rooms; and a [[VW:storey|/ˈstɔːri/|楼层]], [[VW:layer|/ˈleɪə(r)/|层]], [[VW:elevator|/ˈelɪveɪtə(r)/|【美】电梯]] or [[VW:escalator|/ˈeskəleɪtə(r)/|自动扶梯，滚梯]] changes how people rise through a building. A [[VW:handrail|/ˈhændreɪl/|扶手，栏杆]] is a small promise of safety. Good [[VW:architecture|/ˈɑːkɪtektʃə(r)/|建筑风格；建筑学]] does not merely create impressive surfaces; it makes",
     "zh": "通行方式塑造日常体验。街区、网格或过道可以引导移动； 门廊、走廊、楼梯或楼梯间连接房间；楼层、层、电梯或自动扶梯改变人如何上升穿过建筑。扶手是安全的小承诺。好 建筑不只是创造壮观表面，而是让普通移动显得自然。"
    },
    {
     "en": "[[VW:Structure|/ˈstrʌktʃə(r)/|建筑物；结构]] is visible in details. A [[VW:pillar|/ˈpɪlə(r)/|柱子；中坚，栋梁]], [[VW:column|/ˈkɒləm/|柱；(书、报纸等印刷页的)栏…]], [[VW:beam|/biːm/|(能量、放射线或粒子的)束，柱…]], [[VW:vault|/vɔːlt/|拱顶；金库，保险库]] or [[VW:arch|/ɑːtʃ/|拱门 (使)弯成弓形]] carries or distributes weight; a [[VW:ceiling|/ˈsiːlɪŋ/|天花板，顶棚]] and [[VW:eaves|/iːvz/|屋檐]] control light and weather; and a [[VW:chimney|/ˈtʃɪmni/|烟囱]] lets smoke leave while warmth remains. These elements are technical, yet they also form rhythm and character. A building can be strong without being heavy and expressive",
     "zh": "结构在细节中可见。柱子、圆柱、梁、拱顶或拱门承载或分散重量；天花板和屋檐控制光线与天气；烟囱让烟离开，同 时留住温暖。这些元素是技术性的，却也形成节奏和性格。 建筑可以坚固而不沉重，也可以富有表达而不浪费。"
    },
    {
     "en": "The social spaces are just as important as the private ones. A [[VW:reception|/rɪˈsepʃ(ə)n/|接待处]] or [[VW:lobby|/ˈlɒbi/|大厅，前厅；游说；游说]] is a threshold, a [[VW:bench|/bentʃ/|长凳；【the~】法官职位]] invites pause, and a [[VW:parlour|/ˈpɑːlə(r)/|客厅]] or [[VW:living room|/'lɪvɪŋ ru:m/|客厅，起居室]] supports conversation. A [[VW:fireplace|/ˈfaɪəpleɪs/|壁炉]] and [[VW:radiator|/ˈreɪdɪeɪtə(r)/|暖气设备]] provide warmth, while a [[VW:cabinet|/ˈkæbɪnət/|储藏柜；内阁]] stores what daily life accumulates and a [[VW:balcony|/ˈbælkəni/|阳台；(剧院的)楼座]] extends the room into open air. [[VW:Architecture|/ˈɑːkɪtektʃə(r)/|建筑风格；建筑学]] succeeds when",
     "zh": "社交空间与私人空间同样重要。接待处或大厅是门槛，长凳 邀请停留，客厅或起居室支持交谈。壁炉和暖气提供温暖，储藏柜收存日常生活积累之物，阳台则把房间延伸到户外。当人们能生活、相遇、休息与变化，而无需与建筑对抗时， 建筑便成功了。"
    }
   ],

  {
   "zhTitle": "城市空间",
   "enTitle": "Urban Space",
   "paragraphs": [
    {
     "en": "01 A home is an [[VW:urban|/ˈɜːbən/|城市的]] system in miniature. A [[VW:kitchen|/ˈkɪtʃɪn/|厨房，灶间]], [[VW:lavatory|/ˈlævətri/|盥洗室，厕所]] and [[VW:toilet|/ˈtɔɪlət/|抽水马桶；［英］厕所]] serve basic needs; a [[VW:bath|/bɑːθ/|洗澡【英】浴缸]] and [[VW:basin|/ˈbeɪs(ə)n/|盆；盆地]] make hygiene possible; and [[VW:internal|/ɪnˈtɜːn(ə)l/|内部的；自身的；国内的]] walls create privacy. When these spaces function well, no one",
     "zh": "家是城市系统的缩影。厨房、盥洗室和厕所服务基本需要；洗澡和盆使卫生成为可能；内部墙壁创造隐私。当这些空间运作良好时，没人会注意；一旦失效，日常生活对每个人都 变得困难。"
    },
    {
     "en": "The city extends beyond the doorway. A [[VW:reserve|/rɪˈzɜːv/|储备(量)；自然保护区；预订]] protects land or water, a [[VW:store|/stɔː(r)/|商店；贮存物；贮存]], [[VW:mall|/mɔːl; mæl/|［尤美］购物中心]] or [[VW:supermarket|/ˈsuːpəmɑːkɪt/|超市]] supplies goods, and a [[VW:booth|/buːð/|售货摊；电话亭；小隔间]] may serve as a stall, telephone point or small workspace. A [[VW:casino|/kəˈsiːnəʊ/|赌场]] and [[VW:studio|/ˈstjuːdiəʊ/|演播室；工作室；单间公寓]] belong to entertainment, while [[VW:downtown|/ˌdaʊnˈtaʊn/|市中心市中心的]] is the commercial centre. An [[VW:urban|/ˈɜːbən/|城市的]] area grows out from its core, and a [[VW:peripheral|/pəˈrɪfərəl/|外围的；外围设备]] district may sit in the [[VW:vicinity|/vəˈsɪnəti/|附近，邻近地区]] of older",
     "zh": "城市延伸到门外。自然保护区保护土地或水域，商店、购物 中心或超市供应商品，小隔间可作为摊位、电话亭或小型工 作空间。赌场和工作室属于娱乐，市中心则是商业核心。城 市区域从中心向外生长，外围地区可能邻近老社区，却无法 享受同等服务。"
    },
    {
     "en": "Space is never merely empty. A [[VW:room|/ruːm/|房间；空间]] can be cramped or [[VW:spacious|/ˈspeɪʃəs/|宽敞的]], a [[VW:void|/vɔɪd/|空间；空白；空虚空的]] can feel heavy, and an [[VW:airtight|/ˈeətaɪt/|密封的，不透气的]] building may save energy while cutting off fresh air. An [[VW:expanse|/ɪkˈspæns/|广阔，辽阔]], [[VW:plaza|/ˈplɑːzə/|广场；购物中心]] or [[VW:castle|/ˈkɑːs(ə)l/|城堡]] shows how scale changes behaviour. Human comfort depends on",
     "zh": "空间从不只是空白。房间可以狭窄或宽敞，空洞可能令人沉重，密封建筑也许节能，却隔绝新鲜空气。广阔区域、广场 或城堡显示尺度如何改变行为。人的舒适取决于比例、光线、 声音和退避的可能。"
    },
    {
     "en": "Construction is a collaboration among many trades. A [[VW:carpenter|/ˈkɑːpəntə(r)/|木匠]] shapes wood, a [[VW:mason|/ˈmeɪs(ə)n/|石匠，泥瓦匠]] works with stone, and [[VW:tile|/taɪl/|瓦；瓷砖]] or [[VW:brickwork|/ˈbrɪkwɜːk/|砖结构]] gives a surface order. A [[VW:hook|/hʊk/|钩，钩状物；勾拳]], [[VW:lever|/ˈliːvə(r)/|杠杆；操纵杆]] or [[VW:scaffold|/ˈskæfəʊld/|脚手架；绞刑架]] helps workers reach and lift safely. [[VW:Infrastructure|/ˈɪnfrəstrʌktʃə(r)/|基础设施]], [[VW:apparatus|/ˌæpəˈreɪtəs/|器械，装置]], a [[VW:crane|/kreɪn/|起重机；鹤]] and a [[VW:drill|/drɪl/|钻机；反复练习钻(孔)；训练]] extend strength, but a [[VW:malfunction|/ˌmælˈfʌŋkʃ(ə)n/|发生故障]] can turn progress into danger. Maintenance is therefore part of [[VW:design|/dɪˈzaɪn/|设计；计划设计]], not an afterthought.",
     "zh": "建造是许多工种的合作。木匠塑形木材，石匠处理石头，瓦片或砖结构赋予表面秩序。钩子、杠杆或脚手架帮助工人安全抵达和抬起物体。基础设施、器械、起重机与钻机延伸力量，但故障会把进步变成危险。因此，维护是设计的一部分而非事后补做。"
    },
    {
     "en": "To [[VW:maintain|/meɪnˈteɪn/|维持；维修；坚称]] a place is to keep it usable. Workers may [[VW:fix|/fɪks/|修理；使固定]], [[VW:mend|/mend/|修理(使) 康复]], [[VW:modify|/ˈmɒdɪfaɪ/|稍作修改]] or [[VW:trim|/trɪm/|修剪；装饰整齐的，整洁的]]; [[VW:weld|/weld/|焊接；使紧密结合]] metal, [[VW:saw|/sɔː/|锯]] timber, tighten a [[VW:screw|/skruː/|螺丝钉；螺旋桨]], [[VW:drill|/drɪl/|钻机；反复练习钻(孔)；训练]] a hole or [[VW:plumb|/plʌm/|(表示垂直度等的)铅锤用铅垂线校正…]] a wall. A [[VW:viaduct|/ˈvaɪədʌkt/|高架桥]] and a [[VW:dam|/dæm/|水坝；控制，抑制]] show how a [[VW:span|/spæn/|跨距，跨度；持续时间]] can cross a valley or control water. To [[VW:install|/ɪnˈstɔːl/|安装]], [[VW:furnish|/ˈfɜːnɪʃ/|为……配备家具陈设]], arrange [[VW:placement|/ˈpleɪsmənt/|放置，布置]] and plan a [[VW:layout|/ˈleɪaʊt/|设计，布置]] is to decide how people will move, meet and rest. [[VW:Design|/dɪˈzaɪn/|设计；计划设计]] is the intelligence that connects all these acts.",
     "zh": "维护一个地方，就是让它持续可用。工人可以修理、修补、稍作修改或修剪；焊接金属、锯木材、拧紧螺丝、钻孔或用铅垂线校正墙面。高架桥与水坝显示跨度如何跨越山谷，或如何控制水流。安装、配备家具、安排布置与规划布局，就是决定人如何移动、相遇和休息。设计是连接这些行为的智慧。"
    },
    {
     "en": "Boundaries shape experience. An [[VW:entrance|/ˈentrəns/|入口；进入权]] or [[VW:entry|/ˈentri/|进入；进入权]] allows someone to [[VW:enter|/ˈentə(r)/|进入]]; an [[VW:exit|/ˈeksɪt/|出口；退场；离去离去]] offers release. An [[VW:outside|/ˌaʊtˈsaɪd/|外部的；外表]] view can be open, an [[VW:outward|/ˈaʊtwəd/|向外的向外]] gesture welcoming, and an [[VW:exterior|/ɪkˈstɪəriə(r)/|外部，外观外部的]] or [[VW:external|/ɪkˈstɜːn(ə)l/|外来的；外面的；对外的]] surface exposed to weather. At the same time, an [[VW:inner|/ˈɪnə(r)/|内部的；内心的]] life needs an [[VW:interior|/ɪnˈtɪəriə(r)/|内部内部的]] and an [[VW:inward|/ˈɪnwəd/|向内的；内心的向内]] attention. A good building holds both movement and stillness, public contact and private thought.",
     "zh": "边界塑造体验。入口或进入让人进来；出口提供离开。外部景色可以开放，向外姿态表示欢迎，外部表面暴露于天气。同时，内在生活需要内部与向内关注。好的建筑同时容纳移动与静止、公共接触与私人思考。"
    },
    {
     "en": "The quality of a city is not measured by towers alone. It is measured by whether a child can reach a park, a worker can afford a home, an older person can cross a street and a community can gather become humane when they remember that space is a shared resource and that every map describes real",
     "zh": "城市质量不只由高楼衡量，还由孩子能否到达公园、劳动者能否负担住房、老人能否过街，以及社区能否不花钱地聚集来衡量。当建筑与规划记得空间是共享资源，每张地图描绘的都是真实生活时，它们才变得有人情味。"
    }
   ],

  {
   "zhTitle": "出行方式",
   "enTitle": "Ways of Moving",
   "paragraphs": [
    {
     "en": "To move is to make a story from distance. Sailors [[VW:navigate|/ˈnævɪɡeɪt/|航行；横渡]] a [[VW:voyage|/ˈvɔɪɪdʒ/|航海，航天；航行]], [[VW:aviation|/ˌeɪviˈeɪʃ(ə)n/|航空；航空学；航空工业]] lifts [[VW:travel|/ˈtræv(ə)l/|旅行；旅行]] into the sky, and a [[VW:journey|/ˈdʒɜːni/|旅行；历程]] may be practical, sacred or simply curious. A [[VW:safari|/səˈfɑːri/|(尤指在东非的)观兽旅行]] can turn watching into wonder; a [[VW:parade|/pəˈreɪd/|游行；炫耀庆祝游行；列队行选…]] can make a street perform; and a place may [[VW:haunt|/hɔːnt/|(鬼魂等)常出没于常去的地方]] the memory long after departure. An [[VW:attraction|/əˈtrækʃ(ə)n/|吸引；具有吸引力的事物]], [[VW:memorial|/məˈmɔːriəl/|纪念碑纪念的，悼念的]] or [[VW:pyramid|/ˈpɪrəmɪd/|金字塔；棱锥体]] draws people because it gives space a meaning they",
     "zh": "移动就是用距离编成故事。水手航行，航空把旅行带上天空一段旅程可能务实、神圣，也可能只是出于好奇。观兽旅 行能把观看变成惊叹；游行能让街道表演；某个地方可能在 离开后仍萦绕记忆。景点、纪念碑或金字塔吸引人，是因为 它赋予空间一种能被带走的意义。"
    },
    {
     "en": "International movement begins at a [[VW:port|/pɔːt/|港口；左舷]], [[VW:visa|/ˈviːzə/|签证]] desk or [[VW:traffic|/ˈtræfɪk/|交通，车流]] queue. An [[VW:airline|/ˈeəlaɪn/|航空公司]], [[VW:airplane|/ˈeəpleɪn/|飞机]], [[VW:helicopter|/ˈhelɪkɒptə(r)/|直升机用直升机载送…]], [[VW:jet|/dʒet/|喷气式飞机；喷射口]] or [[VW:parachute|/ˈpærəʃuːt/|降落伞]] changes how high and how fast a person can go. A [[VW:flight|/flaɪt/|飞行；航班]] depends on a [[VW:pilot|/ˈpaɪlət/|飞行员]], [[VW:passenger|/ˈpæsɪndʒə(r)/|乘客]], [[VW:baggage|/ˈbæɡɪdʒ/|［尤美］行李]], [[VW:luggage|/ˈlʌɡɪdʒ/|行李]], [[VW:suitcase|/ˈsuːtkeɪs/|手提箱]] and ; a [[VW:rack|/ræk/|搁物架，挂物架]] holds what cannot be carried; and [[VW:freight|/freɪt/|货运；货物运送(货物)]] moves the goods people need. An [[VW:atlas|/ˈætləs/|地图册，地图集]], [[VW:fare|/feə(r)/|车费，路费]], [[VW:route|/ruːt/|路线]] and [[VW:itinerary|/aɪˈtɪnərəri/|行程，路线]] turn possibility into a plan, while a [[VW:passage|/ˈpæsɪdʒ/|通过；通道，走廊]], [[VW:intersection|/ˌɪntəˈsekʃn/|十字路口，交叉路口]] and [[VW:cross|/krɒs/|十字形；十字架；穿过]] mark the points where paths",
     "zh": "国际流动从港口、签证柜台或交通队列开始。航空公司、飞 机、直升机、喷气机或降落伞改变人能走多高、多快。航班 依赖飞行员、乘客、行李、行李、手提箱和随身小包；行李架存放无法手拿之物；货运则移动人们需要的商品。地图册、 车费、路线和行程把可能性变成计划，而通道、十字路口和 交叉标记路径相遇之处。"
    },
    {
     "en": "Roads organise movement. A [[VW:way|/weɪ/|路；方式]] or [[VW:path|/pɑːθ/|小路]] may be small; a [[VW:lane|/leɪn/|小巷；车道]], [[VW:avenue|/ˈævənjuː/|大街；途径]] or [[VW:highway|/ˈhaɪweɪ/|［尤美］公路]] carries larger flows; and a [[VW:curb|/kɜːb/|路缘；起控制作用的事物]], [[VW:signpost|/ˈsaɪnpəʊst/|路标]] and workers who [[VW:pave|/peɪv/|铺(路或地面)]] a surface guide the traveller. A [[VW:vehicle|/ˈviːəkl/|车辆，交通工具；工具，手段]] may be an [[VW:auto|/ˈɔːtəʊ/|汽车]], [[VW:express|/ɪkˈspres/|特快列车；快递服务；表示…]] [[VW:tram|/træm/|［尤英］有轨电车]], [[VW:coach|/kəʊtʃ/|［英］长途汽车；教练…]], [[VW:ambulance|/ˈæmbjələns/|救护车]], [[VW:truck|/trʌk/|卡车；敞篷货运火车]] or [[VW:lorry|/ˈlɒri/|［英］卡车]]; a [[VW:van|/væn/|厢式货车；客货车]], [[VW:wagon|/ˈwæɡən/|四轮运货马车(或牛车)…]], [[VW:carriage|/ˈkærɪdʒ/|四轮马车…]], [[VW:tractor|/ˈtræktə(r)/|拖拉机；牵引车]], [[VW:cart|/kɑːt/|运货马车…]], [[VW:pedicab|/ˈpedɪkæb/|(人力)三轮车]] or [[VW:cycle|/ˈsaɪk(ə)l/|骑(自行车) 周期；自行车]] serves a particular scale. A [[VW:garage|/ˈɡærɑːʒ/|汽车修理厂；车库]], [[VW:motor|/ˈməʊtə(r)/|发动机机动的]], [[VW:horsepower|/ˈhɔːspaʊə(r)/|马力]], [[VW:wheel|/wiːl/|方向盘；车轮]], [[VW:brake|/breɪk/|车闸；刹车；刹车]] and [[VW:tyre|/ˈtaɪə(r)/|轮胎]] belong to the machine that makes motion possible. A [[VW:honk|/hɒŋk/|汽车喇叭声；鹅叫声…]] is a brief signal, while a [[VW:crew|/kruː/|(轮船、飞机等上的)全体工作人员…]] and [[VW:captain|/ˈkæptɪn/|船长；队长]]",
     "zh": "道路组织移动。小路或路径可以狭窄；小巷、大街或公路承载更大流量；路缘、路标和铺路工人引导旅人。车辆可以是 汽车、特快电车、长途汽车、救护车、卡车或货车；厢式车、四轮货车、车厢、拖拉机、手推车、三轮车或自行车适应不 同规模。车库、发动机、马力、车轮、车闸和轮胎属于让运 动成为可能的机器。喇叭声是短暂信号，而船员和船长对船上所有人承担责任。"
    },
    {
     "en": "[[VW:Travel|/ˈtræv(ə)l/|旅行；旅行]] is not only transport. It changes what a person notices. A [[VW:journey|/ˈdʒɜːni/|旅行；历程]] on foot may reveal a scent, a wall, a face or a habit that a [[VW:flight|/flaɪt/|飞行；航班]] passes over. The faster the method, the narrower the view may become. This is why a",
     "zh": "旅行不只是运输，它改变人注意到什么。步行旅程可能揭示飞行掠过的气味、墙壁、面孔或习惯。方式越快，视野可能 越窄。因此地图可以高效却仍不完整：它显示路线，却不显示上路理由。"
    },
    {
     "en": "Public transport expresses a social choice. A reliable system can reduce congestion, connect workers with jobs and give people without cars access to opportunity. A poorly planned system can exclude the poor, isolate the old and waste time. Efficiency matters, but access matters too. A city that moves only its wealthiest residents cannot claim to",
     "zh": "公共交通表达社会选择。可靠系统能减少拥堵，连接劳动者 与工作，并让无车者获得机会。规划糟糕的系统则会排斥穷人、孤立老人、浪费时间。效率重要，可及性也重要。一个只让最富居民顺畅移动的城市，不能声称自己移动良好。"
    },
    {
     "en": "Safety is a shared responsibility. A tired driver, a  or a flooded road can turn routine [[VW:travel|/ˈtræv(ə)l/|旅行；旅行]] into emergency. Airlines, railways and shipping companies must invest in maintenance, training and transparent reporting. Passengers also have duties: to follow instructions, respect staff and recognise that speed is not worth a life.",
     "zh": "安全是共同责任。疲惫司机、损坏刹车或积水道路，都可能把日常出行变成紧急事件。航空公司、铁路和航运企业必须投资维护、培训与透明报告。乘客也有责任：遵守指示、尊重员工，并明白速度不值得以生命交换。"
    },
    {
     "en": "The future of movement will be judged by more than novelty. Electric vehicles, shared transport and better public networks may reduce pollution if they are affordable and well designed. A [[VW:journey|/ˈdʒɜːni/|旅行；历程]] is successful when it delivers the body, protects dignity and leaves the destination no poorer than before.",
     "zh": "出行未来不能只由新奇判断。如果电动车、共享交通和更好的公共网络价格可负担、设计良好，它们就能减少污染。一段旅程只有在送达身体、保护尊严，并让目的地不因到来而更贫乏时，才算成功。"
    }
   ],

  {
   "zhTitle": "旅途与住宿",
   "enTitle": "Journey and Shelter",
   "paragraphs": [
    {
     "en": "01 A voyage is a test of attention. A [[VW:steward|/ˈstjuːəd/|男乘务员；管家]] may attend to passengers while a [[VW:stern|/stɜːn/|船尾；严厉的；坚定的]] captain watches weather and water; an [[VW:emergency|/ɪˈmɜːdʒənsi/|紧急事件应急的]] can [[VW:arrive|/əˈraɪv/|到达；取得成功]] without warning, and a [[VW:wreck|/rek/|使失事…]], [[VW:crash|/kræʃ/|撞击；崩溃：破产]] or [[VW:crush|/krʌʃ/|压碎，压坏；拥挤的人群；迷恋…]] can turn confidence into fear. A sudden [[VW:dash|/dæʃ/|猛冲；猛摔]] may save time or cause danger, while a ship can [[VW:vanish|/ˈvænɪʃ/|突然消失；绝迹]] or [[VW:disappear|/ˌdɪsəˈpɪə(r)/|失踪；消失]] beyond the horizon. A [[VW:hazard|/ˈhæzəd/|危险；使冒风险]] is not fate; it is a condition that",
     "zh": "航行是对专注的考验。乘务员可能照料乘客，而严厉的船长观察天气与海水；紧急事件可能毫无预警地到来，失事、撞 击或挤压会把信心变成恐惧。猛然一冲可能节省时间，也可 能制造危险；船只可能突然消失，或消失在视野之外。危险不是命运，而是良好航海技术尝试预判的条件。"
    },
    {
     "en": "The [[VW:harbour|/ˈhɑːbə(r)/|港口]], [[VW:dock|/dɒk/|码头，船坞]] and [[VW:anchor|/ˈæŋkə(r)/|锚]] mark the end of one movement and the beginning of another. A [[VW:vessel|/ˈves(ə)l/|大船，舰；容器，器皿]] may [[VW:submerge|/səbˈmɜːdʒ/|(使)浸没；掩盖]], a [[VW:sailor|/ˈseɪlə(r)/|海员，水手]] or [[VW:seaman|/ˈsiːmən/|海员，水手]] may work on [[VW:deck|/dek/|甲板；装饰]], and a [[VW:carrier|/ˈkæriə(r)/|航空母舰；运输工具]], [[VW:steamer|/ˈstiːmə(r)/|汽船，轮船]] or [[VW:liner|/ˈlaɪnə(r)/|邮轮，客轮]] may move people and cargo across the sea. A [[VW:ferry|/ˈferi/|渡船；渡运]], [[VW:sail|/seɪl/|航行；驾驶(帆船)]], [[VW:raft|/rɑːft/|木筏，木排]], [[VW:canoe|/kəˈnuː/|独木舟]] and [[VW:oar|/ɔː(r)/|桨用桨划(船)]] represent older and smaller forms of passage, while a [[VW:turbine|/ˈtɜːbaɪn/|涡轮机]] and [[VW:propeller|/prəˈpelə(r)/|螺旋桨，推进器]] convert energy into motion. To be [[VW:aboard|/əˈbɔːd/|在(船、飞机等)上]] is to accept dependence on a crew; to [[VW:embark|/ɪmˈbɑːk/|上船(或飞机等)；开始做]] is to begin a journey and a",
     "zh": "港口、码头和锚标记一次运动的终点与另一次运动的起点。 船只可能潜入水下，水手在甲板工作，运输工具、汽船或邮轮可跨海运送人与货物。渡船、帆、木筏、独木舟和桨代表更古老、更小型的通行方式，而涡轮机和螺旋桨把能量转化 为运动。在船上意味着依赖船员；上船则既开始旅程，也承担责任。"
    },
    {
     "en": "Inland routes have their own architecture. A [[VW:channel|/ˈtʃæn(ə)l/|航道；电视频道；海峡]], [[VW:canal|/kəˈnæl/|运河…]] or [[VW:ditch|/dɪtʃ/|沟，渠；抛弃]] controls water; a [[VW:railroad|/ˈreɪlrəʊd/|［美］铁路，铁路公司]], [[VW:railway|/ˈreɪlweɪ/|［英］铁路，铁路系统]] or [[VW:locomotive|/ˌləʊkəˈməʊtɪv/|火车头，机车]] carries heavy loads; a [[VW:subway|/ˈsʌbweɪ/|［英］地下通道；［美］地铁]], [[VW:underground|/ˌʌndəˈɡraʊnd/|地下的；秘密的［英］地铁]] [[VW:tunnel|/ˈtʌn(ə)l/|隧道，地道]], [[VW:rail|/reɪl/|栏杆；铁路路轨]] line or station organises urban movement. To [[VW:depart|/dɪˈpɑːt/|离开，启程]] is to leave, to [[VW:arrive|/əˈraɪv/|到达；取得成功]] is to complete; a [[VW:destination|/ˌdestɪˈneɪʃn/|目的地，终点]] gives direction, while a [[VW:delay|/dɪˈleɪ/|耽搁；延期；使耽搁；使延期]], [[VW:lull|/lʌl/|暂停，暂时平静期；使昏昏欲睡]] or decision to [[VW:postpone|/pəˈspəʊn/|推迟，使延期]] a plan tests patience. To [[VW:defer|/dɪˈfɜː(r)/|推迟，拖延]] a decision is not always to avoid it. A ticket may [[VW:expire|/ɪkˈspaɪə(r)/|期满；气绝，死亡]] and a payment may fall [[VW:due|/djuː/|到期的，预期的]], but time does",
     "zh": "内陆路线有自己的结构。航道、运河或沟渠控制水流；铁路、 铁路系统或机车承载沉重货物；地铁、地下隧道、铁轨或车 站组织城市移动。启程是离开，到达是完成；目的地给出方向，而延误、暂停或推迟计划考验耐心。推迟决定并不总是逃避它。票可能到期，付款可能到期，但时间并不只属于旅人。"
    },
    {
     "en": "Delivery is movement with a promise. [[VW:Postage|/ˈpəʊstɪdʒ/|邮费，邮资]] and a [[VW:stamp|/stæmp/|邮票；印章…]] carry a letter; [[VW:mail|/meɪl/|邮件，邮包；邮政；邮寄]], a [[VW:packet|/ˈpækɪt/|［英］包装盒…]] and a [[VW:package|/ˈpækɪdʒ/|包裹；［美］盒，包；包装]] travel through systems that [[VW:bind|/baɪnd/|捆，绑]], sort, [[VW:transmit|/trænzˈmɪt/|传送；传播，传染；传输]] and track them. A [[VW:parcel|/ˈpɑːs(ə)l/|打包，包 (土地的)一块…]] may become a [[VW:load|/ləʊd/|装载，装满负荷；大量]] or [[VW:burden|/ˈbɜːd(ə)n/|(使)担负；重担，负担]], and a [[VW:transfer|/trænsˈfɜː(r)/|(使)迁移，(使)转移…]], [[VW:transit|/ˈtrænzɪt/|通过；运送运输；通行…]], service to [[VW:deliver|/dɪˈlɪvə(r)/|传送，递送]] or attempt to [[VW:convey|/kənˈveɪ/|运送，输送；表达，传递]] value moves something from one hand to another. [[VW:Speed|/spiːd/|速度；迅速]] and [[VW:velocity|/vəˈlɒsəti/|速度]] describe pace, and a [[VW:swift|/swɪft/|迅速的；敏捷的]] service can be impressive, but reliability is what",
     "zh": "递送是带有承诺的移动。邮资和邮票运送信件；邮件、小包和包裹通过捆绑、分拣与追踪系统旅行。包裹可能成为装载 物或负担，而转移、传输、过境、递送或运送把价值从一只手传到另一只手。速度和速度描述快慢，迅捷服务令人赞叹但可靠性才让人得以规划。"
    },
    {
     "en": "The same journey can be shelter or ordeal. A shelter is not only a roof; it is a place where the body can recover and the mind can rest. A [[VW:harbour|/ˈhɑːbə(r)/|港口]] protects ships; a station protects waiting passengers; a schedule protects the weak from uncertainty. Good transport does not simply move more people faster. It reduces needless danger, respects time and leaves",
     "zh": "同一段旅程既可能是庇护，也可能是磨难。庇护处不只是屋顶，而是身体能恢复、心灵能休息之处。港口保护船只，车 站保护等待的乘客，时刻表保护弱者免受不确定折磨。良好交通不只是更快地移动更多人，它减少不必要危险、尊重时间，也为无法匆忙者留出空间。"
    }
   ],

  {
   "zhTitle": "公共事务",
   "enTitle": "Public Affairs",
   "paragraphs": [
    {
     "en": "Public affairs begin with a question that every political  [[VW:community|/kəˈmjuːnəti/|社区；群体；(生物的)群落]] must answer: who may exercise [[VW:authority|/ɔːˈθɒrətɪ/|权力；权威人士；行政管理机构…]], and within what limits? A [[VW:republic|/rɪˈpʌblɪk/|共和国，共和政体]] entrusts [[VW:power|/ˈpaʊə(r)/|能力；权力；政权；能源]] to citizens and their representatives rather than to a hereditary ruler. A [[VW:democracy|/dɪˈmɒkrəsi/|民主，民主制度；民主国家]] adds regular elections, open debate and the right to remove a [[VW:government|/ˈɡʌvənmənt/|政府；政体；统治]] peacefully. Yet no system works through elections alone. A professional [[VW:bureaucracy|/bjʊəˈrɒkrəsi/|官僚制度；官僚作风]] prepares policy, a [[VW:hierarchy|/ˈhaɪərɑːki/|等级制度；统治集团]] clarifies responsibility, and an [[VW:egalitarian|/iˌɡælɪˈteəriən/|平等主义的，平等主义者]] culture asks whether wealth or status has quietly turned equal",
     "zh": "公共事务始于每个政治共同体都必须回答的问题：谁可以行 使权威，权威又受什么限制？共和国把权力委托给公民及其 代表，而非世袭统治者。民主制又加入定期选举、公开辩论 以及和平更换政府的权利。然而，任何制度都不能只靠选举运转。专业官僚体系拟定政策，等级结构明确责任，平等文 化则追问财富或地位是否已悄然把平等选票变成不平等影响。"
    },
    {
     "en": "National traditions answer that question differently. Some societies have debated [[VW:Marxism|/ˈmɑːksɪzəm/|马克思主义]], [[VW:socialism|/ˈsəʊʃəlɪz(ə)m/|社会主义]] and [[VW:communism|/ˈkɒmjənɪzəm/|共产主义]] as theories of ownership and distribution; others have preferred a market economy with strong public safeguards. [[VW:Materialism|/məˈtɪəriəlɪzəm/|唯物主义；唯物论]] treats possessions as the main measure of success, while [[VW:reform|/rɪˈfɔːm/|改革，改良改革，改良…]] seeks improvement without discarding every inherited [[VW:institution|/ˌɪnstɪˈtjuːʃ(ə)n/|社会福利机构…]]. A [[VW:revolution|/ˌrevəˈluːʃn/|革命；巨大变化]] may overturn a [[VW:regime|/reɪˈʒiːm/|统治制度，政权，政体]], but reconstruction is a long [[VW:process|/ˈprəʊses/|过程，进程；处理；加工…]]. A [[VW:conservative|/kənˈsɜːvətɪv/|保守的保守党党员]] may warn of economic [[VW:meltdown|/ˈmeltdaʊn/|(核反应堆的)堆芯熔毁；崩溃]], a [[VW:municipal|/mjuːˈnɪsɪp(ə)l/|市政的，地方政府的]] council may demand local control, and a [[VW:neutral|/ˈnjuːtrəl/|中立的；中立国的]] state may offer its city as an [[VW:arena|/əˈriːnə/|竞技场，运动场…]] for [[VW:bilateral|/ˌbaɪˈlætərəl/|双边的]]",
     "zh": "不同传统给出的答案各不相同。有些社会把马克思主义、社 会主义和共产主义作为所有权与分配理论来讨论；另一些更 偏好有强公共保障的市场经济。物质主义把财产当作成功的 主要尺度；改革则寻求改进，而不必抛弃一切继承下来的制 度。革命可能推翻一个政权，但重建是漫长过程。保守派可 能捍卫传统，市政委员会可能要求地方控制，中立国则可能提供城市作为双边会谈的场所。"
    },
    {
     "en": "The visible machinery of [[VW:government|/ˈɡʌvənmənt/|政府；政体；统治]] is both practical and symbolic. A [[VW:flag|/flæɡ/|旗，旗帜]] may fly above a [[VW:parliament|/ˈpɑːləmənt/|议会，国会…]], while a [[VW:banner|/ˈbænə(r)/|横幅，标语]] states a campaign's central promise. A [[VW:president|/ˈprezɪdənt/|总统；校长；董事长]] or [[VW:premier|/ˈpremiə(r)/|总理，首相；首要的，第一的]] leads an executive; a [[VW:minister|/ˈmɪnɪstə(r)/|部长，大臣；公使]] or [[VW:secretary|/ˈsekrət(ə)ri/|秘书；书记员；大臣]] carries responsibility for a [[VW:department|/dɪˈpɑːtmənt/|(政府、企业等机构的)部门…]]. A senate , [[VW:conference|/ˈkɒnfərəns/|(常持续数日的大型正式)会议…]], [[VW:meeting|/ˈmiːtɪŋ/|会议；会面]] and public hearing allow proposals to be tested. A [[VW:delegation|/ˌdelɪˈɡeɪʃn/|代表团；委派]] speaks on [[VW:behalf|/bɪˈhɑːf/|\\[on～of sb. )代表某人…]] of a [[VW:community|/kəˈmjuːnəti/|社区；群体；(生物的)群落]], and a [[VW:headquarters|/ˌhedˈkwɔːtəz/|总部，总公司；司令部]] coordinates work across regions. A [[VW:statesman|/ˈsteɪtsmən/|政治家]] or [[VW:mayor|/meə(r)/|市长]] may attract attention, but the police , [[VW:civil|/ˈsɪv(ə)l/|公民的，国内的；民用的…]] [[VW:office|/ˈɒfɪs/|办公室；要职，官职…]], [[VW:bureau|/ˈbjʊərəʊ/|局，处，科；办事处]] and [[VW:administration|/ədˌmɪnɪˈstreɪʃ(ə)n/|管理，行政]] must still deliver ordinary [[VW:service|/ˈsɜːvɪs/|服务；公共服务事业…]]",
     "zh": "政府可见的机器既有实际功能，也有象征意义。国旗可能飘扬在议会上方，横幅则写出竞选的核心承诺。总统或总理领导行政部门，部长或秘书为一个部门承担责任。参议院、会议、会晤和公开听证让提案经受检验。代表团代表一个群体发言，总部协调各地区工作。政治家或市长可能吸引注意，但警察、民政办公室、局与行政机构仍须公平提供日常服务。"
    },
    {
     "en": "[[VW:Power|/ˈpaʊə(r)/|能力；权力；政权；能源]] is not the same as [[VW:influence|/ˈɪnfluəns/|影响，作用；影响]]. A large [[VW:organisation|/ˌɔːɡənaɪˈzeɪʃ(ə)n/|组织，团体，机构]] may [[VW:dominate|/ˈdɒmɪneɪt/|支配，控制；占优势]] a consultation, while a small [[VW:association|/əˌsəʊsiˈeɪʃn; əˌsəʊʃiˈeɪʃn/|协会，团体；关联]] can [[VW:affect|/əˈfekt/|影响；(感情上)打动，使悲伤]] policy through evidence and trust. The [[VW:importance|/ɪmˈpɔːt(ə)ns/|重要，重要性]] of a rule lies less in its wording than in its [[VW:significance|/sɪɡˈnɪfɪkəns/|重要性，意义]] for daily life. A trade [[VW:union|/ˈjuːniən/|联合；联盟；工会]], , [[VW:community|/kəˈmjuːnəti/|社区；群体；(生物的)群落]] group, business [[VW:consortium|/kənˈsɔːtiəm/|财团，联营企业]] or sports [[VW:league|/liːɡ/|联赛；联盟，同盟]] can [[VW:unite|/juˈnaɪt/|(使)联合，(使)团结]] people around a common purpose. Each [[VW:nation|/ˈneɪʃ(ə)n/|国家；民族；国民]] is [[VW:unique|/juˈniːk/|独一无二的，唯一的；独特的]], but none is self-contained, and institutions earn legitimacy by explaining what they do and whom they serve.",
     "zh": "权力并不等于影响力。大型组织可能主导一次咨询，小型协会却能以证据和信任影响政策。一条规则的重要性不在其措辞，而在它对日常生活意味着什么。工会、专业机构、社区团体、商业联合体或体育联盟可以围绕共同目标团结人们。每个国家都独一无二，却没有一个国家完全自给自足；制度通过解释自身作为与服务对象来赢得正当性。"
    },
    {
     "en": "Modern [[VW:government|/ˈɡʌvənmənt/|政府；政体；统治]] also reaches beyond borders. [[VW:Global|/ˈɡləʊbl/|全球的，全世界的]] supply chains and [[VW:worldwide|/ˌwɜːldˈwaɪd/|世界范围的，遍及全球的]] communication make [[VW:federal|/ˈfedərəl/|联邦的，联合的]], [[VW:overseas|/ˌəʊvəˈsiːz/|海外的，国外的；向海外…]] and [[VW:foreign|/ˈfɒrən/|外国的；外来的；外交的]] policy part of domestic life. People may [[VW:emigrate|/ˈemɪɡreɪt/|移居国外]] in search of work, [[VW:immigrate|/ˈɪmɪɡreɪt/|(从外地)移居，移入]] to join family, or study [[VW:abroad|/əˈbrɔːd/|到国外，在国外；广为流传]] before returning home. A [[VW:civil|/ˈsɪv(ə)l/|公民的，国内的；民用的…]] [[VW:service|/ˈsɜːvɪs/|服务；公共服务事业…]] must treat citizens and residents with equal care, while officials [[VW:abroad|/əˈbrɔːd/|到国外，在国外；广为流传]] must respect local law and culture. International cooperation is strongest when it preserves public",
     "zh": "现代政府也延伸到国界之外。全球供应链和世界范围的交流使联邦、海外与外交政策成为国内生活的一部分。人们可 能为寻找工作而移居国外，为与家人团聚而移入，或到海外学习后回国。公务员必须以同等关怀对待公民与居民，驻外 官员则须尊重当地法律和文化。国际合作只有同时保有国内公共问责，才最为稳固。"
    },
    {
     "en": "History warns against treating the state as a private possession. A ruler may [[VW:reign|/reɪn/|君主统治时期；统治]] for decades, a [[VW:crown|/kraʊn/|王冠为......加冕]] and [[VW:throne|/θrəʊn/|王位；(君王的)宝座]] may carry ceremonial weight, and a [[VW:wreath|/riːθ/|花环，花冠；(祭奠用的)花圈]] may honour those who died in [[VW:service|/ˈsɜːvɪs/|服务；公共服务事业…]]. But a [[VW:puppet|/ˈpʌpɪt/|玩偶；傀儡]] [[VW:government|/ˈɡʌvənmənt/|政府；政体；统治]], installed by an occupying force, lacks genuine [[VW:authority|/ɔːˈθɒrətɪ/|权力；权威人士；行政管理机构…]]. A [[VW:soviet|/ˈsəʊviət/|苏联的；苏维埃]]-style council may claim to speak for everyone while silencing dissent. The lesson is not that [[VW:government|/ˈɡʌvənmənt/|政府；政体；统治]] is unnecessary; it is that no party, family or [[VW:office|/ˈɒfɪs/|办公室；要职，官职…]]",
     "zh": "历史警告人们不要把国家当作私产。统治者可能统治数十年王冠与王座可能仍具礼仪意义，花圈则纪念因公殉职者。 但占领军扶植的傀儡政府缺乏真正权威。苏维埃式委员会可 能声称代表所有人，却压制异议。教训并非政府不必要，而是任何政党、家族或机关都不应变得比它所声称代表的人民更大。"
    },
    {
     "en": "Good public affairs therefore require more than efficient [[VW:administration|/ədˌmɪnɪˈstreɪʃ(ə)n/|管理，行政]]. They require a culture in which questions are welcome, records are open, minorities are heard and [[VW:power|/ˈpaʊə(r)/|能力；权力；政权；能源]] can change hands without violence. The test of a constitution is not how elegantly it describes [[VW:authority|/ɔːˈθɒrətɪ/|权力；权威人士；行政管理机构…]], but whether an ordinary person can appeal a decision, receive a [[VW:service|/ˈsɜːvɪs/|服务；公共服务事业…]] and help shape the future",
     "zh": "因此，良好公共事务不只要求高效行政，还要求一种文化： 提问受到欢迎，记录公开透明，少数群体得到倾听，权力能 以非暴力方式更替。检验宪法的标准，不在它如何优雅地描述权威，而在普通人是否能提出申诉、获得服务并无所畏惧 地参与塑造未来。"
    }
   ],

  {
   "zhTitle": "国家与世界",
   "enTitle": "Nation and World",
   "paragraphs": [
    {
     "en": "[[VW:New Zealand|/ˌnjuː ˈziːlənd/|新西兰]] and [[VW:Germany|/ˈdʒɜːməni/|德国]] offer two distinct examples of democratic life. [[VW:New Zealand|/ˌnjuː ˈziːlənd/|新西兰]] has a parliamentary system and a constitutional monarchy, while [[VW:Germany|/ˈdʒɜːməni/|德国]] is a federal republic whose constitution distributes power between the nation and its states. Neither country's [[VW:liberty|/ˈlɪbəti/|自由]] can be reduced to a single law. [[VW:Independence|/ˌɪndɪˈpendəns/|独立；自立]] created the space for self-government, but freedom is sustained by courts, parties, a free press and citizens who accept that",
     "zh": "新西兰和德国展示了两种不同的民主生活。新西兰实行议会制与君主立宪制，德国则是联邦共和国，其宪法在国家与各州之间分配权力。两国的自由都不能化约为单一法律。独立 为自治创造空间，但自由依靠法院、政党、自由媒体，以及承认权利伴随责任的公民来维持。"
    },
    {
     "en": "Migration has shaped both societies and many others. A former [[VW:colony|/ˈkɒləni/|殖民地]] may preserve old ties while building a new identity; cities may contain wealthy districts and a [[VW:slum|/slʌm/|贫民窟]] where public services are strained. A [[VW:refuge|/ˈrefjuːdʒ/|避难，庇护；避难所]] offers immediate shelter, while [[VW:asylum|/əˈsaɪləm/|庇护；精神病院]] is a legal protection for people who cannot safely return home. [[VW:Population|/ˌpɒpjuˈleɪʃ(ə)n/|人口，人口数量]] change is not merely a number: [[VW:demographic|/ˌdeməˈɡræfɪk/|人口(学)的，人口统计(学)的…]] evidence reveals age, movement and need. Every [[VW:citizen|/ˈsɪtɪz(ə)n/|公民；市民]] and [[VW:resident|/ˈrezɪdənt/|居民；居住的]] should be able to participate, regardless of [[VW:ethnic|/ˈeθnɪk/|民族的，种族的]] or [[VW:racial|/ˈreɪʃ(ə)l/|种族的，人种的]] background, [[VW:clan|/klæn/|宗族，家族；帮派]]",
     "zh": "移民塑造了这两个社会，也塑造了许多其他社会。前殖民地可能在保留旧联系的同时建立新身份；城市中可能既有富裕 区，也有公共服务承压的贫民窟。避难所提供即时栖身之处庇护则为无法安全返乡者提供法律保护。人口变化不只是 一个数字：人口结构证据揭示年龄、流动与需求。无论族裔、 种族背景、氏族忠诚或家庭出身如何，每位公民和居民都应 能够参与。"
    },
    {
     "en": "Democratic inclusion depends on rules that are both clear and fair. The [[VW:franchise|/ˈfræntʃaɪz/|出售……的特许经营权；特许权…]] may [[VW:entitle|/ɪnˈtaɪt(ə)l/|给......权利(或资格)…]] adults to [[VW:vote|/vəʊt/|选举权；投票；表决；投票]], yet a [[VW:preference|/ˈprefrəns/|偏爱；优先权]] for one group can weaken genuine equality. In an election, people [[VW:elect|/ɪˈlekt/|选举；选择]] representatives and help decide [[VW:succession|/səkˈseʃ(ə)n/|连续；继承权，继位]] within a party. A [[VW:respondent|/rɪˈspɒndənt/|(民意测验等的)调查对象]] in an opinion [[VW:poll|/pəʊl/|民意调查；选举投票；投票数]] may express a private doubt that no public speech reveals. A [[VW:vote|/vəʊt/|选举权；投票；表决；投票]] is therefore more than 04 A serious candidate needs [[VW:ambition|/æmˈbɪʃ(ə)n/|雄心，抱负]], but [[VW:ambition|/æmˈbɪʃ(ə)n/|雄心，抱负]] must be paired with preparation. Parties [[VW:nominate|/ˈnɒmɪneɪt/|提名；任命]] candidates, publish a policy [[VW:checklist|/ˈtʃeklɪst/|清单；选民花名册]] and explain how they will protect [[VW:safety|/ˈseɪfti/|安全；安全场所]], [[VW:welfare|/ˈwelfeə(r)/|健康，幸福]] and [[VW:well-being|/ˈwel biːɪŋ/|康乐，安宁]]. Social [[VW:harmony|/ˈhɑːməni/|协调，和谐；融洽；和声]] does not require everyone to agree. It requires a [[VW:steady|/ˈstedi/|不摇晃的，平稳的；稳步的…]] commitment to negotiation so that communities can [[VW:flourish|/ˈflʌrɪʃ/|繁荣，兴旺；茁壮成长]] and individuals can [[VW:succeed|/səkˈsiːd/|成功]]. A credible [[VW:prospect|/ˈprɒspekt/|希望，可能性；风景]] of reform depends on a [[VW:perspective|/pəˈspektɪv/|景点；观点]] that includes more than one [[VW:viewpoint|/ˈvjuːpɔɪnt/|观点，看法；视角]] and",
     "zh": "民主包容依赖既清晰又公平的规则。选举权可能赋予成年人 投票资格，但偏袒某个群体则会削弱真正平等。在选举中，人们选出代表，并参与决定政党的继承安排。民意调查中的受访者可能表达公开演讲未揭示的私人疑虑。因此，投票不只是程序，更是和平解决分歧的方式。严肃的候选人需要抱负，但抱负必须与准备相配。政党提名 候选人，公布政策清单，并解释如何保护安全、福利与福祉。 社会和谐不需要所有人意见一致，而需要持续协商的承诺， 使社区得以繁荣，个人得以成功。可信的改革前景，取决于 包含不止一种观点的视角，以及建立在证据之上的立场。"
    },
    {
     "en": "Public language matters. A national [[VW:outlook|/ˈaʊtlʊk/|(对生活的)观点；展望，前景]] often rests on a simple [[VW:guideline|/ˈɡaɪdlaɪn/|指导方针]], such as an [[VW:ethic|/ˈeθɪk/|行为准则…]] of service. Experts may [[VW:suggest|/səˈdʒest/|建议；暗示]] a change, [[VW:advise|/ədˈvaɪz/|劝告；建议；通知]] a committee or submit a [[VW:proposal|/prəˈpəʊz(ə)l/|提议，建议]]. A [[VW:hint|/hɪnt/|/暗示，提示]] of scandal can undermine trust, so officials should [[VW:declare|/dɪˈkleə(r)/|宣布，宣告；宣称，声称]] interests, [[VW:affirm|/əˈfɜːm/|断言，坚持声称；证实]] facts and avoid every unsupported [[VW:claim|/kleɪm/|声称：主张；索赔；声称…]]. A leader may [[VW:proclaim|/prəˈkleɪm/|声明；清楚地表明]] a principle or [[VW:state|/steɪt/|陈述，说明；国家；州；状况]] a goal, [[VW:announce|/əˈnaʊns/|宣布；通知]] a reform or [[VW:clarify|/ˈklærəfaɪ/|澄清，阐明]] how it will be achieved. Independent reviewers should [[VW:assist|/əˈsɪst/|帮助，协助]] the process, provide [[VW:aid|/eɪd/|救援物资；辅助物；救助]] where needed and 06 A healthy democracy can also [[VW:admit|/ədˈmɪt/|供认，承认]] failure. When a policy harms people, an honest government will acknowledge the error, explain what happened and revise the plan before it tries to [[VW:implement|/ˈɪmplɪment/|实施，执行；工具，器具]] it again. Reviewers should then [[VW:monitor|/ˈmɒnɪtə(r)/|监视；监听；监控器；监视器…]] the results. The alternative is a defensive culture in which officials protect their reputation rather than the public. Trust grows when accountability is routine",
     "zh": "公共语言十分重要。一个国家的观念往往建立在简单准则上例如服务伦理。专家可以提出改变、向委员会提供建议或 提交提案。一丝丑闻迹象就可能破坏信任，因此官员应申报利益、确认事实，避免一切没有依据的主张。领导人可以宣 告原则或陈述目标，宣布改革，或说明改革将如何实现。独 立审查者应协助进程，在需要时提供援助并鼓励地方主动行动。健康民主也能承认失败。政策伤害民众时，诚实政府会承认 错误、解释经过，并在再次尝试执行前修改计划。审查者随后应监督结果。相反，防御性文化会让官员保护自身声誉，而非公众利益。当问责成为常规而非例外，信任才会增长。"
    },
    {
     "en": "Modern societies include [[VW:African|/ˈæfrɪkən/|非洲的非洲人]], [[VW:European|/ˌjʊərəˈpiːən/|欧洲的欧洲人]], [[VW:Latin|/ˈlætɪn/|拉丁语的；拉丁人的拉丁语…]] American, [[VW:Jewish|/ˈdʒuːɪʃ/|犹太教的；犹太人的]], [[VW:Arabian|/əˈreɪbiən/|阿拉伯的]], [[VW:Portuguese|/ˌpɔːtʃʊˈɡiːz/|葡萄牙的葡萄牙语；葡萄牙人]], [[VW:Roman|/ˈrəʊmən/|罗马的；古罗马帝国的…]], [[VW:Russian|/ˈrʌʃ(ə)n/|俄罗斯的；俄罗斯人；俄语]], [[VW:Spanish|/ˈspænɪʃ/|西班牙的；西班牙人]], [[VW:Swiss|/swɪs/|瑞士的；瑞士人]], [[VW:Greek|/ɡriːk/|希腊的；希腊人；古希腊人…]], [[VW:Italian|/ɪˈtæliən/|意大利的；意大利人；意大利语]] and [[VW:Indian|/ˈɪndiən/|印度的；印度人]] cultural influences, among many others. [[VW:Australia|/ɒˈstreɪliə/|澳大利亚]], [[VW:Canada|/ˈkænədə/|加拿大]], [[VW:Britain|/ˈbrɪt(ə)n/|不列颠]] and [[VW:France|/frɑːns/|法国]] share historical connections with different parts of the world, and migration continually creates new ones. Diversity is not a decorative list of names; it is a living argument about",
     "zh": "现代社会中包含非洲、欧洲、拉丁美洲、犹太、阿拉伯、葡 萄牙、罗马、俄罗斯、西班牙、瑞士、希腊、意大利和印度 等众多文化影响。澳大利亚、加拿大、英国和法国与世界不同地区保有历史联系，移民又不断创造新的联系。多样性不 是装饰性的名单，而是关于记忆、归属与未来的鲜活争论。"
    },
    {
     "en": "Nationhood becomes humane when it makes room for both continuity and change. A country can honour its past without turning citizenship into an inheritance test. It can defend borders while keeping its doors open to lawful [[VW:refuge|/ˈrefjuːdʒ/|避难，庇护；避难所]]. Its strength lies not in uniformity, but in the ability to let and build a common life.",
     "zh": "当国家身份同时容纳延续与变化时，它才更有人情味。一个国家可以尊重过去，而不把公民身份变成血统测试；可以守卫边境，同时向合法避难者敞开大门。它的力量不在整齐划一，而在让不同的人共享制度、化解冲突并建设共同生活。"
    }
   ],

  {
   "zhTitle": "市场与生产",
   "enTitle": "Market and Production",
   "paragraphs": [
    {
     "en": "An [[VW:economy|/ɪˈkɒnəmi/|经济；节约]] is a system of choices made by households, companies and governments. [[VW:Trade|/treɪd/|贸易；交换]] allows a [[VW:merchant|/ˈmɜːtʃənt/|商人；商业的]] to sell what one region produces and buy what another lacks. [[VW:Industry|/ˈɪndəstrɪ/|工业；产业；勤劳]] turns raw materials and knowledge into a [[VW:product|/ˈprɒdʌkt/|产品；产物]], while a [[VW:firm|/fɜːm/|公司；坚定的；坚固的]], [[VW:enterprise|/ˈentəpraɪz/|企业；事业]] or [[VW:company|/ˈkʌmpəni/|公司；陪伴；剧团]] organises labour, capital and technology. [[VW:Goods|/ɡʊdz/|商品，货物]] may move by road, rail or sea, and [[VW:cargo|/ˈkɑːɡəʊ/|货物]] may cross several borders before it reaches a [[VW:market|/ˈmɑːkɪt/|市场；市场需求]]. No single [[VW:agent|/ˈeɪdʒənt/|代理人，代理商]] controls the whole chain, yet",
     "zh": "经济是家庭、企业与政府共同作出选择的系统。贸易让商人出售一个地区生产的东西，并购买另一个地区缺少的东西。 产业把原材料与知识变成产品，公司、企业或商号则组织劳动力、资本与技术。货物可经公路、铁路或海运移动，一批 货物在抵达市场前可能跨越数道边境。没有任何单一主体控制整条链条，但每个参与者都依赖他人的可靠性。"
    },
    {
     "en": "Money makes [[VW:exchange|/ɪksˈtʃeɪndʒ/|交换；兑换]] easier, but it also creates distance between a transaction and its consequences. A [[VW:financial|/faɪˈnænʃ(ə)l/|财政的；金融的]] institution may [[VW:fund|/fʌnd/|资助；基金；［～］资金]] a new factory, [[VW:donate|/dəʊˈneɪt/|捐赠，捐献]] to a public project or [[VW:endow|/ɪnˈdaʊ/|捐赠；赋予]] a scholarship. A [[VW:commercial|/kəˈmɜːʃ(ə)l/|商业的；商业广告]] message may [[VW:advertise|/ˈædvətaɪz/|做广告]] a useful service, although a [[VW:slogan|/ˈsləʊɡən/|标语，口号]] can also simplify a complex choice. People [[VW:purchase|/ˈpɜːtʃəs/|购买；购买]] what they can [[VW:afford|/əˈfɔːd/|负担得起；提供，给予]], [[VW:lease|/liːs/|租约；出租；租用]] equipment instead of buying it, or shop at a [[VW:retail|/ˈriːteɪl/|零售；零售…]] store and a [[VW:grocery|/ˈɡrəʊsəri/|食品杂货店]]. A [[VW:discount|/ˈdɪskaʊnt/|折扣；打折出售]], [[VW:promotion|/prəˈməʊʃ(ə)n/|促销活动；晋升]], [[VW:voucher|/ˈvaʊtʃə(r)/|代金券]] or [[VW:coupon|/ˈkuːpɒn/|优惠券]] may [[VW:reduce|/rɪˈdjuːs/|减少，减小]] the immediate [[VW:cost|/kɒst/|需付费；费用；代价…]]",
     "zh": "货币让交换更容易，却也让交易与其后果之间产生距离。金融机构可以资助新工厂、向公共项目捐款或设立奖学金。商业信息可以宣传有用服务，尽管口号也可能简化复杂选择。 人们购买自己负担得起的东西，租用设备而不购买，或到零 售店和杂货店购物。折扣、促销、代金券或优惠券可能降低眼前成本，却不改变底层价值。"
    },
    {
     "en": "[[VW:Currency|/ˈkʌrənsi/|货币；通用，流行]] allows value to move across time and place. A traveller may [[VW:exchange|/ɪksˈtʃeɪndʒ/|交换；兑换]] one [[VW:currency|/ˈkʌrənsi/|货币；通用，流行]] for another, [[VW:swap|/swɒp/|交换；交换物]] coins at an airport, keep a [[VW:receipt|/rɪˈsiːt/|收据；收到]] and request an [[VW:invoice|/ˈɪnvɔɪs/|发票；开发票给]] for a business [[VW:expense|/ɪkˈspens/|费用，花费]]. Governments collect [[VW:tax|/tæks/|税；对......征税]] and may [[VW:levy|/ˈlevi/|税款；征收，征(税)]] a [[VW:tariff|/ˈtærɪf/|关税；(公共服务的)收费]] or [[VW:duty|/ˈdjuːtɪ/|职责；义务；关税]] on imports; they [[VW:impose|/ɪmˈpəʊz/|强加；征收(税款)]] rules to protect consumers and raise [[VW:revenue|/ˈrevənjuː/|(公司、组织的)收入…]]. To [[VW:consume|/kənˈsjuːm/|消耗；吃，喝]] is not merely to [[VW:spend|/spend/|花费；开支]]: it is to use resources, and every [[VW:expense|/ɪkˈspens/|费用，花费]] has an opportunity [[VW:cost|/kɒst/|需付费；费用；代价…]]. [[VW:Gross|/ɡrəʊs/|总的，毛的]] figures can reveal the size of an [[VW:economy|/ɪˈkɒnəmi/|经济；节约]], but they",
     "zh": "货币使价值能够跨时间和地点流动。旅行者可能把一种货币 兑换成另一种，在机场交换硬币，保留收据，并为商务开销索取发票。政府征税，并可能对进口商品征收关税或税费； 它们实施规则以保护消费者并增加收入。消费不只是花钱，而是使用资源，每项支出都有机会成本。总量数字可以揭示 经济规模，却无法说明收益是否被共同分享。"
    },
    {
     "en": "Economic life moves in cycles. A [[VW:recession|/rɪˈseʃ(ə)n/|经济衰退]] may follow a [[VW:financial|/faɪˈnænʃ(ə)l/|财政的；金融的]] [[VW:crisis|/ˈkraɪsɪs/|危机]], and a prolonged [[VW:depression|/dɪˈpreʃn/|沮丧，消沉；萧条期，不景气]] can destroy confidence. [[VW:Security|/sɪˈkjʊərəti/|安全工作；安全…]] markets may rise or fall, a bond  may lose value, and [[VW:debt|/det/|债务]] can grow faster than income. A [[VW:deficit|/ˈdefɪsɪt/|赤字，逆差]] may force difficult choices, while [[VW:inflation|/ɪnˈfleɪʃ(ə)n/|通货膨胀]] erodes purchasing power and [[VW:deflation|/ˌdiːˈfleɪʃn/|通货紧缩]] can delay spending. When demand and credit [[VW:dwindle|/ˈdwɪnd(ə)l/|缩小，减少]], output may [[VW:decrease|/dɪˈkriːs/|减少，减小 (使)减少，(使)减小…]], firms may [[VW:downsize|/ˈdaʊnsaɪz/|使精简；裁员]] and employment may [[VW:decline|/dɪˈklaɪn/|下降；下降]]. Wages can [[VW:diminish|/dɪˈmɪnɪʃ/|(使) 减少；贬低]], profits may [[VW:reduce|/rɪˈdjuːs/|减少，减小]], and recovery may",
     "zh": "经济生活呈周期波动。金融危机后可能出现衰退，长期萧条会摧毁信心。证券市场可能上涨或下跌，债券可能贬值，债 务增长速度可能超过收入。赤字可能迫使人们作出艰难选择通货膨胀侵蚀购买力，通货紧缩则可能推迟消费。需求与 信贷萎缩时，产出会减少，企业可能裁员，就业可能下滑。工资可能降低，利润可能缩水，复苏需要公共投资与私人节 制共同作用。"
    },
    {
     "en": "Recovery is not automatic. An [[VW:increase|/ɪnˈkriːs/|增加，增长 (使)增加，(使)增长…]] in demand can produce a modest [[VW:increment|/ˈɪŋkrəmənt/|增加量；定期的加薪]] of [[VW:growth|/ɡrəʊθ/|增长；生长]], but [[VW:growth|/ɡrəʊθ/|增长；生长]] alone does not always [[VW:enrich|/ɪnˈrɪtʃ/|使富有；充实]] everyone. A country may [[VW:export|/ɪkˈspɔːt; ˈekspɔːt/|出口；出口；出口商品]] what it makes and [[VW:import|/ˈɪmpɔːt/|进口；进口；进口商品]] what it needs, [[VW:expand|/ɪkˈspænd/|扩充，扩大；扩展]] its [[VW:market|/ˈmɑːkɪt/|市场；市场需求]] and attract capital, yet a sudden [[VW:influx|/ˈɪnflʌks/|流入，涌进]] can [[VW:escalate|/ˈeskəleɪt/|(使)逐步升级，(使)不断恶化…]] prices or create dependence. An [[VW:affluent|/ˈæfluənt/|富裕的，富足的]] society may still contain insecurity, while a [[VW:sufficient|/səˈfɪʃ(ə)nt/|足够的]] income and an [[VW:adequate|/ˈædɪkwət/|足够的；合格的]] [[VW:saving|/ˈseɪvɪŋ/|节约，节省]] give people room to plan. A [[VW:spare|/speə(r)/|多余的，空闲的；剩余]] reserve can absorb a shock; a [[VW:lack|/læk/|缺乏，不足；缺少，没有]] of it turns a routine repair into a [[VW:crisis|/ˈkraɪsɪs/|危机]]. [[VW:Redundant|/rɪˈdʌndənt/|多余的；被裁减的]] capacity may look wasteful, yet some slack protects a system from",
     "zh": "复苏并非自动发生。需求增加可能带来小幅增长，但增长本 身不总会让所有人富裕。一个国家可以出口自己制造的东西进口自己需要的东西，扩大市场并吸引资本，但资本突然 涌入也会推高价格或造成依赖。富裕社会仍可能充满不安全 感，而充足收入与一笔适当储蓄让人有余地规划。备用储备 能吸收冲击；缺乏储备则会把日常维修变成危机。冗余产能看似浪费，但一些余地能防止系统崩溃。"
    },
    {
     "en": "Production depends on every [[VW:input|/ˈɪnpʊt/|输入信息；投入物]] that is often invisible in the final [[VW:product|/ˈprɒdʌkt/|产品；产物]]. An investor may put capital into research, a supplier may [[VW:invest|/ɪnˈvest/|投资；投入]] in cleaner equipment, and an employee may contribute skill and attention. An [[VW:acquisition|/ˌækwɪˈzɪʃ(ə)n/|获得；(对公司的)并购]] can create a larger [[VW:entity|/ˈentəti/|实体，独立存在物]], but it can also weaken competition. A [[VW:reliable|/rɪˈlaɪəb(ə)l/|可靠的，可信赖的]] [[VW:guarantee|/ˌɡærənˈtiː/|担保；确保；保证；保修单…]], a policy to [[VW:insure|/ɪnˈʃʊə(r)/|确保；给......上保险]] essential equipment and honest [[VW:negotiation|/nɪˌɡəʊʃiˈeɪʃn/|谈判，协商]] [[VW:reduce|/rɪˈdjuːs/|减少，减小]] risk. If key partners are [[VW:absent|/ˈæbsənt/|不在场的，缺席的；心不在焉的]] and cannot [[VW:attend|/əˈtend/|参加，出席]] a discussion, a contract may  is therefore a tool, not a moral verdict. It can coordinate millions of decisions and reward useful work, but it can also ignore damage that no one is charged for. Sound policy helps those who cannot simply choose another seller. The aim is not to eliminate [[VW:trade|/treɪd/|贸易；交换]] or profit; it is to make [[VW:exchange|/ɪksˈtʃeɪndʒ/|交换；兑换]] serve human need without making future generations pay for",
     "zh": "生产依赖每一种在最终产品中常常不可见的投入。投资者可 能把资本投入研究，供应商可能投资更清洁的设备，雇员则贡献技能与专注。收购能形成更大实体，也可能削弱竞争。可靠的保证、为关键设备投保的保单与诚实谈判能降低风险。 如果关键伙伴缺席、无法参加讨论，合同可能只服务于最有 力量的声音。因此，市场是一种工具，而非道德裁决。它可以协调数百万项决定并奖励有益劳动，也可能忽视无人承担代价的损害。健全政策保护竞争、设定最低标准，并帮助无法轻易更换卖家的人。目标不是消灭贸易或利润，而是让交换服务人类需要，同时不让后代为当下便利买单。"
    }

  {
   "zhTitle": "财富与生活",
   "enTitle": "Wealth and Life",
   "paragraphs": [
    {
     "en": "[[VW:Wealth|/welθ/|财富，丰富]] begins with a [[VW:sale|/seɪl/|卖，销售；销售额]], but it does not end there. A producer may offer goods at [[VW:wholesale|/ˈhəʊlseɪl/|批发]] prices, hold an [[VW:auction|/ˈɔːkʃ(ə)n/|拍卖；拍卖]], invite a [[VW:bid|/bɪd/|出价；投标；出价；投标]] and complete a [[VW:deal|/diːl/|买卖…]] after careful negotiation. A transaction  records the exchange; [[VW:turnover|/ˈtɜːnəʊvə(r)/|(人员)流动率；营业额]] measures activity; market [[VW:share|/ʃeə(r)/|股份，股票…]] shows influence. A company may [[VW:dump|/dʌmp/|丢弃，倾倒；倾销]] surplus [[VW:stock|/stɒk/|股本:股票:库存]] abroad, accept a [[VW:quota|/ˈkwəʊtə/|限额，配额；定额]] or issue a [[VW:share|/ʃeə(r)/|股份，股票…]] to",
     "zh": "财富始于一次销售，却不以销售告终。生产者可以按批发价 供货，举办拍卖，邀请竞标，并在谨慎谈判后完成交易。交易记录交换；营业额衡量活跃程度；市场份额显示影响力。 公司可能向海外倾销剩余库存，接受配额，或发行股票以筹 集资本。每种安排都有收益与代价，没有任何账目能记录全 部后果。"
    },
    {
     "en": "Personal finance is a discipline of time. A bank [[VW:account|/əˈkaʊnt/|账户；解释]] may hold a [[VW:deposit|/dɪˈpɒzɪt/|存款；押金]], an [[VW:instalment|/ɪnˈstɔːlmənt/|(分期付款的)一期付款]] plan spreads [[VW:payment|/ˈpeɪmənt/|支付；支付的款顶；付款额]], and a [[VW:cheque|/tʃek/|支票]], [[VW:cash|/kæʃ/|现金；兑现(支票)]] or [[VW:coin|/kɔɪn/|硬币；铸币；创造(新词语)]] serves a different purpose. [[VW:Interest|/ˈɪntrəst/|兴趣；利益；利息使感兴趣]] may reward a saver or increase the cost of borrowing. The old [[VW:shilling|/ˈʃɪlɪŋ/|先令]] and [[VW:copper|/ˈkɒpə(r)/|铜；铜币:警察]] [[VW:coin|/kɔɪn/|硬币；铸币；创造(新词语)]] belong to monetary history, while [[VW:treasure|/ˈtreʒə(r)/|金银财宝；宝物，珍品]], [[VW:wealth|/welθ/|财富，丰富]] and a family [[VW:estate|/ɪˈsteɪt/|地产；遗产]] may carry emotional as well as financial value. To [[VW:possess|/pəˈzes/|占用，拥有；影晌，控制]] something is not the same as to understand it. A [[VW:legacy|/ˈleɡəsi/|遗赠，遗产]] can [[VW:descend|/dɪˈsend/|下降，下来]] through",
     "zh": "个人财务是一段时间管理。银行账户可以存入款项，分期付 款计划分散支付，支票、现金或硬币各有用途。利息可以奖励储蓄者，也会提高借贷成本。旧时的先令与铜币属于货币 史，而珍宝、财富与家族产业可能同时承载情感和财务价值。拥有某物并不等于理解它。遗产可以传至后代，继承也可能 制造冲突。"
    },
    {
     "en": "Consumer protection depends on remedies. A [[VW:refund|/ˈriːfʌnd/|退款；退(款)]] returns money after a failed purchase, while institutions [[VW:coordinate|/kəʊˈɔːdɪneɪt/|调和，协调；坐标]] their work and [[VW:collaborate|/kəˈlæbəreɪt/|合作]] on fair rules. A [[VW:worthy|/ˈwɜːði/|有价值的；值得......的]] product need not be expensive, and a [[VW:cheap|/tʃiːp/|廉价的；质劣价低的]] one may still be [[VW:valuable|/ˈvæljuəb(ə)l/|很值钱的，贵重的；很重要的]] if it lasts. An [[VW:incentive|/ɪnˈsentɪv/|刺激，激励]] can [[VW:accelerate|/əkˈseləreɪt/|(使)加速]] a desired [[VW:change|/tʃeɪndʒ/|改变]] or [[VW:prompt|/prɒmpt/|促使迅速的]] a useful decision. [[VW:Salary|/ˈsæləri/|工资，(尤指按月领的)薪水]], [[VW:income|/ˈɪnkʌm/|收入]], [[VW:wage|/weɪdʒ/|(通常指按周领的)工钱]] and [[VW:payment|/ˈpeɪmənt/|支付；支付的款顶；付款额]] describe different forms of reward; a company may [[VW:reimburse|/ˌriːɪmˈbɜːs/|赔偿，补偿]] an expense, [[VW:payroll|/ˈpeɪrəʊl/|工资名单]] distributes regular pay and [[VW:remuneration|/rɪˌmjuːnəˈreɪʃ(ə)n/|报酬]] recognises the full value of",
     "zh": "消费者保护依赖补救机制。退款在购买失败后返还金钱，机构也通过协调工作、合作制定公平规则。值得购买的产品不一定昂贵，便宜商品若经久耐用也可能很有价值。激励可以 加速期望中的改变，或促使人们作出有用决定。薪水、收入、工资和付款描述不同报酬形式；公司可以报销支出，工资单 发放固定薪酬，报酬则承认工作的完整价值。"
    },
    {
     "en": "Employment is more than a source of money. A [[VW:subsidy|/ˈsʌbsədi/|津贴，补贴]] may support training, yet a [[VW:career|/kəˈrɪə(r)/|职业，事业；职业生涯]], [[VW:profession|/prəˈfeʃn/|职业]], [[VW:occupation|/ˌɒkjuˈpeɪʃ(ə)n/|占领，占据；职业]], [[VW:job|/dʒɒb/|职业，工作…]] and [[VW:vocation|/vəʊˈkeɪʃ(ə)n/|(认为特别适合自己的)职业…]] answer different human needs. [[VW:Labour|/ˈleɪbə(r)/|劳动，体力劳动]] and the [[VW:workforce|/ˈwɜːkfɔːs/|劳动力；全体员工]] create goods and services, while workers [[VW:earn|/ɜːn/|赚得；赢得；获得]] a living. A [[VW:workaholic|/ˌwɜːkəˈhɒlɪk/|工作狂]] may confuse effort with identity, and a [[VW:clerk|/klɑːk/|店员；办事员；接待员]] may perform essential work far from public view. Human resources or [[VW:personnel|/ˌpɜːsəˈnel/|人员，职员；人事部门]] officers advertise a post, read a [[VW:resume|/rɪˈzjuːm/|重新开始，(中断后)继续]], [[VW:interview|/ˈɪntəvjuː/|面试…]] applicants and [[VW:recommend|/ˌrekəˈmend/|推荐，介绍：劝告，建议]] the best match. An employer may [[VW:employ|/ɪmˈplɔɪ/|雇用；采用]] or [[VW:hire|/ˈhaɪə(r)/|雇用：租用自．租赁(业)]] a worker, but must not [[VW:fire|/ˈfaɪə(r)/|解雇；火]], lay off, [[VW:dismiss|/dɪsˈmɪs/|解雇；解散；(法官)驳回]], [[VW:discharge|/dɪsˈtʃɑːdʒ/|解雇 (船的)卸货]], [[VW:sack|/sæk/|大口袋，麻布袋开除]] or force someone to [[VW:resign|/rɪˈzaɪn/|辞去，辞职]] without fair cause. A fair [[VW:lay-off|/ˈleɪ ɒf/|(因岗位不足的)解雇，裁员…]] process protects",
     "zh": "就业不只是一项收入来源。补贴可以支持培训，但事业、专业、职业、工作与天职满足不同的人类需要。劳动力与劳动 队伍创造商品和服务，劳动者以此谋生。工作狂却可能把努 力与身份混为一谈，一名职员也可能在公众视线之外完成关 键工作。人力资源或人事人员发布职位、阅读简历、面试申 请者并推荐最合适的人。雇主可以雇用或聘用员工，却不能在没有正当理由时解雇、裁员、开除、辞退、炒鱿鱼或迫使员工辞职。公平的裁员流程保护劳动者，人则在时机到来时 应能有尊严地退休。"
    },
    {
     "en": "Every working life includes [[VW:result|/rɪˈzʌlt/|后果，结果；导致]] and [[VW:failure|/ˈfeɪljə(r)/|失败；失败的人；失败的事]], and every serious [[VW:undertaking|/ˌʌndəˈteɪkɪŋ/|任务，事业；许诺，保证]] carries risk. A failed project is not an [[VW:abortion|/əˈbɔːʃ(ə)n/|人工流产；(计划等)中途失败]] of effort if it produces knowledge. A financial [[VW:loss|/lɒs/|遗失；损失；亏损]] can close one [[VW:opportunity|/ˌɒpəˈtjuːnəti/|机会，时机]], while a new [[VW:chance|/tʃɑːns/|机会；可能性]] may open another. People [[VW:choose|/tʃuːz/|选择]] among alternatives and must sometimes [[VW:change|/tʃeɪndʒ/|改变]] direction. Difficult problems require evidence, patience and cooperation to [[VW:solve|/sɒlv/|解答；解决]]. [[VW:Sustainable|/səˈsteɪnəb(ə)l/|可持续的]] firms [[VW:develop|/dɪˈveləp/|发展；开发]] products carefully, [[VW:improve|/ɪmˈpruːv/|改善，改造]] working conditions and [[VW:manage|/ˈmænɪdʒ/|管理；设法做到]] risk. Governments may [[VW:regulate|/ˈreɡjuleɪt/|管理；调整]] conduct, while international bodies may [[VW:sanction|/ˈsæŋkʃn/|批准；制裁；批准…]] serious abuses. Lasting success requires competitors and colleagues",
     "zh": "每段职业生涯都包含成果与失败，每项严肃事业也伴随风险。项目失败若能产生知识，就不是努力的流产。经济损失会关 闭一个机会，新机会也可能随之打开。人们在选项中作出选择，有时必须改变方向。难题需要证据、耐心与合作才能解决。可持续企业谨慎开发产品、改善工作条件并管理风险。 政府可以规范行为，国际机构则可制裁严重侵权。持久成功要求竞争者与同事合作，而不只是竞争。"
    },
    {
     "en": "[[VW:Wealth|/welθ/|财富，丰富]], in the widest sense, includes health, time, trust and knowledge. Money matters because it gives people choices, but a society that measures only accumulation will miss what makes life durable. The most [[VW:valuable|/ˈvæljuəb(ə)l/|很值钱的，贵重的；很重要的]] economy is one in which work is dignified, exchange is honest and prosperity does not depend on",
     "zh": "最广泛意义上的财富包括健康、时间、信任与知识。金钱重 要，因为它给人选择，但只衡量积累的社会会错过让生活持 久的东西。最有价值的经济，是工作有尊严、交换诚实，且 繁荣不依赖耗尽人或自然世界的经济。"
    }
   ],

  {
   "zhTitle": "法律程序",
   "enTitle": "Legal Process",
   "paragraphs": [
    {
     "en": "01 A [[VW:law|/lɔː/|法律；规律；定理]] is more than a command backed by force. It expresses a [[VW:rule|/ruːl/|规则；统治]] that a community accepts as binding, and it gains legitimacy when its purpose is clear and its application is consistent. A [[VW:regulation|/ˌreɡjuˈleɪʃ(ə)n/|规则，规定；管理]] may translate a broad [[VW:legal|/ˈliːɡ(ə)l/|法律的；合法的]] principle into practical detail, while a professional [[VW:norm|/nɔːm/|标准；［～s］行为准则，规范]] sets expectations that no statute can fully describe. A benchmark  helps compare performance, and [[VW:criteria|/kraɪˈtɪəriə/|\\[criterion 的复数形式］标准，准则…]] define what evidence must meet a required standard . Good rules [[VW:allow|/əˈlaʊ/|允许，准许]] [[VW:reasonable|/ˈriːznəbl/|合理的；理智的]] freedom; they do not turn every mistake into a",
     "zh": "法律不只是以武力为后盾的命令。它表达的是一条被共同体视为有约束力的规则；当目的清楚、适用一致时，法律才获 得正当性。规章可能把宽泛法律原则转化成实际细节，专业规范则设定成文法无法完全描述的期待。基准帮助比较表现标准则界定证据必须达到何种要求。良好规则允许合理自 由，不会把每次错误都变成犯罪。"
    },
    {
     "en": "International order depends on many instruments. A [[VW:treaty|/ˈtriːti/|条约；协议]] is a formal [[VW:agreement|/əˈɡriːmənt/|协定；同意]] between states, a [[VW:charter|/ˈtʃɑːtə(r)/|宪章…]] establishes an institution's purposes, and a [[VW:protocol|/ˈprəʊtəkɒl/|议定书，协议；礼仪]] adds detail to an existing commitment. A [[VW:protocol|/ˈprəʊtəkɒl/|议定书，协议；礼仪]] may control [[VW:admission|/ədˈmɪʃ(ə)n/|承认；入场费；准许进入]] to a programme, establish a [[VW:default|/dɪˈfɔːlt/|不支付，不履行；违约；默认值]] procedure or state when officials may [[VW:reject|/rɪˈdʒekt/|拒绝接受；摒弃]] an application. A [[VW:mandatory|/ˈmændətəri/|法定的，强制的]] [[VW:rule|/ruːl/|规则；统治]] imposes a clear [[VW:obligation|/ˌɒblɪˈɡeɪʃ(ə)n/|义务，责任]], yet no [[VW:agreement|/əˈɡriːmənt/|协定；同意]] removes every [[VW:constraint|/kənˈstreɪnt/|约束，限制；克制]], and no signature alone changes behaviour. An [[VW:official|/əˈfɪʃ(ə)l/|正式的，官方的]] text becomes meaningful when governments [[VW:enforce|/ɪnˈfɔːs/|强制执行，强行实施；迫使]] it, respect the obligations it creates and remain [[VW:bound|/baʊnd/|\\[be ~ to］一定会，很可能会，有义务…]] by the same rules",
     "zh": "国际秩序依赖许多文书。条约是国家间的正式协议，宪章确 立一个机构的目的，议定书则为既有承诺增加细节。议定书可能控制项目准入、设定默认程序，或规定官员何时可以拒 绝申请。强制性规则施加明确义务，但没有任何协议能消除全部约束，只有签名也不足以改变行为。正式文本只有在政 府执行、履行其创设的义务，并遵守自己要求他人遵守的同一规则时，才有意义。"
    },
    {
     "en": "[[VW:Law|/lɔː/|法律；规律；定理]] also has an architecture. A [[VW:court|/kɔːt/|法院；庭院]] hears disputes, and a  [[VW:court|/kɔːt/|法院；庭院]] may settle questions that lower courts cannot resolve. Legislators [[VW:enact|/ɪˈnækt/|通过(法律)；表演]] new statutes and [[VW:legislate|/ˈledʒɪsleɪt/|立法，制定(或通过)法律]] for changing conditions. The aim is not merely order but [[VW:equity|/ˈekwəti/|公平]]: a [[VW:fair|/feə(r)/|公平的，公正的]] process that treats similar cases alike and gives each person a chance to be heard. A [[VW:just|/dʒʌst/|公正的；正义的；刚刚；仅仅]] system also admits when old rules produce injustice. [[VW:Prejudice|/ˈpredʒədɪs/|偏见，成见]] and [[VW:discrimination|/dɪˌskrɪmɪˈneɪʃn/|歧视]] undermine that promise. Justice is not automatic because a [[VW:rule|/ruːl/|规则；统治]] exists; it",
     "zh": "法律也有自身结构。法院审理争议，最高法院可以解决下级 法院无法处理的问题。立法者颁布新法，并针对变化的条件 立法。目标不只是秩序，还包括衡平：公正程序平等对待相似案件，并给每个人陈情机会。公正制度也会承认旧规则造 成不公。偏见与歧视会破坏这一承诺。正义不会因规则存在而自动实现，它依赖愿意不偏不倚适用规则的制度。"
    },
    {
     "en": "When harm occurs, people may [[VW:accuse|/əˈkjuːz/|控告，指责]] another party, [[VW:sue|/suː/|控告，提起诉讼；提出请求]] for compensation or ask a prosecutor to [[VW:prosecute|/ˈprɒsɪkjuːt/|检举，起诉]]. A public statement may [[VW:condemn|/kənˈdem/|谴责，指责]] serious abuse, but condemnation cannot replace evidence. Citizens may [[VW:complain|/kəmˈpleɪn/|抱怨；投诉]] through an ombudsman, bring a case to [[VW:court|/kɔːt/|法院；庭院]] or organise a [[VW:boycott|/ˈbɔɪkɒt/|抵制，拒绝购买；抵制行动]] against an abusive practice. A [[VW:session|/ˈseʃ(ə)n/|会议；会期]] may be open or closed, and a neutral mediator may [[VW:mediate|/ˈmiːdieɪt/|斡旋，调解]] between opponents and help them reach [[VW:agreement|/əˈɡriːmənt/|协定；同意]]. A [[VW:plea|/pliː/|辩解理由，借口；请求]] can",
     "zh": "损害发生后，人们可以指控另一方、提起诉讼索取赔偿，或 请检察官提起公诉。公开声明可以谴责严重滥权，但谴责不 能取代证据。公民可以通过监察专员投诉、把案件提交法院或组织抵制滥权做法。庭审可以公开或闭门进行，中立调 解人可以调解对立双方，帮助他们达成一致。抗辩可以承认责任，上诉则请求上级法院审查裁决。"
    },
    {
     "en": "[[VW:Legal|/ˈliːɡ(ə)l/|法律的；合法的]] argument is not a contest of volume. One side may [[VW:contradict|/ˌkɒntrəˈdɪkt/|反驳；与......矛盾]] another, and each must [[VW:persuade|/pəˈsweɪd/|说服；使相信]] the decision-maker with reasons rather than threats. [[VW:Controversy|/ˈkɒntrəvɜːsi/|争议；辩论]] is unavoidable when values conflict, but a civil system protects the right to disagree. A [[VW:whisper|/ˈwɪspə(r)/|低声说；私下谈论]], [[VW:mutter|/ˈmʌtə(r)/|轻声低语；小声抱怨]] or [[VW:murmur|/ˈmɜːmə(r)/|低声说；咕哝，低语]] may spread a rumour without evidence; silence can protect the powerful, and a [[VW:silent|/ˈsaɪlənt/|沉默的；寂静无声的]] or [[VW:mute|/mjuːt/|缄默的；哑的；无声的；哑巴]] [[VW:witness|/ˈwɪtnəs/|目击者，见证人；目击]] may still communicate through writing or an interpreter. Courts must [[VW:investigate|/ɪnˈvestɪɡeɪt/|调查]] facts, hear every [[VW:witness|/ˈwɪtnəs/|目击者，见证人；目击]] and separate",
     "zh": "法律论证不是比谁声音大。一方可能反驳另一方，双方都必 须以理由而非威胁说服裁决者。价值观冲突时，争议不可避 免，但文明制度保护异议权。低语、嘟囔或低声抱怨可能在无证据时传播谣言；沉默可能保护强者，而沉默或无法说话 的证人仍可通过文字或翻译交流。法院必须调查事实、听取 每位证人，并把怀疑与证明区分开。"
    },
    {
     "en": "Every judgment needs justification. A party must [[VW:justify|/ˈdʒʌstɪfaɪ/|为......辩护，证明……正当…]] its claim with evidence, not merely assert it. A decision is [[VW:reasonable|/ˈriːznəbl/|合理的；理智的]] when it follows relevant [[VW:law|/lɔː/|法律；规律；定理]]; it is [[VW:suitable|/ˈsuːtəb(ə)l/|合适的，适宜的]] when the remedy fits the harm. A statement can be [[VW:false|/fɔːls/|不正确的；虚假的；伪造的]] without the speaker being malicious, and a [[VW:judge|/dʒʌdʒ/|法官；裁判员]] must distinguish an honest error from deliberate deception. The most [[VW:potent|/ˈpəʊt(ə)nt/|很有效的，强有力的]] [[VW:legal|/ˈliːɡ(ə)l/|法律的；合法的]] systems are not those that punish most severely, but those that make power accountable, protect the vulnerable and",
     "zh": "每项裁判都需要理由。一方必须用证据证明主张，而不能只作断言。决定遵循相关法律时才是合理的；救济与损害相称 时才是适当的。一个说法可能是错误的，说话者却未必怀有恶意，法官必须区分诚实错误与刻意欺骗。最有力量的法律 制度，不是惩罚最严厉的制度，而是让权力接受问责、保护弱者并纠正自身错误的制度。"
    }

  {
   "zhTitle": "权利与秩序",
   "enTitle": "Rights and Order",
   "paragraphs": [
    {
     "en": "Criminal [[VW:procedure|/prəˈsiːdʒə(r)/|手续；程序]] protects both the public and the accused. A [[VW:jury|/ˈdʒʊəri/|陪审团；(比赛的)评判委员会]] may decide facts in a [[VW:trial|/ˈtraɪəl/|试验；审判]], while a judge interprets law and ensures that the process is fair. A [[VW:suspect|/səˈspekt/|嫌疑犯；怀疑]] is presumed innocent until evidence supports a conviction. Police may make an [[VW:arrest|/əˈrest/|逮捕；吸引(注意)逮捕]] only on lawful grounds; a court may impose a [[VW:sentence|/ˈsentəns/|判决；宣判]], and imprisonment in [[VW:jail|/dʒeɪl/|监狱；监禁]] or [[VW:prison|/ˈprɪz(ə)n/|监狱；监禁]] may [[VW:confine|/kənˈfaɪn/|边界，范围；限制；监禁]] a person's liberty. The power to [[VW:oversee|/ˌəʊvəˈsiː/|监督，监管]], [[VW:supervise|/ˈsuːpəvaɪz/|监督，管理，指导]], [[VW:restrict|/rɪˈstrɪkt/|限制，限定；约束]] and [[VW:restrain|/rɪˈstreɪn/|抑制；制止]] must",
     "zh": "刑事诉讼程序同时保护公众与被告。陪审团可在审判中认定 事实，法官则解释法律并确保程序公正。在证据支持定罪前嫌疑人被推定无罪。警方只能依据合法理由实施逮捕；法 院可以判处刑罚，监狱或监所则可能限制人身自由。监督、管理、限制与约束的权力，本身也必须受清晰规则约束。"
    },
    {
     "en": "Society draws distinctions between wrongdoing and harm. To [[VW:commit|/kəˈmɪt/|犯(罪)，做(坏事)]] a [[VW:sin|/sɪn/|罪孽；犯戒律]] is not always to [[VW:commit|/kəˈmɪt/|犯(罪)，做(坏事)]] a [[VW:crime|/kraɪm/|罪行；犯罪活动]], and a personal [[VW:vice|/vaɪs/|恶行；缺点]] may be damaging without being unlawful. A [[VW:bribe|/braɪb/|贿赂；向......行贿]] corrupts public trust; to [[VW:rob|/rɒb/|抢劫；夺走]], [[VW:pirate|/ˈpaɪrət/|海盗；盗版者；盗印，窃用]], [[VW:steal|/stiːl/|偷，窃取；剽窃]] or [[VW:murder|/ˈmɜːdə(r)/|谋杀；谋杀]] violates both person and community. [[VW:Suicide|/ˈsuːɪsaɪd/|自杀]] raises questions of suffering and care rather than simple blame. The law must respond to each case without",
     "zh": "社会会区分错误行为与伤害。犯下罪过并不总等于犯罪，个人恶习可能有害却未必违法。贿赂腐蚀公共信任；抢劫、海 盗行为、偷窃或谋杀同时侵害个人与共同体。自杀引出的问题是痛苦与照护，而非简单归责。法律必须回应每起案件， 却不能假装每场悲剧都只有一个恶人。"
    },
    {
     "en": "[[VW:Fraud|/frɔːd/|骗子；赝品；欺诈]] is often quieter than violence. A person may [[VW:deceive|/dɪˈsiːv/|欺骗；蒙蔽，误导]] a customer, [[VW:cheat|/tʃiːt/|欺骗；作弊；作弊者]] an investor or act as a [[VW:liar|/ˈlaɪə(r)/|说谎的人]] in a formal document. A criminal may [[VW:trap|/træp/|陷阱；诡计，诱骗]] a victim, use a [[VW:trick|/trɪk/|诡计；哄骗]] to gain trust, [[VW:pretend|/prɪˈtend/|假装；假扮]] to offer help or [[VW:fool|/fuːl/|蠢人，傻子；欺骗]] someone who lacks information. A [[VW:thief|/θiːf/|窃贼，偷窃犯]] may act alone, through a group or behind a respectable company. [[VW:Stigma|/ˈstɪɡmə/|耻辱，污名]] can isolate people even after punishment, and a person must be able to [[VW:confess|/kənˈfes/|供认；忏悔]] without torture or coercion. The law must uncover [[VW:fraud|/frɔːd/|骗子；赝品；欺诈]]",
     "zh": "欺诈往往比暴力更安静。一个人可能欺骗顾客、诈骗投资者或在正式文件中充当说谎者。犯罪分子可能设下圈套、用 诡计获得信任、假装提供帮助，或愚弄缺乏信息的人。窃贼可能独自行动，也可能通过团伙或体面的公司掩护。污名可 能在惩罚结束后继续孤立某人，而一个人应当能够在没有酷刑或胁迫的情况下认罪。法律必须揭露欺诈，同时保护无辜 者不受怀疑。"
    },
    {
     "en": "Justice also involves rebuilding a social relationship. A person may [[VW:conform|/kənˈfɔːm/|遵守；顺从；相符合]] to a rule out of fear or [[VW:obey|/əˈbeɪ/|服从，顺从]] it from conviction. A community may help an offender [[VW:reconcile|/ˈrekənsaɪl/|使和解；调和]] with those harmed, but it should not [[VW:require|/rɪˈkwaɪə(r)/|需要；命令，规定]] a victim to forgive before safety is restored. To [[VW:succumb|/səˈkʌm/|屈服，屈从]] to pressure is not the same as to choose wrongdoing. A [[VW:penalty|/ˈpenəlti/|惩罚，处罚]], [[VW:fine|/faɪn/|罚款；美好的]] or other [[VW:consequence|/ˈkɒnsɪkwəns/|后果]] should be proportionate, and a [[VW:prison|/ˈprɪz(ə)n/|监狱；监禁]] should prepare a person for return",
     "zh": "正义也涉及重建社会关系。一个人可能因恐惧而遵从规则， 或因信念而服从它。社区可以帮助犯罪者与受伤害者和解，但不应在安全恢复前要求受害者原谅。屈从压力不等于选择 作恶。刑罚、罚款或其他后果应成比例，监狱也应帮助一个人重返社会，而不只是把人藏起来。"
    },
    {
     "en": "Property and ideas need protection as well. A [[VW:mortgage|/ˈmɔːɡɪdʒ/|抵押(房屋、土地)借款…]] may secure a loan, while [[VW:ownership|/ˈəʊnəʃɪp/|所有权，物主身份]] of land, [[VW:copyright|/ˈkɒpiraɪt/|版权]] in a work and professional [[VW:privilege|/ˈprɪvəlɪdʒ/|特权]] each create different rights. An institution may [[VW:accredit|/əˈkredɪt/|把……归于；委任]] a course, a court may examine a [[VW:clue|/kluː/|线索；提示]], and a citizen may seek [[VW:access|/ˈækses/|通路，入径：查阅(或使用、接近)的机会(或权利)…]] to a public record. An [[VW:anonymous|/əˈnɒnɪməs/|匿名的]] source can reveal misconduct, but anonymity does not make a story [[VW:genuine|/ˈdʒenjuɪn/|真诚的；真正的]]. Investigators must verify",
     "zh": "财产与思想同样需要保护。按揭可以担保贷款，而土地所有 权、作品版权与职业特权各自创设不同权利。机构可以认证课程，法院可以审查线索，公民则可以申请查阅公共记录。匿名来源可能揭露不当行为，但匿名并不会使故事自动真实。 调查者必须核实证据，又不能把每项隐私主张都变成障碍。"
    },
    {
     "en": "Law works through [[VW:procedure|/prəˈsiːdʒə(r)/|手续；程序]] and [[VW:routine|/ruːˈtiːn/|例行公事；需规；惯例的]]. A [[VW:demand|/dɪˈmɑːnd/|要求；需要；要求；需求…]], [[VW:request|/rɪˈkwest/|要求，请求；要求，请求]] or [[VW:petition|/pəˈtɪʃn/|请求；请愿书；上诉]] may begin a process, while a court may [[VW:require|/rɪˈkwaɪə(r)/|需要；命令，规定]] evidence, [[VW:command|/kəˈmɑːnd/|命令；指挥，统率；命令…]] disclosure or [[VW:instruct|/ɪnˈstrʌkt/|指导，讲授；通知；命令]] an official to act. [[VW:Procedure|/prəˈsiːdʒə(r)/|手续；程序]] may seem slow, yet it prevents  of a decision should be explainable, and a fair remedy should repair what can be repaired.",
     "zh": "法律通过程序与常规运转。要求、请求或请愿可以启动一个进程，法院则可能要求提供证据、命令披露信息或指示官员行动。程序看似缓慢，却能防止任意权力。决定后果应当可以解释，公正救济则应修复尚可修复之处。"
    }
   ],

  {
   "zhTitle": "冲突的阴影",
   "enTitle": "The Shadow of Conflict",
   "paragraphs": [
    {
     "en": "[[VW:Conflict|/ˈkɒnflɪkt/|斗争，冲突]] can begin before the first [[VW:battle|/ˈbæt(ə)l/|战斗战役；与战斗]]. A dispute over land, resources or identity may harden into [[VW:violence|/ˈvaɪələns/|暴力]], and a [[VW:campaign|/kæmˈpeɪn/|战役；运动；参加运动]] may turn a local [[VW:struggle|/ˈstrʌɡ(ə)l/|挣扎；奋力；挣扎；奋力]] into a wider war. A [[VW:raid|/reɪd/|突袭；突然搜查；突袭…]] can [[VW:seize|/siːz/|抓住；夺取]] a town or destroy supplies, while an [[VW:explosion|/ɪkˈspləʊʒ(ə)n/|爆发；迸发；爆炸；激增]], [[VW:bombard|/bɒmˈbɑːd/|轰击，轰炸…]], [[VW:bomb|/bɒm/|炸弹；轰炸]] or [[VW:blast|/blɑːst/|爆炸；爆炸，炸毁]] turns ordinary streets into scenes of fear. A single [[VW:spark|/spɑːk/|火花，火星]] may ignite a [[VW:conflict|/ˈkɒnflɪkt/|斗争，冲突]], even when leaders claim that they want peace. The [[VW:enormity|/ɪˈnɔːməti/|巨大；滔天大罪]] of war lies not only in death but in the way it reorganises every part of daily life.",
     "zh": "冲突可能在第一场战斗前就已开始。关于土地、资源或身份的争端可能硬化成暴力，一场行动会把局部斗争扩大为更大战争。突袭可能占领城镇或摧毁补给，而爆炸、轰炸、炸弹或冲击会把普通街道变成恐惧现场。即使领导人声称希望和平，一点火花也能点燃冲突。战争的巨大不只在于死亡，还在于它重组日常生活的每一部分。"
    },
    {
     "en": "Weapons reflect both ingenuity and failure. [[VW:Gunpowder|/ˈɡʌnpaʊdə(r)/|火药]] changed [[VW:siege|/siːdʒ/|包围，围攻]] warfare; a [[VW:tank|/tæŋk/|坦克；罐，槽，缸]], [[VW:cannon|/ˈkænən/|大炮，加农炮…]] or [[VW:missile|/ˈmɪsaɪl/|导弹；投掷物]] can [[VW:strike|/straɪk/|打，击；突击；罢工；罢工…]] from a distance, and a [[VW:weapon|/ˈwepən/|武器，兵器；手段]] such as a [[VW:pistol|/ˈpɪst(ə)l/|手枪]], [[VW:rifle|/ˈraɪf(ə)l/|步枪]] or [[VW:bullet|/ˈbʊlɪt/|子弹，枪弹]] makes [[VW:violence|/ˈvaɪələns/|暴力]] impersonal. A [[VW:target|/ˈtɑːɡɪt/|靶子；目标，对象]] may be difficult to see, and armour may [[VW:deflect|/dɪˈflekt/|v .(使)偏斜，(使)偏转：转移…]] a blow. A blade , [[VW:sword|/sɔːd/|刀，剑]], [[VW:ax|/æks/|斧子]], [[VW:hammer|/ˈhæmə(r)/|n，锤，哪头用锤击]], arrow  or [[VW:spear|/spɪə(r)/|矛；标枪；用尖物刺穿]] belongs to older forms of combat, while a [[VW:helmet|/ˈhelmɪt/|头盔，防护帽]] and [[VW:shield|/ʃiːld/|盾；防护物；保护]] were designed to protect the body. A [[VW:flame|/fleɪm/|火焰；强烈的感情]] may [[VW:glow|/ɡləʊ/|发出微弱稳定的光…]], a [[VW:flare|/fleə(r)/|(闪耀的)火光…]] may [[VW:glitter|/ˈɡlɪtə(r)/|闪烁；闪现发光小物]] and [[VW:twinkle|/ˈtwɪŋk(ə)l/|闪烁，闪耀；闪烁，闪耀]] in the dark, and a [[VW:burst|/bɜːst/|(使)爆裂；(使)胀开；迸发…]] of fire can devastate in seconds. To [[VW:equip|/ɪˈkwɪp/|配备，装备]], [[VW:prepare|/prɪˈpeə(r)/|使预备好…]], [[VW:provide|/prəˈvaɪd/|供给，提供]] and [[VW:deploy|/dɪˈplɔɪ/|部署]] a force is a logistical act, but no supply line can make aggression wise.",
     "zh": "武器既体现创造力，也体现失败。火药改变攻城战；坦克、火炮或导弹可以远距离打击，手枪、步枪或子弹等武器则让暴力变得非人格化。目标可能难以看见，盔甲可能使打击偏转。刀、剑、斧、锤、箭或矛属于更古老的作战形式，头盔与盾牌则用来保护身体。火焰可能发亮，闪光弹会在黑暗中闪烁闪耀，一团火则能在数秒内造成毁灭。装备、准备、提供和部署一支部队属于后勤行为，但没有任何补给线能让侵略变得明智。"
    },
    {
     "en": "People often describe combat with short verbs: [[VW:hit|/hɪt/|击，打；碰撞；打击；击，打…]], [[VW:beat|/biːt/|打；打败；(心脏等)跳动节拍…]], [[VW:strike|/straɪk/|打，击；突击；罢工；罢工…]], [[VW:punch|/pʌntʃ/|打孔机；重拳击打…]], [[VW:chop|/tʃɒp/|切碎(食物)；劈(木头)]] or [[VW:stab|/stæb/|(用刀等)刺，戳；刺，戳]]. Such language can make [[VW:violence|/ˈvaɪələns/|暴力]] sound clean and immediate, though its consequences are neither. A [[VW:mission|/ˈmɪʃ(ə)n/|使命；重要任务]] may succeed by one measure and fail by another. A soldier may face a [[VW:dilemma|/dɪˈlemə/|(避退两难的)困境]] when every choice harms someone, and a civilian population may endure a [[VW:plight|/plaɪt/|困境；誓约]] that no strategic map records. A [[VW:pitfall|/ˈpɪtfɔːl/|陷阱；危险，困难]] is easier to see afterward, and a [[VW:conspiracy|/kənˈspɪrəsi/|阴谋，密谋，合谋]] can hide intent until action",
     "zh": "人们常用短动词描述战斗：打、击、攻击、拳打、砍或刺。 这种语言会让暴力听起来干净而即时，后果却并非如此。一项任务可能以某种标准成功，又以另一种标准失败。每个选 择都伤害某人时，士兵会面对两难；平民群体承受的困境， 任何战略地图都无法记录。陷阱往往事后才看得清，阴谋则可能隐藏意图，直到行动无法避免。"
    },
    {
     "en": "War exposes the fragility of ordinary life. A [[VW:destitute|/ˈdestɪtjuːt/|赤贫的，一无所有的；缺乏的]] family may lose its home, while [[VW:famine|/ˈfæmɪn/|饥荒]] and drought [[VW:starve|/stɑːv/|v .(使)挨饿，饿死]] communities already weakened by neglect. One group may [[VW:deprive|/dɪˈpraɪv/|剥夺]] another of water or land, [[VW:seize|/siːz/|抓住；夺取]] property and [[VW:pursue|/pəˈsjuː/|追赶；追查；追求]] people across a border. The [[VW:threat|/θret/|威胁，恐吓]] of force can [[VW:offend|/əˈfend/|冒犯；犯罪；违反]] moral restraint and make [[VW:aggressive|/əˈɡresɪv/|侵略的；好斗的；积极进取的]] behaviour seem normal. When soldiers [[VW:invade|/ɪnˈveɪd/|入侵，侵略；侵扰]] a country, [[VW:trespass|/ˈtrespəs/|非法侵入罪过；非法侵入]] on private land, [[VW:intrude|/ɪnˈtruːd/|闯入，侵入；侵扰]] into a home or [[VW:violate|/ˈvaɪəleɪt/|违反，违背；侵犯；搅扰]] a ceasefire, an [[VW:attack|/əˈtæk/|攻击，进攻；攻击，进攻]] becomes more than a military event. It is an [[VW:assault|/əˈsɔːlt/|猛攻；(身体)侵犯；袭击]] on 05 A [[VW:challenge|/ˈtʃælɪndʒ/|挑战；向……挑战]] to power can also take nonviolent forms. Protest, negotiation and legal action may [[VW:surround|/səˈraʊnd/|包围；环绕]] a disputed decision and [[VW:enclose|/ɪnˈkləʊz/|围住，包围…]] it in public scrutiny. During a [[VW:siege|/siːdʒ/|包围，围攻]], a city may be surrounded by troops, yet civilians still need food, medicine and escape routes. A [[VW:pause|/pɔːz/|暂停，停顿；暂停，停顿]] in fighting may allow aid to enter and families to search for one another. A temporary ceasefire is not peace, but it",
     "zh": "战争暴露日常生活的脆弱。贫困家庭可能失去住所，饥荒与干旱则让本已被忽视的社区挨饿。一个群体可能剥夺另一个 群体的水或土地，夺取财产并追捕越境者。武力威胁会冒犯 道德克制，让侵略行为显得正常。士兵入侵一国、擅闯私人土地、侵入住宅或违反停火时，攻击就不只是军事事件，而是对信任可能性的袭击。对权力的挑战也可以采取非暴力形式。抗议、谈判与法律行 动可以包围争议决定，把它置于公众审视之下。围城期间， 城市可能被军队环绕，平民却仍需要食物、药品与逃生通道。 战斗暂停可以让援助进入，让家庭寻找彼此。临时停火不是和平，却能在寻求政治解决方案时保护生命。"
    },
    {
     "en": "The hardest question is not whether force can achieve an objective, but whether the objective is just and the means proportionate. International humanitarian law requires parties to distinguish civilians from fighters, avoid unnecessary suffering and care for the wounded. Those duties do not disappear because an enemy is ruthless. A society that abandons restraint in the name of security may",
     "zh": "最难的问题不是武力能否实现目标，而是目标是否正义、手 段是否相称。国际人道法要求各方区分平民与战斗员，避免不必要痛苦并照料伤者。敌人残酷，并不会使这些义务消失。一个以安全之名放弃克制的社会，可能复制它声称反对的危 险。"
    },
    {
     "en": "Memory should not turn war into romance. Monuments can honour sacrifice without hiding atrocity, and testimony can preserve what official histories omit. Peace is not the silence that follows victory; it is the patient work of restoring law, listening to loss and preventing the next generation",
     "zh": "记忆不应把战争变成浪漫。纪念碑可以纪念牺牲，却不必掩 盖暴行；证词可以保存官方历史省略的内容。和平不是胜利后的沉默，而是恢复法律、倾听损失、防止下一代把旧怨继承为新命令的耐心工作。"
    }
   ],
