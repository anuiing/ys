/* ---------------- progress / spaced repetition ---------------- */
const LS_KEY = 'ielts_vocab_progress_v2';
const BOX_INTERVALS = [1,2,4,7,15,30]; // days for box 1..6
function loadP(){ try{return JSON.parse(localStorage.getItem(LS_KEY))||{studied:{},words:{}};}catch(e){return {studied:{},words:{}};} }
function saveP(p){ localStorage.setItem(LS_KEY, JSON.stringify(p)); }
let PROG = loadP();

function todayISO(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
function addDays(iso,n){ const d=new Date(iso); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

function markStudied(id){
  if(!PROG.studied[id]) PROG.studied[id]={date:todayISO(),reviews:0};
  if(!PROG.words[id]){
    PROG.words[id]={};
    const e=essayById(id);
    e.vocab.forEach(v=>{ PROG.words[id][v.w.toLowerCase()]={box:1,due:todayISO(),wrong:0,correct:0,seen:0}; });
  }
  saveP(PROG);
}
function incReviews(id){ if(PROG.studied[id]){PROG.studied[id].reviews=(PROG.studied[id].reviews||0)+1; saveP(PROG);} }

function recordWord(id, word, correct){
  if(!PROG.words[id]) PROG.words[id]={};
  const k=word.toLowerCase();
  let w=PROG.words[id][k];
  if(!w) w=PROG.words[id][k]={box:1,due:todayISO(),wrong:0,correct:0,seen:0};
  w.seen=(w.seen||0)+1;
  if(correct){ w.correct=(w.correct||0)+1; w.box=Math.min(w.box+1, BOX_INTERVALS.length); w.due=addDays(todayISO(), BOX_INTERVALS[w.box-1]); }
  else { w.wrong=(w.wrong||0)+1; w.box=1; w.due=todayISO(); }
  saveP(PROG);
}

/* ---------------- helpers ---------------- */
function essayById(id){ return DATA.essays.find(e=>e.id===id); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function plainOf(enPH){ return enPH.replace(/\[\[VW:([^\]|]*)\|[^\]]*\]\]/g,'$1'); }
function todayIndex(){ const now=new Date(); const start=new Date(now.getFullYear(),0,0); const doy=Math.floor((now-start)/86400000); return doy % DATA.essays.length; }

let showPhon = false; /* 默认不显示音标，保证段落连续、版面整洁（可勾选，或点词看音标） */

function renderInline(chunk){
  let html='',last=0;
  const re=/\[\[VW:([^\]|]*)\|([^\]|]*)\|([^\]]*)\]\]/g; let m;
  while((m=re.exec(chunk))){
    html+=escapeHtml(chunk.slice(last,m.index));
    const w=m[1],ipa=m[2],g=m[3];
    html+='<span class="vw" data-w="'+escapeHtml(w)+'" data-ipa="'+escapeHtml(ipa)+'" data-g="'+escapeHtml(g)+'">'
        +'<b>'+escapeHtml(w)+'</b>'
        +((showPhon&&ipa)?'<span class="vw-phon">'+escapeHtml(ipa)+'</span>':'')
        +'</span>';
    last=re.lastIndex;
  }
  html+=escapeHtml(chunk.slice(last));
  return html;
}

/* sentence splitting (plain text) */
function splitEn(s){
  const parts=[]; const re=/([^.!?]+[.!?]+)/g; let m,last=0;
  while((m=re.exec(s))){ parts.push(m[1].trim()); last=re.lastIndex; }
  const rest=s.slice(last).trim(); if(rest) parts.push(rest);
  return parts.filter(x=>x.length);
}
function splitZh(s){
  const parts=[]; const re=/([^。！？]+[。！？]+)/g; let m,last=0;
  while((m=re.exec(s))){ parts.push(m[1].trim()); last=re.lastIndex; }
  const rest=s.slice(last).trim(); if(rest) parts.push(rest);
  return parts.filter(x=>x.length);
}
/* split placeholder-English into sentences aligned with plain sentence boundaries */
function splitEnPH(enPH){
  const plain=plainOf(enPH);
  const ps=splitEn(plain);
  const ends=[]; let acc=0; ps.forEach(s=>{acc+=s.length; ends.push(acc);});
  const chunks=[]; let seg=0,cur='',j=0,ci=0;
  while(ci<enPH.length){
    if(enPH[ci]==='['&&enPH[ci+1]==='['){
      const end=enPH.indexOf(']]',ci); const tok=enPH.slice(ci,end+2);
      const word=tok.slice(5,tok.indexOf('|'));
      cur+=tok; j+=word.length; ci=end+2;
    } else { cur+=enPH[ci]; j++; ci++; }
    if(seg<ends.length && j>=ends[seg]){ chunks.push(cur.trim()); cur=''; seg++; }
  }
  if(cur.trim()) chunks.push(cur.trim());
  return chunks;
}

/* grammar detection */
function grammarNotes(s){
  const n=[];
  if(/\b(which|that|who|whom|whose)\b/i.test(s)&&/,.*\b(which|that|who|whom)\b/i.test(s)) n.push('定语从句');
  if(/\bit (?:is|was|were)\b[^.?!]*\bthat\b/i.test(s)) n.push('强调句');
  if(/\bnot only\b[\s\S]*\bbut also\b/i.test(s)) n.push('并列 / 递进');
  if(/\b(although|though|whereas|while|despite|in spite of)\b/i.test(s)) n.push('让步 / 对比');
  if(/\b(if|unless)\b/i.test(s)&&/\b(would|could|should|might|were)\b/i.test(s)) n.push('虚拟语气');
  if(/\b(?:is|are|was|were|be|been|being)\b\s+[a-z]+(?:ed|en)\b/i.test(s)) n.push('被动语态');
  if(/\b(having|given|considering|provided|supposing)\b/i.test(s)) n.push('分词状语');
  if(s.split(/\s+/).length>=30) n.push('长难句');
  return n;
}

      const row=document.createElement('div'); row.className='sb';
      const c1=document.createElement('div'); c1.className='col-en';

      const enS=splitEnPH(enPH), zhS=splitZh(zh);
      enS.forEach((es,i)=>{

        box.appendChild(row);
      });

  });

/* ---------------- QUIZ (study & review share engine) ---------------- */
let quiz=null;
function startQuiz(pool, kind, essayId){
  quiz={pool:pool.slice(), kind:kind, essayId:essayId||curId, idx:0, passed:0, streak:0, total:pool.length};
  showStage(kind==='review'?'rquiz':'quiz');
  if(kind==='review'){ document.getElementById('rqTitle').textContent='复习 · '+essayById(quiz.essayId).zhTitle; }
  setStepActive('quiz');
  renderQuiz();
}
function buildOptions(v, pool){
  const others=shuffle(pool.filter(x=>x.g!==v.g).map(x=>x.g)).slice(0,3);
  return shuffle([v.g,...others]);
}
function renderQuiz(){
  const isR=quiz.kind==='review';
  const word=quiz.pool[0]; if(!word){ finishQuiz(); return; }
  const opts=buildOptions(word, quiz.pool);
  if(isR){
    document.getElementById('rqword').textContent=word.w;
    document.getElementById('rqipa').textContent=word.ipa;
    document.getElementById('rqOpts').innerHTML=opts.map(o=>'<div class="opt" data-o="'+escapeHtml(o)+'">'+escapeHtml(o)+'</div>').join('');
    document.getElementById('rqBar').style.width=(quiz.passed/quiz.total*100)+'%';
    const due=Object.values(PROG.words[quiz.essayId]||{}).filter(w=>w.due<=todayISO()).length;
    document.getElementById('rqCount').textContent='剩余 '+quiz.pool.length+' 词';
    document.getElementById('rqDue').textContent='待复习 '+due+' 词';
    document.getElementById('rqOpts').querySelectorAll('.opt').forEach(o=>o.onclick=()=>answerQuiz(o,true));
  } else {
    document.getElementById('qword').textContent=word.w;
    document.getElementById('qipa').textContent=word.ipa;
    document.getElementById('qOpts').innerHTML=opts.map(o=>'<div class="opt" data-o="'+escapeHtml(o)+'">'+escapeHtml(o)+'</div>').join('');
    document.getElementById('qBar').style.width=(quiz.passed/quiz.total*100)+'%';
    document.getElementById('qCount').textContent='剩余 '+quiz.pool.length+' 词';
    document.getElementById('qPassed').textContent='已过关 '+quiz.passed+' / '+quiz.total;
    document.getElementById('qstreak').innerHTML=Array.from({length:2},(_,i)=>'<span class="dot'+(i<quiz.streak?' on':'')+'"></span>').join('');
    document.getElementById('qOpts').querySelectorAll('.opt').forEach(o=>o.onclick=()=>answerQuiz(o,false));
  }
}
function answerQuiz(optEl, isR){
  const chosen=optEl.dataset.o;
  const word=quiz.pool[0];
  const correct=(chosen===word.g);
  optEl.classList.add(correct?'ok':'bad');
  document.querySelectorAll(isR?'#rqOpts .opt':'#qOpts .opt').forEach(o=>{ if(o.dataset.o===word.g) o.classList.add('ok'); o.onclick=null; });
  recordWord(quiz.essayId, word.w, correct);
  if(isR){
    document.getElementById('rqfb').textContent=correct?'✓ 正确':'✗ 正确释义：'+word.g;
    document.getElementById('rqfb').style.color=correct?'var(--ok)':'var(--bad)';
  } else {
    quiz.streak=correct?Math.min(quiz.streak+1,2):0;
    document.getElementById('qfb').textContent=correct?(quiz.streak>=2?'✓ 全部答对，过关！':'✓ 答对啦，再来一次巩固'):'✗ 正确释义：'+word.g;
    document.getElementById('qfb').style.color=correct?'var(--ok)':'var(--bad)';
  }
  setTimeout(()=>{
    if(isR){
      // 复习模式：单次答对即升级（Leitner 遗忘曲线由 recordWord 处理）
      quiz.pool.shift();
      if(correct) quiz.passed++;
      else quiz.pool.push(word);
    } else {
      // 学习模式：需连续答对两次方可过关
      if(correct){
        if(quiz.streak>=2){ quiz.pool.shift(); quiz.passed++; quiz.streak=0; } // 过关，换词并重置连对计数
        // 否则保留在队首，立即重试同一词（streak 继续累加）
      } else {
        quiz.pool.shift(); quiz.pool.push(word); // 答错，重新排入队尾
        quiz.streak=0;
      }
    }
    renderQuiz();
  }, correct?520:900);
}
function finishQuiz(){
  const isR=quiz.kind==='review';
  if(isR){
    document.getElementById('rqword').textContent='🎉 复习完成！';
    document.getElementById('rqipa').textContent='';
    document.getElementById('rqOpts').innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--ok);padding:14px;">本组单词已按遗忘曲线更新排期</div>';
    document.getElementById('rqfb').textContent='';
    document.getElementById('rqFinish').classList.remove('hidden');
  } else {
    document.getElementById('toGrammar').classList.remove('hidden');
    document.getElementById('qword').textContent='🎉 全部闯关成功！';
    document.getElementById('qipa').textContent='';
    document.getElementById('qOpts').innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--ok);padding:14px;">所有单词都答对了两次，进入语法精读吧</div>';
    document.getElementById('qfb').textContent='';
  }
}

function startGrammar(){
  showStage('grammar');
  setStepActive('grammar');
  document.getElementById('gSub').textContent=curEssay.zhTitle;
  const plain=curEssay.paragraphs.map(p=>plainOf(p.en)).join(' ');
  const sents=splitEn(plain);
  const art=document.getElementById('gArticle'); art.innerHTML='';
  const list=document.getElementById('gList'); list.innerHTML='';
  let any=false;
  sents.forEach(s=>{
    const notes=grammarNotes(s);
    const hl=notes.length>0; if(hl) any=true;
    const div=document.createElement('div');
    div.className='g-sent'+(hl?' g-hl':'');
    div.textContent=s;
    if(hl) div.setAttribute('data-notes',notes.join('##GR##'));
    art.appendChild(div);
    if(hl){ const item=document.createElement('div'); item.className='g-item';
      item.innerHTML='<b>⚑ 语法点：</b>'+notes.map(x=>'<div>• '+escapeHtml(x)+'</div>').join(''); list.appendChild(item); }
  });
  if(!any) list.innerHTML='<div class="g-item">本篇未检测到明显的重点语法结构。</div>';
}
document.getElementById('gArticle').addEventListener('click',e=>{
  const s=e.target.closest('.g-sent.g-hl'); if(!s)return; e.stopPropagation();
  const notes=(s.getAttribute('data-notes')||'').split('##GR##').filter(Boolean);
  showGramPop(notes,e.clientX,e.clientY);
});
document.getElementById('finishStudy').onclick=()=>{
  markStudied(curId); stopAudio(); showStage('home'); renderHome();
};

/* ---------------- REVIEW ---------------- */
function renderReview(){
  showStage('review');
  const list=document.getElementById('reviewList'); list.innerHTML='';
  const studied=DATA.essays.filter(e=>PROG.studied[e.id]);
  if(!studied.length){ list.innerHTML='<div class="g-item">还没有学完的文章。先在首页完成学习，单词会自动进入复习区。</div>'; return; }
  studied.forEach(e=>{
    const wmap=PROG.words[e.id]||{};
    const due=Object.values(wmap).filter(w=>w.due<=todayISO()).length;
    const item=document.createElement('div'); item.className='ritem';
    item.innerHTML='<div class="info"><div class="zh">'+escapeHtml(e.zhTitle)+'</div>'
      +'<div class="en">'+escapeHtml(e.enTitle)+' · '+e.vocab.length+' 词 · 已复习 '+(PROG.studied[e.id].reviews||0)+' 次</div></div>'
      +(due?'<span class="due">'+due+' 词待复习</span>':'<span class="due" style="color:var(--sub)">暂无待复习</span>');
    const b1=document.createElement('button'); b1.className='btn sm primary'; b1.textContent='复习单词';
    b1.onclick=()=>startReviewQuiz(e.id);
    const b2=document.createElement('button'); b2.className='btn sm'; b2.textContent='拼写听写';
    b2.onclick=()=>startDictation(e.id);
    item.appendChild(b1); item.appendChild(b2);
    list.appendChild(item);
  });
}
function reviewPool(id){
  const e=essayById(id); const wmap=PROG.words[id]||{};
  let items=e.vocab.map(v=>{ const w=wmap[v.w.toLowerCase()]||{box:1,due:todayISO(),wrong:0}; return {...v, box:w.box, due:w.due, wrong:w.wrong||0}; });
  const dueArr=items.filter(v=>v.due<=todayISO());
  const rest=items.filter(v=>v.due>todayISO());
  const sortFn=(a,b)=> (b.wrong-a.wrong) || (a.due<b.due?-1:1);
  dueArr.sort(sortFn); rest.sort(sortFn);
  return dueArr.concat(rest);
}
function startReviewQuiz(id){
  const pool=reviewPool(id);
  if(!pool.length){ alert('该篇暂无复习单词'); return; }
  incReviews(id);
  startQuiz(pool,'review',id);
}
document.getElementById('rqBack').onclick=()=>{ renderReview(); showStage('review'); };

/* ---------------- DICTATION ---------------- */
let dict=null;
function startDictation(id){
  curId=id; curEssay=essayById(id); // 确保 submitDict 的 recordWord(curId,...) 归属到正确篇章
  const e=essayById(id); const wmap=PROG.words[id]||{};
  let items=e.vocab.map(v=>{ const w=wmap[v.w.toLowerCase()]||{box:1,due:todayISO(),wrong:0}; return {...v, wrong:w.wrong||0, due:w.due}; });
  items.sort((a,b)=>(b.wrong-a.wrong)||(a.due<b.due?-1:1));
  dict={pool:items, idx:0, ok:0, total:items.length};
  showStage('dict');
  document.getElementById('dTitle').textContent='拼写听写 · '+e.zhTitle;
  renderDict();
}
function renderDict(){
  if(dict.idx>=dict.pool.length){ finishDict(); return; }
  const v=dict.pool[dict.idx];
  document.getElementById('dzh').textContent=v.g;
  document.getElementById('dipaHint').textContent='点击「🔊 听发音」后拼写（共 '+dict.total+' 词）';
  document.getElementById('dCount').textContent='进度 '+(dict.idx+1)+' / '+dict.total+' · 正确 '+dict.ok;
  document.getElementById('dBar').style.width=((dict.idx)/dict.total*100)+'%';
  const inp=document.getElementById('dInput'); inp.value=''; inp.disabled=false; inp.focus();
  document.getElementById('dResult').textContent=''; document.getElementById('dResult').className='dresult';
  document.getElementById('dShow').classList.add('hidden');
  speak(v.w,0.9);
}
document.getElementById('dSpeak').onclick=()=>{ if(dict) speak(dict.pool[dict.idx].w,0.9); };
document.getElementById('dInput').addEventListener('keydown',e=>{ if(e.key==='Enter') submitDict(); });
document.getElementById('dNext').onclick=submitDict;
function submitDict(){
  const v=dict.pool[dict.idx];
  const inp=document.getElementById('dInput'); const val=inp.value.trim().toLowerCase();
  const correct=(val===v.w.toLowerCase());
  const res=document.getElementById('dResult');
  recordWord(curId, v.w, correct);
  if(correct){ dict.ok++; res.textContent='✓ 正确！'; res.className='dresult ok'; }
  else { res.textContent='✗ 正确答案：'+v.w; res.className='dresult bad';
    document.getElementById('dShow').textContent='音标：'+v.ipa+'　释义：'+v.g; document.getElementById('dShow').classList.remove('hidden'); }
  inp.disabled=true;
  setTimeout(()=>{ dict.idx++; renderDict(); }, correct?520:1100);
}
function finishDict(){
  document.getElementById('dzh').textContent='🎉 听写完成！';
  document.getElementById('dipaHint').textContent='';
  document.getElementById('dCount').textContent='正确 '+dict.ok+' / '+dict.total;
  document.getElementById('dBar').style.width='100%';
  document.getElementById('dInput').style.display='none';
  document.getElementById('dSpeak').style.display='none';
  document.getElementById('dResult').textContent='正确率 '+Math.round(dict.ok/dict.total*100)+'%，错误单词已回到第 1 关排期';
  document.getElementById('dResult').className='dresult '+(dict.ok===dict.total?'ok':'bad');
  document.getElementById('dNext').style.display='none';
  document.getElementById('dFinish').classList.remove('hidden');
}
document.getElementById('dFinish').onclick=()=>{ renderReview(); showStage('review'); };
document.getElementById('dBack').onclick=()=>{ renderReview(); showStage('review'); };

/* ---------------- init ---------------- */
renderHome();
</script>
