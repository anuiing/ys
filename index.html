  {
   "zhTitle": "勇气与代价",
   "enTitle": "Courage and Cost",
   "paragraphs": [
    {
     "en": "Every war eventually reaches a point where someone must [[VW:halt|/hɔːlt/|(使)停止，(使)停住…]], [[VW:cease|/siːs/|终止，停止]] or [[VW:oppose|/əˈpəʊz/|反对，抵制]] it. A government may [[VW:counter|/ˈkaʊntə(r)/|抵消；反击，反驳；相反地…]] an uprising, [[VW:oppress|/əˈpres/|压迫，压制；使压抑]] a minority, [[VW:deter|/dɪˈtɜː(r)/|阻止，威慑住]] an attack or [[VW:forbid|/fəˈbɪd/|禁止；阻止]] certain weapons. Law may [[VW:prohibit|/prəˈhɪbɪt/|禁止，不允许]] specific tactics and try to [[VW:prevent|/prɪˈvent/|预防，防止；阻止，阻碍]] civilian harm. Yet a [[VW:revolt|/rɪˈvəʊlt/|叛乱；反抗；叛乱；反抗]] can grow from grievances that peaceful politics failed to address. One side may [[VW:betray|/bɪˈtreɪ/|背叛，出卖…]] a promise, commit [[VW:treason|/ˈtriːz(ə)n/|叛国罪，通敌罪]] or support a  group; another may call the same person a [[VW:traitor|/ˈtreɪtə(r)/|叛徒，卖国贼]], a [[VW:patriot|/ˈpætriət/|爱国者]] or a terrorist. Labels often say more about the speaker than the act.",
     "zh": "每场战争最终都会到达某个时刻，必须有人停止、终止或反对它。政府可能反击起义、压迫少数群体、威慑攻击或禁止某些武器。法律可以禁止特定战术，并尝试防止平民受害。然而，起义也可能源于和平政治未能解决的怨愤。一方可能背叛承诺、犯下叛国罪或支持叛乱组织；另一方则可能把同一个人称为叛徒、爱国者或恐怖分子。标签往往比行为更能说明说话者。"
    },
    {
     "en": "[[VW:Blame|/bleɪm/|责备，指责(对坏事应负的)责任…]] is easy, but [[VW:evidence|/ˈevɪdəns/|证据；根据]] and [[VW:proof|/pruːf/|证明，证据]] are difficult. [[VW:Terror|/ˈterə(r)/|恐惧，恐慌]] produces [[VW:terrible|/ˈterəb(ə)l/|可怕的，糟糕的；极严重的]] fear, and a [[VW:horrible|/ˈhɒrəb(ə)l/|可怕的，恐怖的]] scene can leave people in [[VW:alarm|/əˈlɑːm/|惊恐，忧虑；警报；警报器]] and [[VW:dread|/dred/|极为害怕，非常担心…]]. [[VW:Tension|/ˈtenʃ(ə)n/|紧张；拉紧状态]] becomes [[VW:turbulent|/ˈtɜːbjələnt/|动荡的，混乱的；汹涌的]] when institutions lose trust; [[VW:turmoil|/ˈtɜːmɔɪl/|混乱，骚乱]] can turn a familiar [[VW:scenario|/səˈnɑːriəʊ/|可能发生的情况…]] into chaos. A single [[VW:occasion|/əˈkeɪʒ(ə)n/|场合；时机，机会]] can provoke a [[VW:contest|/ˈkɒntest/|争取赢得；争辩；竞争；比赛]] that no one intended. [[VW:Reckless|/ˈrekləs/|鲁莽的，不计后果的]] leaders may claim to make [[VW:progress|/ˈprəʊɡres/|前进；进步；进程]] while crossing every [[VW:limit|/ˈlɪmɪt/|限度；界限；限制，限定]] and removing the [[VW:rein|/reɪn/|缰绳；控制权；用缰绳勒马…]] on power.",
     "zh": "归责容易，证据与证明却困难。恐怖会制造可怕恐惧，骇人场景也会使人陷入惊慌与畏惧。制度失去信任时，紧张会变得动荡；混乱会把熟悉局面变成失控。一个偶然场合就能引发无人预料的争斗。鲁莽领导人可能一边宣称取得进展，一边跨越所有界限，松开约束权力的缰绳。"
    },
    {
     "en": "Competition need not become war, but it can create enemies. [[VW:Rival|/ˈraɪv(ə)l/|竞争者，对手；与……匹敌]] states may [[VW:compete|/kəmˈpiːt/|竞争；参加(比赛)]] for resources, while a [[VW:competitor|/kəmˈpetɪtə(r)/|竞争者，对手]] uses [[VW:strategy|/ˈstrætədʒi/|策略；战略]], [[VW:tactic|/ˈtæktɪk/|策略，战术]] and [[VW:manoeuvre|/məˈnuːvə(r)/|策略，巧计；［－s］军事演习]] to gain advantage. A blueprint  for peace is more valuable than a plan for victory. Diplomats should [[VW:warn|/wɔːn/|警告；告诫]] against escalation, [[VW:compel|/kəmˈpel/|强迫，迫使]] restraint through law and [[VW:oblige|/əˈblaɪdʒ/|迫使，强迫；帮忙]] parties to protect civilians. A [[VW:protest|/ˈprəʊtest/|抗议；申明；抗议；申辩]] can [[VW:refute|/rɪˈfjuːt/|反驳，驳斥；否认]] a false claim and [[VW:reinforce|/ˌriːɪnˈfɔːs/|增援；增强，加强；加固]] the",
     "zh": "竞争不必变成战争，却可能制造敌人。敌对国可能争夺资源竞争者则利用战略、战术与机动取得优势。和平蓝图比胜 利计划更有价值。外交官应警告局势升级，以法律迫使各方 克制，并责成各方保护平民。抗议可以驳斥虚假主张，并加强问责要求。"
    },
    {
     "en": "[[VW:Force|/fɔːs/|力量；武力强迫，迫使…]] has limits. Military [[VW:might|/maɪt/|力量，威力]] may [[VW:compel|/kəmˈpel/|强迫，迫使]] surrender, but it cannot create enduring legitimacy. A [[VW:savage|/ˈsævɪdʒ/|野蛮的，凶猛的 v，凶狠地攻击 n，野蛮人…]] or [[VW:fierce|/fɪəs/|凶猛的；猛烈的…]] attack may produce a temporary advantage, while [[VW:foul|/faʊl/|恶臭的；恶劣的；邪恶的；弄脏…]] means create future enemies. [[VW:Evil|/ˈiːv(ə)l/|邪恶；祸害；邪恶的]] does not require a [[VW:devil|/ˈdev(ə)l/|魔鬼；恶棍]] to explain it; ordinary institutions can drift toward cruelty when fear replaces judgment. [[VW:Punishment|/ˈpʌnɪʃmənt/|惩罚，处罚]] may be necessary, yet a state should not [[VW:execute|/ˈeksɪkjuːt/|实行，执行；处死]] or [[VW:hang|/hæŋ/|悬挂；悬浮(在空中)…]] people merely to display power. [[VW:Sacrifice|/ˈsækrɪfaɪs/|牺牲，献出；献祭]] is honourable only when it",
     "zh": "武力有其限度。军事力量可能迫使投降，却无法创造持久正 当性。野蛮或猛烈攻击可能带来暂时优势，卑劣手段却会制 造未来敌人。邪恶不需要魔鬼来解释；恐惧取代判断时，普通制度也会滑向残酷。惩罚可能必要，国家却不应只为展示 权力而处决或绞死人。牺牲只有在服务可辩护的事业时才光荣，而每个伤亡者都是生命，不是统计数字。"
    },
    {
     "en": "The human cost continues after fighting stops. Refugees may mourn the dead, carry trauma and struggle to rebuild. A peace agreement can [[VW:mitigate|/ˈmɪtɪɡeɪt/|减轻，缓和]] immediate harm, strengthen civilian protection and [[VW:comfort|/ˈkʌmfət/|安慰；舒适；安慰，抚慰]] the bereaved. But relief is not reconciliation. Communities must decide how to remember wrongdoing, how to compensate victims and how to [[VW:prevent|/prɪˈvent/|预防，防止；阻止，阻碍]] old hatred from becoming",
     "zh": "人类代价在战斗停止后仍延续。难民可能哀悼死者、承受创 伤并艰难重建。和平协议可以减轻眼前伤害、加强平民保护 并安慰丧亲者。但救济不等于和解。社区必须决定如何记忆不义、如何补偿受害者，以及如何防止旧恨变成下一场冲突。"
    },
    {
     "en": "Peace requires institutions that can handle conflict without humiliation. A public [[VW:reproach|/rɪˈprəʊtʃ/|责备，指责；责备，指责]] may be deserved, yet it should not become a substitute for law. A [[VW:terrific|/təˈrɪfɪk/|极好的；很大的，很强的]] success can ease fear, while a [[VW:terrible|/ˈterəb(ə)l/|可怕的，糟糕的；极严重的]] defeat may [[VW:frighten|/ˈfraɪt(ə)n/|使害怕，使惊恐]] a whole society. When dispute crosses a [[VW:boundary|/ˈbaʊndri/|分界线，边界；界限]], parties may [[VW:contend|/kənˈtend/|竞争；争辩，主张]] openly, but an [[VW:enemy|/ˈenəmi/|敌人，仇敌；敌兵，敌军]] must not be treated as less than human. War can [[VW:impair|/ɪmˈpeə(r)/|削弱；妨碍]] health, education and trust for generations. Every [[VW:event|/ɪˈvent/|事件，大事；公开活动]] and public [[VW:matter|/ˈmætə(r)/|事情；物质；要紧]] can [[VW:matter|/ˈmætə(r)/|事情；物质；要紧]], but not everything that can [[VW:happen|/ˈhæpən/|发生，出现；碰巧]] should be allowed to [[VW:occur|/əˈkɜː(r)/|发生，出现]] without restraint. The goal is not to eliminate every disagreement, but to make violence a last resort rather than the fastest",
     "zh": "和平需要能够处理冲突而不羞辱任何一方的制度。公开责备可能是应得的，却不应取代法律。一场极好的成功可以缓解恐惧，惨重失败则会让整个社会惊恐。争端越过边界时，各方可能公开竞争，但不能把敌人视为不算人的存在。战争可能损害几代人的健康、教育与信任。每个事件与公共事项都可能重要，但并非可能发生的一切都应不受约束地发生。目标不是消除所有分歧，而是让暴力成为最后手段，而不是最快答案。"
    }

  {
   "zhTitle": "和平的线索",
   "enTitle": "Tracks Toward Peace",
   "paragraphs": [
    {
     "en": "War leaves traces that outlast armies. A community may [[VW:bury|/ˈberi/|埋葬；埋藏]] its dead after a [[VW:funeral|/ˈfjuːnərəl/|葬礼]], mark a [[VW:grave|/ɡreɪv/|坟墓；死亡；庄重的，严肃的]] or [[VW:tomb|/tuːm/|坟墓，冢]] and remember that even [[VW:hell|/hel/|地狱；苦境]] on earth can become ordinary through repetition. At sea, [[VW:maritime|/ˈmærɪtaɪm/|海的，海上的，海事的]] and [[VW:naval|/ˈneɪv(ə)l/|海军的]] operations may decide a campaign; a [[VW:troop|/truːp/|－群，一队…]] transport or [[VW:fleet|/fliːt/|舰队，船队；机群，车队]] can move soldiers, while a [[VW:landing|/ˈlændɪŋ/|着陆；登陆]] tests weather, planning and courage. A helicopter may [[VW:hover|/ˈhɒvə(r)/|盘旋，悬浮；徘徊…]] before troops [[VW:proceed|/prəˈsiːd/|接下来做；继续进行；进行]], and a [[VW:veteran|/ˈvetərən/|.老兵；老手]] may return carrying memories that medals cannot 02 A [[VW:military|/ˈmɪlətri/|军事的，军用的]] relies on technology, but technology can magnify error. [[VW:Nuclear|/ˈnjuːkliə(r)/|原子核的；核能的；核武器的]] weapons [[VW:devastate|/ˈdevəsteɪt/|毁坏，摧毁]] beyond any battlefield, and [[VW:poison|/ˈpɔɪz(ə)n/|毒物，毒药毒害]] can harm generations. [[VW:Risk|/rɪsk/|危险，风险阻冒着......的危险…]] and [[VW:adventure|/ədˈventʃə(r)/|冒险，冒险经历v，去(某地)探险…]] may sound heroic in a story, yet peril  is not an invitation when [[VW:catastrophe|/kəˈtæstrəfi/|重大灾难，大祸]] is possible. A [[VW:collapse|/kəˈlæps/|倒塌；崩溃；倒塌；崩溃]] of command can [[VW:humiliate|/hjuːˈmɪlieɪt/|羞辱，使蒙羞]] a force, [[VW:torture|/ˈtɔːtʃə(r)/|拷问；痛苦，折磨；拷问…]] civilians with uncertainty and [[VW:damage|/ˈdæmɪdʒ/|损害；伤害；损害；伤害]] trust. [[VW:Harmful|/ˈhɑːmf(ə)l/|有害的]] rumours can [[VW:mislead|/ˌmɪsˈliːd/|误导，欺骗，使误入歧途]] the public, [[VW:disturb|/dɪˈstɜːb/|打扰；使焦虑；弄乱]] peace, [[VW:interfere|/ˌɪntəˈfɪə(r)/|干涉；妨碍]] with relief and [[VW:interrupt|/ˌɪntəˈrʌpt/|打断；中断]] essential work. An interruption in communication can make [[VW:retreat|/rɪˈtriːt/|撤退；退避；撤退；退避]], [[VW:shrink|/ʃrɪŋk/|退缩；收缩，缩水；(使)减少]] a defensive line or force troops to [[VW:withdraw|/wɪðˈdrɔː/|收回；(使)撤退；提(款)]] from a position they",
     "zh": "战争会留下比军队更持久的痕迹。社区可能在葬礼后埋葬死者，标记坟墓或陵墓，并记住即使人间地狱也会因反复而变 得寻常。海上与海军行动可能决定一场战役；运兵船或舰队可以运送士兵，登陆则考验天气、计划与勇气。直升机可能 在部队继续前进前悬停，老兵归来时则带着勋章无法修补的记忆。军队依赖技术，技术却会放大错误。核武器会造成超越任何 战场的毁灭，毒物可以伤害几代人。风险与冒险在故事里或 许显得英勇，但当灾难可能发生时，危险并不是邀请。指挥 体系崩溃会羞辱一支部队，用不确定性折磨平民并损害信任。 有害谣言会误导公众、扰乱和平、妨碍救援并中断关键工作。通信中断可能使撤退、缩短防线，或迫使部队撤出原本可以 防守的阵地。"
    },
    {
     "en": "Endurance has moral limits. Forces may [[VW:withstand|/wɪðˈstænd/|承受，顶住，经受住]] pressure, [[VW:compromise|/ˈkɒmprəmaɪz/|妥协]] with an opponent or choose to [[VW:surrender|/səˈrendə(r)/|投降；放弃；投降…]] rather than sacrifice more lives. [[VW:Escape|/ɪˈskeɪp/|逃跑；逃脱；逃避；逃跑；逃脱…]] is not always cowardice; to [[VW:avoid|/əˈvɔɪd/|避免；躲开]] needless destruction can be wise. To [[VW:quit|/kwɪt/|放弃，停止；辞去；离开]] a hopeless position, [[VW:withdraw|/wɪðˈdrɔː/|收回；(使)撤退；提(款)]], [[VW:abandon|/əˈbændən/|放弃；抛弃，丢弃]] a weapon, [[VW:forgo|/fɔːˈɡəʊ/|放弃]] revenge and [[VW:discard|/dɪˈskɑːd/|丢弃，抛弃]] hatred may be harder than to fight on. Getting [[VW:rid|/rɪd/|\\[get -of］摆脱，丢弃]] of grievance is not the same as forgetting victims, but it",
     "zh": "忍耐有道德限度。军队可以承受压力、与对手妥协，或选择 投降，以免牺牲更多生命。逃跑并不总是怯懦，避免无谓毁灭可能明智。放弃绝望阵地、撤退、丢下武器、放弃复仇并 抛弃仇恨，有时比继续战斗更难。摆脱怨恨不等于忘记受害 者，却为保护生者、守护未来创造空间。"
    },
    {
     "en": "[[VW:Defeat|/dɪˈfiːt/|战胜，击败；失败]] is not the end of meaning. An army may [[VW:resist|/rɪˈzɪst/|抵制，反对；抵御；忍住]] [[VW:capture|/ˈkæptʃə(r)/|战利品；捕获；夺得]], but a society can still [[VW:conquer|/ˈkɒŋkə(r)/|征服；克服，战胜]] fear through law and generosity. [[VW:Victory|/ˈvɪktəri/|胜利，成功]] and [[VW:triumph|/ˈtraɪʌmf/|伟大胜利，非凡的成功…]] are fragile if they depend on humiliation. A [[VW:monument|/ˈmɒnjumənt/|纪念碑；历史遗迹；典范]], memorial [[VW:tablet|/ˈtæblət/|碑，匾；药片]] or [[VW:statue|/ˈstætʃuː/|雕像，塑像]] may [[VW:honour|/ˈɒnə(r)/|尊敬，敬意；荣誉；尊敬…]] the dead, while a [[VW:medal|/ˈmed(ə)l/|勋章，奖章]] recognises service. It is [[VW:glorious|/ˈɡlɔːriəs/|光荣的，荣糙的]] to [[VW:contribute|/kənˈtrɪbjuːt/|捐献；(为···)作贡献…]] to peace and to [[VW:devote|/dɪˈvəʊt/|献身；投入]] resources to recovery, but the living also [[VW:owe|/əʊ/|欠；应把……归功于…]]",
     "zh": "失败不是意义的终点。军队可能抵抗俘获，社会却仍能通过 法律与宽厚征服恐惧。胜利与成功若依赖羞辱，便十分脆弱。纪念碑、纪念牌或雕像可以纪念死者，勋章则承认服役。为和平作出贡献、把资源投入恢复是光荣的，但生者也应诚实面对那些再未归来的人。"
    },
    {
     "en": "Security requires vigilance without paranoia. A [[VW:patrol|/pəˈtrəʊl/|巡逻，巡查；巡逻，巡查]] or [[VW:guard|/ɡɑːd/|卫兵，警卫员；看守…]] may protect a village, and [[VW:camouflage|/ˈkæməflɑːʒ/|伪装；伪装]] can shield a unit from view. An [[VW:obstacle|/ˈɒbstək(ə)l/|障碍；障碍物]] can delay attack, while a [[VW:burrow|/ˈbʌrəʊ/|地洞，地道掘地洞]] may conceal a person in danger. A [[VW:spy|/spaɪ/|间谍，特务…]], [[VW:scout|/skaʊt/|侦察员，侦察机侦察，搜寻]] or [[VW:general|/ˈdʒen(ə)rəl/|.将军；总的；一般性的]] may influence events, and a [[VW:soldier|/ˈsəʊldʒə(r)/|战士，士兵]] may follow orders that citizens never see. The moral difference lies in whether force protects life or",
     "zh": "安全需要警惕，却不需要偏执。巡逻队或卫兵可以保护村庄伪装能遮蔽部队。障碍可以拖延攻击，地洞则可能藏身避 险。间谍、侦察兵或将军会影响事件，士兵可能执行普通公民看不见的命令。道德差别在于武力保护生命，还是仅仅扩 大控制。"
    },
    {
     "en": "Peace is built by people who are willing to restore what can be restored and to stop treating every difference as a threat. The most enduring [[VW:victory|/ˈvɪktəri/|胜利，成功]] is not the [[VW:capture|/ˈkæptʃə(r)/|战利品；捕获；夺得]] of a city, but the creation of a world in which another generation does not need to be called to arms.",
     "zh": "和平由愿意记住而不寻求报复的人建立。它要求昔日敌人承认共同脆弱，修复尚可修复之物，并停止把每一处差异都当作威胁。最持久的胜利不是占领一座城市，而是创造一个后代不再需要被征召入伍的世界。"
    }
   ],

  {
   "zhTitle": "家庭与关系",
   "enTitle": "Family and Relationships",
   "paragraphs": [
    {
     "en": "01 A family is not one fixed shape. A [[VW:couple|/ˈkʌp(ə)l/|夫妻，情侣；两个，几个]] may live with their children, a single parent may raise a [[VW:household|/ˈhaʊshəʊld/|家庭，一户；家务]] alone, and a [[VW:grandfather|/ˈɡrænfɑːðə(r)/|(外)祖父]] or grandmother may become the main carer when illness or migration changes the plan. A [[VW:surname|/ˈsɜːneɪm/|姓；给······起别名]] can connect people to one line, but kinship is created by care as well as blood. A [[VW:sibling|/ˈsɪblɪŋ/|兄；弟；姐；妹]], [[VW:cousin|/ˈkʌz(ə)n/|堂(或表)兄(或弟、姐、妹)]], [[VW:nephew|/ˈnefjuː/|侄子；外甥]], [[VW:niece|/niːs/|侄友；外甥友]] or [[VW:twin|/twɪn/|成双的；双胞胎之一]] belongs to a [[VW:generation|/ˌdʒenəˈreɪʃ(ə)n/|一代(约20至30年)…]] with its own opportunities. A [[VW:spouse|/spaʊs/|配偶(指夫或妻)]], [[VW:husband|/ˈhʌzbənd/|丈夫]] or wife may be [[VW:female|/ˈfiːmeɪl/|女子；雌性生物；女的；雌性的]] or male; a [[VW:gay|/ɡeɪ/|同性恋者(尤指男性)同性恋的…]] [[VW:couple|/ˈkʌp(ə)l/|夫妻，情侣；两个，几个]] deserves the same legal respect as any other. [[VW:Gender|/ˈdʒendə(r)/|性别]] and [[VW:sex|/seks/|性别；性行为]] are related terms, yet they are not identical, and a [[VW:father-in-law|/ˈfɑːðər ɪn lɔː/|岳父；公公]] or [[VW:relative|/ˈrelətɪv/|亲戚；相对的；有关的]] may become [[VW:intimate|/ˈɪntɪmət/|亲密的；个人隐私的…]] family through time rather",
     "zh": "家庭并非只有一种固定形态。一对夫妻可能与子女同住，单亲家长可能独自支撑家庭，而疾病或迁徙改变安排时，祖父或祖母可能成为主要照护者。姓氏可以把人连接到某一家系但亲属关系也由照料创造，而不只由血缘创造。兄弟姐妹、 堂表亲、侄子外甥、侄女外甥女或双胞胎属于拥有各自机会 的一代。配偶、丈夫或妻子可能是女性或男性；同性伴侣应 获得与任何其他伴侣同等的法律尊重。社会性别与生理性别是相关词，却并不完全相同；岳父或亲戚也可能随时间成为 亲密家人，而不只是称谓。"
    },
    {
     "en": "The beginning of life is full of wonder and responsibility. An [[VW:embryo|/ˈembriəʊ/|胚胎；胚胎的；初期的]] develops before an [[VW:infant|/ˈɪnfənt/|婴儿；供婴儿用的；婴儿的]] is born, and a child may grow from a [[VW:juvenile|/ˈdʒuːvənaɪl/|少年的；少年]] into a [[VW:youngster|/ˈjʌŋstə(r)/|年轻人；少年]], a [[VW:teenager|/ˈtiːneɪdʒə(r)/|青少年]] and a [[VW:youth|/juːθ/|青年时期；青春；(统称)青年]]. An [[VW:orphan|/ˈɔːf(ə)n/|n，孤儿；使成为孤儿]] needs protection; a [[VW:gang|/ɡæŋ/|一帮，一伙(常聚在一起闹事、打斗的年轻人)…]] may offer belonging while also creating danger. [[VW:Adolescence|/ˌædəˈles(ə)ns/|青春期]] is not simply a period of confusion, and no [[VW:generation|/ˌdʒenəˈreɪʃ(ə)n/|一代(约20至30年)…]] should be reduced to a stereotype. A [[VW:pioneer|/ˌpaɪəˈnɪə(r)/|先驱，开创者]] or [[VW:prophet|/ˈprɒfɪt/|(基督教、犹太教、伊斯兰教的)先知…]] may challenge old habits, while an [[VW:heir|/eə(r)/|后嗣；继承人]] or [[VW:successor|/səkˈsesə(r)/|接替者，继任者；后继的事物]] inherits both resources and expectations. A [[VW:herald|/ˈherəld/|使者，传令官；先驱，预兆…]] of change is often a",
     "zh": "生命开端充满惊奇与责任。婴儿出生前，胚胎先发育；孩子可能从少年成长为年轻人、青少年和青年。孤儿需要保护； 帮派可能提供归属感，也制造危险。青春期不只是混乱时期任何一代都不应被化约为刻板印象。先驱或先知可能挑战 旧习惯，继承人则同时继承资源与期待。变化的先声，往往 是一个年轻人追问某件事为何一直这样做。"
    },
    {
     "en": "Relationships depend on small acts of attention. A [[VW:lover|/ˈlʌvə(r)/|爱好者；(婚外的)情人]] may call someone [[VW:dear|/dɪə(r)/|亲爱的；啊呀]], [[VW:darling|/ˈdɑːlɪŋ/|亲爱的；宠儿]] or [[VW:beloved|/bɪˈlʌvɪd/|爱人；深受喜爱的]], while a friend expresses affection without romance. A [[VW:madam|/ˈmædəm/|夫人，支士…]] may be a respectful form of address, and a [[VW:hostess|/ˈhəʊstəs/|女主人]] may welcome guests at a table. A [[VW:landlord|/ˈlændlɔːd/|地主；房东；(酒吧)店主]], [[VW:landlady|/ˈlændleɪdi/|女房东；女地主]], [[VW:tenant|/ˈtenənt/|房客；租户]] or member of the [[VW:household|/ˈhaʊshəʊld/|家庭，一户；家务]] shares a building without sharing a life. A [[VW:housewife|/ˈhaʊswaɪf/|家庭主妇]] may manage a home, a [[VW:widow|/ˈwɪdəʊ/|寡妇，遗孀]] may live alone after loss, and a [[VW:maid|/meɪd/|女佣，女仆；少女]] or housekeeper performs chores that make daily life possible. The old word [[VW:mistress|/ˈmɪstrəs/|女主人；情妇]] could describe a woman with authority in a [[VW:household|/ˈhaʊshəʊld/|家庭，一户；家务]], although it now carries other meanings; [[VW:maiden|/ˈmeɪdn/|少女，姑娘]] is likewise a literary term that should not define a woman's worth. [[VW:Kin|/kɪn/|(统称)家属，亲戚…]] and [[VW:folk|/fəʊk/|人们；［~s］家属，亲属]] can refer to relatives or a wider cultural group, while a [[VW:host|/həʊst/|主人，东道主]], [[VW:guest|/ɡest/|客人，宾客；旅客]], [[VW:customer|/ˈkʌstəmə(r)/|顾客，主顾，客户]] and [[VW:client|/ˈklaɪənt/|顾客，客户；委托人]] meet under different",
     "zh": "关系依赖细小的关注行为。爱人可能称对方为亲爱的、宝贝 或心爱之人，朋友也能表达情感而不涉恋情。女士可以是一 种尊重称呼，女主人则在餐桌旁迎接客人。男房东、女房东、租客或家庭成员共享建筑，却不必共享生活。家庭主妇可能 管理家务，寡妇可能在失去伴侣后独居，女佣或管家则承担让日常生活得以运转的杂务。旧词“女主人”可以指在家中 拥有权威的女性，但如今也有其他含义；“少女”同样是文 学用语，不应定义女性价值。亲属与民间群体可以指亲戚或更广泛的文化群体；主人、客人、顾客与客户在不同义务下 相遇，却都应得到礼貌对待。"
    },
    {
     "en": "Living together is a series of encounters. A resident may [[VW:encounter|/ɪnˈkaʊntə(r)/|遭遇；偶遇，邂逅；遭遇…]] a neighbour, [[VW:chase|/tʃeɪs/|追逐；追求；追逐；追求]] a missed bus or [[VW:miss|/mɪs/|想念；未注意到]] an [[VW:appointment|/əˈpɔɪntmənt/|约会；指派]] because a [[VW:dependent|/dɪˈpendənt/|依靠的，依赖的]] child needs help. To [[VW:accompany|/əˈkʌmpəni/|陪伴；伴随]] someone is not to control them. Care can be [[VW:intimate|/ˈɪntɪmət/|亲密的；个人隐私的…]] without becoming possessive, and independence can coexist with mutual support. A community is strongest when it recognises that dependence changes across a lifetime: children depend on adults, adults may depend on one another, and older people may",
     "zh": "共同生活是一连串相遇。居民可能遇见邻居，追赶错过的公 交，或因受抚养子女需要帮助而错过预约。陪伴某人并不等于控制对方。照料可以亲密，却不该变成占有；独立也可以 与相互支持并存。社区在承认依赖会贯穿一生时最为强健： 孩子依赖成人，成人可能彼此依赖，老年人则依赖尊重其尊严的服务。"
    },
    {
     "en": "Identity is also shaped by work, migration and social change. A farm worker may be a [[VW:pioneer|/ˌpaɪəˈnɪə(r)/|先驱，开创者]] in sustainable methods; a teacher may act as a [[VW:herald|/ˈherəld/|使者，传令官；先驱，预兆…]] of curiosity; a politician may inherit a public role and still choose whether to serve or merely occupy it. A person can belong to several groups at once and still remain an individual. Respect does not require agreement, and",
     "zh": "身份也由工作、迁徙和社会变化塑造。农场工人可能是可持续方法的先驱；教师可能是好奇心的先声；政治家可能继承公共角色，却仍可选择服务，或只是占据位置。一个人可以同时属于多个群体，也仍是一个独立个体。尊重不要求意见一致，归属也不要求沉默。"
    },
    {
     "en": "The deepest lesson is that family and community are practices rather than labels. They are made when people remember an [[VW:appointment|/əˈpɔɪntmənt/|约会；指派]], share a [[VW:chore|/tʃɔː(r)/|家庭杂务；乏味无聊的工作]], welcome a stranger or care for someone who cannot repay them. Institutions can support those practices, but they cannot manufacture affection. A humane society protects the vulnerable without turning dependence into shame and honours closeness without making it",
     "zh": "最深的教训是，家庭与社区是实践，而非标签。当人们记住一次约定、分担一项家务、欢迎陌生人，或照料无法回报自 己的人时，家庭与社区便被创造出来。制度可以支持这些实 践，却不能制造情感。人道社会保护脆弱者，却不把依赖变 成羞耻；尊重亲密，却不把它变为强制。"
    }
   ],

    {
     "en": "Work gives shape to identity, but it does not define a person completely. A [[VW:delegate|/ˈdelɪɡət/|代表；授权，委派]] represents others, while a [[VW:coward|/ˈkaʊəd/|懦夫，胆小鬼]] may avoid responsibility; courage and fear can appear in the same individual . A couple may [[VW:propose|/prəˈpəʊz/|提议；向··求婚]] [[VW:engagement|/ɪnˈɡeɪdʒmənt/|婚约；约定]] before they [[VW:marry|/ˈmæri/|娶，嫁，结婚]], celebrate a [[VW:wedding|/ˈwedɪŋ/|婚礼]] and leave for a [[VW:honeymoon|/ˈhʌnimuːn/|蜜月]]. A [[VW:kiss|/kɪs/|吻，接吻；吻]] can express [[VW:affection|/əˈfekʃn/|喜爱，喜欢]], and marriage can last or end in [[VW:divorce|/dɪˈvɔːs/|离婚…]]. A [[VW:single|/ˈsɪŋɡ(ə)l/|单一的；单身的]] person may be [[VW:sole|/səʊl/|仅有的，唯一的]] head of a household, while partners remain [[VW:respective|/rɪˈspektɪv/|各自的，分别的]] individuals rather than copies of [[VW:each|/iːtʃ/|各个，各自 det.各，每]] other. [[VW:Each|/iːtʃ/|各个，各自 det.各，每]] [[VW:member|/ˈmembə(r)/|成员；会员]] of a team brings a distinct skill, 02 A [[VW:neighbourhood|/ˈneɪbəhʊd/|街坊；居住区；周边地区]] is a small social system. A [[VW:commuter|/kəˈmjuːtə(r)/|上下班往返者，通勤者]] may travel far to work and still care deeply about the local community. A [[VW:member|/ˈmembə(r)/|成员；会员]] may join a club, while a [[VW:boss|/bɒs/|老板，上司]], [[VW:manager|/ˈmænɪdʒə(r)/|经理，管理人]], [[VW:supervisor|/ˈsuːpəvaɪzə(r)/|管理者，监督者]] and [[VW:subordinate|/səˈbɔːdɪnət/|部属，下级]] negotiate authority. A [[VW:partner|/ˈpɑːtnə(r)/|伙伴，盟友]], [[VW:colleague|/ˈkɒliːɡ/|同事，同僚]] or [[VW:comrade|/ˈkɒmreɪd/|同志；(尤指共患难的)同伴]] may share a task, and an [[VW:acquaintance|/əˈkweɪntəns/|相识的人，泛泛之交；认识…]] may become a friend. [[VW:Friendship|/ˈfrendʃɪp/|友谊；友情，友好]] rests on trust, [[VW:affection|/əˈfekʃn/|喜爱，喜欢]] and reciprocity; a [[VW:stranger|/ˈstreɪndʒə(r)/|陌生人；新来者]] deserves basic courtesy, and an [[VW:apprentice|/əˈprentɪs/|学徒，徒弟…]] learns by watching a skilled worker. A [[VW:deputy|/ˈdepjuti/|代理人，副手]] may act when a senior official is absent, and a [[VW:hero|/ˈhɪərəʊ/|男主角，男主人公；英雄；勇士]] or [[VW:heroine|/ˈherəʊɪn/|女主角，女主人公；女英雄]] may be ordinary rather",
     "zh": "工作塑造身份，却不能完全定义一个人。代表为他人发声， 懦夫可能逃避责任；勇气与恐惧也能出现在同一个人身上。一对伴侣可能在结婚前求婚订婚，庆祝婚礼，然后启程度蜜 月。亲吻可以表达情感，婚姻可以持续，也可能以离婚告终。 单身者可以是家庭唯一负责人，伴侣则仍是各自独立的个体而非彼此的复制品。团队中的每位成员都带来不同技能， 任何角色都不应抹去个人尊严。邻里是一个小型社会系统。通勤者可能远行上班，却仍深切 关心本地社区。成员可以加入俱乐部，老板、经理、主管与下属则协商权威关系。伙伴、同事或同志可以共同完成任务熟人则可能变成朋友。友谊建立在信任、情感与互惠之上 ；陌生人应得到基本礼貌，学徒通过观察熟练工人学习。副 手可以在高级官员缺席时代理职责，英雄或女英雄也可能平凡而不出名。"
    },
    {
     "en": "Public institutions depend on many specialised roles. An [[VW:actress|/ˈæktrəs/|女演员]] performs for an audience, while a [[VW:chancellor|/ˈtʃɑːnsələ(r)/|(德国或奥地利)总理…]], [[VW:commander|/kəˈmɑːndə(r)/|司令官，指挥官]] or [[VW:director|/dəˈrektə(r); daɪˈrektə(r)/|主管；理事；导演]] leads an organisation. A [[VW:proponent|/prəˈpəʊnənt/|拥护者，支持者]] argues for a policy, and a [[VW:committee|/kəˈmɪti/|委员会]] or [[VW:council|/ˈkaʊns(ə)l/|委员会；市政委员会]] deliberates before making a decision. A [[VW:specialist|/ˈspeʃəlɪst/|专家；专科医生]] provides depth, a [[VW:consultant|/kənˈsʌltənt/|顾问；［英］会诊医师]] offers independent advice, and a [[VW:veterinary|/ˈvetnri/|兽医的]] surgeon cares for animals. A [[VW:counsellor|/ˈkaʊnsələ(r)/|顾问，辅导顾问]] listens, a [[VW:solicitor|/səˈlɪsɪtə(r)/|(英国的)诉状律师，事务律师…]] or [[VW:attorney|/əˈtɜːni/|(美国的)律师]] prepares a legal case, and an [[VW:umpire|/ˈʌmpaɪə(r)/|裁判员]] protects",
     "zh": "公共机构依赖许多专业角色。女演员为观众表演，校长、指 挥官或主任领导组织。支持者为政策辩护，委员会或理事会则在决定前进行审议。专家提供深度，顾问提供独立建议， 兽医则照顾动物。咨询师倾听，事务律师或辩护律师准备法 律案件，裁判则维护比赛规则。"
    },
    {
     "en": "Daily life also relies on visible and invisible service. A [[VW:cashier|/kæˈʃɪə(r)/|出纳员，收银员]] handles payment, a [[VW:fireman|/ˈfaɪəmən/|消防队员；司炉工]] responds to danger, and a [[VW:nurse|/nɜːs/|护士；保姆；护理]] provides care when a patient is most vulnerable. A [[VW:gardener|/ˈɡɑːdnə(r)/|园丁，花匠]] cultivates a public space, a [[VW:barber|/ˈbɑːbə(r)/|理发师]] gives a [[VW:haircut|/ˈheəkʌt/|理发]], and a [[VW:fisherman|/ˈfɪʃəmən/|渔民，渔夫，垂钓者]] works with weather and tide. A [[VW:butcher|/ˈbʊtʃə(r)/|屠夫；杀人狂]] prepares meat, while a [[VW:groom|/ɡruːm/|马夫；新郎 (给动物)刷洗…]] may care for horses or stand beside a bride. A [[VW:hostage|/ˈhɒstɪdʒ/|人质]] is denied freedom, and every society has a duty to protect that",
     "zh": "日常生活也依赖可见与不可见的服务。收银员处理付款，消 防员应对危险，护士则在患者最脆弱时提供照料。园丁培育公共空间，理发师修剪头发，渔民与天气和潮汐打交道。屠 夫处理肉类，马夫可能照顾马匹，也可能站在新娘身旁。人质被剥夺自由，每个社会都有责任保护此人，却不能把营救 变成表演。"
    },
    {
     "en": "Some work carries dignity precisely because it is difficult. People may [[VW:toil|/tɔɪl/|苦工，苦活；网，圈套…]] for long hours, and a [[VW:beggar|/ˈbeɡə(r)/|乞丐]] may depend on the mercy of strangers. A [[VW:slave|/sleɪv/|奴隶]] is owned and controlled; this is a crime against humanity, not a normal occupation. Whatever the title, work should not reduce a person to a tool. Fair pay, safe conditions",
     "zh": "有些工作正因艰难而承载尊严。人们可能长时间辛劳，乞丐可能依赖陌生人的怜悯。奴隶被占有和控制；这是反人类罪而非正常职业。无论头衔为何，工作都不应把人贬低为工 具。公平薪酬、安全条件与组织权保护劳动的人性。"
    },
    {
     "en": "Identity becomes healthier when it includes more than a job title. A person can be a careful [[VW:manager|/ˈmænɪdʒə(r)/|经理，管理人]], a devoted parent and a curious forms and remembers that the person behind every role is larger than the work they perform.",
     "zh": "当身份包含的不只是职位时，它会更健康。一个人可以同时是谨慎的管理者、尽责的家长和好奇的邻居，而不让某一角色吞掉其他角色。良好社会珍视多种形式的贡献，并记住每个角色背后的人，都比其所做的工作更大。"
    }
   ],

  {
   "zhTitle": "选择与改变",
   "enTitle": "Choice and Change",
   "paragraphs": [
    {
     "en": "People [[VW:act|/ækt/|行动；行为]] and [[VW:behave|/bɪˈheɪv/|表现；(机器等)运转]] in ways that reveal habit, intention and circumstance. A good [[VW:deed|/diːd/|行为；功绩；契约]] may be small, yet repeated practice can [[VW:accustom|/əˈkʌstəm/|使习惯(于)]] a person to patience. We [[VW:react|/riˈækt/|作出反应，反应]] to danger, [[VW:respond|/rɪˈspɒnd/|回答；响应，作出反应]] to kindness and [[VW:reflect|/rɪˈflekt/|反映；反射]] on consequences before choosing what to [[VW:adopt|/əˈdɒpt/|收养；采取，采用]]. Healthy routines [[VW:nourish|/ˈnʌrɪʃ/|滋养，给......提供营养]] the body; a gardener may [[VW:mow|/məʊ/|割，修剪干草堆]] a lawn, while friends [[VW:support|/səˈpɔːt/|支撑；支持；供养支持；帮助]] one another through difficulty. An athlete may [[VW:exhale|/eksˈheɪl/|呼气，呼出]] slowly to control [[VW:intake|/ˈɪnteɪk/|吸入；摄取量；新招收者]] of air, [[VW:revive|/rɪˈvaɪv/|(使)苏醒…]] after rest and [[VW:survive|/səˈvaɪv/|幸存；生存]] a demanding race. Action is not merely movement; it",
     "zh": "人们行动与表现的方式揭示习惯、意图和处境。一件善行可 能很小，反复实践却会使人习惯于耐心。我们会回应危险，对善意作出反应，并在决定采取什么做法前反思后果。健康日常滋养身体；园丁可能修剪草坪，朋友则在困难中相互支 持。运动员可能缓慢呼气以控制空气摄入，在休息后恢复， 并挺过艰苦比赛。行动不只是运动，而是通过选择表达的意 义。"
    },
    {
     "en": "Attention changes what we see when we look. A driver may [[VW:glare|/ɡleə(r)/|怒目而视；发出强光刺眼的光…]] at a reckless car, [[VW:glimpse|/ɡlɪmps/|瞥见一瞥]] movement at the edge of vision or [[VW:glance|/ɡlɑːns/|瞥，迅速看一眼一瞥]] at a mirror. A child might [[VW:peep|/piːp/|窥视，偷看偷偷一瞥]] through a door, an astronomer may [[VW:gaze|/ɡeɪz/|凝视，注视]] at the sky, and a reader may [[VW:peer|/pɪə(r)/|凝视，盯着看同等地位的人，同辈…]] at faint print or [[VW:stare|/steə(r)/|凝视，盯着看]] into the distance. To [[VW:contemplate|/ˈkɒntəmpleɪt/|凝视；沉思；考虑]] is to look inward as well as outward, allowing observation to become",
     "zh": "注意力会改变我们观察时看到的东西。司机可能怒视鲁莽车辆，在视野边缘瞥见动静，或扫视后视镜。孩子可能从门缝 偷看，天文学家可能凝视天空，读者可能细看模糊字迹或久 久凝视远方。沉思既是向外观察，也是向内观看，让观察变 成理解。"
    },
    {
     "en": "Speech can build trust or destroy it. A witness may [[VW:vow|/vaʊ/|誓约发誓]] to tell the truth, take an [[VW:oath|/əʊθ/|誓言；宣誓]] or [[VW:pledge|/pledʒ/|保证；保证，誓言]] to protect a secret. A referee may [[VW:whistle|/ˈwɪs(ə)l/|口哨；哨子；汽笛声吹口哨…]] for a pause, and a colleague may [[VW:reply|/rɪˈplaɪ/|回答，答复；回答，答复]] to a message or [[VW:notify|/ˈnəʊtɪfaɪ/|通知，告知]] a manager of risk. A scientist should [[VW:assert|/əˈsɜːt/|断言，坚称…]] the evidence clearly, [[VW:explain|/ɪkˈspleɪn/|说明，解释]] method and avoid claiming more than the data [[VW:support|/səˈpɔːt/|支撑；支持；供养支持；帮助]]. In a [[VW:quarrel|/ˈkwɒrəl/|吵架，争论；吵架，争论]], however, people may [[VW:dispute|/dɪˈspjuːt/|争论，辩论；争论，辩论]] details and turn an [[VW:argument|/ˈɑːɡjumənt/|辩论，争论；论点，论据]] into a contest of pride. A simple [[VW:mention|/ˈmenʃ(ə)n/|提及，说起；提及，说起]] can become an accusation; [[VW:hurry|/ˈhʌri/|赶紧；催促匆忙]] and [[VW:hasten|/ˈheɪs(ə)n/|赶紧；促进]] a decision, [[VW:urge|/ɜːdʒ/|催促，敦促冲动]] restraint, [[VW:scold|/skəʊld/|责骂，斥责]] a child or [[VW:curse|/kɜːs/|诅咒；咒骂咒语：咒骂话]] at traffic. To [[VW:swear|/sweə(r)/|诅咒，咒骂；发苔，保证]] can mean to promise, but it can also express anger; to [[VW:provoke|/prəˈvəʊk/|激怒，挑拨；引起]] a fight is different from making a point. A person may [[VW:preach|/priːtʃ/|宣扬]] tolerance, [[VW:boast|/bəʊst/|自夸，吹嘘；自夸，吹嘘]] about success, [[VW:tease|/tiːz/|取笑，嘲弄]] a friend or [[VW:mock|/mɒk/|嘲笑，嘲弄；模拟的，假装的]] someone unfairly.",
     "zh": "言语可以建立信任，也能摧毁它。证人可能发誓说实话、宣誓，或承诺保护秘密。裁判可能吹哨暂停，同事可能回复信息，或提醒经理存在风险。科学家应清晰断言证据、解释方法，避免宣称超出数据支持的内容。争吵中，人们却可能对细节争论，把论证变成自尊竞赛。一次简单提及可能变成指控；匆忙并催促决定、力劝克制、责骂孩子或咒骂交通。发誓可以表示承诺，也能表达愤怒；挑起打斗与表达观点并不相同。一个人可能宣讲宽容、夸耀成功、戏弄朋友，或不公平地嘲弄他人。"
    },
    {
     "en": "The body expresses emotion before language can. Two people may [[VW:touch|/tʌtʃ/|触摸；触动触觉；接触]] hands, [[VW:hug|/hʌɡ/|拥抱；拥抱]] after a long absence, [[VW:clap|/klæp/|拍手；轻拍；鼓掌]] in [[VW:support|/səˈpɔːt/|支撑；支持；供养支持；帮助]] or [[VW:applaud|/əˈplɔːd/|鼓掌；称赞，赞许]] a performance. A person may [[VW:fold|/fəʊld/|折叠，对折]] a letter, [[VW:kneel|/niːl/|跪，跪下]] in prayer or [[VW:catch|/kætʃ/|捉住；赶上；领会]] a falling cup. We [[VW:snatch|/snætʃ/|一把抓住，迅速夺取]] an object in surprise, [[VW:grab|/ɡræb/|抓住，攫取；(匆忙地)取]] a chance, [[VW:grasp|/ɡrɑːsp/|抓牢，握紧…]] an idea or [[VW:overtake|/ˌəʊvəˈteɪk/|追上，超过；(情感等)压倒]] a slower runner. To [[VW:follow|/ˈfɒləʊ/|跟随…]] instructions is not the same as to [[VW:grip|/ɡrɪp/|紧握，抓牢紧握，抓牢…]] a rope; one requires judgment, the other force.",
     "zh": "身体会在语言之前表达情绪。两个人可能触碰双手，久别后拥抱，鼓掌支持，或为表演喝彩。一个人可能折信、跪下祈祷，或接住掉落的杯子。我们会在惊讶中夺过物品、抓住机会、领会想法，或超过跑得较慢的人。遵循说明不同于紧握绳索；前者需要判断，后者需要力量。"
    },
    {
     "en": "Ordinary work involves precise movement. A table may be a [[VW:mess|/mes/|混乱，脏乱弄乱]] after a project, so a worker might [[VW:twist|/twɪst/|拧，扭；使缠绕拧，扭动]] a wire, [[VW:scatter|/ˈskætə(r)/|撒；(使)散开]] seeds, [[VW:fasten|/ˈfɑːs(ə)n/|拍牢，系牢，缚紧]] a button or [[VW:loosen|/ˈluːs(ə)n/|解开，松开；放宽(限制等)]] a screw. A careless blow can [[VW:smash|/smæʃ/|打碎；(使)猛烈撞击…]] glass, [[VW:scratch|/skrætʃ/|擦破，刮坏；搔乱涂…]] a surface, [[VW:scrape|/skreɪp/|刮掉；擦坏；勉强获得刮；擦伤]] paint, [[VW:wipe|/waɪp/|揩，擦]] a spill or [[VW:polish|/ˈpɒlɪʃ/|擦光，擦亮；使完美，改选]] metal until it shines. A branch may [[VW:split|/splɪt/|(使)开裂；(使)分裂…]]; trees [[VW:sway|/sweɪ/|(使)摇摆，(使)摆动，(使)摇晃…]] in wind; windows [[VW:shake|/ʃeɪk/|摇动，(使)颤动摇动，颤动]] and machines [[VW:vibrate|/vaɪˈbreɪt/|(使)振动，(使)摇摆]]. A wheel can [[VW:whirl|/wɜːl/|(使)回旋回旋]], [[VW:rotate|/rəʊˈteɪt/|(使)旋转，(使)转动]] or [[VW:shuffle|/ˈʃʌf(ə)l/|洗(牌)；拖着脚走…]] forward, while a dancer learns to turn without losing",
     "zh": "日常工作包含精确动作。项目结束后桌面可能一片混乱，工人可能拧线、播撒种子、扣上纽扣或拧松螺钉。草率一击会打碎玻璃、划伤表面、刮掉油漆、擦去溢出物，或把金属抛光到发亮。树枝可能裂开，树木随风摇摆，窗户震动，机器颤动。轮子可以旋转、转动或拖着移动，舞者则学习转身而不失衡。"
    },
    {
     "en": "Things meet in different ways. Cars may [[VW:collide|/kəˈlaɪd/|碰撞；抵触]]; a hand may [[VW:contact|/ˈkɒntækt/|接触，联系；接触，联系]] a surface; wires [[VW:connect|/kəˈnekt/|(使)连接…]] separate devices. To [[VW:combine|/kəmˈbaɪn/|(使)联合，(使)结合]] ingredients, [[VW:integrate|/ˈɪntɪɡreɪt/|(使)成为一体，(使)合并]] systems or [[VW:insert|/ɪnˈsɜːt/|插入，嵌入插入物]] a key is to make a new relationship. Rain can [[VW:penetrate|/ˈpenətreɪt/|刺入，穿透；渗透；洞察]] soil, a needle can [[VW:pierce|/pɪəs/|刺穿，刺破，穿透；使心如刀割]] cloth and a frame may [[VW:tilt|/tɪlt/|(使)倾斜，(使)歪斟]] on uneven ground. A truck may [[VW:tow|/təʊ/|拖，控，牵引牵引]] a trailer, leaving a [[VW:trail|/treɪl/|(使)拖在后面；跟踪踪迹]] of dust behind.",
     "zh": "事物以不同方式相遇。汽车可能相撞，手可能接触表面，导线连接独立设备。混合原料、整合系统或插入钥匙，都是创造新关系。雨水能渗入土壤，针能刺穿布料，框架会在不平地面上倾斜。卡车可以拖曳挂车，身后留下尘土轨迹。"
    },
    {
     "en": "Reflection gives action its ethical shape. We cannot control every event, but we can choose whether to [[VW:act|/ækt/|行动；行为]] with care, [[VW:respond|/rɪˈspɒnd/|回答；响应，作出反应]] with generosity and help others [[VW:survive|/səˈvaɪv/|幸存；生存]] uncertainty. A [[VW:deed|/diːd/|行为；功绩；契约]] matters most when no audience is watching.",
     "zh": "反思赋予行动伦理形状。我们无法控制每个事件，却能选择是否谨慎行动、以宽厚作出反应，并帮助他人挺过不确定。一项行为最有意义之时，往往没有观众在看。"
    }

  {
   "zhTitle": "沟通与行动",
   "enTitle": "Communication and Action",
   "paragraphs": [
    {
     "en": "Choice begins with arrangement. A planner may [[VW:arrange|/əˈreɪndʒ/|安排，整理，使有条理]] resources, [[VW:manipulate|/məˈnɪpjuleɪt/|(熟练地操作；操纵]] a model, [[VW:steer|/stɪə(r)/|为(船)操舵，驾驶(船、车等)…]] a project toward a goal, [[VW:bet|/bet/|下注，打赌；敢说打赌；赌注]] on an uncertain outcome, [[VW:stake|/steɪk/|赌注；桩以……打赌]] reputation on a decision or [[VW:gamble|/ˈɡæmb(ə)l/|赌博；冒险；赌博；冒险]] with limited information. A [[VW:promise|/ˈprɒmɪs/|诺言；承诺]] creates expectation. A public ceremony may [[VW:baptise|/ˌbæpˈtaɪz/|给......施行洗礼(或浸礼)…]] a new member, and a persuasive idea can [[VW:attract|/əˈtrækt/|吸引；引起]] attention until it seems to [[VW:obsess|/əbˈses/|(使)痴迷，(使)心神不宁]] the mind and [[VW:mesmerise|/ˈmezməraɪz/|吸引，迷住]] reasoning. A [[VW:nightmare|/ˈnaɪtmeə(r)/|噩梦，梦魔]] may reveal fear that daytime confidence conceals. A group may [[VW:expel|/ɪkˈspel/|驱逐；开除；排出]] a member, a [[VW:bully|/ˈbʊli/|恐吓，欺凌；恃强凌弱者]] may intimidate someone weaker, and a discovery may [[VW:amaze|/əˈmeɪz/|使惊奇，使惊愕]], [[VW:astonish|/əˈstɒnɪʃ/|使惊讶]] or make us [[VW:marvel|/ˈmɑːv(ə)l/|感到惊讶，大为赞叹奇迹]]. To [[VW:involve|/ɪnˈvɒlv/|(使)参加；牵涉]] people in a decision can empower them; to [[VW:annoy|/əˈnɔɪ/|使恼怒；打扰]], [[VW:upset|/ˌʌpˈset/|使心烦意乱，使生气；搅乱…]] or [[VW:bewilder|/bɪˈwɪldə(r)/|使迷惑，使不知所措]] them can destroy",
     "zh": "选择始于安排。规划者可能安排资源、操纵模型、引导项目走向目标，在不确定结果上下注，以声誉押注决定，或用有限信息赌博。承诺会创造期待。公共仪式可能为新成员施洗有说服力的想法则能吸引注意，直到它似乎占据头脑、迷 住理性。噩梦可能揭示白天信心所掩盖的恐惧。群体可能驱逐成员，霸凌者可能恐吓弱者，一项发现则可能令人惊奇、震惊，或让我们惊叹。让人参与决定能赋予其力量；惹恼、 扰乱或迷惑他们，则会毁掉合作。"
    },
    {
     "en": "Language can expose what power denies. [[VW:Irony|/ˈaɪrəni/|反话；有讽刺意味的情形]] reveals a gap between words and reality; [[VW:indignity|/ɪnˈdɪɡnəti/|侮辱，轻蔑]] strips away respect; [[VW:contempt|/kənˈtempt/|轻视，藐视]] treats a person as worthless. [[VW:Neglect|/nɪˈɡlekt/|忽视，忽略；忽视，忽略]], [[VW:disregard|/ˌdɪsrɪˈɡɑːd/|不顾，漠视忽视，漠视]] and [[VW:ignorance|/ˈɪɡnərəns/|无知，愚昧]] are not identical: one may forget a duty, ignore evidence or simply lack knowledge. [[VW:Bias|/ˈbaɪəs/|使有偏见，使偏心偏见，俑，心]] can make judgment [[VW:deviate|/ˈdiːvieɪt/|偏离，背离]] from fairness. When danger appears, people may [[VW:flee|/fliː/|逃避，逃离]], [[VW:panic|/ˈpænɪk/|惊恐，惊慌(使)惊恐，(使)惊慌…]] or [[VW:terrify|/ˈterɪfaɪ/|使恐惧，使非常害怕]] one another. A [[VW:desire|/dɪˈzaɪə(r)/|愿望，欲望渴望，期望]] for [[VW:revenge|/rɪˈvendʒ/|报仇，复仇向......报仇]] can turn grief into cruelty. Criminals may [[VW:kidnap|/ˈkɪdnæp/|绑架，劫持]] a traveller, [[VW:hijack|/ˈhaɪdʒæk/|劫持(飞机或真他交通工具)]] a vehicle or [[VW:smuggle|/ˈsmʌɡ(ə)l/|走私，偷运]] goods. A court may [[VW:convict|/kənˈvɪkt/|定罪，宣判......有罪8决犯…]] a criminal, yet violence can go further when criminals [[VW:strangle|/ˈstræŋɡl/|扼杀，压制；勒死，扼死]] a victim, commit [[VW:massacre|/ˈmæsəkə(r)/|残杀，屠杀；残杀，屠杀]] or cause [[VW:decimation|/ˌdesɪˈmeɪʃn/|大批杀死，大量毁灭；大大削弱]]. Outsiders must [[VW:intervene|/ˌɪntəˈviːn/|插话；干扰；平涉]] to stop harm, not merely observe it, and corruption can [[VW:impede|/ɪmˈpiːd/|妨碍，阻止]] every [[VW:rescue|/ˈreskjuː/|营救，救援；营救，救援物]].",
     "zh": "语言能揭示权力所否认之事。讽刺揭示言词与现实之间的缝隙；侮辱剥夺尊重；蔑视把人当作毫无价值。忽视、漠视与无知并不相同：一个人可能忘记职责、无视证据，或仅仅缺乏知识。偏见会使判断偏离公平。危险出现时，人们可能逃跑、恐慌，或彼此恐吓。复仇欲望会把悲伤变成残酷。犯罪分子可能绑架旅行者、劫持车辆或走私货物。法院可以判犯罪者有罪，暴力却会进一步走向勒死受害者、实施屠杀或造成大规模毁灭。旁观者必须介入阻止伤害，而不只是观看；腐败则会阻碍每一次救援。"
    },
    {
     "en": "Influence often works through temptation. An advertisement may [[VW:allure|/əˈlʊə(r)/|吸引，引诱]] a buyer, [[VW:bait|/beɪt/|v，使上当发火诱饵；诱惑物]] a click or [[VW:induce|/ɪnˈdjuːs/|引诱，劝说]] a purchase; a discount may [[VW:tempt|/tempt/|引诱，诱惑；怂恿]] a shopper. A manager may [[VW:designate|/ˈdezɪɡneɪt/|指明；选派，指派]] a leader, [[VW:assign|/əˈsaɪn/|布置；分配；指定；确定]] a task, [[VW:distribute|/dɪˈstrɪbjuːt/|分发，分配]] work and [[VW:despatch|/dɪˈspætʃ/|派遣，调派；迅速处理]] a team. Training can [[VW:detach|/dɪˈtætʃ/|(使)分开，(使)分离；派遣]] people from old habits, [[VW:undo|/ʌnˈduː/|解开，打开；取消]] a mistake, [[VW:disguise|/dɪsˈɡaɪz/|掩饰；假扮，伪装假扮；伪装物]] a weakness or [[VW:conceal|/kənˈsiːl/|隐藏，掩盖]] a motive. A person may [[VW:refuse|/rɪˈfjuːz/|拒绝；回绝]] an order, [[VW:exclude|/ɪkˈskluːd/|把......排除在外；拒]] a rival or [[VW:reverse|/rɪˈvɜːs/|颠倒，彻底改变…]] a decision.",
     "zh": "影响常通过诱惑发挥作用。广告可能吸引买家、诱惑点击或诱导购买；折扣可能诱惑购物者。管理者可以指定负责人、分配任务、分发工作并派遣团队。训练可以让人脱离旧习惯、撤销错误、伪装弱点或隐藏动机。一个人可以拒绝命令、排斥对手或推翻决定。"
    },
    {
     "en": "Trust requires more than persuasion. A leader may [[VW:assure|/əˈʃʊə(r)/|向......保证；保证…]] the public, [[VW:undertake|/ˌʌndəˈteɪk/|承担；许诺，保证]] reform and [[VW:stipulate|/ˈstɪpjuleɪt/|规定，明确要求；保证]] clear standards. Evidence can [[VW:convince|/kənˈvɪns/|使确信，使信服；说服]] a sceptic, and a clear explanation can [[VW:reassure|/ˌriːəˈʃʊə(r)/|使安心，使放心]] the public. People [[VW:wish|/wɪʃ/|想要(某事发生)希望]] for safety, [[VW:aspire|/əˈspaɪə(r)/|有志于，渴望]] to justice, [[VW:desire|/dɪˈzaɪə(r)/|愿望，欲望渴望，期望]] recognition and [[VW:yearn|/jɜːn/|渴望，向往]] for belonging. A community may [[VW:invoke|/ɪnˈvəʊk/|唤起(感情等)…]] the law to [[VW:rescue|/ˈreskjuː/|营救，救援；营救，救援物]] the vulnerable. An [[VW:itch|/ɪtʃ/|发痒；渴望；痒；渴望]] to act is natural, but every [[VW:attempt|/əˈtempt/|尝试，试图尝试，企图]] should be cautious, every [[VW:effort|/ˈefət/|努力；努力的成果]] should [[VW:strive|/straɪv/|努力，奋斗]] for fairness and every plan should have a purpose.",
     "zh": "信任不只依赖说服。领导人可以安抚公众、承诺改革并规定明确标准。证据能说服怀疑者，清晰解释则能安慰公众。人们渴望安全、追求正义、希望被承认，并盼望归属。社区可以援引法律拯救脆弱者。行动冲动很自然，但每次尝试都应谨慎，每份努力都应力求公平，每个计划都应有目的。"
    },
    {
     "en": "To [[VW:fulfil|/fʊlˈfɪl/|履行，实现；完成；满足]] a goal takes stages. First, [[VW:sort|/sɔːt/|种类，类别把......分类]] priorities; then watch a deadline [[VW:loom|/luːm/|(庞然大物或形状模糊之物)隐现…]] and [[VW:launch|/lɔːntʃ/|发射；发布，推出…]] the work. Before you [[VW:commence|/kəˈmens/|开始，着手]] a difficult task, [[VW:explore|/ɪkˈsplɔː(r)/|勘查，考察；探讨]] options rather than [[VW:exploit|/ɪkˈsplɔɪt/|开发，开采，开拓]] people. [[VW:Exert|/ɪɡˈzɜːt/|运用，行使；施加]] steady pressure, [[VW:tackle|/ˈtæk(ə)l/|处理，应对，解决用处，器材]] the central problem, [[VW:cope|/kəʊp/|应付，处理]] with setbacks, [[VW:dispose|/dɪˈspəʊz/|布置，安排]] of waste safely and [[VW:conduct|/kənˈdʌkt/|进行，实施；举止，行为]] yourself with honesty. If a detail is wrong, [[VW:omit|/əˈmɪt/|遗漏；省略；删去]] it from the final record, [[VW:delete|/dɪˈliːt/|删除，删掉]] private data and [[VW:cancel|/ˈkæns(ə)l/|取消；废除]] a plan that cannot be justified.",
     "zh": "实现目标需要阶段。先整理优先事项，再看着期限逼近并启动工作。开始困难任务前，探索选项，而非剥削他人。稳定施力，处理核心问题，应对挫折，安全处置废物，并以诚实约束自己。若细节错误，就把它从最终记录中省略，删除私人数据，并取消无法辩护的计划。"
    },
    {
     "en": "Responsibility turns intention into character. To [[VW:promise|/ˈprɒmɪs/|诺言；承诺]] is easy; to repair is difficult. To influence is powerful; to [[VW:manipulate|/məˈnɪpjuleɪt/|(熟练地操作；操纵]] is corrosive. The ethical question is not only whether an action works, but whether it leaves other people more free, more informed and more able to choose.",
     "zh": "责任把意图变成品格。承诺容易，修复困难。施加影响很有力量，操纵他人则具有腐蚀性。伦理问题不只在于行动是否有效，还在于它是否让他人更自由、更有信息，也更能够作出选择。"
    }
   ],

  {
   "zhTitle": "困境与修复",
   "enTitle": "Trouble and Repair",
   "paragraphs": [
    {
     "en": "Repair begins by seeing clearly. We may [[VW:clear|/klɪə(r)/|清晰的；明显的清除]] debris, [[VW:erase|/ɪˈreɪz/|清除；抹去]] an old record, [[VW:resort|/rɪˈzɔːt/|求助于，采取，诉诸 (度假)胜地…]] to a temporary measure, [[VW:recover|/rɪˈkʌvə(r)/|重新拿回；恢复健康…]] a lost file, [[VW:restore|/rɪˈstɔː(r)/|恢复；归还；修复]] a damaged relationship, [[VW:rectify|/ˈrektɪfaɪ/|纠正，矫正，改正]] an error or [[VW:redeem|/rɪˈdiːm/|赎回；挽回，补偿；兑现]] a past failure. One improvement can [[VW:offset|/ˈɒfset/|补偿；抵消；抵消物，补偿]] part of a loss. To [[VW:replenish|/rɪˈplenɪʃ/|重新装满，补充]] supplies, [[VW:obtain|/əbˈteɪn/|获得，得到]] evidence, [[VW:gain|/ɡeɪn/|获得；增加增加；改造]] trust, [[VW:supply|/səˈplaɪ/|供给，供应，提供供应量…]] aid, [[VW:offer|/ˈɒfə(r)/|给予(物)；提议提供…]] comfort and [[VW:render|/ˈrendə(r)/|给予，提供；翻译]] service is to rebuild capacity rather than merely hide damage.",
     "zh": "修复始于清楚看见。我们可以清理碎片、抹去旧记录、求助于临时措施、找回丢失文件、恢复受损关系、纠正错误，或赎回过去的失败。一项改善可以抵消部分损失。补充供给、取得证据、赢得信任、提供援助、给予安慰并提供服务，是重建能力，而非仅仅隐藏损害。"
    },
    {
     "en": "Small interventions can [[VW:enlarge|/ɪnˈlɑːdʒ/|扩大，扩展…]] a  a fund, [[VW:magnify|/ˈmæɡnɪfaɪ/|放大；夸大]] a weakness, [[VW:amplify|/ˈæmplɪfaɪ/|增强；扩大(声音)…]] a voice or [[VW:exaggerate|/ɪɡˈzædʒəreɪt/|夸张，夸大]] a risk. A wise leader will not [[VW:prolong|/prəˈlɒŋ/|延长]] a conflict, but will [[VW:uphold|/ʌpˈhəʊld/|支持，维护；维持]] a promise. A [[VW:backup|/ˈbækʌp/|后援，支持…]] system can [[VW:propel|/prəˈpel/|推动，驱使；推进]] recovery, [[VW:update|/ˌʌpˈdeɪt/|更新；使现代化]] information, [[VW:raise|/reɪz/|举起；引起；抚养；提高；筹募]] standards and [[VW:contain|/kənˈteɪn/|包含，容纳；抑制(感情)]] a crisis. Water may [[VW:leak|/liːk/|泄漏；漏洞，裂缝]] through a roof, [[VW:spill|/spɪl/|(使)溢出]] from a container, [[VW:seep|/siːp/|渗出，渗漏]] into soil or [[VW:ooze|/uːz/|渗出；洋溢着]] from a crack. When danger reaches a [[VW:Trench|/trentʃ/|掘沟于；砍除；沟，渠，壕沟]] or flood begins to [[VW:saturate|/ˈsætʃəreɪt/|使饱和，使充满；浸透]] the ground, people must [[VW:evacuate|/ɪˈvækjueɪt/|疏散，撤离]] before escape routes close.",
     "zh": "小干预可以扩大可能性、增加资金、放大弱点、增强声音或夸大风险。明智领导人不会延长冲突，而会维护承诺。备份系统能推动恢复、更新信息、提高标准并遏制危机。水可能从屋顶漏下、从容器溢出、渗入土壤，或从裂缝中慢慢渗出。危险抵达壕沟，或洪水开始浸透地面时，人们必须在逃生路线关闭前撤离。"
    },
    {
     "en": "Emotion can be repaired as well as property. To [[VW:forgive|/fəˈɡɪv/|原谅，宽恕，饶恕]] is not to forget, and to [[VW:regard|/rɪˈɡɑːd/|尊重；问候看待]] someone with respect is different from trying to [[VW:flatter|/ˈflætə(r)/|奉承，讨好，向......滔媚…]] them or [[VW:worship|/ˈwɜːʃɪp/|(对上帝或神的)崇拜，礼拜…]] a leader. For the [[VW:sake|/seɪk/|理由，目的]] of a common [[VW:purpose|/ˈpɜːpəs/|目的]], people may pursue a shared [[VW:objective|/əbˈdʒektɪv/|宗旨；目标；客观的]] that can [[VW:arouse|/əˈraʊz/|唤起，激起，引起]] hope, [[VW:trigger|/ˈtrɪɡə(r)/|引发，触发(枪等的)扳机]] cooperation and [[VW:cause|/kɔːz/|原因，理由；事业]] lasting change. We [[VW:seek|/siːk/|寻找；寻求]] truth, [[VW:retrieve|/rɪˈtriːv/|取回；挽回]] memory, [[VW:testify|/ˈtestɪfaɪ/|作证；证明]] in court, [[VW:verify|/ˈverɪfaɪ/|证实；核实，查清]] a claim, [[VW:specify|/ˈspesɪfaɪ/|具体指定，详细说明]] terms and [[VW:enlighten|/ɪnˈlaɪt(ə)n/|启发，开导，启迪]] others. Every teacher should [[VW:impart|/ɪmˈpɑːt/|传授；透露]] knowledge honestly, because trust is something each institution must [[VW:deserve|/dɪˈzɜːv/|应得；应受]].",
     "zh": "情感也能像财产一样修复。原谅不等于遗忘，以尊重看待某人，也不同于试图奉承或崇拜领袖。为了共同目标，人们可以追求一个能激发希望、触发合作并带来持久改变的目的。我们寻求真相、找回记忆、在法庭作证、核实主张、明确条款并启发他人。每位教师都应诚实传授知识，因为信任是每个机构必须配得之物。"
    },
    {
     "en": "Recognition gives effort meaning. A reputation may [[VW:drop|/drɒp/|(使)落下；(使)降低…]], a mood may [[VW:sink|/sɪŋk/|(使)下沉；下降]] or a price may [[VW:plummet|/ˈplʌmɪt/|垂直掉下…]]. Noise can [[VW:muffle|/ˈmʌf(ə)l/|使(声音)减弱]] a warning, while one crisis may [[VW:overshadow|/ˌəʊvəˈʃædəʊ/|遮蔽；使黯然失色]] another. A host may [[VW:invite|/ɪnˈvaɪt/|邀请]] a guest, [[VW:welcome|/ˈwelkəm/|欢迎；欢迎；欢迎]] a visitor, [[VW:greet|/ɡriːt/|向……问好，迎接…]] a neighbour, [[VW:salute|/səˈluːt/|(向……)行礼；致敬行礼…]] service, [[VW:celebrate|/ˈselɪbreɪt/|庆祝(节日、事件等)]] progress, [[VW:congratulate|/kənˈɡrætʃəleɪt/|祝贺，向……道贺]] a friend and [[VW:bless|/bles/|祝福，为......析求上帝保佑…]] a new beginning. To [[VW:participate|/pɑːˈtɪsɪpeɪt/|v，参加，参与]] fully is also to recognise [[VW:farewell|/ˌfeəˈwel/|再会；告别]]; endings and beginnings [[VW:correspond|/ˌkɒrəˈspɒnd/|符合，相一致；通信]] more closely than we often admit.",
     "zh": "认可赋予努力意义。声誉可能下跌，情绪可能低落，价格可能骤降。噪音会压低警告声，一场危机也会遮蔽另一场危机。主人可以邀请客人、欢迎来访者、问候邻居、致敬服务、庆祝进步、祝贺朋友并祝福新开端。充分参与也意味着承认告别；结束与开始之间的对应，比我们通常愿意承认的更紧密。"
    },
    {
     "en": "Memory organises experience. We [[VW:assort|/əˈsɔːt/|把......分类…]] impressions, notice how actions [[VW:correspond|/ˌkɒrəˈspɒnd/|符合，相一致；通信]] with words and [[VW:accord|/əˈkɔːd/|(与......)－致；给予…]] praise where it is due. We may  success to luck, [[VW:recall|/rɪˈkɔːl/|回忆，回想起]] a promise, [[VW:recollect|/ˌrekəˈlekt/|记起，想起]] a  someone of a duty, [[VW:retell|/ˌriːˈtel/|重新讲述，复述]] a story, [[VW:repeat|/rɪˈpiːt/|重复再次光顾的]] a lesson or view the past in [[VW:retrospect|/ˈretrəspekt/|\\[in－］回顾]]. A genuine achievement can impress  without needing to dominate. A failure may [[VW:mortify|/ˈmɔːtɪfaɪ/|使难堪，使羞愧]] pride, yet it can also teach",
     "zh": "记忆组织经验。我们分类印象，注意行动是否与言语相符，并在应得时给予赞扬。我们可能把成功归因于运气、回忆承诺、回想谈话、提醒某人职责、复述故事、重复教训，或回望过去。真正成就无需主宰他人也能令人印象深刻。失败会令自尊难堪，却也能教会谦逊。"
    },
    {
     "en": "Change can [[VW:surmount|/səˈmaʊnt/|克服；置于......顶端]] obstacles and [[VW:pervade|/pəˈveɪd/|弥漫，渗透，遍及]] every part of life. We [[VW:replace|/rɪˈpleɪs/|代替，取代]] worn tools, [[VW:substitute|/ˈsʌbstɪtjuːt/|替换代用品；代替者…]] one method for another, [[VW:distinguish|/dɪˈstɪŋɡwɪʃ/|区别，辨别；使出众，使著名]] fact from opinion  repair from concealment. A person may [[VW:incline|/ɪnˈklaɪn/|(使)倾向于；(使)倾斜…]] toward caution or [[VW:lean|/liːn/|(使)倚靠；倾斜；瘦的…]] on friends when exhausted; a [[VW:sideways|/ˈsaɪdweɪz/|向(或从、往)一侧]] glance can express doubt that direct speech would make dangerous. The mature response is neither endless regret nor easy optimism, but the steady attempt to [[VW:restore|/rɪˈstɔː(r)/|恢复；归还；修复]] what matters and improve what can still be changed.",
     "zh": "变化能够克服障碍，也会渗透生活每一部分。我们替换磨损工具、用一种方法替代另一种、区分事实与观点，并把修复与掩盖区别开来。一个人可能倾向谨慎，或在疲惫时倚靠朋友；侧眼一瞥可以表达直言会带来危险时的不确定。成熟回应既不是无尽悔恨，也不是轻易乐观，而是稳定地修复重要之物，并改善尚能改变之处。"
    }

  {
   "zhTitle": "身体与感知",
   "enTitle": "Body and Perception",
   "paragraphs": [
    {
     "en": "Health begins with the body, but it is never only [[VW:physical|/ˈfɪzɪk(ə)l/|身体的；物质的；物理的]]. How a person feels can shape [[VW:mood|/muːd/|心情，情绪；气氛]], [[VW:emotion|/ɪˈməʊʃ(ə)n/|情绪，情感，感情]], [[VW:temper|/ˈtempə(r)/|坏脾气；情绪，心情；使缓和]], [[VW:manner|/ˈmænə(r)/|举止；礼貌；方式；风俗]] and [[VW:attitude|/ˈætɪtjuːd/|态度，看法]]. [[VW:Character|/ˈkærəktə(r)/|性格；特征；人物，角色]] and [[VW:personality|/ˌpɜːsəˈnælətɪ/|个性，人格]] are not fixed at birth; experience develops every [[VW:trait|/treɪt/|特性，特点]] and [[VW:virtue|/ˈvɜːtʃuː/|美德，德行；优点]]. [[VW:Stature|/ˈstætʃə(r)/|身高，身材…]], skin colour, facial [[VW:feature|/ˈfiːtʃə(r)/|特征；面容的一部分…]] or body shape may be [[VW:visible|/ˈvɪzəb(ə)l/|看得见的，可见的]], yet [[VW:flesh|/fleʃ/|肉；人类]] and [[VW:bone|/bəʊn/|骨；骨髓]] cannot explain a whole [[VW:human|/ˈhjuːmən/|人类的；奇人性的；人类]] being. The old term [[VW:mankind|/mænˈkaɪnd/|人类；男人]] is now often replaced by humanity, because dignity belongs to every [[VW:human|/ˈhjuːmən/|人类的；奇人性的；人类]], not to one group.",
     "zh": "健康始于身体，却绝不只关乎身体。一个人的感受会塑造情绪、情感、脾气、举止和态度。性格与个性并非出生时便固定，经验会发展每一种特质和美德。身高、肤色、面部特征或体型可能可见，但血肉与骨骼无法解释完整的人。旧词“人类”如今常被“人类整体”取代，因为尊严属于每一个人而非某一群体。"
    },
    {
     "en": "The head protects the brain  and the senses. A [[VW:skull|/skʌl/|n，头脑；头骨]] encloses the brain , while the [[VW:mind|/maɪnd/|头脑；思考能力；思维；意见…]] emerges through its activity. [[VW:Physical|/ˈfɪzɪk(ə)l/|身体的；物质的；物理的]] and [[VW:mental|/ˈment(ə)l/|精神的，思想上的；智力的]] health influence each other. A [[VW:cheek|/tʃiːk/|面颊，颊]], [[VW:forehead|/ˈfɔːhed; ˈfɒrɪd/|额]] or [[VW:brow|/braʊ/|n·额；眉，眉毛]] may show [[VW:emotion|/ɪˈməʊʃ(ə)n/|情绪，情感，感情]]; an [[VW:eyelash|/ˈaɪlæʃ/|眼睫毛]], [[VW:lip|/lɪp/|嘴唇；(洞口、伤口等的)边缘]] and [[VW:mouth|/maʊθ/|口，嘴；河口]] help protect and communicate. The [[VW:tongue|/tʌŋ/|舌头；语言]] moves food, the [[VW:throat|/θrəʊt/|喉咙；窄路；嗓子，嗓音]] and [[VW:gorge|/ɡɔːdʒ/|咽喉；暴食；山峡，峡谷…]] lead toward digestion, and the [[VW:chin|/tʃɪn/|(指人的)颏，下巴]], [[VW:jaw|/dʒɔː/|额；下巴；狭窄入口；唠叨]] and [[VW:neck|/nek/|脖子；衣领；海峡]] support movement. A [[VW:beard|/bɪəd/|胡须]] may be cultural or personal, just as hair is. A [[VW:shoulder|/ˈʃəʊldə(r)/|肩，肩膀]] supports the arm, and every [[VW:limb|/lɪm/|肢；树枝]] depends on bones, joints and muscles working together.",
     "zh": "头部保护大脑与感官。颅骨包裹大脑，心智则通过其活动显现。身体健康与心理健康相互影响。脸颊、额头或眉毛可以表现情绪；睫毛、嘴唇和嘴帮助保护与交流。舌头移动食物咽喉与食道通向消化系统，下巴、颌骨和脖子支撑动作。胡须可能是文化或个人选择，正如头发一样。肩部支撑手臂每个肢体都依赖骨骼、关节和肌肉共同运作。"
    },
    {
     "en": "The [[VW:skeleton|/ˈskelɪt(ə)n/|骨髓，骨架；框架，梗概]] gives the body a frame. The [[VW:backbone|/ˈbækbəʊn/|脊柱；骨干，中坚；骨气]] supports the trunk, while an [[VW:elbow|/ˈelbəʊ/|肘部；弯头；扶手；用肘挤]], [[VW:wrist|/rɪst/|腕，腕关节]], [[VW:thumb|/θʌm/|拇指]], [[VW:palm|/pɑːm/|棕榈树；手掌；把……藏在手中]], [[VW:finger|/ˈfɪŋɡə(r)/|(尤指大拇指之外的)手指]] or [[VW:fist|/fɪst/|拳头，拳]] allows precise action. A [[VW:chest|/tʃest/|胸，胸部]] protects the heart and lungs; the [[VW:abdomen|/ˈæbdəmən/|腹，腹部]] contains organs, with a [[VW:rib|/rɪb/|肋骨；排骨]] cage shielding sensitive tissue. The [[VW:waist|/weɪst/|腰；腰部]] changes with age, and an [[VW:organ|/ˈɔːɡən/|器官；风琴；机构]] such as the [[VW:liver|/ˈlɪvə(r)/|肝脏]], [[VW:stomach|/ˈstʌmək/|胃口；胃，腹部]], [[VW:kidney|/ˈkɪdni/|肾，肾脏]], [[VW:gland|/ɡlænd/|腺]] or [[VW:intestine|/ɪnˈtestɪn/|肠]] performs work that is easy to ignore. The [[VW:womb|/wuːm/|子宫；发源地]] supports [[VW:pregnancy|/ˈpreɡnənsi/|怀孕，妊娠]], while a [[VW:lung|/lʌŋ/|肺]] exchanges gases and a [[VW:chamber|/ˈtʃeɪmbə(r)/|室，腔；议院；室内的]] of the heart pumps blood. A [[VW:thigh|/θaɪ/|大腿，股]], [[VW:knee|/niː/|膝盖，膝]], [[VW:lap|/læp/|(人坐着时的)大腿部；下摆…]], [[VW:ankle|/ˈæŋk(ə)l/|裸关节，裸]], [[VW:heel|/hiːl/|足跟]]",
     "zh": "骨骼为身体提供框架。脊柱支撑躯干，肘、腕、拇指、手掌、 手指或拳头则实现精确动作。胸腔保护心脏与肺；腹部容纳器官，肋骨架保护敏感组织。腰围会随年龄变化，肝脏、胃、 肾、腺体或肠道等器官执行着容易被忽视的工作。子宫支持 妊娠，肺进行气体交换，心腔则泵送血液。大腿、膝、大腿 前侧、踝、脚跟和脚趾让行走成为可能。"
    },
    {
     "en": "Invisible systems keep the body alive. A [[VW:joint|/dʒɔɪnt/|接合处；关节；共同的，联合的]] links bones and allows controlled movement. A [[VW:muscle|/ˈmʌs(ə)l/|肌肉]] contracts, a [[VW:pore|/pɔː(r)/|毛孔；小孔，气孔；凝视；沉思]] releases moisture, and a [[VW:pulse|/pʌls/|脉博；脉冲]] records each heartbeat. An [[VW:artery|/ˈɑːtəri/|动脉；干线]] carries blood away from the heart, while a [[VW:nerve|/nɜːv/|神经；紧张，焦虑]] transmits signals and a [[VW:hormone|/ˈhɔːməʊn/|荷尔蒙，激素]] adjusts growth or metabolism. The [[VW:immune|/ɪˈmjuːn/|免疫的；不曼影响的；免除的]] system responds to a [[VW:stimulus|/ˈstɪmjələs/|剌激(物)；促进因素]], and a daily [[VW:biorhythm|/ˈbaɪəʊrɪðəm/|生物节律]] influences sleep and alertness. [[VW:Lifestyle|/ˈlaɪfstaɪl/|生活方式]] and [[VW:habit|/ˈhæbɪt/|习惯]] can strengthen or",
     "zh": "看不见的系统维持生命。关节连接骨骼，使受控的动作成为可能。肌肉收缩，毛孔释放水分，脉搏记录每次心跳。动脉 把血液从心脏带走，神经传递信号，激素调节生长或代谢。 免疫系统回应刺激，日常生物节律影响睡眠与警觉。生活方 式和习惯会随时间增强或削弱这些系统。"
    },
    {
     "en": "Perception connects body and world. A [[VW:sense|/sens/|感官；感觉]] is not a passive window: [[VW:sight|/saɪt/|视力；看见；景物]], [[VW:eyesight|/ˈaɪsaɪt/|视力]] and [[VW:view|/vjuː/|视野；见解；风景；察看]] depend on light, attention and memory. A [[VW:visual|/ˈvɪʒuəl/|视力的，视觉的]] image may be clear or [[VW:vague|/veɪɡ/|含糊的；不清楚的，模糊的]], [[VW:visible|/ˈvɪzəb(ə)l/|看得见的，可见的]] or hidden. To be [[VW:blind|/blaɪnd/|盲目的；瞎的；未察觉的]] or [[VW:dumb|/dʌm/|哑的；不肯开口的]] can describe a [[VW:physical|/ˈfɪzɪk(ə)l/|身体的；物质的；物理的]] condition, but language should not reduce a person to one [[VW:feature|/ˈfiːtʃə(r)/|特征；面容的一部分…]]. A [[VW:dwarf|/dwɔːf/|(童话中的)小矮人；侏儒…]] may appear in a fairy tale; however, that word can cause offence when applied to a person with short [[VW:stature|/ˈstætʃə(r)/|身高，身材…]]. [[VW:Aural|/ˈɔːrəl/|耳的；听觉的；气味的；先兆的]] skills matter for listening and [[VW:dental|/ˈdent(ə)l/|牙的，牙科的]] care protects the [[VW:mouth|/maʊθ/|口，嘴；河口]]. A healthy routine includes being [[VW:awake|/əˈweɪk/|醒着的；警觉的]], taking a brief [[VW:yawn|/jɔːn/|打呵欠；裂开；呵欠]], a short [[VW:nap|/næp/|小睡；绒毛]] or a [[VW:quiet|/ˈkwaɪət/|安静的；寂静的；平静的]] [[VW:doze|/dəʊz/|小睡，打盹儿]], and getting enough time [[VW:asleep|/əˈsliːp/|睡着的；不活跃的；麻木的]].",
     "zh": "感知连接身体与世界。感官不是被动窗口：视觉、视力和视野依赖光线、注意力与记忆。视觉图像可能清晰或模糊、可见或隐藏。失明或不能说话可以描述身体状况，但语言不应把人缩减为某一特征。童话中可能出现小矮人；但这个称呼若用于形容身材矮小的人，可能造成冒犯。听觉能力对倾听重要，牙科护理保护口腔。健康日常包括保持清醒、短暂打哈欠、小睡或安静打盹，并获得充足睡眠。"
    },
    {
     "en": "Health also changes across life. [[VW:Pregnancy|/ˈpreɡnənsi/|怀孕，妊娠]] may require medical care before a child is [[VW:born|/bɔːn/|天生的；与生俱来的；出生]], and a [[VW:condom|/ˈkɒndɒm/|避孕套]] can reduce the risk of [[VW:infection|/ɪnˈfekʃ(ə)n/|传染；传染病；影响]]. A [[VW:clone|/kləʊn/|以无性繁殖技术复制，克隆克隆动物(或植物)…]] would share genetic material, but it would not share a life. A [[VW:symptom|/ˈsɪmptəm/|征兆；症状]] such as a [[VW:moan|/məʊn/|呻吟；哀悼；呻吟声；哀悼声]], [[VW:fever|/ˈfiːvə(r)/|狂热；发烧，发热 (使)发烧…]], [[VW:headache|/ˈhedeɪk/|头痛]], [[VW:pimple|/ˈpɪmpl/|粉刺，丘疹]] or [[VW:swell|/swel/|肿胀，膨胀；(使)增加]] may be minor or serious. [[VW:Infection|/ɪnˈfekʃ(ə)n/|传染；传染病；影响]] can cause [[VW:illness|/ˈɪlnəs/|病，疾病]], while [[VW:obesity|/əʊˈbiːsəti/|(过度)肥胖；肥胖症]], [[VW:overweight|/ˌəʊvəˈweɪt/|超重的，过胖的；超重；使超重…]], [[VW:hypertension|/ˌhaɪpəˈtenʃ(ə)n/|高血压]] and [[VW:diabetes|/ˌdaɪəˈbiːtiːz/|糖尿病]] increase risk. [[VW:Cancer|/ˈkænsə(r)/|癌]], [[VW:arthritis|/ɑːˈθraɪtɪs/|关节炎]] and a [[VW:stroke|/strəʊk/|中风；击打；一笔(画)]] require different forms of care. An [[VW:allergy|/ˈælədʒɪ/|敏感症；过敏性]] can be mild or severe, and [[VW:insomnia|/ɪnˈsɒmniə/|失眠，失眠症]] affects [[VW:mood|/muːd/|心情，情绪；气氛]] as well as energy.",
     "zh": "健康也随生命阶段变化。妊娠在孩子出生前可能需要医疗照护，安全套可降低感染风险。克隆会共享遗传物质，却不会共享人生。呻吟、发烧、头痛、粉刺或肿胀等症状可能轻微也可能严重。感染会导致疾病，而肥胖、超重、高血压和糖尿病提高风险。癌症、关节炎和中风需要不同照护。过敏可能轻微或严重，失眠会影响情绪与精力。"
    },
    {
     "en": "Some terms must be used with care. A [[VW:disease|/dɪˈziːz/|疾病]] may [[VW:disable|/dɪsˈeɪb(ə)l/|使丧失能力，使伤残]] movement, a [[VW:heart attack|/ˈhɑːt ətæk/|心脏病发作]] may damage tissue, and a [[VW:broken|/ˈbrəʊkən/|弄坏的；破碎的]] [[VW:bone|/bəʊn/|骨；骨髓]] may temporarily [[VW:paralyse|/ˈpærəlaɪz/|使麻痹；使瘫痪；使无助]] a [[VW:limb|/lɪm/|肢；树枝]]. A [[VW:patient|/ˈpeɪʃ(ə)nt/|病人；有耐心的，能忍耐的]] may [[VW:feel|/fiːl/|感觉到，感知；触碰]] [[VW:dizzy|/ˈdɪzi/|头晕目眩的，眩晕的；使眩晕]], have an acute [[VW:dysfunction|/dɪsˈfʌŋkʃn/|(身体)功能障碍]] or be described as an  in older texts. The word [[VW:insane|/ɪnˈseɪn/|患精神病的；疯狂的]] belongs to legal and historical contexts, not casual insult. A [[VW:plague|/pleɪɡ/|瘟疫]] or [[VW:flu|/fluː/|流行性感冒]] can spread rapidly, and a [[VW:fever|/ˈfiːvə(r)/|狂热；发烧，发热 (使)发烧…]] may signal that the body is fighting [[VW:infection|/ɪnˈfekʃ(ə)n/|传染；传染病；影响]]. A condition may [[VW:cripple|/ˈkrɪp(ə)l/|跛子；残疾人；使跛]] mobility, just as social barriers may restrict opportunity. The old term [[VW:lame|/leɪm/|瘸的，跛的…]] can describe difficulty walking, but it",
     "zh": "有些词必须谨慎使用。疾病可能使行动能力瘫痪，心脏病发作会损伤组织，骨折会暂时使肢体失去功能。患者可能头晕出现急性功能障碍，或在旧文本中被称为病弱者。“精神 失常”属于法律与历史语境，不应作为随意侮辱。瘟疫或流 感会迅速传播，发烧可能表明身体正在抵抗感染。身体状况可能严重损害行动能力，社会障碍也会限制机会。旧词“跛 ”可描述行走困难，却不应被用来嘲弄他人。"
    },
    {
     "en": "Health is therefore both personal and public. Clean water, safe food, vaccination, exercise and fair access to care protect individuals and communities. Excess weight can be a [[VW:detriment|/ˈdetrɪmənt/|损害；损害物]] to heart health and mobility, just as poor sleep can harm concentration. The body is not a machine to be judged by appearance, and no diagnosis should erase dignity. Good health policy helps people live",
     "zh": "因此，健康既是个人的，也是公共的。清洁用水、安全食物、 疫苗接种、运动和公平获得照护保护个人与社区。超重可能损害心脏健康与行动能力，睡眠不足也会伤害注意力。身体不是按外表评判的机器，任何诊断都不应抹去尊严。良好卫 生政策帮助人们好好生活，而不只是存活。"
    }
   ],

  {
   "zhTitle": "疾病与照护",
   "enTitle": "Illness and Care",
   "paragraphs": [
    {
     "en": "An [[VW:injury|/ˈɪndʒərɪ/|伤害；损害]] can happen in an instant: a person may [[VW:injure|/ˈɪndʒə(r)/|伤害，使遭受损伤；损害]] a knee, [[VW:hurt|/hɜːt/|损害；伤害；(使)疼痛]] a wrist, [[VW:bleed|/bliːd/|流血；榨取…]] after a deep cut, or develop a [[VW:bruise|/bruːz/|淤伤；伤痕；擦伤]] beneath the skin. A [[VW:wound|/wuːnd/|创伤，伤害；伤口]] may leave a [[VW:scar|/skɑː(r)/|疤痕，伤疤]], while major [[VW:trauma|/ˈtrɔːmə/|外伤，身体上的伤；精神创伤…]] affects body and mind. If someone begins to [[VW:choke|/tʃəʊk/|(使)窒息；阻塞；说不出话]], feels a [[VW:lump|/lʌmp/|块；肿块；使成块状]] in the throat, or suffers [[VW:acute|/əˈkjuːt/|(疾病)急性的…]] [[VW:pain|/peɪn/|痛苦；疼痛；使痛苦]], first aid should begin at once. A [[VW:sore|/sɔː(r)/|疼痛的；恼火的；严重的]] muscle may need rest, whereas [[VW:chronic|/ˈkrɒnɪk/|慢性的；长期的]] [[VW:pain|/peɪn/|痛苦；疼痛；使痛苦]] calls for a longer plan. A [[VW:faint|/feɪnt/|模糊的；微弱的；虚弱的；晕倒]] patient may become [[VW:unconscious|/ʌnˈkɒnʃəs/|失去知觉的；无意识的]], and urgent care is",
     "zh": "受伤可能发生在一瞬间：一个人可能伤到膝盖、弄伤手腕、因深切口而流血，或皮下出现瘀青。伤口可能留下疤痕，而严重创伤会影响身体与心理。如果有人开始窒息、感觉喉咙里有肿块或遭受急性疼痛，急救应立即开始。肌肉酸痛可能需要休息，而慢性疼痛则需要更长期的方案。昏厥的患者可能失去知觉，紧急照护至关重要。"
    },
    {
     "en": "[[VW:Medicine|/ˈmedsn; ˈmedɪsn/|药；医学]] cannot deny [[VW:death|/deθ/|死，死亡；毁灭]]. Every [[VW:mortal|/ˈmɔːt(ə)l/|必死的；致命的；凡人，人类]] life moves toward its eventual [[VW:demise|/dɪˈmaɪz/|死亡…]], but illness need not become a sentence of [[VW:doom|/duːm/|厄运；毁灭…]]. Some conditions are [[VW:fatal|/ˈfeɪt(ə)l/|adi.致命的；毁灭性的…]] or [[VW:lethal|/ˈliːθ(ə)l/|致命的]], especially when [[VW:treatment|/ˈtriːtmənt/|治疗，疗法；待遇]] is delayed, while others are limiting but manageable. [[VW:Sorrow|/ˈsɒrəʊ/|悲伤，悲痛]], [[VW:suffering|/ˈsʌfərɪŋ/|苦难，折磨]] and [[VW:lament|/ləˈment/|悲伤，哀悼；哀悼…]] are natural responses to loss; they deserve time, company and professional support rather than silence.",
     "zh": "医学无法否认死亡。每个凡人的生命都走向最终离世，但疾病不必成为毁灭的判决。有些病症致命，尤其在治疗延误时另一些则限制生活却可以管理。悲伤、痛苦与哀悼是面对失去时的自然反应；它们需要时间、陪伴和专业支持，而不是沉默。"
    },
    {
     "en": "Work can also affect health. [[VW:Overwork|/ˌəʊvəˈwɜːk/|过度操劳…]] may [[VW:tire|/ˈtaɪə(r)/|(使)感到疲劳；厌烦]] a person, [[VW:exhaust|/ɪɡˈzɔːst/|使筋疲力竭；用完，耗尽]] the body and produce lasting [[VW:fatigue|/fəˈtiːɡ/|疲劳 (使)疲劳]]. Someone who feels [[VW:feeble|/ˈfiːb(ə)l/|虑弱的，无力的；微弱的]] or [[VW:weary|/ˈwɪəri/|疲倦的；厌烦的]] may gradually [[VW:weaken|/ˈwiːkən/|减弱，削弱；变软弱]], become [[VW:uncomfortable|/ʌnˈkʌmftəb(ə)l/|不舒服的；不自在的]] and lose the ability to concentrate. Regular [[VW:fitness|/ˈfɪtnəs/|健康；适合]], by contrast, can protect strength and stamina. Yet the [[VW:corpus|/ˈkɔːpəs/|尸体；文集；本金]] of [[VW:medical|/ˈmedɪk(ə)l/|医学的，医疗的]] knowledge also shows that [[VW:recovery|/rɪˈkʌvəri/|恢复，痊愈]] is possible. Good [[VW:health care|/ˈhelθ keə(r)/|医疗保健]] treats the person, not merely a test result. 04 A [[VW:hospital|/ˈhɒspɪt(ə)l/|医院]] joins science to daily care. A [[VW:sanitary|/ˈsænət(ə)ri/|卫生的；清洁的]] ward supports [[VW:hygiene|/ˈhaɪdʒiːn/|卫生(学)；保健(学)]], and a [[VW:clinic|/ˈklɪnɪk/|诊所；门诊部]] may offer [[VW:medical|/ˈmedɪk(ə)l/|医学的，医疗的]] advice, while a [[VW:physician|/fɪˈzɪʃ(ə)n/|内科医生]], [[VW:surgeon|/ˈsɜːdʒən/|外科医生]] or nurse provides [[VW:treatment|/ˈtriːtmənt/|治疗，疗法；待遇]]. An [[VW:operation|/ˌɒpəˈreɪʃ(ə)n/|手术；操作；运转，经营]] can [[VW:cure|/kjʊə(r)/|治好，治愈；疗法；治疗]] some conditions or help the body [[VW:heal|/hiːl/|治愈；愈合]]; [[VW:therapy|/ˈθerəpi/|治疗]] may support movement, and not every [[VW:treatment|/ˈtriːtmənt/|治疗，疗法；待遇]] is [[VW:curative|/ˈkjʊərətɪv/|治疗的；药品]]. A [[VW:check|/tʃek/|检查，核对 ［美］账单]] can reveal risk, and a [[VW:prescription|/prɪˈskrɪpʃn/|处方，药方；秘诀]] guides safe use. A [[VW:transplant|/trænsˈplɑːnt/|移植]], [[VW:X-ray|/ˈeks reɪ/|X射线…]] or injection  may save a life, but no procedure is magical.",
     "zh": "工作也会影响健康。过度劳累会让人疲倦、耗尽体力并造成持久乏力。感到虚弱或疲惫的人可能逐渐变弱、身体不适并失去专注能力。相反，规律健身可以保护力量与耐力。然而医学知识的总汇也表明康复是可能的。良好的医疗照护治疗的是整个人，而不只是一个检验结果。医院把科学与日常照护连接起来。卫生的病房支持清洁习惯诊所可以提供医疗建议；医生、外科医生或护士提供治疗。手术可以治愈某些病症，或帮助身体自行愈合；治疗可以支持行动，但并非每一种治疗都能治愈。检查能发现风险，处方则指导安全用药。移植、X 光或注射可能挽救生命，但没有任何操作是魔法。"
    },
    {
     "en": "[[VW:Precaution|/prɪˈkɔːʃ(ə)n/|预防，警惕；预防措施]] begins before illness spreads. [[VW:Vaccinate|/ˈvæksɪneɪt/|给......接种疫苗，预防接种…]] people when evidence supports it, improve ventilation, and [[VW:quarantine|/ˈkwɒrəntiːn/|对......进行隔离检疫…]] those who are infectious when necessary. To [[VW:isolate|/ˈaɪsəleɪt/|使隔离，使孤立，使脱离]] a patient is different from using isolation as punishment, and we should never [[VW:segregate|/ˈseɡrɪɡeɪt/|隔离]] people because of disability or disease. A [[VW:pharmacy|/ˈfɑːməsi/|药店；药剂学]] may supply [[VW:medicine|/ˈmedsn; ˈmedɪsn/|药；医学]], a [[VW:remedy|/ˈremədi/|药物，治疗法；解决方法]] or a [[VW:drug|/drʌɡ/|毒品；药]] in the form of a [[VW:pill|/pɪl/|药丸，丸剂]]. An [[VW:antibiotic|/ˌæntibaɪˈɒtɪk/|抗生素]] treats bacterial infection but not a virus; [[VW:acupuncture|/ˈækjupʌŋktʃə(r)/|针灸，中医针灸疗法]] may [[VW:relieve|/rɪˈliːv/|救济…]] some symptoms; [[VW:penicillin|/ˌpenɪˈsɪlɪn/|青霉素]], [[VW:morphine|/ˈmɔːfiːn/|吗啡]]",
     "zh": "预防在疾病扩散之前开始。在证据支持时接种疫苗，改善通风，并在必要时对传染者进行隔离检疫。把患者单独隔离， 与把隔离当作惩罚并不相同；我们也不应因为残障或疾病而把人分隔开来。药房可以提供药物、疗法或以药丸形式出现 的药品。抗生素治疗细菌感染，却不治疗病毒；针灸可能缓 解部分症状；青霉素、吗啡和其他药物必须按受控剂量使用。"
    },
    {
     "en": "During [[VW:recovery|/rɪˈkʌvəri/|恢复，痊愈]], a pause can [[VW:refresh|/rɪˈfreʃ/|使恢复精神]] the mind and bring [[VW:relief|/rɪˈliːf/|宽慰，轻松；减轻，缓解]]. [[VW:Gentle|/ˈdʒent(ə)l/|温和的；柔和的；文雅的…]] exercise may [[VW:relieve|/rɪˈliːv/|救济…]] [[VW:pain|/peɪn/|痛苦；疼痛；使痛苦]], [[VW:alleviate|/əˈliːvieɪt/|减轻(痛苦等)，缓解]] stress and [[VW:ease|/iːz/|减轻，放松，缓和容易；悠闲]] tension; rest helps the body [[VW:relax|/rɪˈlæks/|放松]]. A [[VW:normal|/ˈnɔːm(ə)l/|正常的；正规的，规范的]] routine and [[VW:common|/ˈkɒmən/|共同的；普通的，平常的]] habits become valuable again, and the [[VW:usual|/ˈjuːʒuəl/|通常的，惯常的]] rhythm of life feels precious. [[VW:Recovery|/rɪˈkʌvəri/|恢复，痊愈]] rarely follows a straight line, so patience matters as much as",
     "zh": "康复期间，暂停可以让精神恢复并带来解脱。温和运动可能缓解疼痛、减轻压力并放松紧张；休息帮助身体松弛。正常 作息和常见习惯重新变得可贵，生活的惯常节奏也显得珍贵。 康复很少沿直线前进，因此耐心与速度同样重要。"
    },
    {
     "en": "An [[VW:optimistic|/ˌɒptɪˈmɪstɪk/|乐观的，乐观主义的]] patient is not blind to difficulty, while a [[VW:pessimistic|/ˌpesɪˈmɪstɪk/|悲观的，悲观主义的]] outlook can make [[VW:pain|/peɪn/|痛苦；疼痛；使痛苦]] seem heavier. A [[VW:positive|/ˈpɒzətɪv/|肯定的；积极的；绝对的]] attitude helps, but a [[VW:negative|/ˈneɡətɪv/|怀疑的；消极的]] emotion is not a moral failure. One person may seem [[VW:passive|/ˈpæsɪv/|被动的，消极的]] or [[VW:indifferent|/ɪnˈdɪfrənt/|漠不关心的；无关紧要的…]]; another may appear [[VW:apathetic|/ˌæpəˈθetɪk/|无动于衷的，漠不关心的]] when profoundly tired. Such responses may be understandable, and their importance is not [[VW:negligible|/ˈneɡlɪdʒəb(ə)l/|可以忽略的，微不足道的]]. Small [[VW:happiness|/ˈhæpinəs/|幸福，快乐；适当]] and [[VW:delight|/dɪˈlaɪt/|(使)高兴；爱好乐趣]] can coexist with illness. A [[VW:merry|/ˈmeri/|愉快的，欢乐的；微醉的]] moment, shared [[VW:fun|/fʌn/|乐趣；玩笑有趣的]], a [[VW:joke|/dʒəʊk/|笑话；玩笑说笑话；开玩笑]], [[VW:laughter|/ˈlɑːftə(r)/|笑，笑声]] and [[VW:joy|/dʒɔɪ/|欢乐，喜悦；乐趣]] can [[VW:please|/pliːz/|使高兴，取悦；请]] the heart. People may [[VW:rejoice|/rɪˈdʒɔɪs/|(使)高兴，(使)欢喜]] at good news, [[VW:thrill|/θrɪl/|激动(使)激动；感到紧张]] at progress and [[VW:cheer|/tʃɪə(r)/|使振作；(向……)欢呼]] a friend. Simple [[VW:pleasure|/ˈpleʒə(r)/|愉快，高兴…]] is [[VW:agreeable|/əˈɡriːəb(ə)l/|使人愉快的；(欣然)同意的]], and a kind act can [[VW:exhilarate|/ɪɡˈzɪləreɪt/|使高兴，使兴奋]]. [[VW:Satisfactory|/ˌsætɪsˈfæktəri/|令人满意的]] care is [[VW:desirable|/dɪˈzaɪərəb(ə)l/|adj，可取的，值得拥有的，合意的…]] and [[VW:exciting|/ɪkˈsaɪtɪŋ/|令人兴奋的，使人激动的]], and a [[VW:keen|/kiːn/|强烈的；敏锐的；渴望的…]], [[VW:enthusiastic|/ɪnˌθjuːziˈæstɪk/|热心的，热情的]] clinician shows [[VW:zeal|/ziːl/|热心，热情，热忱]] without losing calm. A [[VW:lively|/ˈlaɪvli/|活泼的；活跃的；栩栩如生的]] garden, a [[VW:lovely|/ˈlʌvli/|可爱的；令人愉快的]] song and [[VW:fond|/fɒnd/|喜爱的；溺爱的]] memories may [[VW:favour|/ˈfeɪvə(r)/|偏爱；赞同；恩惠，帮助]] healing. Good care is [[VW:liberal|/ˈlɪbərəl/|慷慨的，大方的；自由主义的]] in listening, [[VW:generous|/ˈdʒenərəs/|慷慨的；宽厚的]] with time, [[VW:gentle|/ˈdʒent(ə)l/|温和的；柔和的；文雅的…]] in speech and [[VW:humble|/ˈhʌmb(ə)l/|谦虚的；卑微的]] about uncertainty. A [[VW:modest|/ˈmɒdɪst/|谦虚的，谦逊的]] doctor can still be [[VW:humorous|/ˈhjuːmərəs/|富于幽默感的，诙谐的]], [[VW:polite|/pəˈlaɪt/|有礼貌的；客气的]] and [[VW:frank|/fræŋk/|坦白的，直率的]]; a [[VW:curious|/ˈkjʊəriəs/|好奇的，好求知的]] mind asks [[VW:direct|/dəˈrekt/|直接的；直率的]] questions, while a [[VW:mysterious|/mɪˈstɪəriəs/|神秘的；不可思议的]] symptom calls for patient investigation. Even a [[VW:daring|/ˈdeərɪŋ/|勇敢的，大胆的]] [[VW:treatment|/ˈtriːtmənt/|治疗，疗法；待遇]] should respect evidence. The old-fashioned word [[VW:manly|/ˈmænli/|有男子气概的；果断的]] should not imply that courage belongs only to men; care, too, is strength.",
     "zh": "乐观的患者并非看不见困难，而悲观的看法会让疼痛显得更沉重。积极态度有帮助，但负面情绪不是道德失败。有人可能显得被动或漠不关心；另一个人在极度疲惫时可能显得冷淡。这些反应可以理解，其重要性也并非微不足道。微小的幸福与喜悦可以与疾病并存。欢快的一刻、共同玩乐、一个笑话、笑声和欢乐都能使内心愉悦。人们会为好消息欢欣、为进步激动并为朋友喝彩。简单的快乐令人愉快，善意的举动也能使人精神振奋。令人满意的照护既可取又令人兴奋，热切而充满热情的临床医生展现热情，却不会失去冷静。生机勃勃的花园、可爱的歌曲和喜爱的回忆都可能有助于康复。令人惊讶的结果可能使患者受惊、让家人觉得奇妙，并让朋友大为震惊，尤其是在忙碌的一周预约之后。良好的照护在倾听上开明、在时间上慷慨、在言语上温和，并对不确定性保持谦逊。谦虚的医生仍可以幽默、礼貌而坦诚；好奇的心会直接提问，而神秘症状需要耐心调查。即使大胆的治疗也应尊重证据。旧式词汇“有男子气概的”不应暗示勇气只属于男性；关怀同样是力量。"
    },
    {
     "en": "Care at its best protects dignity. It controls infection, eases [[VW:pain|/peɪn/|痛苦；疼痛；使痛苦]] and respects fear. It also recognises that healing is not always a [[VW:cure|/kjʊə(r)/|治好，治愈；疗法；治疗]]. Sometimes support means helping a person live as fully as possible. Health systems earn trust when they combine rigorous evidence with compassion.",
     "zh": "最好的照护维护尊严。它控制感染、减轻疼痛并尊重恐惧。它也承认，愈合并不总是治愈。有时支持意味着帮助一个人尽可能完整地生活。当卫生体系把严谨证据与同情结合起来时，便能赢得信任。"
    }
   ],

    {
     "en": "01 A [[VW:sincere|/sɪnˈsɪə(r)/|真诚的，诚挚的]] person can be [[VW:earnest|/ˈɜːnɪst/|认真的，诚恳的]] in effort and honest in speech without becoming too [[VW:proud|/praʊd/|骄傲的，自豪的；令人自豪的]] of every judgment. Quiet [[VW:confidence|/ˈkɒnfɪdəns/|自信；信任]] often matters more than loud claims, and a responsible person takes a promise [[VW:seriously|/ˈsɪəriəsli/|严肃地；认真地；严重地]]. A [[VW:friendly|/ˈfrendli/|友好的，友善的]], [[VW:hospitable|/hɒˈspɪtəb(ə)l/|好客的；热情友好的]] host may create a welcome that feels [[VW:romantic|/rəʊˈmæntɪk/|浪漫的；充满传奇色彩的]] in its [[VW:freedom|/ˈfriːdəm/|自由，独立自主]] from hurry, while [[VW:careful|/ˈkeəf(ə)l/|仔细的，细致的…]] [[VW:concern|/kənˈsɜːn/|关心；忧虑涉及；使担忧；关心]] shows consideration. A [[VW:thoughtful|/ˈθɔːtf(ə)l/|认真思考的…]] companion is [[VW:sympathetic|/ˌsɪmpəˈθetɪk/|同情的；和谐的]] and [[VW:considerate|/kənˈsɪdərət/|考虑周到的，体谅的]], [[VW:ready|/ˈredi/|准备好的；愿意的]] to [[VW:apologise|/əˈpɒlədʒaɪz/|道歉，赔罪]] when needed; a real [[VW:apology|/əˈpɒlədʒi/|道歉；辩解]] asks for [[VW:mercy|/ˈmɜːsi/|仁慈，宽容，怜悯]], not merely admiration. We [[VW:admire|/ədˈmaɪə(r)/|赞美，钦佩，仰慕]] [[VW:remarkable|/rɪˈmɑːkəb(ə)l/|值得注意的；非凡的，卓越的]] courage and feel [[VW:grateful|/ˈɡreɪtf(ə)l/|感激的；表示感激的]] [[VW:gratitude|/ˈɡrætɪtjuːd/|感激，感谢，感恩]] for kindness received.",
     "zh": "真诚的人可以努力认真、说话诚实，却不会对每个判断都过于骄傲。安静的自信往往比高声宣称更重要，负责的人也会认真对待承诺。友善好客的主人能营造一种欢迎的氛围，它因不急不躁而带有浪漫的自由；细致的关心则体现体贴。周到的同伴富有同情心、为他人着想，必要时愿意道歉；真正的道歉寻求宽恕，而不只是赞美。我们钦佩非凡的勇气，并为得到的善意心怀感激。"
    },
    {
     "en": "An [[VW:eager|/ˈiːɡə(r)/|渴望的，热切的]] student may be [[VW:sound|/saʊnd/|健全的；(睡眠)酣畅的…]] in judgment and find a [[VW:picturesque|/ˌpɪktʃəˈresk/|如画的；独特的]] landscape [[VW:promising|/ˈprɒmɪsɪŋ/|大有希望的，有前途的]] rather than merely [[VW:awesome|/ˈɔːsəm/|卓越的，引起敬畏的]]. A [[VW:prominent|/ˈprɒmɪnənt/|突出的，显著的…]] [[VW:concern|/kənˈsɜːn/|关心；忧虑涉及；使担忧；关心]] should still be examined with care. Life can be [[VW:arduous|/ˈɑːdʒuəs/|辛勤的；费力的；陡峭的]] and [[VW:tough|/tʌf/|艰难的；坚强的，坚韧不拔的…]], so people need [[VW:robust|/rəʊˈbʌst/|强壮的，强健的]] health, [[VW:sturdy|/ˈstɜːdi/|强健的；坚定的]] habits  purpose. A [[VW:tender|/ˈtendə(r)/|脆弱的；温柔的；软弱的…]] heart is not weak; a [[VW:temperate|/ˈtempərət/|(气候)温和的；温带的…]] person can remain [[VW:delicate|/ˈdelɪkət/|精致的；微妙的；脆弱的]] in feeling without . A [[VW:naive|/naɪˈiːv/|天真的；幼稚的]] or [[VW:childish|/ˈtʃaɪldɪʃ/|孩子般的；幼稚的]] response may seem simple, yet [[VW:sincere|/sɪnˈsɪə(r)/|真诚的，诚挚的]] care is [[VW:trustworthy|/ˈtrʌstwɜːði/|值得信赖的，可靠的]] and [[VW:enterprising|/ˈentəpraɪzɪŋ/|有事业心的，有进取心的…]]. Every person is [[VW:liable|/ˈlaɪəb(ə)l/|有责任的…]] to error, and a [[VW:sane|/seɪn/|心智健全的；理智的]] response is to learn from it.  task can make anyone [[VW:frown|/fraʊn/|皱眉，不悦；皱眉，表示不悦]], especially when a [[VW:wretched|/ˈretʃɪd/|不幸的，可怜的，悲惨的…]] day produces [[VW:rage|/reɪdʒ/|盛怒，狂怒]]. [[VW:Frustrating|/frʌˈstreɪtɪŋ/|令人灰心的，使人沮丧的]] delays may make us [[VW:mourn|/mɔːn/|(因失去……而)哀痛，哀悼]] lost time; [[VW:anger|/ˈæŋɡə(r)/|怒，怒气；使发怒]] may rise, and a [[VW:furious|/ˈfjʊəriəs/|狂怒的，暴怒的]] reaction can [[VW:irritate|/ˈɪrɪteɪt/|激怒，使急躁；刺激]] everyone nearby. [[VW:Hate|/heɪt/|恨，憎恨不喜欢]] and [[VW:hatred|/ˈheɪtrɪd/|憎恶，憎恨，仇恨]] are heavy burdens, while a [[VW:nuisance|/ˈnjuːsns/|讨厌或麻烦的人(或事物)]] should not become an obsession. [[VW:Disgust|/dɪsˈɡʌst/|使厌恶，使作呕厌恶，嫌恶]] may warn us, but it need not [[VW:vex|/veks/|使烦恼，使恼火]] or [[VW:harass|/ˈhærəs/|烦扰]] others. To [[VW:bore|/bɔː(r)/|烦扰；钻孔讨厌的人…]] or [[VW:bother|/ˈbɒðə(r)/|花费时间精力(做某事)…]] someone with repeated complaints is [[VW:troublesome|/ˈtrʌb(ə)lsəm/|令人烦恼的；麻烦的]]; [[VW:awful|/ˈɔːf(ə)l/|令人不愉快的，极讨厌的]], [[VW:unpleasant|/ʌnˈplez(ə)nt/|令人不愉快的，讨厌的]] and [[VW:adverse|/ˈædvɜːs/|敌对的，不友好的∶不利的]] experiences are part of life, yet [[VW:hostile|/ˈhɒstaɪl/|怀有敌意的，不友善的；敌对的]] words and [[VW:indignant|/ɪnˈdɪɡnənt/|愤慨的，义愤的]] [[VW:rage|/reɪdʒ/|盛怒，狂怒]] solve little. A [[VW:radical|/ˈrædɪk(ə)l/|激进的；根本的]] change should not be [[VW:mad|/mæd/|发疯的；恼火的]], [[VW:crazy|/ˈkreɪzi/|疯狂的；荒唐的]], [[VW:wicked|/ˈwɪkɪd/|邪恶的，缺德的]], [[VW:vicious|/ˈvɪʃəs/|邪恶的，不道德的]] or [[VW:vulgar|/ˈvʌlɡə(r)/|粗俗的，庸俗的]]; a [[VW:restless|/ˈrestləs/|不安定的，焦躁不安的，不耐烦的…]] [[VW:ego|/ˈiːɡəʊ/|自我，自尊；自负]] can make even minor conflict feel .",
     "zh": "热切的学生可能判断稳健，并发现如画的风景充满希望，而不只是令人惊叹。突出的担忧仍应被仔细审视。生活可能艰难而严峻，因此人们需要强健的身体、稳固的习惯和坚定的目标。温柔的心并不软弱；有节制的人可以情感细腻，却不流于平庸。幼稚或孩子气的反应也许显得简单，但真诚的关怀值得信赖且富有进取心。每个人都容易犯错，理智的回应是从中学习。艰苦的任务会让任何人皱眉，尤其当糟糕的一天引发暴怒时。令人沮丧的延误会使我们哀悼失去的时间；怒气可能上升，愤怒反应也会激怒身边每个人。憎恨与仇恨是沉重的负担，而一件讨厌的事不该变成执念。厌恶可能发出警示，但不必去烦扰或骚扰他人。用反复抱怨让某人厌烦或困扰是惹麻烦的；糟糕、不快和不利的经历都是生活的一部分，但敌意言辞与愤慨很少解决问题。激进变化不应疯狂、荒唐、邪恶、恶毒或粗俗；躁动不安的自我会让微小冲突也变得过度。"
    },
    {
     "en": "[[VW:Anxiety|/æŋˈzaɪəti/|焦虑，担心；渴望]] can make a person [[VW:uneasy|/ʌnˈiːzi/|心神不安的，忧虑的]], fearful and [[VW:timid|/ˈtɪmɪd/|胆小的，羞怯的]]; a small [[VW:fuss|/fʌs/|大惊小怪，无谓的纷扰]] may feel like an [[VW:insult|/ɪnˈsʌlt; ˈɪnsʌlt/|侮辱，凌辱；侮辱，凌辱]]. [[VW:Envy|/ˈenvi/|羡慕；嫉妒；羡慕；嫉妒]] and jealousy can make us [[VW:jealous|/ˈdʒeləs/|嫉妒的，妒忌的]], feed [[VW:doubt|/daʊt/|怀疑，疑问；怀疑，不信]] , and leave us [[VW:sceptical|/ˈskeptɪk(ə)l/|怀疑的]]. A [[VW:selfish|/ˈselfɪʃ/|自私的，利己主义的]] comparison may produce a [[VW:nasty|/ˈnɑːsti/|下流的；肮脏的；险恶的]] remark. An [[VW:unsatisfactory|/ˌʌnˌsætɪsˈfæktəri/|不能令人满意的，不符合要求的，不足的…]] habit can leave us [[VW:unwilling|/ʌnˈwɪlɪŋ/|不愿意的，不情愿的；勉强的]] and [[VW:reluctant|/rɪˈlʌktənt/|不情愿的；勉强的]] to act. An [[VW:unstable|/ʌnˈsteɪb(ə)l/|不稳定的；易变的；不牢固的]] mood or  habit can make us [[VW:confuse|/kənˈfjuːz/|使困惑，把(某人)弄糊涂混淆]] fatigue with failure and [[VW:embarrass|/ɪmˈbærəs/|使尴尬，使窘迫，使局促不安]] those we love. We , feel that way and then . We [[VW:regret|/rɪˈɡret/|遗憾；抱歉；悲叹…]] a [[VW:careless|/ˈkeələs/|粗心的；无忧无虑的；淡漠的]] word, [[VW:repent|/rɪˈpent/|忏悔；后悔]] in private and feel [[VW:ashamed|/əˈʃeɪmd/|惭愧的，感到难为情的…]]; we [[VW:sigh|/saɪ/|叹息，叹气；叹息，叹气]], [[VW:weep|/wiːp/|哭泣，流泪哀悼；哭泣]] and ask for [[VW:tolerance|/ˈtɒlərəns/|忍受，容忍，宽容]]. To be [[VW:ignorant|/ˈɪɡnərənt/|无知的，没有学识的，愚昧的]] is not shameful if we are willing to learn and [[VW:endure|/ɪnˈdjʊə(r)/|忍耐，忍受；持久]] may look clever but often rests on [[VW:arbitrary|/ˈɑːbɪtrəri/|武断的，专断的；任意的]] judgment and [[VW:ridiculous|/rɪˈdɪkjələs/|荒谬的，可笑的]] claims. A [[VW:stupid|/ˈstjuːpɪd/|愚蠢的；麻木的…]] decision can feel [[VW:awkward|/ˈɔːkwəd/|笨拙的；尴尬的；棘手的…]] or [[VW:clumsy|/ˈklʌmzi/|笨拙的]], while a [[VW:careless|/ˈkeələs/|粗心的；无忧无虑的；淡漠的]] person remains [[VW:oblivious|/əˈblɪviəs/|不知道的，未注意的]] to consequences. A [[VW:naughty|/ˈnɔːti/|淘气的，顽皮的]] child may be [[VW:greedy|/ˈɡriːdi/|贪吃的；贪婪的]] for attention, and an [[VW:obtrusive|/əbˈtruːsɪv/|过分炫耀的，过分突出的，扎眼的…]] display may seem [[VW:slothful|/ˈsləʊθf(ə)l/|偷懒的，懒散的]] when effort is needed. A [[VW:rash|/ræʃ/|草率的，鲁莽的]] choice, a [[VW:volatile|/ˈvɒlətaɪl/|易变的，反复无常的；易挥发的]] mood and a [[VW:weird|/wɪəd/|怪诞的，古怪的]] coincidence can all produce a [[VW:sluggish|/ˈslʌɡɪʃ/|行动迟缓的]] response; a sudden [[VW:impulse|/ˈɪmpʌls/|冲动，心血来潮]] may follow, and a [[VW:rigid|/ˈrɪdʒɪd/|固执的；严格的；刚硬的]], [[VW:stubborn|/ˈstʌbən/|顽固的，固执的]] mind may cling to a [[VW:stereotype|/ˈsteriətaɪp/|老一套，模式化观念，刻板印象]]. An [[VW:unkind|/ˌʌnˈkaɪnd/|不仁慈的，不和善的，刻薄的]] judgment should not be",
     "zh": "焦虑会让人不安、恐惧和胆怯；小小的忙乱也可能像一种侮辱。羡慕与嫉妒会让我们心生妒忌、滋养怀疑与猜忌，并使我们抱持怀疑。自私的比较可能产生恶意的言语。令人不满的习惯会让我们不愿且勉强行动。不稳定情绪或不合宜习惯也会让我们把疲惫混淆为失败，并让所爱之人尴尬。我们可能犹豫、产生那种感受，随后感到内疚。我们后悔无心之言私下悔改并感到羞愧；我们叹息、哭泣并请求宽容。无知并不可耻，只要愿意学习并忍受困难。狡猾或奸诈的伎俩也许看似聪明，却常建立在武断判断和荒谬说法上。愚蠢决定可能让人尴尬或笨拙，而粗心的人仍对后果毫无察觉。淘气的孩子可能贪求关注，过度显眼的展示 在本应努力时可能显得懒散。轻率选择、易变情绪和古怪巧合都可能产生迟缓反应；突然冲动随之而来，僵化固执的心则可能抱住刻板印象不放。不友善的判断不应被误认为诚实。"
    },
    {
     "en": "Mood is not a verdict on character. A person can be strong and still struggle, cheerful and still need help. When emotion becomes a storm, it helps to name what is happening without turning it into a permanent label. Sleep, food, exercise, conversation and professional care can all restore balance. Patience, like friendship, grows through small acts",
     "zh": "情绪并不是对人品的判决。一个人可以坚强，却仍在挣扎；可以开朗，却仍需要帮助。当情绪变成风暴，帮助自己命名 正在发生的事，而不把它变成永久标签，会有益。睡眠、食 物、运动、交谈和专业照护都能恢复平衡。耐心如同友谊，会通过日复一日的小行动成长。"
    },
    {
     "en": "Recovery may begin with a less dramatic hope: one honest conversation, one night of rest, one cautious return to routine. [[VW:Confidence|/ˈkɒnfɪdəns/|自信；信任]] need not mean certainty; it can mean the willingness to take the next step. [[VW:Gratitude|/ˈɡrætɪtjuːd/|感激，感谢，感恩]] does not erase pain, and courage does not erase [[VW:fear|/fɪə(r)/|害怕；担心]], but neither needs to be perfect",
     "zh": "康复也许始于一种不那么戏剧化的希望：一次诚实交谈、一 夜休息、一次谨慎地回归日常。信心不必意味着确定，它可以意味着愿意迈出下一步。感激不会抹去痛苦，勇气也不会 消除恐惧，但二者都不必完美才有用。"
    },
    {
     "en": "The mature aim is not to feel pleasant emotions at every moment. It is to meet ourselves and others with [[VW:honesty|/ˈɒnəsti/|诚实，正直]], restraint and warmth. A compassionate community does not demand endless cheer; it makes room for sadness, offers help",
     "zh": "成熟的目标不是每时每刻都感到愉快情绪，而是以诚实、克制和温暖面对自己与他人。有同情心的社群不要求无止境的 欢欣；它给悲伤留出空间，在不羞辱人的前提下提供帮助， 并让尊严得以回归。"
    }

   "zhTitle": "时间的尺度",
   "enTitle": "The Measure of Time",
   "paragraphs": [
    {
     "en": "Human life is measured in [[VW:daily|/ˈdeɪli/|每日的；日报]] habits and [[VW:monthly|/ˈmʌnθli/|每月的；每月一次；月刊]] rhythms. A [[VW:quarterly|/ˈkwɔːtəli/|季度的；接季度地；季刊]] report, an [[VW:annual|/ˈænjuəl/|每年的；一年的；年报]] festival or a [[VW:yearly|/ˈjɪəli/|每年的；一年一度的；每年地]] review gives shape to time. An [[VW:anniversary|/ˌænɪˈvɜːsəri/|周年纪念日]] can recall a [[VW:first|/fɜːst/|ord.第一；最初，第一]] meeting, while an [[VW:era|/ˈɪərə/|时代，年代，纪元]] may be remembered for a single invention. The [[VW:present|/ˈprez(ə)nt; prɪˈzent/|现在的；目前；礼物，赠送物]] is not isolated from the [[VW:contemporary|/kənˈtemp(ə)rəri/|当代的；同时代的]] world or from [[VW:medieval|/ˌmediˈiːv(ə)l/|中世纪的；守旧的]] and earlier traditions; each [[VW:era|/ˈɪərə/|时代，年代，纪元]] borrows from the one before it. 02 A [[VW:century|/ˈsentʃəri/|世纪；百年]] is long enough for customs to change, yet short within a [[VW:millennium|/mɪˈleniəm/|一千年，千年期；千禧年]]. A [[VW:million|/ˈmɪljən/|百万；大量]] stars may shine above a quiet field; a [[VW:billion|/ˈbɪljən/|十亿；大量]] years may pass in geological time; a [[VW:dozen|/ˈdʌz(ə)n/|一打，十二个；十来个]] minutes can feel long when we wait. At [[VW:dawn|/dɔːn/|黎明；开端；破晓]], light returns; at [[VW:midday|/ˌmɪdˈdeɪ/|正午，中午]] and [[VW:midnight|/ˈmɪdnaɪt/|午夜，子夜，半夜]], the day reaches different poles. An [[VW:overnight|/ˌəʊvəˈnaɪt/|在晚上；突然，一夜之间]] journey can change a landscape, while [[VW:night|/naɪt/|夜，夜间；晚上；夜场]] itself teaches",
     "zh": "人生由每日习惯与每月节律衡量。季度报告、年度节庆或一年一度的回顾为时间赋予形状。周年纪念可以让人想起初次相见，而一个时代可能因某项发明被记住。当下并不孤立于当代世界，也不脱离中世纪及更早的传统；每个时代都从先前时代有所借鉴。一个世纪足以让习俗改变，在千年尺度中却很短。百万颗星辰也许在安静的原野上空闪耀；十亿年可能在地质时间中流逝；等待时，十几分钟也会显得漫长。黎明时，光重新回来正午与午夜，白昼抵达不同极点。一夜旅程可以改变一片景色，而夜晚本身教会人耐心。"
    },
    {
     "en": "[[VW:Modern|/ˈmɒd(ə)n/|现代的；近代的]] technology makes [[VW:recent|/ˈriːs(ə)nt/|新近的，最近的]] discoveries seem immediately available, but the [[VW:first|/fɜːst/|ord.第一；最初，第一]] question is not always the most useful. An  map may still be wrong if conditions change. [[VW:Secondly|/ˈsekəndli/|第二，其次]], attention matters more than speed; [[VW:finally|/ˈfaɪnəli/|最后；终于；决定性地]], reflection gives information meaning. A [[VW:modern|/ˈmɒd(ə)n/|现代的；近代的]] person may live by clocks, yet nature keeps older rhythms.",
     "zh": "现代技术让近期发现看似立即可得，但最先提出的问题未必最有用。最新地图若条件改变，仍可能错误。其次，注意力比速度更重要；最后，反思赋予信息意义。现代人也许按钟表生活，自然却保留着更古老的节律。"
    },
    {
     "en": "Time becomes more humane when it is neither ignored nor worshipped. A calendar can organise work, but it should not turn every hour into a measurement. Some things grow slowly: trust, forests, recovery and wisdom. To notice them is to see that duration itself can be a form of care.",
     "zh": "当时间既不被忽视也不被崇拜时，它会更有人情味。日历可以组织工作，却不应把每个小时都变成计量。有些事物成长缓慢：信任、森林、康复与智慧。注意到它们，就是看到持续本身也可以是一种关怀。"
    }
   ],

  {
   "zhTitle": "记忆与当下",
   "enTitle": "Memory and the Present",
   "paragraphs": [
    {
     "en": "Every story has to [[VW:finish|/ˈfɪnɪʃ/|完成；结束；结尾，最后部分]], sometimes not [[VW:immediately|/ɪˈmiːdiətli/|立即；直接地]] after the final event, but at the [[VW:instant|/ˈɪnstənt/|瞬间；立即的]] when meaning becomes clear. A single [[VW:moment|/ˈməʊmənt/|片刻；时刻]] can matter more than an hour, and a quiet [[VW:minute|/ˈmɪnɪt/|分，分钟；一会儿]] can repair a hurried day. Advice drawn from [[VW:prior|/ˈpraɪə(r)/|在先的，在前的]] experience may help, although the [[VW:former|/ˈfɔːmə(r)/|以前的；前者的；前者]] solution and the [[VW:preceding|/prɪˈsiːdɪŋ/|在前的，在先的]] choice are not always a [[VW:precedent|/ˈpresɪdənt/|先例；常规]] for what comes",
     "zh": "每个故事都必须结束，有时并非紧接最后事件之后，而是在 意义变得清晰的那一刻。单个瞬间可能比一小时更重要，安静的一分钟也能修复匆忙的一天。来自先前经验的建议可能 有帮助，尽管从前的方案与在先的选择并不总是后续事情的先例。"
    },
    {
     "en": "The [[VW:foremost|/ˈfɔːməʊst/|最前的；最重要的]] task is often simply to begin. At the [[VW:opening|/ˈəʊpənɪŋ/|开始的；开始，开端]], plans are fragile; [[VW:initially|/ɪˈnɪʃəli/|最初]], progress may seem slow, and an [[VW:intermediate|/ˌɪntəˈmiːdiət/|中间的]] stage may test patience. In the [[VW:midst|/mɪdst/|中部，中间]] of difficulty, [[VW:meantime|/ˈmiːntaɪm/|\\[in the~］其间，同时…]] and meanwhile  remind us that other work continues. Two [[VW:simultaneous|/ˌsɪm(ə)lˈteɪniəs/|同时发生(或进行)的]] efforts can support one another, even when one is [[VW:ongoing|/ˈɒnɡəʊɪŋ/|进行中的；继续存在的]] and the other seems near",
     "zh": "最重要的任务常常只是开始。开端时，计划很脆弱；起初， 进展可能显得缓慢，中间阶段会考验耐心。身处困难之中， 其间与同时提醒我们，其他工作仍在继续。两项同时进行的 努力可以相互支持，即使一项仍在持续，另一项似乎接近结束。"
    },
    {
     "en": "Some values are [[VW:everlasting|/ˌevəˈlɑːstɪŋ/|永恒的]], while other arrangements are temporary rather than [[VW:permanent|/ˈpɜːmənənt/|永久的]]. A [[VW:punctual|/ˈpʌŋktʃuəl/|准时的，守时的]] arrival shows respect, but the [[VW:duration|/djuˈreɪʃn/|持续时间；期间]] of a conversation matters more than its schedule. Several [[VW:consecutive|/kənˈsekjətɪv/|连续不断的]] attempts may fail, and a problem may return [[VW:periodically|/ˌpɪəriˈɒdɪkli/|周期性地，定期地]]. An [[VW:imminent|/ˈɪmɪnənt/|(尤指不愉快的事)即将发生的，逼近的…]] deadline should not produce panic; [[VW:incidentally|/ˌɪnsɪˈdent(ə)li/|偶然地；顺便提一句]], a delay may reveal a",
     "zh": "有些价值永恒，另一些安排则是暂时而非永久。准时到达体现尊重，但一段交谈的持续时间比日程更重要。连续数次尝 试可能失败，一个问题也可能周期性重现。即将到来的截止日期不应引发恐慌；顺便一提，延迟有时会揭示更好的道路。"
    },
    {
     "en": "The present is not a prison of isolated moments.  days a place in the [[VW:ongoing|/ˈɒnɡəʊɪŋ/|进行中的；继续存在的]] story, and hope gives the next step direction. To live well is to [[VW:finish|/ˈfɪnɪʃ/|完成；结束；结尾，最后部分]] what must be finished, to remember without being trapped by the past, and to remain open to what has not yet happened.",
     "zh": "当下不是孤立瞬间组成的牢笼。记忆让先前的日子在持续的故事中拥有位置，希望则为下一步指引方向。好好生活，就是完成必须完成之事，记住过去而不被困住，并对尚未发生的一切保持开放。"
    }
   ],
