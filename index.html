<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雅思词汇真经 · 每日鉴赏</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --ink:#2b2f36; --sub:#707784;
    --brand:#c8102e; --brand2:#1565c0; --line:#e6e9ef;
    --done:#fff7d6; --done-bd:#f0d97a; --todo:#eef1f4; --todo-bd:#dde3ea;
    --ok:#2e7d32; --bad:#c62828;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.7;}
  header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);
         padding:10px 16px;display:flex;align-items:center;gap:12px;}
  header .ttl{font-weight:700;font-size:16px;}
  header .ttl small{color:var(--sub);font-weight:400;margin-left:6px;font-size:12px;}
  header .spacer{flex:1;}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;
       padding:7px 12px;cursor:pointer;font-size:13px;transition:.15s;}
  .btn:hover{background:#f0f3f7;}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);}
  .btn.primary:hover{filter:brightness(1.05);}
  .btn.ghost{background:transparent;}
  .btn.sm{padding:4px 9px;font-size:12px;border-radius:6px;}
  main{padding:18px;max-width:1080px;margin:0 auto;}
  .hidden{display:none!important;}
  /* ---------- HOME ---------- */
  .home-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .stat{font-size:13px;color:var(--sub);}
  .stat b{color:var(--brand);font-size:15px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;}
  .ecard{border:1px solid var(--todo-bd);background:var(--todo);border-radius:12px;padding:13px 13px 11px;
         cursor:pointer;position:relative;transition:.15s;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;}
  .ecard:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.08);}
  .ecard.done{background:var(--done);border-color:var(--done-bd);}
  .ecard .no{font-size:12px;color:var(--sub);}
  .ecard .zh{font-weight:700;font-size:15px;margin-top:3px;}
  .ecard .en{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.3;}
  .ecard .badge{position:absolute;top:8px;right:8px;font-size:10px;padding:2px 6px;border-radius:20px;background:var(--brand);color:#fff;}
  .ecard .rev{position:absolute;bottom:8px;right:9px;font-size:10.5px;color:#a9791b;}
  /* ---------- STAGES ---------- */
  .stage-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .stage-head h2{margin:0;font-size:18px;}
  .stage-head .sub{color:var(--sub);font-size:13px;}
  .steps{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
  .step{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;}
  .step.active{background:var(--brand);color:#fff;border-color:var(--brand);}
  .step.done{background:#e8f5e9;color:var(--ok);border-color:#c8e6c9;}
  /* reading */
  .article-meta{margin-bottom:8px;}
  .article-meta .zh{font-size:20px;font-weight:800;}
  .article-meta .en{color:var(--sub);font-size:13px;}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 16px;}
  .controls label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:5px;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg button{border:none;background:#fff;padding:6px 11px;cursor:pointer;font-size:13px;color:var(--sub);}
  .seg button.on{background:var(--brand2);color:#fff;}
  /* ---------- 文章排版 ---------- */
  #rArticle{margin:0 auto;}
  #rArticle.rcont{max-width:820px;}
  #rArticle.rsb{max-width:1120px;}
  #rArticle.rsent{max-width:880px;}

  .para{margin:0 0 14px;}
  .para.en{font-size:16px;}
  .para.zh{font-size:14.5px;color:#3a4049;}

  /* 连续阅读（默认）：整段英文连续成段不拆分，中文整段置于英文下方 */
  .pblock{margin:0 0 30px;}
  .pblock .para.en{font-size:17px;line-height:2;color:#1b2230;margin:0 0 14px;
                   text-align:justify;letter-spacing:.1px;}
  .pblock .para.zh{font-size:14.5px;line-height:1.9;color:#5c6675;margin:0;
                   padding:12px 16px;background:#f6f8fa;border-left:3px solid var(--brand2);
                   border-radius:0 10px 10px 0;}

  /* 左右对照 */
  .sb{display:grid;grid-template-columns:1.06fr .94fr;gap:24px;align-items:start;
      padding:20px 0;border-bottom:1px dashed #e8ecf1;}
  .sb:last-child{border-bottom:0;}
  .sb .para.en{font-size:16.5px;line-height:1.95;color:#1b2230;margin:0;}
  .sb .col-zh{padding-left:20px;border-left:2px solid var(--line);}
  .sb .para.zh{margin-top:0;font-size:14.5px;line-height:1.9;color:#5c6675;}

  /* 逐句对照 */
  .sb-row{margin:0 0 14px;padding:6px 0 10px;border-bottom:1px solid #f0f3f6;}
  .sb-row:last-child{border-bottom:0;}
  .sb-row .en{font-size:16px;line-height:1.85;margin-bottom:6px;color:#1b2230;}
  .sb-row .zh{font-size:14px;color:#5c6675;padding-left:14px;border-left:3px solid #ffd54f;margin-left:2px;line-height:1.8;}
  .vw{cursor:pointer;color:var(--brand);font-weight:700;position:relative;white-space:nowrap;}
  .vw b{font-weight:700;}
  /* 音标改为行内展示：原 display:block 会把段落强行断成多行 */
  .vw-phon{display:inline;font-size:11px;color:var(--brand2);font-weight:400;margin-left:3px;}
  .vw:hover{background:#eaf1fb;border-radius:3px;text-decoration:none;}
  /* quiz */
  .qwrap{max-width:640px;margin:0 auto;}
  .qprog{height:8px;background:#e9edf2;border-radius:6px;overflow:hidden;margin-bottom:6px;}
  .qprog>i{display:block;height:100%;background:var(--brand);transition:.2s;}
  .qmeta{font-size:12.5px;color:var(--sub);margin-bottom:18px;display:flex;justify-content:space-between;}
  .qword{font-size:26px;font-weight:800;text-align:center;margin:6px 0 2px;}
  .qipa{text-align:center;color:var(--brand2);font-size:15px;margin-bottom:18px;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .opt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:14px;cursor:pointer;font-size:15px;transition:.12s;}
  .opt:hover{background:#f3f6fa;}
  .opt.ok{background:#e8f5e9;border-color:#a5d6a7;color:var(--ok);}
  .opt.bad{background:#ffebee;border-color:#ef9a9a;color:var(--bad);}
  .qhint{text-align:center;color:var(--sub);font-size:13px;margin-top:14px;}
  .qstreak{display:inline-flex;gap:4px;margin-left:6px;}
  .dot{width:9px;height:9px;border-radius:50%;background:#dcdcdc;display:inline-block;}
  .dot.on{background:var(--ok);}
  .qfb{text-align:center;margin-top:12px;font-size:14px;min-height:20px;}
  /* grammar */
  .g-sent{cursor:pointer;border-radius:8px;padding:8px 10px;margin:0 0 10px;font-size:16px;transition:.12s;}
  .g-sent:hover{background:#f3f6fa;}
  .g-sent.g-hl{background:#fff8e1;border-left:3px solid #ffb300;}
  .g-flag{font-size:11px;color:#b07400;margin-left:6px;vertical-align:middle;}
  .g-item{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;}
  .g-item b{color:var(--brand);}
  /* review */
  .rlist{display:flex;flex-direction:column;gap:10px;}
  .ritem{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;}
  .ritem .info{flex:1;}
  .ritem .info .zh{font-weight:700;}
  .ritem .info .en{font-size:12px;color:var(--sub);}
  .ritem .due{font-size:12px;color:#a9791b;}
  /* dictation */
  .dict{max-width:560px;margin:0 auto;text-align:center;}
  .dict .qzh{font-size:22px;font-weight:700;margin:10px 0 4px;}
  .dict .qipa-hint{color:var(--sub);font-size:13px;margin-bottom:14px;}
  .dict input{width:100%;padding:13px 14px;font-size:18px;border:1px solid var(--line);border-radius:10px;text-align:center;letter-spacing:1px;}
  .dict input:focus{outline:none;border-color:var(--brand2);}
  .dict .dresult{margin-top:12px;font-size:15px;min-height:22px;}
  .dict .dresult.ok{color:var(--ok);}
  .dict .dresult.bad{color:var(--bad);}
  .dict .showword{font-size:14px;color:var(--sub);margin-top:6px;}
  /* popover */
  #pop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:12px;
       box-shadow:0 8px 28px rgba(0,0,0,.18);padding:13px 15px;max-width:300px;display:none;}
  #pop .pw{font-size:18px;font-weight:800;}
  #pop .pi{color:var(--brand2);font-size:13px;margin:2px 0 6px;}
  #pop .pg{font-size:14px;line-height:1.5;}
  #pop .pgt{font-size:11px;color:var(--sub);margin-bottom:4px;}
  #pop .close{position:absolute;top:6px;right:9px;cursor:pointer;color:var(--sub);font-size:15px;}
  .footer-note{text-align:center;color:var(--sub);font-size:12px;margin:26px 0 8px;}
  @media(max-width:680px){ .sb{grid-template-columns:1fr;} .sb .col-zh{border-left:none;padding-left:0;} .opts{grid-template-columns:1fr;} }
</style>
</head>
<body class="mode-home">
<header>
  <div class="ttl">雅思词汇真经<small>每日鉴赏学习</small></div>
  <div class="spacer"></div>
  <button class="btn ghost sm" id="btnHome">🏠 首页</button>
</header>

<main>
  <!-- ===================== HOME ===================== -->
  <section id="home">
    <div class="home-head">
      <button class="btn primary" id="studyToday">📖 学习今日推荐</button>
      <button class="btn" id="openReview">📚 复习区</button>
      <span class="stat" id="homeStat"></span>
    </div>
    <div class="grid" id="essayGrid"></div>
    <div class="footer-note">点击任意卡片开始学习 · 已学完的主题显示淡黄色，未学为灰色 · 学过的单词会自动进入复习区</div>
  </section>

  <!-- ===================== READING ===================== -->
  <section id="reading" class="hidden">
    <div class="stage-head">
      <h2 id="rTitle">赏读</h2>
      <span class="sub" id="rSub"></span>
    </div>
    <div class="steps">
      <span class="step" data-stage="reading">① 赏读</span>
      <span class="step" data-stage="quiz">② 词汇闯关</span>
      <span class="step" data-stage="grammar">③ 语法精读</span>
    </div>
    <div class="article-meta">
      <div class="zh" id="rZh"></div>
      <div class="en" id="rEnTitle"></div>
    </div>
    <div class="controls">
      <button class="btn sm" id="playAudio">▶ 播放全文</button>
      <button class="btn sm" id="stopAudio">■ 停止</button>
      <label><input type="checkbox" id="showPhon"> 显示音标</label>
      <span class="seg" id="modeSeg">
        <button data-mode="cont" class="on">连续阅读</button>
        <button data-mode="sb">左右对照</button>
        <button data-mode="sent">逐句对照</button>
      </span>
    </div>
    <div id="rArticle"></div>
    <div style="text-align:center;margin-top:18px;">
      <button class="btn primary" id="toQuiz">进入词汇闯关 →</button>
    </div>
  </section>

  <!-- ===================== QUIZ ===================== -->
  <section id="quiz" class="hidden">
    <div class="stage-head"><h2>词汇闯关</h2><span class="sub" id="qSub"></span></div>
    <div class="steps">
      <span class="step" data-stage="reading">① 赏读</span>
      <span class="step active" data-stage="quiz">② 词汇闯关</span>
      <span class="step" data-stage="grammar">③ 语法精读</span>
    </div>
    <div class="qwrap">
      <div class="qprog"><i id="qBar"></i></div>
      <div class="qmeta"><span id="qCount"></span><span id="qPassed"></span></div>
      <div class="qword" id="qword"></div>
      <div class="qipa" id="qipa"></div>
      <div class="opts" id="qOpts"></div>
      <div class="qfb" id="qfb"></div>
      <div class="qhint">请选择正确中文释义
        <span class="qstreak" id="qstreak"></span>
      </div>
    </div>
    <div style="text-align:center;margin-top:18px;">
      <button class="btn primary hidden" id="toGrammar">进入语法精读 →</button>
      <button class="btn ghost sm" id="quizBack" style="margin-left:8px;">← 返回赏读</button>
    </div>
  </section>

  <!-- ===================== GRAMMAR ===================== -->
  <section id="grammar" class="hidden">
    <div class="stage-head"><h2>语法精读</h2><span class="sub" id="gSub"></span></div>
    <div class="steps">
      <span class="step" data-stage="reading">① 赏读</span>
      <span class="step" data-stage="quiz">② 词汇闯关</span>
      <span class="step active" data-stage="grammar">③ 语法精读</span>
    </div>
    <div id="gArticle"></div>
    <h3 style="margin:18px 0 6px;font-size:15px;">本篇重点语法讲解</h3>
    <div id="gList"></div>
    <div style="text-align:center;margin-top:20px;">
      <button class="btn primary" id="finishStudy">完成学习 · 返回首页</button>
    </div>
  </section>

  <!-- ===================== REVIEW LIST ===================== -->
  <section id="review" class="hidden">
    <div class="stage-head"><h2>📚 复习区</h2><span class="sub">错词优先 · 按遗忘曲线排期</span></div>
    <div class="rlist" id="reviewList"></div>
  </section>

  <!-- ===================== REVIEW QUIZ ===================== -->
  <section id="rquiz" class="hidden">
    <div class="stage-head"><h2 id="rqTitle">复习 · 词汇闯关</h2><span class="sub" id="rqSub"></span></div>
    <div class="qwrap">
      <div class="qprog"><i id="rqBar"></i></div>
      <div class="qmeta"><span id="rqCount"></span><span id="rqDue"></span></div>
      <div class="qword" id="rqword"></div>
      <div class="qipa" id="rqipa"></div>
      <div class="opts" id="rqOpts"></div>
      <div class="qfb" id="rqfb"></div>
      <div class="qhint">复习模式：选错会回到第 1 关，正确的词会按遗忘曲线延长下次复习间隔</div>
    </div>
    <div style="text-align:center;margin-top:18px;">
      <button class="btn primary hidden" id="rqFinish">完成复习 · 返回</button>
      <button class="btn ghost sm" id="rqBack" style="margin-left:8px;">← 返回复习区</button>
    </div>
  </section>

  <!-- ===================== DICTATION ===================== -->
  <section id="dict" class="hidden">
    <div class="stage-head"><h2 id="dTitle">拼写听写</h2><span class="sub">听发音 / 看释义，写出英文单词</span></div>
    <div class="dict">
      <div class="qprog"><i id="dBar"></i></div>
      <div class="qmeta" style="justify-content:center;"><span id="dCount"></span></div>
      <div class="qzh" id="dzh"></div>
      <div class="qipa-hint" id="dipaHint">点击「🔊 听发音」后拼写</div>
      <button class="btn sm" id="dSpeak" style="margin:6px 0 12px;">🔊 听发音</button>
      <input id="dInput" placeholder="在此输入英文拼写…" autocomplete="off">
      <div class="dresult" id="dResult"></div>
      <div class="showword hidden" id="dShow"></div>
      <div style="margin-top:14px;">
        <button class="btn primary" id="dNext">提交 / 下一词 →</button>
      </div>
    </div>
    <div style="text-align:center;margin-top:18px;">
      <button class="btn ghost sm hidden" id="dFinish">完成听写 · 返回</button>
      <button class="btn ghost sm" id="dBack" style="margin-left:8px;">← 返回复习区</button>
    </div>
  </section>
</main>

<div id="pop">
  <span class="close" id="popClose">×</span>
  <div id="popW" class="pw"></div>
  <div id="popI" class="pi"></div>
  <div id="popG" class="pg"></div>
  <div id="popGt" class="pgt hidden">语法点</div>
  <div id="popGList" class="pg hidden"></div>
</div>

const DATA = {
 "total": 49,

     "en": "The Earth is best understood as a set of connected systems. The [[VW:atmosphere|/ˈætməsfɪə(r)/|大气层，大气圈；气氛]] surrounds the planet and makes life possible; the [[VW:hydrosphere|/ˈhaɪdrəʊsfɪə(r)/|水圈；大气中的水汽]] includes its oceans, ice, rivers and water vapour; and the [[VW:lithosphere|/ˈlɪθəsfɪə(r)/|岩石圈]] forms the outer shell of rock on which people live. [[VW:Oxygen|/ˈɒksɪdʒən/|氧气]], [[VW:oxide|/ˈɒksaɪd/|氧化物]], [[VW:carbon dioxide|/ˌkɑːbən daɪˈɒksaɪd/|二氧化碳]] and [[VW:hydrogen|/ˈhaɪdrədʒən/|氢气]] take part in exchanges among these realms. Below the [[VW:crust|/krʌst/|地壳；外壳]] lies the [[VW:mantle|/ˈmænt(ə)l/|地幔；斗篷，披风；覆盖]], and at the centre is a dense [[VW:core|/kɔː(r)/|果核]]. A point on the [[VW:globe|/ɡləʊb/|球体；地球仪；地球]] can be described by [[VW:longitude|/ˈlɒŋɡɪtjuːd/|经度]] and [[VW:latitude|/ˈlætɪtjuːd/|纬度]], while its height above sea level is measured as [[VW:altitude|/ˈæltɪtjuːd/|高度，海拔]]. A measuring [[VW:pole|/pəʊl/|竿，杆]], for example, helps a surveyor relate a local landmark to that wider grid. These coordinates matter because the [[VW:horizon|/həˈraɪz(ə)n/|地平线；眼界，见识]] is not equally distant in every [[VW:landscape|/ˈlændskeɪp/|风景，地貌…]], and the angle of the Sun",
     "zh": "地球最好被理解为一组彼此关联的系统。大气层包裹着行星使生命成为可能；水圈包括海洋、冰、河流和水汽；岩石 圈则构成人类赖以生存的外层岩石壳。氧气、氧化物、二氧 化碳和氢气在这些领域之间参与交换。地壳之下是地幔，中 心则是致密的地核。地球上的一个点可以用经度和纬度来描述，而它高出海平面的高度被测量为海拔。例如，一根测量 杆能帮助测绘者把当地地标与更广阔的地理网格联系起来。 这些坐标之所以重要，是因为地平线在不同地貌中并不等距太阳角度也会随位置改变。"

    {
     "en": "Natural hazards reveal how quickly a familiar environment can change. A [[VW:mishap|/ˈmɪshæp/|小灾难]] may affect only one household, but a [[VW:disaster|/dɪˈzɑːstə(r)/|灾难]] can become [[VW:catastrophic|/ˌkætəˈstrɒfɪk/|灾难性的]] when warning systems fail. [[VW:Drought|/draʊt/|干旱，旱灾]] may [[VW:endanger|/ɪnˈdeɪndʒə(r)/|使遭受危险，危及]] food supplies, and [[VW:flooding|/ˈflʌdɪŋ/|洪水泛滥]] can [[VW:jeopardise|/ˈdʒepədaɪz/|危害，危及]] transport, while both may have [[VW:destructive|/dɪˈstrʌktɪv/|破坏性的，有害的]] effects on communities. A [[VW:calamity|/kəˈlæməti/|灾难，不幸的事]] is not simply a large event; it is a failure of protection, preparation and recovery. [[VW:El Nino|/ˌel ˈniːnjəʊ/|厄尔尼诺现象]] is a climate [[VW:phenomenon|/fəˈnɒmɪnən/|现象]] linked to changes in [[VW:ocean|/ˈəʊʃ(ə)n/|海洋；(五大洋之一的)洋]] temperatures and rainfall patterns, and the [[VW:greenhouse|/ˈɡriːnhaʊs/|温室，暖房]] effect, although essential in moderation, can intensify global warming. Scientists therefore study not only the power of a single event",
     "zh": "自然灾害揭示出熟悉的环境能够多快发生变化。一次小意外也许只影响一个家庭，但当预警系统失灵时，灾难就可能变 成大灾。干旱可能危及粮食供应，洪水则会使交通陷入风险两者都可能对社区造成破坏性影响。一场灾祸不仅是一个 巨大事件，更意味着保护、准备和恢复的失败。厄尔尼诺现 象与海洋温度和降雨格局的变化有关；温室效应虽然适度时 必不可少，却可能加剧全球变暖。因此，科学家不仅研究单一事件的力量，也研究暴露其中的社会有多脆弱。"
    },
    {
     "en": "The solid Earth is a storehouse of materials. A [[VW:magnet|/ˈmæɡnət/|磁铁，吸铁石]] can reveal the orientation of magnetic minerals, and an [[VW:ore|/ɔː(r)/|矿石；矿]] may contain enough metal to be mined economically. A [[VW:mineral|/ˈmɪnərəl/|矿物，矿物质；矿产]] has a characteristic chemical composition, whereas [[VW:marble|/ˈmɑːb(ə)l/|大理石；(玩具)弹球]], [[VW:quartz|/kwɔːts/|石英]] and [[VW:granite|/ˈɡrænɪt/|花岗岩]] are familiar rocks or minerals with different origins. Near a [[VW:volcano|/vɒlˈkeɪnəʊ/|火山]], heat and pressure can transform existing rock; along a [[VW:cliff|/klɪf/|悬崖，峭壁]], waves expose layers; and where a [[VW:glacier|/ˈɡlæsiə(r)/|冰河，冰川]] retreats, polished stone may record its former passage. Even a small [[VW:pebble|/ˈpeb(ə)l/|鹅卵石]] on a beach can record a long journey of erosion, transport and deposition. Such evidence helps",
     "zh": "固体地球是一座材料宝库。磁铁能够揭示磁性矿物的方向， 矿石则可能含有足够多、值得开采的金属。矿物具有特定的化学成分，而大理石、石英和花岗岩则是来源各异的常见岩石或矿物。在火山附近，高温高压能改变既有岩石；沿着悬 崖，海浪会露出岩层；冰川退却之处，磨光的石头则可能记录它曾经经过的痕迹。就连海滩上的一颗小鹅卵石，也能记 录侵蚀、搬运和沉积的漫长旅程。这样的证据帮助地质学家 重建远在文字记录之前存在的地貌。"
    },
    {
     "en": "Weather is driven by differences in heat, pressure and moisture. A light [[VW:breeze|/briːz/|微风，和风]] may be welcome on a hot afternoon, but a sudden [[VW:gust|/ɡʌst/|一阵狂风；(感情的)迸发]] can bend trees and lift dust. A [[VW:monsoon|/ˌmɒnˈsuːn/|季风；雨季]] brings seasonal rain, a [[VW:gale|/ɡeɪl/|大风]] can disrupt shipping, and a [[VW:hurricane|/ˈhʌrɪkən/|飓风；暴风]], [[VW:tornado|/tɔːˈneɪdəʊ/|龙卷风]] or [[VW:typhoon|/taɪˈfuːn/|台风]] may cause severe damage. A [[VW:volcano|/vɒlˈkeɪnəʊ/|火山]] can [[VW:erupt|/ɪˈrʌpt/|爆发，喷发…]] without warning, sending [[VW:magma|/ˈmæɡmə/|岩浆]] from below the surface and altering the land. [[VW:Thermodynamic|/ˌθɜːməʊdaɪˈnæmɪk/|热力的；热力学的]] processes govern these movements, while [[VW:smog|/smɒɡ/|烟雾，雾霾]], [[VW:fume|/fjuːm/|(难闻且常为有害的)烟，气体…]] and [[VW:mist|/mɪst/|薄雾；水汽；使视线模糊的东西]] affect visibility and",
     "zh": "天气由热量、气压和湿度的差异驱动。炎热午后，一阵微风 也许令人惬意，但突如其来的狂风能吹弯树木、扬起尘土。季风带来季节性降雨，大风会扰乱航运，飓风、龙卷风或台风则可能造成严重破坏。火山也可能毫无预警地喷发，把岩 浆从地下送出并改变大地。热力学过程支配着这些运动，而 烟雾、废气和薄雾会影响能见度与人类健康。"
    },
    {
     "en": "Some changes occur suddenly. A [[VW:tsunami|/tsuːˈnɑːmi/|海啸]] can cross an [[VW:ocean|/ˈəʊʃ(ə)n/|海洋；(五大洋之一的)洋]] after an [[VW:earthquake|/ˈɜːθkweɪk/|地震]], while [[VW:seismic|/ˈsaɪzmɪk/|地震的，地震引起的]] waves reveal movement deep underground. A [[VW:torrent|/ˈtɒrənt/|激流，洪流]] may cut a new channel, an [[VW:avalanche|/ˈævəlɑːnʃ/|雪崩]] may sweep down a mountain, and a [[VW:drought|/draʊt/|干旱，旱灾]] may persist for years. [[VW:Flooding|/ˈflʌdɪŋ/|洪水泛滥]] is often the result of several conditions rather than one cause. Together, these events reshape the surface and test the resilience of",
     "zh": "有些变化发生得很突然。地震之后，海啸可能横穿大洋，而地震波则揭示地下的运动。急流可能切出新河道，雪崩可能 冲下山坡，干旱则可能持续多年。洪水往往是多种条件共同 作用的结果，而不是只有一个原因。这些事件共同重塑地表也考验着人类聚居地的韧性。"
    },
    {
     "en": "The variety of [[VW:terrain|/təˈreɪn/|地形]] is remarkable. A [[VW:continent|/ˈkɒntɪnənt/|大陆；洲]] may include a [[VW:cave|/keɪv/|洞穴，山洞]] system, a [[VW:cliff|/klɪf/|悬崖，峭壁]] and a [[VW:glacier|/ˈɡlæsiə(r)/|冰河，冰川]]; a [[VW:swamp|/swɒmp/|沼泽，湿地]] can slowly become a [[VW:delta|/ˈdeltə/|三角洲]], a [[VW:plain|/pleɪn/|平原；简朴的；明白的]] or a [[VW:plateau|/ˈplætəʊ/|高原]]. An [[VW:oasis|/əʊˈeɪsɪs/|绿洲；宜人之地]] provides water in dry country, and the [[VW:globe|/ɡləʊb/|球体；地球仪；地球]] can be divided by the [[VW:equator|/ɪˈkweɪtə(r)/|赤道]] into a northern [[VW:hemisphere|/ˈhemɪsfɪə(r)/|半球]] and a southern [[VW:hemisphere|/ˈhemɪsfɪə(r)/|半球]]. From the [[VW:Arctic|/ˈɑːktɪk/|极冷的；北极的…]] to the [[VW:Antarctic|/ænˈtɑːktɪk/|南极的；南极地区，南极洲]], the [[VW:polar|/ˈpəʊlə(r)/|极地的，近极地的；对立的]] regions behave differently",
     "zh": "地形之丰富令人惊叹。一个大陆可能包含洞穴系统、悬崖和冰川；沼泽也可能逐渐变成三角洲、平原或高原。绿洲为干旱地区提供水源，而赤道把地球分为北半球和南半球。从北 极到南极，极地地区的行为与温带不同，地轴的倾斜则造就了四季。"
    },
    {
     "en": "Landscapes also [[VW:deteriorate|/dɪˈtɪəriəreɪt/|恶化，变坏]] under  vulnerable land, leaving little room to [[VW:upgrade|/ˌʌpˈɡreɪd/|使升级；提高，改善]] balance between land and [[VW:ocean|/ˈəʊʃ(ə)n/|海洋；(五大洋之一的)洋]]. Geological change is slow, but human choices can",
     "zh": "pressure. Poor land management can aggravate /ˈæɡrəveɪt/ （加重，加剧，使恶化） erosion, erode /ɪˈrəʊd/ （侵蚀，腐蚀）damaged ecosystems. Rivers carry sediment to the Mediterranean /ˌmedɪtəˈreɪniən/ （地中海的；地中海地区的…）, the Atlantic /ətˈlæntɪk/ （大西洋的；大西洋） and the Pacific /pəˈsɪfɪk/ （平静的，和平的；太平洋的…）, where marine /məˈriːn/ （海生的，海洋的；海事的；水兵） life depends on the地貌也会在压力下退化。糟糕的土地管理会加剧侵蚀、冲蚀肥沃土壤并使脆弱土地退化，让受损生态系统几乎没有恢复升级的空间。河流把沉积物带入地中海、大西洋和太平洋，海洋生命依赖陆地与海洋之间的平衡。地质变化缓慢，但人类选择可能加速它；理解这种联系，是责任地守护环境的第一步。"
    }

  {
   "zhTitle": "地貌天气",
   "enTitle": "Land and Weather",
   "paragraphs": [
    {
     "en": "Coastal study begins with [[VW:navigation|/ˌnævɪˈɡeɪʃ(ə)n/|航行；航海]]. A [[VW:gulf|/ɡʌlf/|海湾]] may shelter a [[VW:beach|/biːtʃ/|海滩，河滩]], while the open [[VW:coast|/kəʊst/|海岸，海滨]] and rocky [[VW:shore|/ʃɔː(r)/|(海、湖等大水域的)岸，滨]] face the full energy of the sea. The [[VW:tide|/taɪd/|趋势，潮流；潮汐]] rises and falls, a [[VW:current|/ˈkʌrənt/|潮流，趋势；当前的]] moves [[VW:sediment|/ˈsedɪmənt/|沉淀物；沉积物]] along the seabed, and a small [[VW:brook|/brʊk/|小河，溪]] or [[VW:stream|/striːm/|小河，溪；流；流动，流出]] carries material from an inland [[VW:source|/sɔːs/|河的源头；根源]]. No [[VW:coast|/kəʊst/|海岸，海滨]] is",
     "zh": "海岸研究从航行开始。海湾可能庇护一处海滩，而开阔海岸 与多岩海岸则承受海洋的全部能量。潮水涨落，海流沿海床 搬运沉积物，小溪或河流则把内陆源头的物质带来。没有哪段海岸是静止的：每一小时都在改变边缘的形状。"
    },
    {
     "en": "The [[VW:shore|/ʃɔː(r)/|(海、湖等大水域的)岸，滨]] can be [[VW:shallow|/ˈʃæləʊ/|浅的；肤浅的，浅薄的]] or [[VW:steep|/stiːp/|陡峭的，陡直的]], [[VW:flat|/flæt/|【尤英】单元房，公寓]] or [[VW:vertical|/ˈvɜːtɪk(ə)l/|垂直的，直立的]]. A [[VW:smooth|/smuːð/|光滑的；平稳的；流畅的]] surface often indicates repeated movement by water, whereas a [[VW:rough|/rʌf/|粗糙的；粗略的]], [[VW:sandy|/ˈsændi/|铺满沙的；含沙的]] or [[VW:stony|/ˈstəʊni/|石头的；多石的]] [[VW:beach|/biːtʃ/|海滩，河滩]] records different energies and materials. A [[VW:narrow|/ˈnærəʊ/|狭窄的；有局限的；海峡；变窄]] path may run [[VW:parallel|/ˈpærəlel/|平行线；相似之物；相似之处…]] to a cliff, and a [[VW:superficial|/ˌsuːpəˈfɪʃ(ə)l/|表面的，外表的；肤浅的]] layer of sand can hide older deposits below. Close observation turns a",
     "zh": "海岸可以浅，也可以陡；可以平坦，也可以垂直。光滑表面 往往说明水流反复运动，而粗糙、多沙或多石的海滩则记录 着不同的能量与物质。狭窄的小路可能平行于悬崖延伸，表层沙土之下则可能藏着更古老的沉积。仔细观察能把一幅悦 目的景色变成一份物理过程的记录。"
    },
    {
     "en": "[[VW:Oceania|/ˌəʊsiˈɑːniə/|大洋洲]] offers striking examples of the relationship between sea and land. On a [[VW:mainland|/ˈmeɪnlənd/|大陆，本土]] [[VW:coast|/kəʊst/|海岸，海滨]], a [[VW:peninsula|/pəˈnɪnsjələ/|半岛]] may project into the water like a natural pier. [[VW:Climate|/ˈklaɪmət/|气候；风气，思潮，环境]] and [[VW:weather|/ˈweðə(r)/|天气，气象]] are not identical: [[VW:climate|/ˈklaɪmət/|气候；风气，思潮，环境]] describes long-term patterns, while [[VW:meteorology|/ˌmiːtiəˈrɒlədʒi/|气象学]] studies short-term conditions. A [[VW:mild|/maɪld/|温和的；不严重的]] day can follow [[VW:moderate|/ˈmɒdərət/|适度的；温和的…]] [[VW:heating|/ˈhiːtɪŋ/|供暖；暖气装置]], yet [[VW:warm|/wɔːm/|温暖的 (使)变暖]] [[VW:thermal|/ˈθɜːm(ə)l/|热量的]] currents may",
     "zh": "大洋洲提供了海陆关系的鲜明例证。在大陆海岸上，半岛可 能像天然码头一样伸入水中。气候与天气并不相同：气候描述长期格局，气象学则研究短期状况。温和的一天可能出现 在中等强度的增温之后，但热带地区的温暖热流也可能迅速形成。"
    },
    {
     "en": "Moisture creates further variety. An [[VW:arid|/ˈærɪd/|干燥的，干旱的；枯燥的]] [[VW:coast|/kəʊst/|海岸，海滨]] may become [[VW:damp|/dæmp/|潮湿的，湿气重的]] after a storm; [[VW:moist|/mɔɪst/|潮湿的，湿润的]], [[VW:humid|/ˈhjuːmɪd/|潮湿的，湿热的]] air can make a [[VW:mild|/maɪld/|温和的；不严重的]] evening feel heavy, while a [[VW:chill|/tʃɪl/|(使)变冷；使恐惧；寒冷…]] can arrive after sunset. [[VW:Snowy|/ˈsnəʊi/|下雪多的；被雪覆盖的]] conditions, [[VW:frost|/frɒst/|霜；霜冻；严寒]] and [[VW:hail|/heɪl/|雹，冰雹；赞扬；招呼；下雹]] are possible in cold seasons, while a [[VW:thaw|/θɔː/|解冻，融解，融化；解冻时期]] may follow a [[VW:freeze|/friːz/|结冰；霜冻；严寒期]]. A [[VW:frigid|/ˈfrɪdʒɪd/|寒冷的]] wind can make people [[VW:tremble|/ˈtremb(ə)l/|战栗，颤抖；战栗，颤抖]] or [[VW:shiver|/ˈʃɪvə(r)/|颤抖，哆嗦，发抖]], and the sound of [[VW:thunder|/ˈθʌndə(r)/|雷；雷声；打雷…]] and [[VW:lightning|/ˈlaɪtnɪŋ/|闪电；闪电般的，极快的]] may announce a [[VW:stormy|/ˈstɔːmi/|有暴风雨的；争吵激烈的…]] night.",
     "zh": "水汽带来更多变化。干旱海岸可能在暴风雨后变得潮湿；湿润空气会让温和的夜晚显得沉滞，日落之后也可能泛起寒意。寒冷季节可能出现降雪、霜和冰雹，解冻也可能紧随冰冻而来。刺骨寒风使人发抖或战栗，雷声与闪电则可能宣告一个暴风雨之夜。"
    },
    {
     "en": "Rain arrives in many forms. A [[VW:downpour|/ˈdaʊnpɔː(r)/|倾盆大雨]] can cause local flooding, while steady [[VW:rainfall|/ˈreɪnfɔːl/|降雨量]] nourishes fields. A brief [[VW:sprinkle|/ˈsprɪŋk(ə)l/|撒，洒；下小雨；少量；小雨]] may barely wet the ground, and a [[VW:rainbow|/ˈreɪnbəʊ/|虹，彩虹]] often appears when sunshine returns after a [[VW:shower|/ˈʃaʊə(r)/|阵雨；(一)阵；淋浴]]. [[VW:Temperature|/ˈtemprətʃə(r)/|气温；体温；温度]] is usually reported in [[VW:Celsius|/ˈselsiəs/|摄氏的；摄氏温度]], and a [[VW:forecast|/ˈfɔːkɑːst/|预测，预报；预测，预言]] helps travellers prepare for sudden changes. The [[VW:peak|/piːk/|山峰；顶点；达到最大值]] of a [[VW:mountain|/ˈmaʊntən/|山，山岳，高山]] may be colder than a [[VW:valley|/ˈvæli/|山谷，溪谷]], and a [[VW:ridge|/rɪdʒ/|山脊，山脉；使隆起]] can shelter one [[VW:slope|/sləʊp/|倾斜；有坡度；山坡；斜坡]] while exposing",
     "zh": "降雨以多种形式到来。倾盆大雨可能引发局部洪水，稳定降雨则滋养田野。短暂细雨几乎只打湿地面，而阵雨之后阳光归来时，彩虹常常出现。温度通常以摄氏度报告，天气预报帮助旅行者应对突变。山峰可能比山谷更冷，山脊能遮蔽一面山坡，却让另一面完全暴露。"
    },
    {
     "en": "Landforms shape movement and settlement. A [[VW:range|/reɪndʒ/|(在一定幅度内)变动]] of mountains may run from north to south, with valleys and a [[VW:steep|/stiːp/|陡峭的，陡直的]] [[VW:hillside|/ˈhɪlsaɪd/|(小山的)山腰，山坡]] between them. Travellers in the [[VW:southern|/ˈsʌðən/|南部的；南方的]] or [[VW:eastern|/ˈiːstən/|东部的；东方的]] valleys may [[VW:mount|/maʊnt/|渐渐增加；爬上，登上；山]] a [[VW:ridge|/rɪdʒ/|山脊，山脉；使隆起]] to gain a wider view, and a viewpoint can [[VW:overlook|/ˌəʊvəˈlʊk/|俯瞰，远眺；未注意到]] the surrounding country, while roads run [[VW:southeast|/ˌsaʊθˈiːst/|东南方；东南部；东南方的…]], [[VW:southwest|/ˌsaʊθˈwest/|西南方；西南部；西南方的…]], [[VW:northeast|/ˌnɔːθˈiːst/|东北方；东北部；东北方的…]] or [[VW:northwest|/ˌnɔːθˈwest/|西北方；西北部；西北方的…]]. People sometimes label distant cultures as [[VW:oriental|/ˌɔːriˈent(ə)l/|东方的(尤指中国和日本的)]] or exotic, but such terms say more about the observer than the place being observed.",
     "zh": "地貌塑造着迁徙与定居。一条山脉可能自北向南延伸，山谷与陡峭山坡分布其间。身处南部或东部山谷的旅行者可以登上一道山脊以获得更开阔的视野，观景点则能俯瞰周边乡野道路则向东南、西南、东北或西北延伸。人们有时把他方文化称为“东方的”或“异域的”，但这些词更多反映观察者自身，而非被观察的地方。"
    },
    {
     "en": "Some natural processes are [[VW:inevitable|/ɪnˈevɪtəb(ə)l/|不可避免的，必然的]], and serious soil loss may be [[VW:irreversible|/ˌɪrɪˈvɜːsəb(ə)l/|不可逆转的；不可挽回的]]. [[VW:Weather|/ˈweðə(r)/|天气，气象]] can behave [[VW:irregularly|/ɪˈreɡjələli/|不规则地；不合常规地]], and human construction may be [[VW:inappropriate|/ˌɪnəˈprəʊpriət/|不合适的]] if it ignores local conditions. An [[VW:abnormal|/æbˈnɔːm(ə)l/|不正常的，反常的；变态的]] [[VW:tide|/taɪd/|趋势，潮流；潮汐]] or [[VW:sediment|/ˈsedɪmənt/|沉淀物；沉积物]] flow can leave [[VW:silt|/sɪlt/|淤泥，泥沙 (使)淤塞]] that makes water [[VW:muddy|/ˈmʌdi/|泥泞的；浑浊的]]. Good planning accepts uncertainty, studies the evidence, and adapts before a small environmental problem becomes a costly",
     "zh": "有些自然过程不可避免，严重的水土流失甚至可能不可逆转。天气会表现得毫无规律，若忽视当地条件，人类建设也可能并不合适。反常的潮汐或泥沙流会留下淤泥，使河水浑浊。良好的规划接受不确定性，研究证据，并在小环境问题演变为高昂代价之前作出调整。"
    }
   ],

  {
   "zhTitle": "环境变迁",
   "enTitle": "Environmental Change",
   "paragraphs": [
    {
     "en": "Environmental change is often visible first at the edge of a settlement. [[VW:Clay|/kleɪ/|黏土，陶土]] and [[VW:dirt|/dɜːt/|污垢，灰尘；［尤美］泥土]] may be exposed where a [[VW:rural|/ˈrʊərəl/|农村的，乡村的；田园的]] road meets a [[VW:suburb|/ˈsʌbɜːb/|郊区，郊外，近郊]], while the [[VW:outskirts|/ˈaʊtskɜːts/|郊区，市郊]] of a city can feel [[VW:remote|/rɪˈməʊt/|遥远的；偏僻的；疏远的]] and even [[VW:desolate|/ˈdesələt/|荒凉的]]. A [[VW:distant|/ˈdɪstənt/|疏远的；遥远的]] factory is not necessarily harmless if it is [[VW:adjacent|/əˈdʒeɪs(ə)nt/|邻近的，毗连的]] to a river, because [[VW:toxic|/ˈtɒksɪk/|有毒的]] [[VW:pollution|/pəˈluːʃ(ə)n/|污染]] can travel through water and [[VW:contaminate|/kənˈtæmɪneɪt/|弄脏，污染]] farmland. [[VW:Geology|/dʒiˈɒlədʒi/|地质学；地质状况]], soil type and land use all influence where a [[VW:pollutant|/pəˈluːtənt/|污染物质]] will go.",
     "zh": "环境变化常常最先在聚居地边缘显现。乡村道路与郊区相接之处，可能露出黏土和泥土；城市郊外可能显得偏远，甚至荒凉。远处的工厂若与河流毗邻，未必无害，因为有毒污染能随水传播并污染农田。地质、土壤类型和土地利用都会影响污染物的去向。"
    },
    {
     "en": "The boundary between town and country is rarely a simple line. A [[VW:border|/ˈbɔːdə(r)/|边界；边界地区；镶边…]] may be marked by a [[VW:margin|/ˈmɑːdʒɪn/|边缘；页边空白；余地]] of trees or a [[VW:fringe|/frɪndʒ/|边缘；刘海儿；次要的…]] of weeds; a [[VW:plate|/pleɪt/|(地质学中的大陆)板块；盘]] of concrete can cover fragile ground, and [[VW:debris|/ˈdebriː/|碎片，残骸]] may collect in every [[VW:crack|/kræk/|破裂；发出爆裂声；裂缝；缝隙]] and [[VW:gap|/ɡæp/|缺口，裂缝；差距；空白]]. Yet the same place can also be [[VW:splendid|/ˈsplendɪd/|极好的；壮观的]], [[VW:grand|/ɡrænd/|宏大的；豪华的，宏伟的…]] and [[VW:magnificent|/mæɡˈnɪfɪs(ə)nt/|壮丽的，宏伟的…]]. A damaged landscape is not merely ugly: it can be [[VW:dramatic|/drəˈmætɪk/|戏剧的；引人注目的]], [[VW:interesting|/ˈɪntrəstɪŋ/|有趣的；引人入胜的]] and, in the right hands, full of possibility.",
     "zh": "城乡之间的边界很少是一条简单直线。边界可能由一排树、一条杂草镶边标出；一块混凝土板可能覆盖脆弱地面，碎片则积在每道裂缝和缝隙里。但同一个地方也可能壮丽、宏大、辉煌。受损景观并不只是丑陋：它也可以富有戏剧性、趣味和可能，只要交到合适的治理者手中。"
    },
    {
     "en": "Restoration begins with understanding damage. [[VW:Wilderness|/ˈwɪldənəs/|荒野]] is not empty land, and a [[VW:desert|/ˈdezət/|沙漠；离弃，遗弃；擅离]] is not necessarily [[VW:barren|/ˈbærən/|贫瘠的，荒芜的；不结果实的]]. When people [[VW:deforest|/ˌdiːˈfɒrɪst/|毁掉……森林]] a slope, [[VW:fertile|/ˈfɜːtaɪl/|肥沃的，富饶的]] soil may later be washed away. Farmers can [[VW:fertilise|/ˈfɜːtəlaɪz/|施肥于]] fields and plant cover crops, while [[VW:solar|/ˈsəʊlə(r)/|太阳的，日光的]] panels and a [[VW:lunar|/ˈluːnə(r)/|月亮的，月球的]] [[VW:calendar|/ˈkælɪndə(r)/|日历；历法]] remind a community that [[VW:sunrise|/ˈsʌnraɪz/|日出]], [[VW:sunset|/ˈsʌnset/|日落]], an [[VW:eclipse|/ɪˈklɪps/|日食；月食]] and [[VW:dusk|/dʌsk/|黄昏，傍晚]] are connected to [[VW:natural|/ˈnætʃ(ə)rəl/|自然的；天然的]] cycles. No single [[VW:super|/ˈsuːpə(r)/|超级的，极好的]] solution can repair every landscape, but [[VW:sunshine|/ˈsʌnʃaɪn/|阳光，日光]], [[VW:shade|/ʃeɪd/|阴影部分；背阴处…]] and the moving [[VW:shadow|/ˈʃædəʊ/|影子，阴影]] of a tree reveal how local conditions change through the day. [[VW:Heaven|/ˈhev(ə)n/|天堂；极乐(之地)；天空]] and [[VW:paradise|/ˈpærədaɪs/|天堂；乐园，福地]] are poetic ideas, but sustainable stewardship is",
     "zh": "修复从理解损害开始。荒野并非空地，沙漠也未必贫瘠。当人们砍伐山坡森林，肥沃土壤日后可能被冲走。农民可以施肥、种植覆盖作物；太阳能板与阴历提醒社区，日出、日落、 月食和黄昏都与自然循环相连。并没有哪一种超级方案能修 复所有景观，但阳光、背阴处和树木移动的影子揭示了当地 条件如何随一天变化。天堂与乐园是诗意的观念，可持续守 护却是实际工作。"
    },
    {
     "en": "Water can [[VW:circulate|/ˈsɜːkjəleɪt/|(使)循环，(使)流通…]] constantly through the [[VW:environment|/ɪnˈvaɪrənmənt/|自然环境；环境，周围状况]]. Heat causes [[VW:vapour|/ˈveɪpə(r)/|蒸气；水汽]] to [[VW:evaporate|/ɪˈvæpəreɪt/|(使)蒸发；消失]], clouds form, rain may [[VW:precipitate|/prɪˈsɪpɪteɪt/|(水汽等)凝结；沉淀]], and a [[VW:reservoir|/ˈrezəvwɑː(r)/|水库，蓄水池]] stores water for dry months. A [[VW:waterfall|/ˈwɔːtəfɔːl/|瀑布]], [[VW:fountain|/ˈfaʊntən; ˈfaʊntɪn/|喷泉；源泉]] or [[VW:spring|/sprɪŋ/|春天；泉水；跳，跃；跳，跃]] can become both a habitat and a public attraction. [[VW:Dew|/djuː/|露水]] forms quietly; heavy rain can [[VW:pour|/pɔː(r)/|倾泻；倒；(雨)倾盆而下]] through streets, [[VW:drain|/dreɪn/|排空；(使)流出；耗竭]] into rivers, [[VW:drip|/drɪp/|滴出(液体)；滴下]] from roofs or [[VW:gush|/ɡʌʃ/|涌出；涌出]] from a broken pipe. New shoots [[VW:emerge|/ɪˈmɜːdʒ/|浮现，露出；摆脱出来；暴露]] after the water reaches the soil. A child may splash in a puddle, yet the same",
     "zh": "水不断在环境中循环。热量使水汽蒸发，云层形成，雨水可 能降落，水库则为干旱月份蓄水。瀑布、喷泉或泉水既能成为栖息地，也能成为公共景点。露水悄然凝结；暴雨会灌满 街道、排入河流、从屋顶滴落，或从破裂管道喷涌而出。水抵达土壤之后，新芽便会冒出。孩子也许会在水洼中嬉戏，但同样的水也可能淹没缺少防护的田地。"
    },
    {
     "en": "Air moves in similar patterns. Wind can [[VW:blow|/bləʊ/|吹；(风)吹；吹动…]] gently or [[VW:puff|/pʌf/|喷出…]] through a valley; a [[VW:dense|/dens/|密集的；稠密的]] cloud may gather with surprising [[VW:intensity|/ɪnˈtensəti/|强度；强烈]]. [[VW:Intensive|/ɪnˈtensɪv/|加强的，集中的，密集的]] farming, traffic and industry can reduce air quality, while a [[VW:flash|/flæʃ/|(使)闪光；(使)闪现…]] of lightning may start a bush fire. Smoke and dust [[VW:float|/fləʊt/|漂浮；飘浮]] through the [[VW:surrounding|/səˈraʊndɪŋ/|周围的，附近的]] atmosphere, and the [[VW:condition|/kənˈdɪʃn/|条件；情况，状态]] of the [[VW:environment|/ɪnˈvaɪrənmənt/|自然环境；环境，周围状况]] changes from one",
     "zh": "空气的运动遵循类似模式。风可能轻柔吹过，也可能在山谷间阵阵鼓起；浓云会以惊人的强度聚集。集约化农业、交通和工业会降低空气质量，而一道闪电可能点燃丛林火灾。烟 尘飘浮在周围大气中，环境状况也随情境不断变化。"
    },
    {
     "en": "The distinction between [[VW:nature|/ˈneɪtʃə(r)/|大自然；本性；性质]], [[VW:natural|/ˈnætʃ(ə)rəl/|自然的；天然的]] and [[VW:artificial|/ˌɑːtɪˈfɪʃ(ə)l/|人造的]] or [[VW:synthetic|/sɪnˈθetɪk/|人造的，合成的；合成物]] materials matters when assessing impact. [[VW:Petrol|/ˈpetrəl/|汽油]], [[VW:gas|/ɡæs/|气体；汽油]], [[VW:gasoline|/ˈɡæsəliːn/|汽油]] and [[VW:petroleum|/pəˈtrəʊlɪəm/|石油]] provide energy, but their extraction and use can damage land, water and air. A wise policy does not reject technology as a whole; it asks whether a particular method is",
     "zh": "在评估影响时，自然、天然与人造、合成材料之间的区别很重要。汽油、燃气、汽油和石油提供能源，但开采与使用会 损害土地、水和空气。明智政策不会一概拒绝技术，而会追 问某种方法在长期内是否高效、公平且安全。"
    },
    {
     "en": "Evidence from reliable monitoring allows communities to see whether conditions are improving. Change may be slow and local, but it is rarely isolated. The air above a city, the water in a river and the soil beneath a field form one interconnected system, so protecting that system",
     "zh": "来自可靠监测的证据，让社区能够判断状况是否改善。变化可能缓慢而局部，却很少孤立发生。城市上空的空气、河流 中的水和田野下的土壤构成一个相互连接的系统，因此保护 它需要跨越边界与代际的合作。"
    }
   ],

  {
   "zhTitle": "生长与繁殖",
   "enTitle": "Growth and Reproduction",
   "paragraphs": [
    {
     "en": "Plant life begins with a remarkable chemical process. Through [[VW:photosynthesis|/ˌfəʊtəʊˈsɪnθəsɪs/|光合作用]], green [[VW:vegetation|/ˌvedʒəˈteɪʃ(ə)n/|植物，草木]] uses [[VW:sunlight|/ˈsʌnlaɪt/|阳光]] to combine carbon [[VW:dioxide|/daɪˈɒksaɪd/|二氧化物]] with water and produce the energy-rich compounds on which most of an [[VW:ecosystem|/ˈiːkəʊsɪstəm/|生态系统]] depends. Every [[VW:organism|/ˈɔːɡənɪzəm/|有机体，生物]] can [[VW:respire|/rɪˈspaɪə(r)/|呼吸]], releasing carbon [[VW:dioxide|/daɪˈɒksaɪd/|二氧化物]], and the balance between plants and animals shapes the atmosphere. [[VW:Botany|/ˈbɒtəni/|植物学]] is therefore not only the study of a [[VW:herb|/hɜːb/|药草；香草]] and a [[VW:perennial|/pəˈreniəl/|多年生植物；长期的，持久的]] [[VW:flower|/ˈflaʊə(r)/|开；花；花；朵]] but also the [[VW:ecology|/iˈkɒlədʒi/|生态学；生态]]",
     "zh": "植物生命始于一个非凡的化学过程。通过光合作用，绿色植 被利用阳光把二氧化碳与水结合，产生生态系统赖以生存的 富能化合物。每一种生物都会呼吸并释放二氧化碳，植物与动物之间的平衡塑造着大气。因此，植物学不仅研究一种香 草和一种多年生花卉，也研究空气、水、土壤与阳光之间的 关系生态。"
    },
    {
     "en": "[[VW:Horticulture|/ˈhɔːtɪkʌltʃə(r)/|园艺学；园艺]] applies that knowledge in gardens, farms and parks. An [[VW:eco-friendly|/ˌiːkəʊ ˈfrendli/|对生态环境友好的，不妨害生态环境的…]] approach protects soil life and reduces waste. [[VW:Genetics|/dʒəˈnetɪks/|遗传学]] explains why offspring resemble their parents, while [[VW:mutation|/mjuːˈteɪʃn/|突变，变异]], [[VW:variation|/ˌveəriˈeɪʃ(ə)n/|变种；变异]] and [[VW:diversity|/daɪˈvɜːsəti/|多样性]] provide the raw material for evolution. [[VW:Hybridisation|/ˌhaɪbrɪdaɪˈzeɪʃən/|杂交]] can combine useful traits, and scientists [[VW:classify|/ˈklæsɪfaɪ/|分类]] organisms in order to compare them. Plants [[VW:reproduce|/ˌriːprəˈdjuːs/|繁殖]] in many ways, [[VW:evolve|/ɪˈvɒlv/|进化…]] under changing conditions and [[VW:fluctuate|/ˈflʌktʃueɪt/|波动，起伏]] with rainfall and temperature. Some species [[VW:reclaim|/rɪˈkleɪm/|开垦，开拓，利用]] disturbed",
     "zh": "园艺学把这种知识应用于花园、农场和公园。生态友好的方 法保护土壤生命，减少浪费。遗传学解释后代为何像亲本， 突变、变异和多样性则提供进化的原材料。杂交可以组合有用性状，科学家对生物进行分类以便比较。植物以许多方式 繁殖，在不断变化的环境中进化，并随降雨和温度波动。有些物种能开拓受扰土地，把裸土变成栖息地。"
    },
    {
     "en": "People [[VW:cultivate|/ˈkʌltɪveɪt/|耕作；培养]] plants for food, medicine and beauty. Farmers [[VW:sow|/səʊ/|播种]] [[VW:seed|/siːd/|种子，籽；萌芽]], [[VW:harvest|/ˈhɑːvɪst/|收割；收获；收成]] grain and [[VW:pluck|/plʌk/|采，摘]] [[VW:fruit|/fruːt/|水果，成果；结果实]]; gardeners [[VW:pick|/pɪk/|拾；摘]] flowers and [[VW:rear|/rɪə(r)/|培养，抚养；饲养；后部]] young plants in protected beds. In an [[VW:arable|/ˈærəb(ə)l/|适于耕种的]] [[VW:field|/fiːld/|领域]], a [[VW:plough|/plaʊ/|犁；耕(地)]] may break the soil, a [[VW:spade|/speɪd/|铲，锹]] can turn it, and a [[VW:rake|/reɪk/|耙子；耙；搜索]] can level it before [[VW:seed|/siːd/|种子，籽；萌芽]] is planted in rows. A good crop [[VW:yield|/jiːld/|出产；屈服，服从；产量…]] depends on water, light and careful timing. After [[VW:harvest|/ˈhɑːvɪst/|收割；收获；收成]], a [[VW:stack|/stæk/|堆，垛；堆积]] or [[VW:heap|/hiːp/|(大而杂乱的)堆]] of straw may be left in a corner, while a [[VW:bundle|/ˈbʌnd(ə)l/|捆，包，束]] of wheat or a [[VW:bunch|/bʌntʃ/|一束(花)，一串(钥匙)]] of flowers is tied for storage. Even a simple [[VW:vase|/vɑːz/|瓶，花瓶]] connects a domestic room to the wider cycle of growth.",
     "zh": "人们栽培植物，是为了食物、药物和美感。农民播下种子，收割谷物，采摘果实；园丁剪下花朵，并在受保护的苗床里养育幼苗。在耕地上，犁可以破土，铲子可以翻土，耙子则能在种子成行播下前整平地面。良好的作物产量取决于水、光和恰当的时机。收获后，稻草可能成堆或成垛留在角落，一捆小麦或一束花则被扎起储存。即使一只普通花瓶，也把室内空间与更广阔的生长循环联系起来。"
    },
    {
     "en": "Growth responds to light and season. A  plant flowers when nights are long, whereas a [[VW:shade-tolerant|/ʃeɪd ˈtɒlərənt/|耐阴的]] species can survive below a canopy. A [[VW:fungus|/ˈfʌŋɡəs/|真菌]] or [[VW:mould|/məʊld/|霉；菌；发；霉]] may spread in damp conditions, and [[VW:pollen|/ˈpɒlən/|花粉；给……授粉]] must reach a receptive [[VW:flower|/ˈflaʊə(r)/|开；花；花；朵]] before [[VW:seed|/siːd/|种子，籽；萌芽]] can [[VW:germinate|/ˈdʒɜːmɪneɪt/|(使)发芽；开始生长]]. A [[VW:bud|/bʌd/|芽，苞，蓓蕾]] may [[VW:burgeon|/ˈbɜːdʒən/|嫩枝，新芽；急速增长…]] into new shoots, and a [[VW:flower|/ˈflaʊə(r)/|开；花；花；朵]] may [[VW:blossom|/ˈblɒsəm/|开；花；花；朵]] or [[VW:bloom|/bluːm/|花朵]] with a distinctive [[VW:scent|/sent/|气味；香味；使具有香味]]. [[VW:Aromatic|/ˌærəˈmætɪk/|芳香的]] plants attract pollinators, and [[VW:fruit|/fruːt/|水果，成果；结果实]] begins to [[VW:ripen|/ˈraɪpən/|(使)成熟]] after pollination.",
     "zh": "生长会回应光照与季节。短日照植物在夜长时开花，耐阴物种则能在树冠下存活。真菌或霉菌可能在潮湿环境中扩散，花粉必须先到达可受粉的花，种子才能萌发。花蕾会抽枝成长，花朵可能绽放并散发独特气味。芳香植物吸引传粉者，授粉之后果实开始成熟。"
    },
    {
     "en": "Nothing in a garden lasts forever. A plant may [[VW:wither|/ˈwɪðə(r)/|(使)枯萎]] when water runs short, and fallen , [[VW:rot|/rɒt/|(使)腐烂，(使)腐坏；腐烂]] or [[VW:decay|/dɪˈkeɪ/|腐烂]]. [[VW:Fruit|/fruːt/|水果，成果；结果实]] can become [[VW:stale|/steɪl/|不新鲜的；没有新意的，陈腐的]] if it is stored badly. Yet [[VW:decay|/dɪˈkeɪ/|腐烂]] returns nutrients to the soil and prepares the way for new growth. In a [[VW:rainforest|/ˈreɪnfɒrɪst/|雨林]] or tropical [[VW:jungle|/ˈdʒʌŋɡ(ə)l/|(热带)丛林，密林]], this cycle is rapid; on a [[VW:plantation|/plɑːnˈteɪʃ(ə)n/|种植园；栽植]] or [[VW:terrace|/ˈterəs/|大阳台，露天平台]], farmers manage it carefully. A [[VW:field|/fiːld/|领域]] is never merely a [[VW:field|/fiːld/|领域]]: it is a living system shaped by human choice and natural",
     "zh": "花园里没有任何东西能永久存在。缺水时植物会枯萎，落叶则分解、腐烂或朽坏。水果若储存不当会变得不新鲜。然而腐解会把养分还给土壤，为新生长铺路。在雨林或热带丛林中，这一循环十分迅速；在种植园或梯田上，农民则谨慎管理。田地从来不只是田地：它是人类选择与自然过程共同塑造的生命系统。"
    }

  {
   "zhTitle": "植物与人的世界",
   "enTitle": "Plants and People",
   "paragraphs": [
    {
     "en": "Forests provide far more than [[VW:timber|/ˈtɪmbə(r)/|木材，木料；林木]]. [[VW:Charcoal|/ˈtʃɑːkəʊl/|木炭]] was once a major fuel, and a simple [[VW:log|/lɒɡ/|原木；(航海、飞行)日志]] can become building material, furniture or a painted [[VW:logo|/ˈləʊɡəʊ/|标识，标志，徽标]]. [[VW:Forestry|/ˈfɒrɪstrɪ/|林学；林业]] studies how a [[VW:branch|/brɑːntʃ/|树枝…]], [[VW:trunk|/trʌŋk/|象鼻]], [[VW:bough|/baʊ/|大树枝]] and [[VW:root|/ruːt/|词根，字根；根源]] support a tree, but it also examines the soil, water and wildlife that depend on",
     "zh": "森林提供的远不止木材。木炭曾是重要燃料，一根原木可以 变成建筑材料、家具或涂绘标志。林学研究树枝、树干、大树枝和树根如何支撑一棵树，也研究依赖林地的土壤、水和野生生物。森林是一个系统，而不是孤立产品的集合。"
    },
    {
     "en": "At ground level, [[VW:hay|/heɪ/|干草]] and [[VW:straw|/strɔː/|稻草，麦秆；吸管]] may be stored for animals, while [[VW:reed|/riːd/|芦苇]] grows beside water and [[VW:thorn|/θɔːn/|刺，棘刺；荆棘]] and [[VW:weed|/wiːd/|杂草，野草；除杂草]] demand careful management. [[VW:Grass|/ɡrɑːs/|草；草地]] covers commons and pasture; a [[VW:meadow|/ˈmedəʊ/|草地；牧场]] supports insects and birds, and a [[VW:lawn|/lɔːn/|草地，草坪]] offers open ground in a city. An [[VW:olive|/ˈɒlɪv/|橄榄；橄榄树]], [[VW:pine|/paɪn/|松树；松木]] or [[VW:vine|/vaɪn/|葡萄藤]] can be [[VW:productive|/prəˈdʌktɪv/|多产的]] for generations. [[VW:Violet|/ˈvaɪələt/|堇菜]] and [[VW:tulip|/ˈtjuːlɪp/|郁金香]] add colour, while [[VW:mint|/mɪnt/|薄荷；薄荷糖；铸币厂…]] 03 A healthy ecosystem extends beyond the land. A [[VW:reef|/riːf/|(暗)礁，礁脉]] protects a coast from waves and shelters fish, and even a tiny [[VW:alga|/ˈælɡə/|海藻，藻]] can form the base of a marine food web. In a plant, an [[VW:enzyme|/ˈenzaɪm/|酶]] may act as a [[VW:catalyst|/ˈkætəlɪst/|催化剂；促进因素]], helping a chemical reaction occur without being consumed. Plants [[VW:release|/rɪˈliːs/|释放；发布释放；发布]] oxygen, [[VW:absorb|/əbˈzɔːb/|理解；掌握]] carbon dioxide and support the [[VW:circulation|/ˌsɜːkjəˈleɪʃ(ə)n/|流通；循环；流传]] of water and a [[VW:nutrient|/ˈnjuːtriənt/|营养物质]]. Each [[VW:emission|/ɪˈmɪʃ(ə)n/|排放，散发；排放物，散发物]] from industry or transport can [[VW:exceed|/ɪkˈsiːd/|超过]] the [[VW:uptake|/ˈʌpteɪk/|摄取；领会]] capacity of nearby vegetation, and the resulting imbalance may affect the entire",
     "zh": "在地面层，干草和稻草可为牲畜储存，芦苇生长在水边，荆棘和杂草则需要谨慎管理。青草覆盖公共地和牧场；草甸养 育昆虫与鸟类，草坪则为城市提供开阔地面。橄榄树、松树或葡萄藤可以世代生产。堇菜与郁金香增添色彩，薄荷则提 供香气与风味。健康生态系统延伸到陆地之外。礁体保护海岸免遭波浪冲击也为鱼类提供庇护，就连微小的藻类也能构成海洋食物网 的基础。在植物体内，酶可以充当催化剂，帮助化学反应发 生而自身不被消耗。植物释放氧气，吸收二氧化碳，并支持水和营养物质的循环。工业或交通的每一次排放，都可能超 过附近植被的吸收容量，由此产生的不平衡会影响整个周边环境。"
    },
    {
     "en": "[[VW:Conservation|/ˌkɒnsəˈveɪʃ(ə)n/|(对自然环境的)保护；保存]] is a [[VW:mechanism|/ˈmekənɪzəm/|机制；构造]] for keeping natural processes within safe limits. It seeks to [[VW:protect|/prəˈtekt/|保护]] habitats, [[VW:preserve|/prɪˈzɜːv/|保护；维持(原状)；保存]] genetic diversity and [[VW:counterbalance|/ˈkaʊntəbæləns/|起平衡作用的事物；抗衡力…]] the pressure of industry and settlement. A [[VW:bush fire|/ˈbʊʃ faɪə(r)/|林区大火]] may start naturally or through carelessness; if crews cannot [[VW:extinguish|/ɪkˈstɪŋɡwɪʃ/|扑灭(火)…]] it quickly, it can [[VW:destruct|/dɪˈstrʌkt/|(使)自毁]] a habitat, [[VW:ruin|/ˈruːɪn/|毁坏，摧毁；毁灭；废墟]] a harvest, [[VW:demolish|/dɪˈmɒlɪʃ/|拆除；毁坏，破坏；推翻]] nests and cause many animals to [[VW:perish|/ˈperɪʃ/|毁灭，消亡；腐烂]]. Pollution can [[VW:infringe|/ɪnˈfrɪndʒ/|侵犯；违反]] on the rights of future generations and [[VW:undermine|/ˌʌndəˈmaɪn/|破坏；逐渐削弱]] the long-term resilience",
     "zh": "保护是让自然过程保持在安全限度内的机制。它试图保护栖 息地、保存遗传多样性，并抵消工业与聚居带来的压力。丛林火灾可能自然发生，也可能源于疏忽；如果救援人员无法 迅速扑灭，它可能破坏栖息地、毁掉收成、拆毁巢穴，并使 许多动物死亡。污染会侵害未来世代的权利，削弱一个地区 的长期韧性。"
    },
    {
     "en": "[[VW:Extinction|/ɪkˈstɪŋkʃn/|灭绝]] is often the end of a [[VW:pattern|/ˈpæt(ə)n/|模式；式样；底样]] rather than a single event. A changing climate, lost habitat and introduced predators can combine to produce an irreversible [[VW:outcome|/ˈaʊtkʌm/|结果]]. The [[VW:impact|/ˈɪmpækt/|影响]] of land use is not limited to one field; it affects rivers, soil, air and human health. [[VW:Seasonal|/ˈsiːzən(ə)l/|季节性的]] decisions about planting, harvesting and restoration therefore have",
     "zh": "灭绝往往是一个格局的终结，而非单一事件。气候变化、栖 息地丧失和外来捕食者会共同造成不可逆转的结果。土地利用的影响不限于一块田，而会波及河流、土壤、空气和人类 健康。因此，关于种植、收获和修复的季节性决策，其后果远超一座农场。"
    },
    {
     "en": "[[VW:Experimental|/ɪkˌsperɪˈment(ə)l/|实验的；试验性的]] [[VW:forestry|/ˈfɒrɪstrɪ/|林学；林业]] and farming can identify [[VW:favourable|/ˈfeɪvərəb(ə)l/|有利的；赞成的，肯定的]] methods, [[VW:productive|/prəˈdʌktɪv/|多产的]] crops and [[VW:effective|/ɪˈfektɪv/|有效的]] protection. An [[VW:efficient|/ɪˈfɪʃ(ə)nt/|效率高的]] system uses less [[VW:energy|/ˈenədʒi/|能源；精力]] for the same result, while a [[VW:considerable|/kənˈsɪdərəb(ə)l/|相当多的]] or [[VW:massive|/ˈmæsɪv/|巨大的，大规模的，庞大的]] change may require [[VW:immense|/ɪˈmens/|巨大的]] investment. The goal is neither [[VW:maximal|/ˈmæksɪml/|最大的]] extraction nor [[VW:minimal|/ˈmɪnɪm(ə)l/|最小的，极小的]] use for its own sake, but an [[VW:optimal|/ˈɒptɪməl/|最佳的，最理想的]] balance that allows communities to prosper without exhausting the",
     "zh": "实验性的林业和农业可以找出有利方法、高产作物和有效保 护措施。高效系统以更少能量取得同样结果，而相当大的或巨大的变化可能需要巨额投入。目标既不是最大程度攫取， 也不是为节制而节制，而是找到最适平衡，使社区能够繁荣又不必耗尽自然世界。"
    }
   ],

  {
   "zhTitle": "野性与栖息地",
   "enTitle": "Wildness and Habitat",
   "paragraphs": [
    {
     "en": "[[VW:Wildlife|/ˈwaɪldlaɪf/|野生动物；野生生物]] research brings together different kinds of expertise. A [[VW:biologist|/baɪˈɒlədʒɪst/|生物学家]] studies living systems, a [[VW:zoologist|/zuˈɒlədʒɪst; zəʊˈɒlədʒɪst/|动物学家]] focuses on animals, an [[VW:ecologist|/iˈkɒlədʒɪst/|生态学家]] examines relationships between organisms and habitats, and a [[VW:botanist|/ˈbɒtənɪst/|植物学家]] specialises in plants. A [[VW:mammal|/ˈmæm(ə)l/|哺乳动物]], [[VW:primate|/ˈpraɪmeɪt/|灵长目动物]], [[VW:vertebrate|/ˈvɜːtɪbrət/|脊椎动物]], [[VW:reptile|/ˈreptaɪl/|爬行动物]] or [[VW:amphibian|/æmˈfɪbiən/|两栖动物；水陆两用车…]] may all appear in one survey, while a [[VW:carnivore|/ˈkɑːnɪvɔː(r)/|食肉动物]] and a [[VW:herbivore|/ˈhɜːbɪvɔː(r)/|食草动物]] occupy different places in a food web. Every [[VW:creature|/ˈkriːtʃə(r)/|生物，动物]] belongs to the wider [[VW:wildlife|/ˈwaɪldlaɪf/|野生动物；野生生物]] of a region, and the local [[VW:fauna|/ˈfɔːnə/|(尤指某一地区的)动物群]] and [[VW:flora|/ˈflɔːrə/|(尤指某一地区的)植物群]] together form a biological community. Protecting one [[VW:species|/ˈspiːʃiːz/|种，物种]] without understanding its",
     "zh": "野生生物研究汇集了不同专业知识。生物学家研究生命系统动物学家关注动物，生态学家考察生物与栖息地之间的关 系，植物学家则专攻植物。一次调查中可能出现哺乳动物、灵长目动物、脊椎动物、爬行动物或两栖动物，而食肉动物 和食草动物在食物网中占据不同位置。每种生物都属于一个 地区更广阔的野生生物世界，当地动物群与植物群共同构成 生物群落。若不理解栖息地，只保护单一物种很少成功。"
    },
    {
     "en": "Animals live in groups that vary in size and function. A [[VW:flock|/flɒk/|(羊或鸟)群；聚集]] of birds may cross a wetland, a [[VW:herd|/hɜːd/|兽群，畜群]] of [[VW:cattle|/ˈkæt(ə)l/|牛]] may graze on open land, and a [[VW:swarm|/swɔːm/|(蜜蜂等昆虫的)一大群…]] of bees may move toward a new hive. A [[VW:throng|/θrɒŋ/|人群，一大群人；群集]] or [[VW:crowd|/kraʊd/|入群；观众；一伙人]] of visitors can disturb sensitive habitats, yet a [[VW:beast|/biːst/|兽，野兽；凶残的人，畜生]] is not simply a [[VW:brute|/bruːt/|粗野的人，残忍的人]], and natural behaviour does not make an animal [[VW:cruel|/ˈkruːəl/|残酷的，残忍的，残暴的]]. Predation may look violent, but it can regulate",
     "zh": "动物以大小和功能各异的群体生活。一群鸟可能飞越湿地，一群牛可能在开阔地吃草，一群蜜蜂可能朝新蜂巢移动。拥 挤的人群会干扰敏感栖息地，但野兽并不只是粗野之物，自 然行为也不意味着动物残忍。捕食看似暴力，却能调节种群 并维持平衡。"
    },
    {
     "en": "Evolution explains both similarity and difference. Related [[VW:species|/ˈspiːʃiːz/|种，物种]] [[VW:derive|/dɪˈraɪv/|得到；(使)源自]] from a common [[VW:ancestor|/ˈænsestə(r)/|祖宗，祖先]] and [[VW:originate|/əˈrɪdʒɪneɪt/|发源，来自；创始]] through gradual change over long periods. A [[VW:stem|/stem/|起源于，来自；茎，梗]] line may produce a [[VW:descendant|/dɪˈsendənt/|后裔，后代；下降的]], an [[VW:offspring|/ˈɒfsprɪŋ/|后代，子孙；产物]] may inherit useful traits, and a [[VW:subgroup|/ˈsʌbɡruːp/|子群]] may follow a separate path. Feeding a population is not the same as breeding it: a [[VW:species|/ˈspiːʃiːz/|种，物种]] may [[VW:breed|/briːd/|饲养；繁殖；品种]] successfully only when it finds a [[VW:mate|/meɪt/|伙伴；［构成复合词］同伴]], performs [[VW:courtship|/ˈkɔːtʃɪp/|求偶]], can [[VW:lay|/leɪ/|产(卵)；放置；铺设]] eggs and release [[VW:spawn|/spɔːn/|(鱼、蛙等的)卵；产卵；引起]], watches young [[VW:hatch|/hætʃ/|孵化；舱口]] and rears a [[VW:brood|/bruːd/|一窝幼鸟；孵(蛋)]] until the young [[VW:mature|/məˈtʃʊə(r)/|成熟的；成熟]]. Some related populations [[VW:interbreed|/ˌɪntəˈbriːd/|(使)品种间杂交，(使)生混种…]], while others [[VW:hybridise|/ˈhaɪbrɪdaɪz/|(使)杂交]] and can [[VW:proliferate|/prəˈlɪfəreɪt/|迅速增殖；剧增]] rapidly before [[VW:sterility|/stəˈrɪləti/|不生育]], disease or scarce resources limit",
     "zh": "进化既解释相似，也解释差异。相关物种源自共同祖先，并 在漫长时期中通过逐渐变化而发源。一个主干谱系可以产生后代，后代可能继承有用性状，一个亚群则可能走上独立道 路。供养种群并不等于繁殖它：只有找到配偶、完成求偶、 能够产卵并释放卵、看到幼体孵化，并把一窝幼体养到成熟物种才可能成功繁殖。有些相关种群会种间杂交，另一些 则通过杂交迅速增殖，随后数量又会受到不育、疾病或资源 稀缺的限制。"
    },
    {
     "en": "Animal bodies show remarkable adaptation. [[VW:Skin|/skɪn/|皮肤；外皮]] may be covered by [[VW:fur|/fɜː(r)/|(动物的)软毛…]], [[VW:bristle|/ˈbrɪs(ə)l/|鬃毛；(刷子的)毛]] or a [[VW:curl|/kɜːl/|鬈发；卷曲…]] of hair, while a [[VW:claw|/klɔː/|爪；钳；螯；爪状物]], [[VW:paw|/pɔː/|(动物的)脚掌，爪子]], [[VW:beak|/biːk/|鸟嘴，喙]] or [[VW:fin|/fɪn/|鳍]] helps a [[VW:creature|/ˈkriːtʃə(r)/|生物，动物]] move, [[VW:feed|/fiːd/|供养；喂，饲养；进食]] or defend itself. A [[VW:wing|/wɪŋ/|翼，翅膀]], [[VW:plume|/pluːm/|羽毛]] and [[VW:feather|/ˈfeðə(r)/|羽毛，翎毛]] make flight possible, and an [[VW:insect|/ˈɪnsekt/|昆虫]] may use a [[VW:worm|/wɜːm/|蠕虫]]-like larva stage before becoming an adult. A [[VW:pest|/pest/|害虫；有害动物]] or [[VW:parasite|/ˈpærəsaɪt/|寄生虫]] can damage crops and spread disease, but a [[VW:spider|/ˈspaɪdə(r)/|蜘蛛]], [[VW:butterfly|/ˈbʌtəflaɪ/|蝴蝶；蝶状的]], [[VW:mosquito|/məˈskiːtəʊ/|蚊子]] or [[VW:cricket|/ˈkrɪkɪt/|板球]] also has a role in pollination or the food",
     "zh": "动物身体展现出非凡适应。皮肤可能覆盖毛皮、硬毛或卷曲毛发，而爪、掌、喙或鳍帮助生物移动、取食或防御。翅膀、羽毛和羽饰使飞行成为可能，昆虫则可能在成为成虫前经历 蠕虫状幼虫阶段。害虫或寄生虫会损害作物并传播疾病，但 蜘蛛、蝴蝶、蚊子和蟋蟀也在授粉或食物链中扮演角色。"
    },
    {
     "en": "Large animals illustrate the range of survival strategies. A [[VW:penguin|/ˈpeŋɡwɪn/|企鹅]] is adapted to cold water, a [[VW:seal|/siːl/|海豹；封条；图章；密封]] to both sea and shore, and a [[VW:tortoise|/ˈtɔːtəs/|龟，陆龟]] or [[VW:turtle|/ˈtɜːt(ə)l/|海龟]] to a slow, protected life. A [[VW:whale|/weɪl/|鲸鱼；捕鲸；猛击]] crosses enormous distances, a [[VW:kangaroo|/ˌkæŋɡəˈruː/|袋鼠]] moves by hopping, and a [[VW:camel|/ˈkæm(ə)l/|骆驼]] survives in dry country. A [[VW:panda|/ˈpændə/|熊猫]] depends on a specialised diet, while an [[VW:elephant|/ˈelɪfənt/|象]] may be threatened by demand for [[VW:ivory|/ˈaɪvəri/|象牙]] and [[VW:horn|/hɔːn/|(牛、羊等动物的)角…]]. A [[VW:bear|/beə(r)/|生(孩子)；窑忍…]], [[VW:wolf|/wʊlf/|狼]] or [[VW:fox|/fɒks/|狐狸；狡猾的人]] occupies a different ecological niche, and a [[VW:dragon|/ˈdræɡən/|龙；悍妇]] remains a [[VW:creature|/ˈkriːtʃə(r)/|生物，动物]] of imagination rather than a",
     "zh": "大型动物展示了生存策略的广度。企鹅适应寒冷水域，海豹适应海洋与海岸，陆龟或海龟则适应缓慢而受保护的生活。 鲸会穿越极远距离，袋鼠靠跳跃移动，骆驼能在干旱地区生 存。熊猫依赖专门食物，大象则可能因象牙和角的需求而受威胁。熊、狼或狐狸占据不同生态位，而龙仍是想象生物， 并非有记录的物种。"
    },
    {
     "en": "Young animals are equally varied. A [[VW:cub|/kʌb/|幼兽]], [[VW:calf|/kɑːf/|幼兽；小牛]], [[VW:pup|/pʌp/|幼小动物]] or [[VW:lamb|/læm/|小羊，羔羊]] depends on adult care during its early life, while an [[VW:ox|/ɒks/|(阉割的)公牛]], along with other [[VW:cattle|/ˈkæt(ə)l/|牛]], has long been part of agriculture. Understanding these differences helps conservationists protect habitats rather than merely individual animals. Evidence-based management, public education and international cooperation can reduce the pressures that push vulnerable [[VW:species|/ˈspiːʃiːz/|种，物种]] toward",
     "zh": "幼年动物同样多样。幼兽、幼崽、小狗或羔羊在生命早期依 赖成年个体照料，而耕牛与其他牛类长期参与农业。理解这些差异，能帮助保护工作者保护栖息地，而不只是保护单个 动物。基于证据的管理、公众教育和国际合作，可以减少把 脆弱物种推向灭绝的压力。"
    }
   ],

   "enTitle": "Species, Evolution and Care",
   "paragraphs": [
    {
     "en": "Domestic animals have long shaped human work. A [[VW:bull|/bʊl/|公牛]] or [[VW:buffalo|/ˈbʌfələʊ/|水牛；野牛]] may pull a plough, a [[VW:horse|/hɔːs/|马]] may carry a rider, and a [[VW:donkey|/ˈdɒŋkɪ/|驴；傻瓜]] may cross dry ground with a load. A [[VW:zebra|/ˈzebrə/|斑马]] is less easy to [[VW:tame|/teɪm/|驯养；制服；驯服的；乏味的]] than a [[VW:horse|/hɔːs/|马]], yet its stripes still attract study. A [[VW:saddle|/ˈsæd(ə)l/|鞍，马鞍；车座]] and [[VW:harness|/ˈhɑːnɪs/|控制，利用]] transfer an animal's strength to a task; a [[VW:stable|/ˈsteɪb(ə)l/|马厩；牛棚；稳定的；稳固的]] or [[VW:barn|/bɑːn/|谷仓；牲口棚]] protects it at night; a [[VW:shepherd|/ˈʃepəd/|牧羊人，羊倌]] may guide a flock across open country. Wild animals need a [[VW:habitat|/ˈhæbɪtæt/|(动植物的)生活环境，栖息地]] with a [[VW:hedge|/hedʒ/|树篱；障碍物]], a [[VW:barrier|/ˈbæriə(r)/|障碍；屏障，障碍物]] or a safe route rather than a [[VW:cage|/keɪdʒ/|笼子]], and a [[VW:keeper|/ˈkiːpə(r)/|看守人；饲养员]] must understand the difference between care and control. A [[VW:bar|/bɑː(r)/|酒吧；吧台]] can confine a body, but no fence can substitute for",
     "zh": "家畜长期以来塑造着人类劳动。公牛或水牛可以拉犁，马可以载人，驴则能驮着货物穿越干旱地带。斑马比马更难驯服但它的条纹仍吸引人们研究。马鞍和挽具把动物的力量传 递给一项任务；马厩或谷仓在夜间保护它；牧羊人可以引导羊群穿越开阔乡野。野生动物需要带有树篱、屏障或安全通 道的栖息地，而不是笼子；饲养员必须理解照料与控制之间的区别。一根横杆可以限制身体，但任何围栏都不能取代生 态知识。"
    },
    {
     "en": "Birds reveal how varied animal [[VW:behaviour|/bɪˈheɪvjə(r)/|行为；活动方式]] can be. A [[VW:falcon|/ˈfɔːlkən/|隼，猎鹰]] may dive with great speed, a [[VW:hawk|/hɔːk/|鹰，隼]] may glide above a field, and an [[VW:eagle|/ˈiːɡ(ə)l/|雕]] may scan a river from a high branch. An [[VW:owl|/aʊl/|猫头鹰]] often hunts at night; a [[VW:swallow|/ˈswɒləʊ/|咽下，吞下]] may catch insects in flight; a [[VW:sparrow|/ˈspærəʊ/|麻雀]], [[VW:pigeon|/ˈpɪdʒɪn/|鸽子]], [[VW:crow|/krəʊ/|乌鸦]], [[VW:swan|/swɒn/|天鹅]], [[VW:goose|/ɡuːs/|鹅；鹅肉]] and [[VW:cock|/kɒk/|雄禽；公鸡]] each occupies a different niche. One animal may [[VW:bite|/baɪt/|咬；(昆虫)叮；吞饵；咬伤]], one bird may [[VW:swallow|/ˈswɒləʊ/|咽下，吞下]] food whole, a dog may [[VW:bark|/bɑːk/|(狗等)吠；大声嚷；树皮]], a large mammal may [[VW:roar|/rɔː(r)/|吼叫，咆哮；吼叫声，咆哮声]], and an insect may [[VW:sting|/stɪŋ/|刺，叮；(使)感觉刺痛…]]. A [[VW:horse|/hɔːs/|马]] may [[VW:rub|/rʌb/|擦；摩擦；困难，障碍]] against a fence, while a reptile may [[VW:creep|/kriːp/|爬行；悄悄地缓慢行进]] or [[VW:crawl|/krɔːl/|爬，爬行；卑躬屈膝，巴结]] through grass; close near buildings, a [[VW:squirrel|/ˈskwɪrəl/|松鼠]] may store food, and a [[VW:hare|/heə(r)/|野兔]] or [[VW:frog|/frɒɡ/|蛙]] may disappear into cover. Field scientists [[VW:track|/træk/|追踪；足迹，踪迹；轨道]] such movement, [[VW:trace|/treɪs/|追踪；查出；追溯；痕迹；少许]] a route back to a [[VW:nest|/nest/|巢，窝，穴]], and record how species [[VW:alternate|/ɔːlˈtɜːnət;ˈɔːltəneɪt/|(使)交替，(使)轮流]] between shelter and open ground. A [[VW:predator|/ˈpredətə(r)/|掠夺者；捕食性动物]] pursues [[VW:prey|/preɪ/|被捕食的动物，猎物；捕食]], but not every [[VW:victim|/ˈvɪktɪm/|受害者；牺牲者]] is weak; defence can also be a warning, a hiding place or a rapid escape. A [[VW:hive|/haɪv/|蜂房…]] and its [[VW:cell|/sel/|蜂房巢室；细胞；单人牢房]] structure show how social insects share a home. Samples from a [[VW:nest|/nest/|巢，窝，穴]], [[VW:hive|/haɪv/|蜂房…]] or burrow can reveal an [[VW:epidemic|/ˌepɪˈdemɪk/|流行病；(坏事的)盛行…]] risk, a [[VW:gene|/dʒiːn/|基因]], a [[VW:germ|/dʒɜːm/|微生物，细菌]], [[VW:bacteria|/bækˈtɪəriə/|细菌]], a [[VW:virus|/ˈvaɪrəs/|病毒]] or another [[VW:microbe|/ˈmaɪkrəʊb/|微生物]]. [[VW:Metabolism|/məˈtæbəlɪzəm/|新陈代谢]], [[VW:protein|/ˈprəʊtiːn/|蛋白质]] and [[VW:vitamin|/ˈvɪtəmɪn/|维生素]] levels influence health, while animals [[VW:secrete|/sɪˈkriːt/|分泌]] substances and [[VW:excrete|/ɪkˈskriːt/|排泄；分泌]] waste. A carnivore may [[VW:devour|/dɪˈvaʊə(r)/|吞食，狼吞虎咽地吃]] a carcass quickly.",
     "zh": "鸟类展现出动物行为可以多么多样。隼可能高速俯冲，鹰可 能滑翔在田野上方，雕则会从高枝上扫视河流。猫头鹰常在夜间捕猎；燕子在飞行中捕捉昆虫；麻雀、鸽子、乌鸦、天 鹅、鹅与公鸡各自占据不同生态位。有的动物会咬，有的鸟把食物整块吞下，狗会吠叫，大型哺乳动物会咆哮，昆虫则会刺叮。马可能蹭着围栏，爬行动物则可能从草丛中爬行； 仔细观察会发现，每一种动作都有其情境。老鼠和家鼠可能住在建筑附近，松鼠会储存食物，野兔或蛙则可能钻入遮蔽处。野外科学家追踪这些移动，追溯通往巢穴的路线，并记录物种如何在庇护地与开阔地之间交替。捕食者追逐猎物，但并非每个受害者都弱小；防御也可以是警告、躲藏或迅速逃离。蜂房及其巢室结构显示出社会性昆虫如何共享家园。来自巢、蜂房或洞穴的样本，可以揭示流行病风险、基因、微生物、细菌、病毒或其他微生物。新陈代谢、蛋白质和维生素水平影响健康，动物分泌物质并排泄废物。食肉动物可能迅速吞食尸体。"
    },
    {
     "en": "Animal [[VW:anatomy|/əˈnætəmi/|解剖学]] offers lessons in [[VW:functional|/ˈfʌŋkʃən(ə)l/|功能的；起作用的]] design. [[VW:Instinct|/ˈɪnstɪŋkt/|本能，天性；直觉]] may guide a first attempt, but [[VW:intuitive|/ɪnˈtjuːɪtɪv/|直觉的]] learning allows an animal to adjust. [[VW:Intelligence|/ɪnˈtelɪdʒəns/|智慧，智力；情报，谍报]] is not one single ability: memory, attention and problem solving contribute to it. A [[VW:sensitive|/ˈsensətɪv/|灵敏的；过敏的；易担忧的…]] nose, [[VW:flexible|/ˈfleksəb(ə)l/|可弯曲的；灵活的，易变通的]] limb, [[VW:acoustic|/əˈkuːstɪk/|听觉的；声音的]] signal or [[VW:optical|/ˈɒptɪk(ə)l/|视觉的；光学的]] system may suit a particular environment, and the [[VW:potential|/pəˈtenʃ(ə)l/|潜力；潜在的]] for further adaptation is often hidden in small differences. A [[VW:nocturnal|/nɒkˈtɜːn(ə)l/|夜间发生的；夜间活动的]] hunter may remain [[VW:dormant|/ˈdɔːmənt/|睡着的；休眠的…]] by day, and [[VW:hibernation|/ˌhaɪbəˈneɪʃ(ə)n/|冬眠]] allows some species to survive a cold season. Researchers [[VW:track|/træk/|追踪；足迹，踪迹；轨道]], [[VW:trace|/treɪs/|追踪；查出；追溯；痕迹；少许]] and compare these patterns; a [[VW:predator|/ˈpredətə(r)/|掠夺者；捕食性动物]] and its [[VW:prey|/preɪ/|被捕食的动物，猎物；捕食]] [[VW:alternate|/ɔːlˈtɜːnət;ˈɔːltəneɪt/|(使)交替，(使)轮流]] roles across a food web.  animal may be safe from hunting yet unable to behave naturally, and a [[VW:defensive|/dɪˈfensɪv/|防御性的]] response can become stress.  rapid change  if their [[VW:habitat|/ˈhæbɪtæt/|(动植物的)生活环境，栖息地]] shrinks. [[VW:Vulnerable|/ˈvʌlnərəbl/|易受伤的，脆弱的；易受影响的]] communities that  hunting may also [[VW:exist|/ɪɡˈzɪst/|存在；生存]] on the edge of scarcity, but to [[VW:exterminate|/ɪkˈstɜːmɪneɪt/|消灭，根除]] a species is not a solution; to [[VW:tame|/teɪm/|驯养；制服；驯服的；乏味的]] one for display is not  and a [[VW:shepherd|/ˈʃepəd/|牧羊人，羊倌]] can support care only when policy protects the whole ecosystem, including the",
     "zh": "动物解剖学提供了关于功能性设计的课程。本能也许能引导第一次尝试，但直觉学习使动物能够调整。智力并非单一能力：记忆、注意力和解决问题的能力都参与其中。灵敏的鼻子、灵活的肢体、声学信号或光学系统都可能适应特定环境而进一步适应的潜力常藏在微小差异中。夜行动物白天可能保持休眠，冬眠则让一些物种熬过寒冷季节。研究者追踪、追溯并比较这些模式；捕食者与猎物在食物网中会交替角色。被圈养的动物也许免于捕猎，却无法自然行动，防御反应也可能变成压力。经历快速变化的种群，若栖息地缩小，就可能遭受痛苦。依赖勉强维持生计式狩猎的脆弱社群，也可能生活在匮乏边缘，但根除一个物种不是解决办法，为展示而驯服一种动物也不是保护。只有当政策保护整个生态系统，包括让生命恢复的安静角落，饲养员和牧羊人才能真正支持照料。"
    }

   "zhTitle": "星际观测",
   "enTitle": "Watching the Stars",
   "paragraphs": [
    {
     "en": "When people look up at night, they see a [[VW:galaxy|/ˈɡæləksi/|星系；银河系]] within a vast [[VW:cosmos|/ˈkɒzmɒs/|宇宙]]. The [[VW:universe|/ˈjuːnɪvɜːs/|宇宙；万物，世界]] contains stars, planets, gas and [[VW:dust|/dʌst/|尘土，灰尘，粉尘]], and [[VW:interstellar|/ˌɪntəˈstelə(r)/|星际的]] space is not empty. [[VW:Terrestrial|/təˈrestriəl/|地球的；(动植物)陆地的]] observers study [[VW:celestial|/səˈlestiəl/|天上的]] objects through [[VW:astronomy|/əˈstrɒnəmi/|天文学]], while [[VW:astrology|/əˈstrɒlədʒi/|占星学；占星术]] belongs to a different tradition. A [[VW:telescope|/ˈtelɪskəʊp/|望远镜]] on a mountain can turn a clear sky into a [[VW:spectacle|/ˈspektək(ə)l/|壮观的景象；奇观…]], and the work of an [[VW:astronaut|/ˈæstrənɔːt/|宇航员]] or a [[VW:spacecraft|/ˈspeɪskrɑːft/|宇宙飞船]] extends 02 A [[VW:comet|/ˈkɒmɪt/|彗星]] may develop a bright [[VW:tail|/teɪl/|尾部]] as it approaches the Sun, while a [[VW:meteorite|/ˈmiːtiəraɪt/|陨石]] can leave a [[VW:crater|/ˈkreɪtə(r)/|(撞击或爆炸形成的)坑]] when it strikes a solid surface. [[VW:Dust|/dʌst/|尘土，灰尘，粉尘]] and [[VW:ash|/æʃ/|灰烬]] spread through space, and a [[VW:spacecraft|/ˈspeɪskrɑːft/|宇宙飞船]] may carry an [[VW:envelope|/ˈenvələʊp/|信封]] of gas, an instrument package or a [[VW:spacecraft|/ˈspeɪskrɑːft/|宇宙飞船]] [[VW:module|/ˈmɒdjuːl/|(航天器上各个独立的)舱…]]. A [[VW:chunk|/tʃʌŋk/|厚块]] of rock or ice can contain evidence about the early Solar System. A [[VW:spacecraft|/ˈspeɪskrɑːft/|宇宙飞船]] and a [[VW:spaceship|/ˈspeɪsʃɪp/|宇宙飞船]] are both vehicles of [[VW:exploration|/ˌekspləˈreɪʃ(ə)n/|探索]], but their design depends on 03 A [[VW:probe|/prəʊb/|太空探测器；详尽调查]] can travel for years before a [[VW:flyby|/ˈflaɪbaɪ/|(航天器对行星或卫星的)飞掠]]. Its [[VW:propulsion|/prəˈpʌlʃ(ə)n/|推进力]] system must work under extreme [[VW:pressure|/ˈpreʃə(r)/|压力]], and its [[VW:dynamics|/daɪˈnæmɪks/|动力学；动态]] determine how [[VW:motion|/ˈməʊʃn/|做动作，示意]] changes over time. A [[VW:vent|/vent/|排气口；排放；发泄]] may release gas, a [[VW:tail|/teɪl/|尾部]] may [[VW:curve|/kɜːv/|曲线，弧线]] behind an object, and a precise [[VW:curve|/kɜːv/|曲线，弧线]] in a trajectory can reveal the pull of gravity. Engineers compare these",
     "zh": "人们仰望夜空时，会看到浩瀚宇宙中的一个星系。宇宙包含 恒星、行星、气体和尘埃，星际空间并非空无一物。地球上 的观测者通过天文学研究天体，而占星术属于另一种传统。山上的望远镜能把晴空变成壮丽景象，宇航员或宇宙飞船的工作则把观测延伸到大气层之外。彗星接近太阳时可能形成明亮尾部，陨石撞击固体表面则会 留下撞击坑。尘埃和灰烬在太空中扩散，宇宙飞船可能携带 气体包层、仪器组件或航天舱。一块岩石或冰的厚块可能保 存太阳系早期的证据。宇宙飞船与飞船都是探索载具，但设计取决于任务和尺度。探测器可能飞行多年后才完成一次飞掠。它的推进系统必须 在极端压力下工作，动力学则决定运动如何随时间变化。排 气口会释放气体，尾部可能弯出弧线，而轨迹中的精确曲线 能揭示引力作用。工程师把这些测量与模型比较，并在下一条指令前调整每个阶段。"
    },
    {
     "en": "[[VW:Exploration|/ˌekspləˈreɪʃ(ə)n/|探索]] is often an [[VW:expedition|/ˌekspəˈdɪʃ(ə)n/|远征，探险]] of patience. An [[VW:observatory|/əbˈzɜːvətri/|天文台]] may combine images from several instruments, while a [[VW:telescope|/ˈtelɪskəʊp/|望远镜]] records light that left its source long ago. A [[VW:flyby|/ˈflaɪbaɪ/|(航天器对行星或卫星的)飞掠]] offers only a brief [[VW:spectacle|/ˈspektək(ə)l/|壮观的景象；奇观…]], yet it can transform what scientists know about orbit  and the [[VW:ecliptic|/ɪˈklɪptɪk/|黄道]]. The [[VW:diameter|/daɪˈæmɪtə(r)/|直径]] and [[VW:radius|/ˈreɪdiəs/|半径]] of a distant body can be estimated from its shadow or its path, while the [[VW:substance|/ˈsʌbstəns/|物质；实质，要旨]] of a planet may be inferred from colour, temperature and [[VW:motion|/ˈməʊʃn/|做动作，示意]].",
     "zh": "探索往往是一场关于耐心的远征。天文台可以综合多台仪器拍摄的图像，望远镜则记录很久以前离开天体的光。飞掠只带来短暂奇观，却能改变科学家对轨道与黄道的认识。遥远天体的直径和半径可通过其阴影或路径估算，而行星的物质则可由颜色、温度和运动推断。"
    },
    {
     "en": "No single mission answers every question. [[VW:Interstellar|/ˌɪntəˈstelə(r)/|星际的]] distances are immense, and a [[VW:terrestrial|/təˈrestriəl/|地球的；(动植物)陆地的]] laboratory cannot reproduce every [[VW:celestial|/səˈlestiəl/|天上的]] condition. Yet  turns distant lights into evidence, and each new observation adds a thread to the larger story of the [[VW:universe|/ˈjuːnɪvɜːs/|宇宙；万物，世界]].",
     "zh": "没有任何单一任务能回答所有问题。星际距离极其辽阔，地球实验室也无法重现每一种天体条件。然而，谨慎的天文学能把遥远的光转化为证据，每一次新观测都为宇宙的宏大故事添上一根线索。"
    }
   ],

  {
   "zhTitle": "远行与想象",
   "enTitle": "Voyage and Imagination",
   "paragraphs": [
    {
     "en": "Scientific inquiry often begins with a [[VW:sample|/ˈsɑːmp(ə)l/|样品，样本]]. A [[VW:fossil|/ˈfɒs(ə)l/|化石]] may preserve the [[VW:composition|/ˌkɒmpəˈzɪʃ(ə)n/|成分，构成；作晶；创作]] of an ancient organism, while a mineral [[VW:specimen|/ˈspesɪmən/|样品，标本]] or a [[VW:compound|/ˈkɒmpaʊnd/|混合物；化合物复合的，组合的]] reveals how matter behaves under different conditions. A [[VW:particle|/ˈpɑːtɪk(ə)l/|颗粒，微粒；极小量]] can be smaller than a cell, a [[VW:molecule|/ˈmɒlɪkjuːl/|分子]] can contain an [[VW:atom|/ˈætəm/|原子]], and an [[VW:ion|/ˈaɪən/|离子]] or [[VW:electron|/ɪˈlektrɒn/|电子]] can carry charge. A [[VW:quantum|/ˈkwɒntəm/|量子]] effect may seem strange because it does not follow everyday intuition, yet it helps",
     "zh": "科学探究常常从一份样品开始。化石可能保存古代生物的组 成，矿物标本或化合物则揭示物质在不同条件下的行为。粒子可以比细胞更小，分子可以包含原子，离子或电子则能携 带电荷。量子效应看似奇特，因为它不遵循日常直觉，却有助于解释光、能量和化学键。"
    },
    {
     "en": "Matter appears as a [[VW:liquid|/ˈlɪkwɪd/|液体；液态的]], a [[VW:fluid|/ˈfluːɪd/|液体，流体；流动的]] or a [[VW:solid|/ˈsɒlɪd/|固体；固体的；牢固的]] depending on [[VW:circumstance|/ˈsɜːkəmstəns/|情况；环境；条件]]. Scientists [[VW:synthesise|/ˈsɪnθɪsaɪz/|合成；综合]] new compounds, study their [[VW:formation|/fɔːˈmeɪʃ(ə)n/|形成]], and compare one [[VW:method|/ˈmeθəd/|方法]] with another. A [[VW:spectrum|/ˈspektrəm/|光谱；范围]] can show which elements are present, even when a [[VW:specimen|/ˈspesɪmən/|样品，标本]] is too small to examine directly. The same substance may behave differently when",
     "zh": "物质会随情况表现为液体、流体或固体。科学家合成新化合 物，研究其形成过程，并把一种方法与另一种方法比较。光 谱能显示存在哪些元素，即使标本小到无法直接观察。同一 种物质在热量、压力或时间改变时，行为也可能不同。"
    },
    {
     "en": "Every measurement has a [[VW:dimension|/daɪˈmenʃ(ə)n/|范围；维(度)]], a [[VW:frequency|/ˈfriːkwənsi/|频率；发生次数]] and a limit. A [[VW:signal|/ˈsɪɡnəl/|信号]] may travel through an [[VW:antenna|/ænˈtenə/|天线]] and a [[VW:circuit|/ˈsɜːkɪt/|线路，电路；巡回]], while [[VW:refraction|/rɪˈfrækʃ(ə)n/|折射]] bends light as it passes from one medium to another. [[VW:Ultraviolet|/ˌʌltrəˈvaɪələt/|紫外辐射；紫外线的]] radiation can damage living tissue, [[VW:radioactive|/ˌreɪdiəʊˈæktɪv/|放射性的]] material can decay, and some changes are clearly [[VW:distinct|/dɪˈstɪŋkt/|明显的；截然不同的]] while others are barely [[VW:discernible|/dɪˈsɜːnəb(ə)l/|可辩别的，看得清的]] or completely [[VW:invisible|/ɪnˈvɪzəb(ə)l/|看不见的]]. Instruments extend human senses, but they also introduce uncertainty  in space can [[VW:squash|/skwɒʃ/|压扁；璧球]] a fragile object and leave a [[VW:fragment|/ˈfræɡmənt/|碎片，片断 (使)破裂]] behind. A [[VW:cataclysmic|/ˌkætəˈklɪzmɪk/|剧变的；灾难性的]] event may release [[VW:overwhelming|/ˌəʊvəˈwelmɪŋ/|压倒性的]] energy, yet even a small [[VW:particle|/ˈpɑːtɪk(ə)l/|颗粒，微粒；极小量]] can carry information across vast distances. Scientists reconstruct the event from traces, comparing a laboratory [[VW:sample|/ˈsɑːmp(ə)l/|样品，样本]] with a remote [[VW:signal|/ˈsɪɡnəl/|信号]] and testing whether one explanation fits all the evidence. 05 A difficult result should not lead to [[VW:despair|/dɪˈspeə(r)/|绝望；令人绝望的事]]. A [[VW:desperate|/ˈdespərət/|绝望的；极需要的]] search for certainty can become unscientific, and a beginner may mistake a slow [[VW:method|/ˈmeθəd/|方法]] for a [[VW:hopeless|/ˈhəʊpləs/|无望的；极差的]] one. Careful work turns fragments into a coherent account of matter, from the smallest [[VW:quantum|/ˈkwɒntəm/|量子]] to the largest cosmic",
     "zh": "每一种测量都有范围、频率和限度。信号可以经过天线和电 路传播，折射则会让光在穿过不同介质时弯曲。紫外线会损伤活体组织，放射性物质会衰变，有些变化截然不同，另一些几乎无法辨别，甚至完全不可见。仪器延伸了人类感官， 却也引入必须承认的不确定性。太空中的碰撞会压扁脆弱物体，并留下碎片。灾变事件可能释放压倒性的能量，但即使微小粒子也能跨越遥远距离携带信息。科学家从痕迹重建事件，把实验室样品与远处信号比较，并检验一种解释是否吻合全部证据。困难的结果不应让人陷入绝望。急切寻找确定性可能变得不科学，初学者也可能把缓慢的方法误认为毫无希望。谨慎的工作把碎片转化为关于物质的连贯叙述，从最小的量子到最大的宇宙结构。"
    }
   ],

   "zhTitle": "入学与课程",
   "enTitle": "Arrival and Curriculum",
   "paragraphs": [
    {
     "en": "[[VW:Education|/ˌedʒuˈkeɪʃ(ə)n/|教育；教育学]] is not a single ladder but a landscape of opportunities. A child may begin in [[VW:primary|/ˈpraɪməri/|主要的；最初的；小学教育的]] school, continue through [[VW:secondary|/ˈsekənd(ə)ri/|中等教育的；次要的]] [[VW:education|/ˌedʒuˈkeɪʃ(ə)n/|教育；教育学]], and later choose a [[VW:university|/ˌjuːnɪˈvɜːsəti/|(综合性)大学]], a [[VW:college|/ˈkɒlɪdʒ/|学院；大学]], an [[VW:institute|/ˈɪnstɪtjuːt/|研究所，学院]] or an [[VW:academy|/əˈkædəmi/|专科院校；(美国的)私立中学…]]. Some people [[VW:learn|/lɜːn/|学习；得知]] best by reading; others [[VW:study|/ˈstʌdi/|学习；研究；学习；研究]] through practice. Both routes help a person [[VW:acquire|/əˈkwaɪə(r)/|获得(技能、知识等)；购得]] [[VW:knowledge|/ˈnɒlɪdʒ/|知识，学识；知悉]] and build [[VW:expertise|/ˌekspɜːˈtiːz/|专门知识，专门技能]]. A [[VW:novice|/ˈnɒvɪs/|新手]] needs guidance, while a good institution will [[VW:recruit|/rɪˈkruːt/|吸收(新成员)]] teachers who can explain difficult",
     "zh": "教育不是一架单一的梯子，而是一片由机会构成的地貌。孩子可能从小学开始，经过中等教育，之后选择大学、学院、研究所或专科院校。有些人通过阅读学得最好，另一些人则 通过实践学习。两条路径都能帮助人获得知识、积累专长。 新手需要指导，而优秀机构会招募能够耐心解释难点的教师。"
    },
    {
     "en": "Literacy and numeracy are foundations of public life. A [[VW:literate|/ˈlɪtərət/|有读写能力的]] and [[VW:numerate|/ˈnjuːmərət/|识数的，有计算能力的]] citizen can follow written information and use numbers with confidence, while [[VW:illiteracy|/ɪˈlɪtərəsi/|文盲]] limits choice and makes everyday [[VW:problem|/ˈprɒbləm/|习题；问题]] solving harder. Every [[VW:issue|/ˈɪʃuː/|重要问题；发行；公布，发出]] can become a [[VW:controversial|/ˌkɒntrəˈvɜːʃ(ə)l/|有争议的]] [[VW:affair|/əˈfeə(r)/|事件…]] when evidence is incomplete, and a [[VW:puzzle|/ˈpʌz(ə)l/|难题；谜；使迷惑]] or [[VW:riddle|/ˈrɪd(ə)l/|谜，谜语]] may remain [[VW:obscure|/əbˈskjʊə(r)/|难以理解的]] until",
     "zh": "读写能力和计算能力是公共生活的基础。既识字又识数的公民能够理解书面信息，并自信地运用数字；文盲状态则会限 制选择，使日常问题解决更加困难。当证据不完整时，每个 议题都可能变成有争议的公共事务；谜题或谜语也可能一直 晦涩难解，直到有人提出更好的问题。"
    },
    {
     "en": "Teachers can [[VW:instil|/ɪnˈstɪl/|逐渐灌输]] curiosity, but they should not merely [[VW:cram|/kræm/|把……塞进…]] facts into a syllabus. Good lessons [[VW:emphasise|/ˈemfəsaɪz/|强调，着重]] understanding, [[VW:enhance|/ɪnˈhɑːns/|提高，增强]] confidence and [[VW:enable|/ɪˈneɪb(ə)l/|使能够]] students to think independently. A strong [[VW:motive|/ˈməʊtɪv/|动机，(行动的)缘由]] can [[VW:inspire|/ɪnˈspaɪə(r)/|鼓舞；给……灵感]] effort; praise and clear goals [[VW:motivate|/ˈməʊtɪveɪt/|激发，驱使]] learners; discussion can [[VW:stimulate|/ˈstɪmjuleɪt/|刺激；激励]] new ideas and [[VW:spur|/spɜː(r)/|鞭策，刺激马刺；刺激]] inquiry. The [[VW:impetus|/ˈɪmpɪtəs/|推动，促进；动量；惯性]] for [[VW:study|/ˈstʌdi/|学习；研究；学习；研究]] may come from within, but a school should not [[VW:indulge|/ɪnˈdʌldʒ/|迁就，放任；沉湎…]] every distraction or [[VW:spoil|/spɔɪl/|宠坏，溺爱；破坏，糟蹋]] a child with",
     "zh": "教师可以逐渐灌输好奇心，但不应只是把事实硬塞进教学大 纲。好的课堂强调理解，增强信心，并使学生能够独立思考。强烈的动机会激发努力；赞扬和清晰目标会激励学习者；讨 论则能刺激新想法并推动探究。学习的推动力可能来自内心但学校不应纵容每一种分心，也不该用空洞奖励宠坏孩子。 学校还必须防止权力滥用。"
    },
    {
     "en": "People often describe an [[VW:intelligent|/ɪnˈtelɪdʒənt/|聪明的，有才智的]] [[VW:pupil|/ˈpjuːp(ə)l/|小学生；瞳孔]] as [[VW:clever|/ˈklevə(r)/|聪明的；精明的]] or [[VW:smart|/smɑːt/|聪明的；智能的]], yet ability is wider than a test score. An [[VW:all-round|/ˌɔːl ˈraʊnd/|有多方面才能的，全面的]] learner may combine practical [[VW:skill|/skɪl/|技巧，技能]] with creative thought; a [[VW:genius|/ˈdʒiːniəs/|天才人物；天赋]] may show exceptional insight; an [[VW:elite|/eɪˈliːt; ɪˈliːt/|精英人物；精华；上层人士]] group may dominate one field without owning every truth. No one should be dismissed as an [[VW:idiot|/ˈɪdiət/|白痴，傻瓜]] because progress is slow. [[VW:Wisdom|/ˈwɪzdəm/|智慧；学问]], [[VW:wit|/wɪt/|风趣的人；机智，风趣；智慧]], [[VW:aptitude|/ˈæptɪtjuːd/|天生的才能，资质]], and the capacity to remain [[VW:capable|/ˈkeɪpəb(ə)l/|有能力的，有才能的]] under pressure matter in different ways. An [[VW:excellent|/ˈeksələnt/|优秀的，杰岀的]] result is welcome, but an [[VW:outstanding|/aʊtˈstændɪŋ/|突出的，杰出的]] and [[VW:brilliant|/ˈbrɪliənt/|光辉的；聪颖的…]] to [[VW:campus|/ˈkæmpəs/|(大专院校的)校园]] and remember the  as vividly as the lecture room. [[VW:Prestige|/preˈstiːʒ/|威望，声望]] and [[VW:reputation|/ˌrepjuˈteɪʃ(ə)n/|名誉，声誉]] are useful only when they rest on honest work. An [[VW:eminent|/ˈemɪnənt/|著名的；杰出的]] researcher may earn [[VW:esteem|/ɪˈstiːm/|尊重，尊敬]], while a [[VW:notorious|/nəʊˈtɔːriəs/|声名狼藉的]] one may lose [[VW:respect|/rɪˈspekt/|尊敬，敬重；尊敬，敬重]]. A [[VW:diligent|/ˈdɪlɪdʒənt/|勤勉的，勤奋的]] student and a [[VW:painstaking|/ˈpeɪnzteɪkɪŋ/|极其仔细的，辛苦的]] teacher share a similar [[VW:approach|/əˈprəʊtʃ/|方法接近]], though the best [[VW:scheme|/skiːm/|计划，方案；阴谋谋划]] is flexible enough to serve",
     "zh": "人们常把一个聪明的学生形容为机灵或智能，但能力远比考 试分数宽广。全面发展型学习者能把实践技能与创造性思维 结合；天才可能展现非凡洞察；精英群体可能主导一个领域却并不拥有全部真理。没有人该因进步缓慢就被斥为白痴。 智慧、机智、天资，以及在压力下仍能胜任的能力，会以不同方式发挥作用。优秀结果值得欢迎，但杰出而卓越的表现 通常来自持续技能。毕业生回到校园时，可能对食堂的记忆和对教室一样鲜明。 威望与声誉只有在诚实工作的基础上才有价值。著名研究者 能赢得尊重，声名狼藉者则可能失去敬意。勤勉的学生与极其仔细的教师有相似方法，不过最好的方案能灵活服务于不同学习者。"
    },
    {
     "en": "Academic leadership takes many forms. A [[VW:headmaster|/ˌhedˈmɑːstə(r)/|［英］男校长]] may lead a school, a [[VW:principal|/ˈprɪnsəp(ə)l/|［美］(中小学)校长…]] may guide a [[VW:college|/ˈkɒlɪdʒ/|学院；大学]], and a [[VW:dean|/diːn/|(大学的)学院院长，系主任]] may oversee a [[VW:faculty|/ˈfæk(ə)lti/|(大学的)系，院…]]. A [[VW:professor|/prəˈfesə(r)/|教授]], [[VW:scholar|/ˈskɒlə(r)/|学者]] or [[VW:scientist|/ˈsaɪəntɪst/|科学家]] may teach and conduct research; a [[VW:mentor|/ˈmentɔː(r)/|导师；顾问]] offers long-term advice; a [[VW:tutor|/ˈtjuːtə(r)/|家庭教师…]] gives focused support; a [[VW:lecturer|/ˈlektʃərə(r)/|［英］(大学的)讲师]] teaches a course; an [[VW:assistant|/əˈsɪstənt/|助手，助理]] helps with tasks; and a [[VW:candidate|/ˈkændɪdət/|候选人；求职者；［英］考生]] prepares for selection. Authority matters less than the ability to 07 A [[VW:degree|/dɪˈɡriː/|学位；学位课程；程度]] can [[VW:qualify|/ˈkwɒlɪfaɪ/|使具备资格；使奋权]] a person for further [[VW:study|/ˈstʌdi/|学习；研究；学习；研究]], but a certificate does not [[VW:certify|/ˈsɜːtɪfaɪ/|证明；颁发专业合格证书]] [[VW:wisdom|/ˈwɪzdəm/|智慧；学问]]. A [[VW:license|/ˈlaɪs(ə)ns/|执照，许可证]] or [[VW:permit|/pəˈmɪt/|允许，准许；许可证]] may allow professional practice, while a [[VW:diploma|/dɪˈpləʊmə/|毕业文凭]] records completion. A [[VW:diplomat|/ˈdɪpləmæt/|外交官；善于交际的人]] and an [[VW:ambassador|/æmˈbæsədə(r)/|大使]] depend on judgement rather than a title. Every [[VW:pupil|/ˈpjuːp(ə)l/|小学生；瞳孔]] should be able to take part in a graduation [[VW:ceremony|/ˈserəməni/|典礼；礼节]]",
     "zh": "学术领导有多种形式。男校长可以领导一所学校，校长可以指导一所学院，院长则负责一个学部。教授、学者或科学家可能教学并开展研究；导师提供长期建议；家庭教师给予集 中支持；讲师教授课程；助理处理任务；考生则为选拔做准 备。权威不如倾听能力重要。学位可以使人具备继续深造的资格，但证书并不能证明智慧。执照或许可证可能允许专业实践，文凭则记录完成情况。外 交官与大使依靠判断力，而不是头衔。每个学生都应在毕业典礼上参与其中，而不会把资历凭证与个人价值混为一谈。"

    {

     "zh": "大学生活有其顺序。学士可以继续攻读硕士或博士；一年级新生熟悉校园，二年级学生选择方向，三年级学生深化知识毕业班学生则准备毕业。校友常回来提供建议。迎新会介绍了学生生活的平台，无论学校是男女同校还是单一性别。新生注册、核对花名册、选课，并在开课前完成入学注册。参考书目列出资料来源；课程内容决定方向；实验室实验产生数据。学生由此懂得数量本身并不等于质量，而有用物品也可以简单如一本笔记。住宿可能包括宿舍和食堂，但安全安静的学习场所比奢华更重要。"

    {
     "en": "The [[VW:library|/ˈlaɪbrərɪ/|图书馆…]] connects readers to  and to one another. An [[VW:article|/ˈɑːtɪk(ə)l/|文章]] may lead to an [[VW:author|/ˈɔːθə(r)/|作者，作家]], a [[VW:tale|/teɪl/|故事，传说]], a work of [[VW:fiction|/ˈfɪkʃ(ə)n/|小说；虚构，杜撰]] or a ; a [[VW:diary|/ˈdaɪəri/|日记，日记簿]] may  private experience, [[VW:poetry|/ˈpəʊətri/|诗，诗歌，诗作]] may compress emotion, a [[VW:magazine|/ˌmæɡəˈziːn/|杂志，期刊]] may offer quick [[VW:coverage|/ˈkʌvərɪdʒ/|新闻报道；覆盖范围]], and a [[VW:journal|/ˈdʒɜːn(ə)l/|日报，周报…]]  of lectures becomes a  worth keeping. A well-organised [[VW:file|/faɪl/|档案把……归档]] and an honest [[VW:profile|/ˈprəʊfaɪl/|概述；人物简介；侧面轮廓]] help a learner see both",
     "zh": "may publish detailed research. An encyclopedia /ɪnˌsaɪkləˈpiːdiə/ （百科全书）, biography /baɪˈɒɡrəfi/ （传记） or documentary /ˌdɒkjuˈment(ə)ri/ （纪录片纪录的） can open a new field, while图书馆把读者与文学以及彼此连接起来。一篇文章可能引向一位作者、一个故事、一部小说或一个真实故事；日记可能记录私人经历，诗歌可能压缩情感，杂志提供快速新闻报道期刊则发表详细研究。百科全书、传记或纪录片能打开一个新领域，而系列讲座会成为值得保存的记录。整理良好的档案与诚实的个人简介，帮助学习者看见进步与缺口。"
